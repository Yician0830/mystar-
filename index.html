<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推し手帳｜我的追星手帳</title>
<script>
/* 提早套用深色/淺色模式，避免畫面載入時閃爍 */
(function(){
  try{
    var raw = window.localStorage.getItem('oshiapp:oshi-theme');
    var theme = raw ? JSON.parse(raw) : null;
    var mode = (theme && theme.mode) ? theme.mode : 'light';
    if(mode==='system'){
      mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    if(mode==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- 引入 Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --bg:#EEF7FC;
    --bg-deep:#DFF0FA;
    --surface:#FFFFFF;
    --surface-soft:#E7F5FC;
    --ink:#2E4C5E;
    --ink-soft:#7B98A9;
    --ink-faint:#B9D3E0;
    --sakura:#8FD3F4;
    --sakura-pale:#DEF2FC;
    --rose:#4FB8E8;
    --rose-deep:#2A8FC7;
    --matcha:#7DC4C9;
    --matcha-pale:#E0F3F2;
    --wisteria:#7FA8D9;
    --wisteria-pale:#E6EEFA;
    --gold:#5AA9D6;
    --shadow: 0 6px 20px rgba(42,143,199,0.12);
    --shadow-sm: 0 2px 8px rgba(42,143,199,0.10);
    --radius: 20px;
    --blob-1: rgba(143,211,244,0.22);
    --blob-2: rgba(127,168,217,0.16);
  }
  /* ===== 深色模式（底色／文字色，主題色由 JS 依使用者選擇的顏色套用） ===== */
  [data-theme="dark"]{
    --bg:#101720;
    --bg-deep:#0A0F16;
    --surface:#1B2530;
    --surface-soft:#212C38;
    --ink:#EAF1F8;
    --ink-soft:#8FA3B5;
    --ink-faint:#4F6273;
    --shadow: 0 6px 20px rgba(0,0,0,0.45);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; width:100%; min-height:100%;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:
      radial-gradient(circle at 15% 8%, var(--blob-1), transparent 40%),
      radial-gradient(circle at 90% 15%, var(--blob-2), transparent 45%),
      var(--bg);
    transition: background-color 0.2s ease;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:none;
    min-height:100vh;
    background:transparent;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* Content fills the full device width — no max-width cap, no centering */
  .top-row, main#mainContent{
    width:100%;
    box-sizing:border-box;
  }
  .maru{font-family:'Zen Maru Gothic', sans-serif;}

  /* ===== Header ===== */
  header.top{
    padding:22px 20px 16px;
    position:relative;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    width:14px;height:14px;
    background:var(--sakura);
    border-radius: 0 60% 0 60%;
    opacity:0.5;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform: translateY(-20px) rotate(0deg); opacity:0;}
    10%{opacity:0.55;}
    100%{ transform: translateY(160px) rotate(200deg); opacity:0;}
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:40px;height:40px;border-radius:50%;
    background:var(--rose-deep);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic';font-weight:700;font-size:18px;
    box-shadow: var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-text .title{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:19px; letter-spacing:0.5px;}
  .brand-text .sub{ font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .profile-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--sakura-pale);
    border-radius:999px;
    padding:6px 12px 6px 6px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    font-size:12px;
    color:var(--ink-soft);
  }
  .profile-chip .dot{
    width:22px;height:22px;border-radius:50%;
    background:var(--wisteria-pale);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    overflow:hidden;
  }
  .profile-chip .dot img{ width:100%;height:100%;object-fit:cover; }

  /* ===== Tab content area ===== */
  main{
    flex:1;
    padding: 6px 18px 100px;
  }
  .section-title{
    font-family:'Zen Maru Gothic';
    font-weight:700;
    font-size:20px;
    margin: 10px 2px 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title .stamp{
    width:30px;height:30px;border-radius:50%;
    background:var(--rose);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic';font-weight:700;font-size:14px;
  }

  /* ===== responsive list grid (schedule/expense/fanlog/artists cards) ===== */
  .list-grid{ display:block; }
  @media (min-width:700px){
    .list-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px; align-items:stretch; }
    .list-grid .card{ margin-bottom:0; height:100%; display:flex; flex-direction:column; }
  }
  /* ===== cards ===== */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px 16px;
    margin-bottom:12px;
    box-shadow: var(--shadow-sm);
    position:relative;
    border:1px solid rgba(0,0,0,0.02);
  }
  .card-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{ font-weight:700; font-size:15px; margin:0 0 3px;}
  .card-meta{ font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .tag{
    display:inline-block;
    font-size:11px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--sakura-pale);
    color:var(--rose-deep);
    margin-right:6px;
    margin-top:4px;
  }
  .tag.matcha{ background:var(--matcha-pale); color:#4E6B49;}
  .tag.wisteria{ background:var(--wisteria-pale); color:#5F4E7A;}
  .tag.gold{ background:#F7EAD1; color:#8A6A28;}
  .tag.rose{ background:#FDE0E8; color:#B23A5C;}
  .tag.sky{ background:#D9EEFB; color:#2A6F99;}
  .tag.peach{ background:#FFE3C2; color:#9C5A17;}
  .tag.lavender{ background:#E4D9FF; color:#5B3FA0;}
  .tag.mint{ background:#D8F3DC; color:#2F6B3F;}
  .tag.coral{ background:#FBD9F0; color:#9C3D82;}
  .tag.amber{ background:#FFF3C4; color:#8A6A28;}
  .tag.slate{ background:#E6E6E6; color:#555555;}
  .card-actions{ display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    width:30px;height:30px;border-radius:50%;
    border:none; background:var(--bg-deep); color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:14px;
    transition:0.15s;
  }
  .icon-btn:hover{ background:var(--sakura-pale); color:var(--rose-deep);}
  .icon-btn.del:hover{ background:#F7D9D9; color:#B54545;}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-faint);
  }
  .empty .big{ font-size:34px; margin-bottom:8px;}
  .empty .msg{ font-size:13.5px; }

  /* Home dashboard */
  .greet{
    font-family:'Zen Maru Gothic';
    font-size:17px;
    font-weight:700;
    margin: 4px 2px 2px;
  }
  .greet-date{ font-size:12px; color:var(--ink-soft); margin: 0 2px 16px;}
  .stat-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--surface); border-radius:16px; padding:12px 8px;
    text-align:center; box-shadow:var(--shadow-sm);
  }
  .stat-card .num{ font-family:'Zen Maru Gothic'; font-size:19px; font-weight:700; color:var(--rose-deep);}
  .stat-card .lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .oshi-banner{
    background: linear-gradient(135deg, var(--sakura-pale), var(--wisteria-pale));
    border-radius:var(--radius);
    padding:16px;
    display:flex; flex-direction:column; gap:12px;
    margin-bottom:18px;
    box-shadow: var(--shadow-sm);
  }
  .oshi-banner .oshi-top{ display:flex; gap:14px; align-items:center; }
  .oshi-banner img, .oshi-banner .ph{
    width:58px;height:58px;border-radius:50%;
    object-fit:cover; border:3px solid #fff; box-shadow:var(--shadow-sm);
    flex-shrink:0; background:var(--surface);
    display:flex;align-items:center;justify-content:center; font-size:22px;
  }
  .oshi-banner .name{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px;}
  .oshi-banner .grp{ font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .oshi-stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .oshi-stat{
    background:rgba(255,255,255,0.6);
    border-radius:14px;
    padding:8px 4px;
    text-align:center;
    min-width:0;
  }
  .oshi-stat .v{
    font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px;
    color:var(--rose-deep);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .oshi-stat .l{ font-size:10px; color:var(--ink-soft); margin-top:2px;}
  @media (min-width:700px){
    .oshi-stat{ padding:12px 8px; }
    .oshi-stat .v{ font-size:15px; }
    .oshi-stat .l{ font-size:11px; }
  }
  .home-block{ margin-bottom:22px;}
  .home-block .block-head{
    display:flex; justify-content:space-between; align-items:center;
    margin:0 2px 10px;
  }
  .home-block .block-head h3{
    font-family:'Zen Maru Gothic'; font-size:14.5px; margin:0; font-weight:700;
    color:var(--ink);
  }
  .home-block .block-head a{
    font-size:11.5px; color:var(--rose-deep); cursor:pointer; text-decoration:none;
  }
  .mini-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border-radius:14px; padding:10px 14px;
    margin-bottom:8px; box-shadow:var(--shadow-sm); font-size:13px;
  }
  .mini-row .l{ color:var(--ink); }
  .mini-row .r{ color:var(--ink-soft); font-size:11.5px;}

  /* ===== Schedule calendar ===== */
  .cal-filter-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin:0 2px 16px;
    scrollbar-width:thin;
  }
  .cal-filter-btn{
    flex-shrink:0; padding:7px 15px; border-radius:999px;
    border:1px solid var(--sakura-pale); background:var(--surface); color:var(--ink-soft);
    font-size:12.5px; font-family:'Noto Sans TC'; cursor:pointer; font-weight:500;
  }
  .cal-filter-btn.active{ background:var(--rose-deep); color:#fff; border-color:var(--rose-deep); font-weight:700;}
  .cal-filter-btn.qualify{ background:var(--matcha-pale); border-color:var(--matcha-pale); color:#3F6B45; font-weight:700;}
  .cal-filter-btn.qualify.active{ background:var(--rose-deep); border-color:var(--rose-deep); color:#fff;}
  .chip-filter-btn{
    flex-shrink:0; padding:7px 14px; border-radius:999px; border:2px solid transparent;
    font-size:12.5px; font-family:'Noto Sans TC'; cursor:pointer; font-weight:600;
    transition:0.15s;
  }
  .chip-filter-btn.active{ border-color:currentColor; }
  .chip-filter-btn:hover{ transform:translateY(-1px); }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin:0 2px 14px;}
  .cal-title{ font-weight:700; font-size:16px;}
  .cal-nav-btn{
    width:32px;height:32px;border-radius:50%; border:none; background:var(--bg-deep);
    color:var(--ink-soft); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-nav-btn:hover{ background:var(--sakura-pale); color:var(--rose-deep);}
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; width:100%; }
  .cal-dow{ text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); padding-bottom:6px;}
  .cal-day{
    position:relative; min-height:78px; border-radius:12px; background:var(--surface);
    display:flex; flex-direction:column; align-items:stretch;
    cursor:pointer; box-shadow:var(--shadow-sm); padding:6px 5px; gap:2px;
    overflow:hidden;
  }
  .cal-day .daynum{ font-size:12px; font-weight:700; color:var(--ink); align-self:flex-start; }
  .cal-day.empty{ background:transparent; box-shadow:none; cursor:default;}
  .cal-day.today{ border:2px solid var(--rose-deep);}
  .cal-day.today .daynum{ color:var(--rose-deep); }
  .event-pill{
    display:block; width:100%; box-sizing:border-box;
    font-size:10px; line-height:1.5; padding:1px 6px; border-radius:6px;
    color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer;
  }
  .event-pill.ec0{ background:var(--rose-deep); }
  .event-pill.ec1{ background:#7DA687; }
  .event-pill.ec2{ background:#8B7CB6; }
  .event-pill.ec3{ background:#C99A45; }
  .event-pill.ec4{ background:#C97B84; }
  .event-more{ font-size:9.5px; color:var(--ink-soft); padding:1px 6px; }
  @media (min-width:700px){
    .cal-day{ min-height:120px; padding:8px 7px; }
    .cal-day .daynum{ font-size:13.5px; }
    .event-pill{ font-size:11.5px; padding:3px 8px; border-radius:8px; }
  }
  .cal-daylist-title{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:14.5px; margin:4px 2px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .chip-clear{
    font-size:11px; border:none; background:var(--bg-deep); color:var(--ink-soft);
    border-radius:999px; padding:4px 12px; cursor:pointer; font-weight:500;
  }
  .chip-clear:hover{ background:var(--sakura-pale); color:var(--rose-deep);}

  /* ===== 年度／月份回顧 (schedule & fanlog) ===== */
  .review-block{ margin-bottom:22px;}
  .review-head{ font-weight:700; font-size:14.5px; margin:0 2px 10px;}
  .year-list{ display:flex; flex-direction:column; gap:10px;}
  .year-card{
    background:var(--surface); border-radius:16px; padding:13px 16px;
    cursor:pointer; box-shadow:var(--shadow-sm); border:2px solid transparent; transition:0.15s;
  }
  .year-card:hover{ transform:translateY(-1px);}
  .year-card.qualify{ background:var(--matcha-pale);}
  .year-card.active{ border-color:var(--rose-deep);}
  .year-num{ font-weight:700; font-size:17px;}
  .year-count{ font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .year-msg{ font-size:12px; margin-top:5px; font-weight:700; color:#B54545;}
  .year-card.qualify .year-msg{ color:#4E6B49;}

  .month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .month-card{
    background:var(--surface); border-radius:14px; padding:10px 6px; text-align:center;
    cursor:pointer; box-shadow:var(--shadow-sm); border:2px solid transparent; transition:0.15s;
  }
  .month-card:hover{ transform:translateY(-1px);}
  .month-card.active{ border-color:var(--rose-deep);}
  .month-num{ font-weight:700; font-size:12.5px;}
  .month-count{ font-size:10px; color:var(--ink-soft); margin-top:3px;}
  .month-msg{ font-size:10px; margin-top:4px; font-weight:700; color:#B54545;}
  .month-card.happy .month-msg{ color:var(--rose-deep);}

  .sched-layout{ display:block; }
  @media (min-width:900px){
    .sched-layout{ display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:26px; align-items:start; }
    .sched-cal-col{ position:sticky; top:12px; min-width:0; }
    .sched-list-col{ min-width:0; }
  }

  /* Photocard count pill */
  .pc-count{ font-size:12px; color:var(--ink-soft);}
  .pc-owned{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink); margin:5px 0 6px; cursor:pointer;
  }
  .pc-owned input{ width:13px;height:13px; accent-color:var(--rose-deep); cursor:pointer; flex-shrink:0;}

  /* Photocard 大圖鑑 (series cover) grid — click into a series to see its individual cards */
  .pc-series-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    align-items:stretch; /* every card in a row stretches to the row's height */
  }
  @media (min-width:460px){ .pc-series-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:620px){ .pc-series-grid{ grid-template-columns:repeat(4,1fr); } }
  @media (min-width:780px){ .pc-series-grid{ grid-template-columns:repeat(5,1fr); } }
  @media (min-width:940px){ .pc-series-grid{ grid-template-columns:repeat(6,1fr); } }
  @media (min-width:1100px){ .pc-series-grid{ grid-template-columns:repeat(7,1fr); } }
  @media (min-width:1260px){ .pc-series-grid{ grid-template-columns:repeat(8,1fr); } }
  @media (min-width:1400px){ .pc-series-grid{ grid-template-columns:repeat(9,1fr); } }
  .pc-series-card-wrap{
    position:relative;
    height:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .pc-series-card{
    background:var(--surface); border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow-sm); cursor:pointer; border:none; padding:0; text-align:left;
    transition:transform 0.15s ease;
    display:flex; flex-direction:column;
    height:100%;
    width:100%;
    min-width:0;
  }
  .pc-series-card:hover{ transform:translateY(-3px); }
  .pc-series-cover{
    width:100%; aspect-ratio:4/5; object-fit:contain; object-position:center center;
    background:var(--sakura-pale); display:block; flex-shrink:0;
  }
  .pc-series-cover.ph{ display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--ink-faint);}
  .pc-series-edit-cover{
    position:absolute; bottom:9px; right:9px; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.92); color:var(--rose-deep); font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
    z-index:2;
  }
  .pc-series-body{
    padding:9px 34px 11px 11px; position:relative;
    flex:1; display:flex; flex-direction:column; justify-content:center;
    min-height:44px;
  }
  .pc-series-name{
    font-weight:700; font-size:12.5px; white-space:normal; overflow-wrap:break-word; line-height:1.35;
  }
  .pc-series-count{ font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .pc-series-progress-track{ width:100%; height:5px; background:var(--bg-deep); border-radius:4px; margin-top:5px; overflow:hidden;}
  .pc-series-progress-fill{ height:100%; background:var(--rose); border-radius:4px;}

  .pc-back{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    color:var(--rose-deep); font-weight:700; font-size:13.5px; margin:0 2px 14px; user-select:none;
  }

  /* Individual photocard grid — auto-adjusts by device width, capped at 8 columns */
  .pc-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
    align-items:stretch;
  }
  @media (min-width:380px){ .pc-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:480px){ .pc-grid{ grid-template-columns:repeat(4,1fr); gap:9px; } }
  @media (min-width:620px){ .pc-grid{ grid-template-columns:repeat(5,1fr); } }
  @media (min-width:760px){ .pc-grid{ grid-template-columns:repeat(6,1fr); gap:10px; } }
  @media (min-width:900px){ .pc-grid{ grid-template-columns:repeat(7,1fr); } }
  @media (min-width:1040px){ .pc-grid{ grid-template-columns:repeat(8,1fr); } }
  @media (min-width:1180px){ .pc-grid{ grid-template-columns:repeat(9,1fr); } }
  .pc-card{
    background:var(--surface); border-radius:14px; overflow:hidden;
    box-shadow:var(--shadow-sm); position:relative; display:flex; flex-direction:column;
    height:100%;
  }
  .pc-img{
    width:100%; aspect-ratio: 4/5; object-fit:contain; object-position:center center; background:var(--sakura-pale);
    display:block;
  }

  .recap-info .v{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recap-btn{
    width:100%; border:none; background:rgba(255,255,255,0.94); color:var(--rose-deep);
    font-weight:700; padding:10px; border-radius:12px; cursor:pointer;
    font-family:'Noto Sans TC'; font-size:13px; position:relative; z-index:1;
  }
  .recap-btn:hover{ background:#fff; }
  .ys-cat-row{ margin-bottom:10px; }
  .ys-cat-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .ys-cat-top span:first-child{ color:var(--ink); font-weight:500; }
  .ys-cat-top span:last-child{ color:var(--ink-soft); }
  .ys-cat-track{ width:100%; height:7px; background:var(--bg-deep); border-radius:5px; overflow:hidden; }
  .ys-cat-fill{ height:100%; border-radius:5px; }

  /* ===== Final desktop overrides (kept at end of stylesheet so they win the cascade) ===== */
  @media (min-width:700px){
    .stat-grid{ grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); }
  }

  /* At >=900px the app switches from a bottom tab bar to a left sidebar,
     and content area gets a comfortable inline gutter instead of edge-to-edge mobile padding. */
  @media (min-width:900px){
    body{ display:block; }
    header.top{ padding-left:40px; padding-right:40px; margin-left:220px; }
    main#mainContent{ padding-left:40px; padding-right:40px; margin-left:220px; width:calc(100% - 220px); max-width:none; }

    nav.bottom{
      left:0; top:0; bottom:0; transform:none;

      flex-direction:column; justify-content:flex-start; align-items:stretch;

      border-top:none; border-right:1px solid var(--sakura-pale);
    }
    nav.bottom .nav-btn{ flex-direction:row; justify-content:flex-start; gap:12px; padding:10px 12px; border-radius:14px; max-width:none; }
    nav.bottom .nav-btn .lbl{ font-size:13px; }
    nav.bottom .nav-btn.active{ background:var(--sakura-pale); }
  }
  @media (min-width:1300px){
    main#mainContent{ max-width:none; }
  }
</style>

<body>
<div class="app" id="app">

  <div class="loading-screen" id="loadingScreen">
    <div class="lmark maru">推</div>
    <div class="ltext">正在連線雲端並讀取手帳資料...</div>
  </div>

  <div class="storage-warn" id="storageWarning">
    <span id="storageWarningText"></span>
    <span class="storage-warn-close" id="storageWarningClose">✕</span>
  </div>

  <header class="top" id="petalHost">
    <div class="top-row">
      <div class="brand">
        <div class="brand-mark maru">推</div>
        <div class="brand-text">
          <div class="title maru">推し手帳</div>
          <div class="sub" id="headerSub">我的追星手帳</div>
        </div>
      </div>
      <div class="profile-chip" id="profileChip">
        <div class="dot" id="profileDot">🌸</div>
        <span id="profileLabel">設定 / 登入</span>
      </div>
    </div>
  </header>

  <main id="mainContent"></main>

    <button class="nav-btn" data-tab="home"><div class="stamp maru">首</div><div class="lbl">首頁</div></button>
    <button class="nav-btn" data-tab="schedule"><div class="stamp maru">程</div><div class="lbl">行程</div></button>
    <button class="nav-btn" data-tab="expense"><div class="stamp maru">帳</div><div class="lbl">記帳</div></button>
    <button class="nav-btn" data-tab="photocards"><div class="stamp maru">卡</div><div class="lbl">小卡</div></button>
    <button class="nav-btn" data-tab="support"><div class="stamp maru">援</div><div class="lbl">應援</div></button>
    <button class="nav-btn" data-tab="fanlog"><div class="stamp maru">記</div><div class="lbl">紀錄</div></button>
    <button class="nav-btn" data-tab="media"><div class="stamp maru">媒</div><div class="lbl">媒體</div></button>

  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= Firebase & Cloud Storage Setup ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBjclP4efWWcOTO88W_3tlcC4Za_hEIzW0",
  authDomain: "mystarlifeapp.firebaseapp.com",
  projectId: "mystarlifeapp",
  storageBucket: "mystarlifeapp.firebasestorage.app",
  messagingSenderId: "941753508434",
  appId: "1:941753508434:web:5bdf24eac9ee4514d8758b",
  measurementId: "G-FDX9867N4N"
};

let db = null;
let auth = null;
let storage = null;
let currentUser = null;
let useCloud = false;

try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    useCloud = true;
    // 保持登入狀態：同一台裝置/瀏覽器重新整理後不需要再次登入
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.log('設定登入持久化失敗', e));
    // 若因跳出視窗被瀏覽器擋下而改用整頁導向登入，回來後在這裡接住結果
    auth.getRedirectResult().catch(e=>{
      console.log('Google 登入導向結果讀取失敗', e);
    });
  }
} catch(e) {
  console.log("Firebase 初始化未完成，將使用本機模式", e);
}

// Storage 是額外的圖片雲端功能，獨立初始化：就算 Storage 還沒在後台啟用而失敗，
// 也完全不影響上面的登入狀態與 Firestore 資料同步，圖片功能只是自動退回本機模式
try {
  if (useCloud) {
    storage = firebase.storage();
  }
} catch(e) {
  console.log("Firebase Storage 尚未啟用，圖片上傳將改用本機模式", e);
  storage = null;
}

async function signInWithGoogle(){
  if(!useCloud || !auth){
    showToast('雲端服務尚未設定完成，暫時無法登入');
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    await auth.signInWithPopup(provider);
    closeModal();
    showToast('登入成功，正在同步雲端資料 ☁️');
  }catch(e){
    console.error('Google 登入失敗', e);
    if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
      try{
        await auth.signInWithRedirect(provider);
      }catch(err){
        showToast('登入失敗，請稍後再試');
      }
    } else if(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'){
      // 使用者自行關閉登入視窗，不需要顯示錯誤
    } else {
      showToast('登入失敗：' + (e.message || '請稍後再試'));
    }
  }
}

async function signOutOfGoogle(){
  if(!auth) return;
  try{
    await auth.signOut();
    closeModal();
    showToast('已登出，資料改為儲存在本機');
  }catch(e){
    console.error('登出失敗', e);
    showToast('登出失敗，請稍後再試');
  }
}

const LOCAL_PREFIX = 'oshiapp:';

async function loadKey(key, fallback){
  if(useCloud && currentUser){
    try{
      const docRef = db.collection('users').doc(currentUser.uid).collection('data').doc(key);
      const doc = await docRef.get();
      if(doc.exists && doc.data().value !== undefined){
        return doc.data().value;
      }
      return fallback;
    }catch(e){
      console.error("雲端讀取失敗", e);
      return fallback;
    }
  } else {
    try{
      const raw = window.localStorage.getItem(LOCAL_PREFIX+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
}

async function saveKey(key, value){
  if(useCloud && currentUser){
    try{
      const docRef = db.collection('users').doc(currentUser.uid).collection('data').doc(key);
      await docRef.set({ value: value });
    }catch(e){
      showToast('雲端儲存失敗，請檢查網路連線');
      console.error(e);
    }
    return;
  } else {
    try{
      window.localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(value));

const DEFAULT_THEME = { mode:'light', accent:'sky', customColor:'#4FB8E8' };

function hexToRgb(hex){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
}
function mixHex(hex, target, pct){
  const c = hexToRgb(hex), t = hexToRgb(target);
  return rgbToHex(c.r+(t.r-c.r)*pct, c.g+(t.g-c.g)*pct, c.b+(t.b-c.b)*pct);
}
function buildCustomThemeVars(base){
  return {
    '--rose-deep': mixHex(base, '#000000', 0.14),
    '--rose': base,
    '--sakura': mixHex(base, '#ffffff', 0.45),
    '--sakura-pale': mixHex(base, '#ffffff', 0.80)
  };
}
function resolveThemeMode(mode){
  if(mode==='system'){
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  return mode==='dark' ? 'dark' : 'light';
}
function applyTheme(theme){
  if(!theme) theme = DEFAULT_THEME;
  const root = document.documentElement;
  root.setAttribute('data-theme', resolveThemeMode(theme.mode));
  const preset = THEME_PRESETS.find(p=>p.key===theme.accent);
  const vars = theme.accent==='custom'
    ? buildCustomThemeVars(theme.customColor||DEFAULT_THEME.customColor)
    : (preset ? preset.vars : THEME_PRESETS[0].vars);
  Object.entries(vars).forEach(([k,v])=> root.style.setProperty(k, v));
  const roseRgb = hexToRgb(vars['--rose']);
  const deepRgb = hexToRgb(vars['--rose-deep']);
  root.style.setProperty('--blob-1', `rgba(${roseRgb.r},${roseRgb.g},${roseRgb.b},0.22)`);
  root.style.setProperty('--blob-2', `rgba(${deepRgb.r},${deepRgb.g},${deepRgb.b},0.16)`);
}

const TAG_CLASSES = ['', 'matcha', 'wisteria', 'gold', 'rose', 'sky', 'peach', 'lavender', 'mint', 'coral', 'amber', 'slate'];
function tagColorClass(text, categoryList){
  if(!text) return '';
  if(categoryList && categoryList.length){
    const idx = categoryList.indexOf(text);
    if(idx>=0) return TAG_CLASSES[idx % TAG_CLASSES.length];
  }
  // 找不到所屬清單時（例如舊資料），退回用文字雜湊決定顏色，至少同一個名稱顏色穩定
  let h = 0;
  for(let i=0;i<text.length;i++) h = (h*31 + text.charCodeAt(i)) % 997;
  return TAG_CLASSES[h % TAG_CLASSES.length];
}

function readLocalRaw(key, fallback){
  try{
    const raw = window.localStorage.getItem(LOCAL_PREFIX+key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function hasRealData(vals){
  return vals.some(v=>{
    if(Array.isArray(v)) return v.length>0;
    if(v && typeof v==='object') return !!v.nickname;
    return false;
  });
}

      loadKey('oshi-schedule', []), loadKey('oshi-expense', []), loadKey('oshi-photocards', []),
      loadKey('oshi-support', []), loadKey('oshi-fanlog', []), loadKey('oshi-artists', []),
      loadKey('oshi-profile', {nickname:''})
    ]);
    if(hasRealData([cSc,cEx,cPc,cMv,cFl,cAr,cPf])) return;

    const lSc = readLocalRaw('oshi-schedule', []);
    const lEx = readLocalRaw('oshi-expense', []);
    const lPc = readLocalRaw('oshi-photocards', []);
    const lMv = readLocalRaw('oshi-support', []);
    const lFl = readLocalRaw('oshi-fanlog', []);
    const lAr = readLocalRaw('oshi-artists', []);
    const lPf = readLocalRaw('oshi-profile', {nickname:''});
    const lCc = readLocalRaw('oshi-pc-categories', []);
    const lFlc = readLocalRaw('oshi-fanlog-categories', []);
    const lScc = readLocalRaw('oshi-schedule-categories', []);
    if(!hasRealData([lSc,lEx,lPc,lMv,lFl,lAr,lPf])) return;

    await Promise.all([
      saveKey('oshi-schedule', lSc), saveKey('oshi-expense', lEx), saveKey('oshi-photocards', lPc),
      saveKey('oshi-support', lMv), saveKey('oshi-fanlog', lFl), saveKey('oshi-artists', lAr),
      saveKey('oshi-profile', lPf), saveKey('oshi-pc-categories', lCc), saveKey('oshi-fanlog-categories', lFlc),
      saveKey('oshi-schedule-categories', lScc)
    ]);
    showToast('已將本機資料同步到雲端帳號 ☁️');

}

/* 將使用者從裝置選取的照片壓縮成較小的檔案；已登入雲端帳號時會上傳到 Firebase Storage 取得可分享的雲端網址，
   未登入（本機模式）時則轉成內嵌的 dataURL 直接存在本機資料裡 */
function compressImageFile(file, maxDim=1400, quality=0.8){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('不是圖片檔')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('讀取檔案失敗'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('圖片解析失敗'));
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob); else reject(new Error('壓縮失敗'));
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function blobToDataUrl(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(new Error('讀取失敗'));
    reader.readAsDataURL(blob);
  });
}
async function uploadBlobToStorage(blob){
  const path = `users/${currentUser.uid}/images/${Date.now()}_${Math.floor(Math.random()*100000)}.jpg`;
  const ref = storage.ref().child(path);
  const snapshot = await ref.put(blob, { contentType: 'image/jpeg' });
  return await snapshot.ref.getDownloadURL();
}
/* 單張照片：壓縮後視登入狀態決定上傳雲端或轉成本機 dataURL，回傳可直接當 <img src> 用的網址字串 */
async function processImageFileToUrl(file){
  const blob = await compressImageFile(file);
  if(useCloud && storage && currentUser){
    try{
      return await uploadBlobToStorage(blob);
    }catch(e){
      console.error('雲端圖片上傳失敗，改存本機', e);
    }
  }
  return await blobToDataUrl(blob);
}
/* 處理多張照片檔案（依序處理並加入陣列），成功後呼叫 onDone 重新渲染縮圖清單 */
async function addImageFilesToList(fileList, targetArrayGetter, targetArraySetter, maxCount, onDone){
  const files = Array.from(fileList || []);
  if(files.length===0) return;
  let arr = targetArrayGetter();
  const remaining = maxCount - arr.length;
  if(remaining<=0){ showToast(`最多只能加入 ${maxCount} 張圖片`); return; }
  const toProcess = files.slice(0, remaining);
  if(files.length > toProcess.length){ showToast(`最多只能加入 ${maxCount} 張，已略過多的照片`); }
  showToast(useCloud && currentUser ? '上傳中，請稍候…' : '處理中，請稍候…');
  for(const file of toProcess){
    try{
      const url = await processImageFileToUrl(file);
      arr.push(url);
    }catch(e){
      showToast('有張照片處理失敗，已略過');
    }
  }
  targetArraySetter(arr);
  onDone();
}
function fmtDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length!==3) return d;
  return `${parts[0]}/${parts[1]}/${parts[2]}`;
}
function todayStr(){
  const t = new Date();
  return t.toISOString().slice(0,10);
}
function fanDurationText(dateStr){
  if(!dateStr) return '';
  const start = new Date(dateStr+'T00:00:00');
  const now = new Date();
  if(isNaN(start.getTime()) || start>now) return '';
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if(days<0) months -= 1;
  if(months<0){ years -= 1; months += 12; }
  if(years<=0 && months<=0){
    const diffDays = Math.max(0, Math.floor((now-start)/(1000*60*60*24)));
    return diffDays<=0 ? '今天入坑' : diffDays+'天';
  }
  let parts = [];
  if(years>0) parts.push(years+'年');
  if(months>0) parts.push(months+'個月');
  return parts.join('');
}

function computeYearSummary(year){
  const yearFanlogs = state.fanlog.filter(f=> f.date && f.date.startsWith(year));
  const concertCount = yearFanlogs.filter(f=> f.category==='演唱會').length;
  const totalEventCount = yearFanlogs.length;

  const yearExpenses = state.expense.filter(e=> e.date && e.date.startsWith(year));
  const totalExpense = yearExpenses.reduce((sum,e)=> sum + (e.unitPrice!==undefined ? expenseAmount(e) : (parseFloat(e.amount)||0)), 0);

  const catMap = {};
  yearExpenses.forEach(e=>{
    const cat = e.category || '未分類';
    const amt = e.unitPrice!==undefined ? expenseAmount(e) : (parseFloat(e.amount)||0);
    catMap[cat] = (catMap[cat]||0) + amt;
  });
  const categoryBreakdown = Object.entries(catMap).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
  const topCategory = categoryBreakdown[0] || null;

  const photocardCount = state.photocards.filter(p=> p.owned && p.createdAt && p.createdAt.startsWith(year)).length;

  const artistMap = {};
  yearFanlogs.forEach(f=>{
    if(!f.artist) return;
    artistMap[f.artist] = (artistMap[f.artist]||0) + 1;
  });
  const topArtist = Object.entries(artistMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count)[0] || null;

  return { year, concertCount, totalEventCount, totalExpense, categoryBreakdown, topCategory, photocardCount, topArtist };
}

function nextOccurrenceInfo(dateStr){
  // 只看月/日，算出下一次的日期（今年還沒到就用今年，過了就用明年）
  if(!dateStr || dateStr.length<10) return null;
  const mm = dateStr.slice(5,7), dd = dateStr.slice(8,10);
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let year = today.getFullYear();
  let next = new Date(`${year}-${mm}-${dd}T00:00:00`);
  if(isNaN(next.getTime())) return null;
  if(next < todayMid){
    next = new Date(`${year+1}-${mm}-${dd}T00:00:00`);
  }
  const diffDays = Math.round((next - todayMid) / (1000*60*60*24));
  return { mmdd: `${parseInt(mm,10)}/${parseInt(dd,10)}`, diffDays };
}

  if(expArtistFilter!=='__all__' && !expArtistNames.includes(expArtistFilter)) expArtistFilter = '__all__';
  if(expArtistFilter!=='__all__'){
    items = items.filter(e=> e.artist===expArtistFilter);
  }

  const grandTotal = items.reduce((sum, e) => sum + expenseAmount(e), 0);

  // 切換按鈕（累積消費總計僅在「全部明細」顯示，分類明細/歷年花費各自已有小計，不重複列出總計）
  html += `
  <div class="cal-filter-row" style="margin-bottom:14px;">
    <button class="exp-view-btn cal-filter-btn ${expViewMode==='all'?'active':''}" data-view="all">📋 全部明細</button>
    <button class="exp-view-btn cal-filter-btn ${expViewMode==='category'?'active':''}" data-view="category">🏷️ 分類明細</button>
    <button class="exp-view-btn cal-filter-btn ${expViewMode==='year'?'active':''}" data-view="year">📅 歷年花費</button>
    <button class="exp-view-btn cal-filter-btn ${expViewMode==='stats'?'active':''}" data-view="stats">📊 統計圖表</button>
  </div>
  ${expArtistNames.length>0 ? `
  <div class="cal-filter-row" style="margin-bottom:14px;">
    <button class="chip-filter-btn cal-filter-btn ${expArtistFilter==='__all__'?'active':''}" data-artist="__all__">👤 全部藝人</button>
    ${expArtistNames.map(n=>`<button class="chip-filter-btn cal-filter-btn ${expArtistFilter===n?'active':''}" data-artist="${esc(n)}">${esc(n)}</button>`).join('')}
  </div>` : ''}
  <div class="field" style="margin-bottom:14px;">
    <input type="text" id="expSearchInput" placeholder="🔍 搜尋商品名稱、備註、標籤、平台..." value="${esc(expSearchQuery)}" style="width:100%;box-sizing:border-box;">
  </div>
  `;

  if(items.length===0){
    html += `<div class="empty"><div class="big">🔍</div><div class="msg">找不到符合條件的花費紀錄</div></div>`;
    return html;
  }

  if(expViewMode==='all'){
    // 依有紀錄的月份列出可篩選的月份（新到舊）
    const months = [...new Set(items.filter(e=>e.date).map(e=>e.date.slice(0,7)))].sort((a,b)=> b.localeCompare(a));
    if(expMonthFilter!=='__all__' && !months.includes(expMonthFilter)) expMonthFilter = '__all__';

    html += `<div class="cal-filter-row" style="margin-bottom:14px;">
      <button class="chip-filter-btn cal-filter-btn ${expMonthFilter==='__all__'?'active':''}" data-month="__all__">📆 全部</button>
      ${months.map(m=>{
        const [y,mm] = m.split('-');
        const active = expMonthFilter===m;
        return `<button class="chip-filter-btn cal-filter-btn ${active?'active':''}" data-month="${m}">${y}/${parseInt(mm,10)}月</button>`;
      }).join('')}
    </div>`;

    // 累積消費總計：放在篩選列下方、月份明細上方
    html += `
    <div class="mini-row" style="margin-bottom:16px; background:var(--surface); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow-sm);">
      <span class="l" style="font-weight:700;">💰 累積消費總計</span>
      <span class="r" style="font-weight:700; font-size:16px; color:var(--rose-deep);">NT$ ${grandTotal.toLocaleString()}</span>
    </div>
    `;

    // 選擇特定月份時，顯示該月明細
    if(expMonthFilter!=='__all__'){
      const monthItems = items.filter(e=> e.date && e.date.startsWith(expMonthFilter));
      const monthTotal = monthItems.reduce((sum,e)=> sum + expenseAmount(e), 0);
      const [my, mm] = expMonthFilter.split('-');

      html += `
      <div class="exp-group-header">
        <div class="exp-group-title">🗓️ ${my}/${parseInt(mm,10)}月明細 <span class="exp-group-count">(${monthItems.length} 筆)</span></div>
        <div class="exp-group-meta">NT$ ${monthTotal.toLocaleString()}</div>
      </div>
      <div class="exp-grid">
      `;
      if(monthItems.length===0){
        html += `<div class="empty"><div class="big">${meta.emptyIcon}</div><div class="msg">這個月還沒有花費紀錄</div></div>`;
      } else {
        monthItems.forEach(item=>{ html += renderExpenseCard(item); });
      }
      html += `</div>`;
    }
  }

  if(expViewMode==='all'){
    if(expMonthFilter==='__all__'){
      html += `<div class="exp-grid">`;
      items.forEach(item=>{ html += renderExpenseCard(item); });
      html += `</div>`;
    }
  } else if(expViewMode==='category'){
    // 依分類分組
    const catGroups = {};
    items.forEach(item=>{
      const cat = item.category || '未分類';
      if(!catGroups[cat]) catGroups[cat] = [];
      catGroups[cat].push(item);
    });

    const allExpCategories = [...FIXED_EXPENSE_CATEGORIES, ...state.customExpenseCategories];
    const categoryKeys = Object.keys(catGroups).sort((a,b)=>{
      const idxA = allExpCategories.indexOf(a);
      const idxB = allExpCategories.indexOf(b);
      if(idxA !== -1 && idxB !== -1) return idxA - idxB;
      if(idxA !== -1) return -1;
      if(idxB !== -1) return 1;
      return a.localeCompare(b);
    });

    if(expCategoryFilter!=='__all__' && !categoryKeys.includes(expCategoryFilter)) expCategoryFilter = '__all__';

    html += `<div class="cal-filter-row" style="margin-bottom:14px;">
      <button class="chip-filter-btn cal-filter-btn ${expCategoryFilter==='__all__'?'active':''}" data-cat="__all__">全部類別</button>
      ${categoryKeys.map(cat=>{
        const c = chipColor(cat);
        const icon = EXPENSE_CATEGORY_ICON[cat] || '🏷️';
        const active = expCategoryFilter===cat;
        return `<button class="chip-filter-btn ${active?'active':''}" style="background:${c.bg};color:${c.fg};" data-cat="${esc(cat)}">${icon} ${esc(cat)}</button>`;
      }).join('')}
    </div>`;

    const catItems = expCategoryFilter==='__all__' ? items : catGroups[expCategoryFilter];
    const catTotal = catItems.reduce((sum, e) => sum + expenseAmount(e), 0);
    const catLabel = expCategoryFilter==='__all__' ? '全部類別' : expCategoryFilter;

    html += `
    <div class="exp-group-header">
      <div class="exp-group-title">${catLabel} <span class="exp-group-count">(${catItems.length} 筆)</span></div>
      <div class="exp-group-meta">NT$ ${catTotal.toLocaleString()}</div>
    </div>
    <div class="exp-grid">
    `;
    catItems.forEach(item=>{ html += renderExpenseCard(item); });
    html += `</div>`;
  } else if(expViewMode==='year'){
    // 依年份分組
    const yearGroups = {};
    items.forEach(item=>{
      const y = (item.date && item.date.length >= 4) ? item.date.slice(0,4) : '未知年份';
      if(!yearGroups[y]) yearGroups[y] = [];
      yearGroups[y].push(item);
    });

    // 年份由新到舊排序
    const yearKeys = Object.keys(yearGroups).sort((a,b)=> b.localeCompare(a));

    if(expYearFilter!=='__all__' && !yearKeys.includes(expYearFilter)) expYearFilter = yearKeys[0] || '__all__';

    html += `<div class="cal-filter-row" style="margin-bottom:14px;">
      <button class="chip-filter-btn cal-filter-btn ${expYearFilter==='__all__'?'active':''}" data-year="__all__">全部年份</button>
      ${yearKeys.map(y=>`<button class="chip-filter-btn cal-filter-btn ${expYearFilter===y?'active':''}" data-year="${esc(y)}">${esc(y)} 年</button>`).join('')}
    </div>`;

    const yearItems = expYearFilter==='__all__' ? items : yearGroups[expYearFilter];
    const yearTotal = yearItems.reduce((sum, e) => sum + expenseAmount(e), 0);
    const yearLabel = expYearFilter==='__all__' ? '全部年份' : `${expYearFilter} 年`;

    html += `
    <div class="exp-group-header">
      <div class="exp-group-title">🗓️ ${esc(yearLabel)}花費明細 <span class="exp-group-count">(${yearItems.length} 筆)</span></div>
      <div class="exp-group-meta">NT$ ${yearTotal.toLocaleString()}</div>
    </div>
    <div class="exp-grid">
    `;
    yearItems.forEach(item=>{ html += renderExpenseCard(item); });
    html += `</div>`;
  } else if(expViewMode==='stats'){
    html += renderExpenseStats(items);
  }

  return html;
}

function renderExpenseStats(items){
  if(items.length===0) return `<div class="empty"><div class="big">📊</div><div class="msg">沒有資料可供統計</div></div>`;

  // 各分類佔比
  const catTotals = {};
  items.forEach(e=>{
    const cat = e.category || '未分類';
    catTotals[cat] = (catTotals[cat]||0) + expenseAmount(e);
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=> b[1]-a[1]);
  const catMax = catEntries.length ? catEntries[0][1] : 1;
  const grandTotal = items.reduce((s,e)=> s+expenseAmount(e), 0);

  const catBarsHtml = catEntries.map(([cat, amt])=>{
    const pct = catMax>0 ? Math.max(4, Math.round(amt/catMax*100)) : 0;
    const sharePct = grandTotal>0 ? (amt/grandTotal*100).toFixed(1) : '0.0';
    const color = chipColor(cat);
    const icon = EXPENSE_CATEGORY_ICON[cat] || '🏷️';
    return `
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span>${icon} ${esc(cat)}</span>
        <span style="color:var(--ink-soft);">NT$ ${amt.toLocaleString()}（${sharePct}%）</span>
      </div>
      <div style="background:var(--bg-deep);border-radius:8px;height:14px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${color.bg};border-left:4px solid ${color.fg};border-radius:8px;"></div>
      </div>
    </div>`;
  }).join('');

  // 月度花費趨勢（依實際資料涵蓋的月份，最多近 12 個月，最新在右）
  const monthTotals = {};
  items.forEach(e=>{
    if(!e.date) return;
    const m = e.date.slice(0,7);
    monthTotals[m] = (monthTotals[m]||0) + expenseAmount(e);
  });
  const monthKeys = Object.keys(monthTotals).sort().slice(-12);
  const monthMax = monthKeys.length ? Math.max(...monthKeys.map(m=>monthTotals[m])) : 1;

  const monthBarsHtml = monthKeys.length ? `
    <div style="display:flex;align-items:flex-end;gap:8px;height:150px;padding:0 4px;overflow-x:auto;">
      ${monthKeys.map(m=>{
        const amt = monthTotals[m];
        const h = monthMax>0 ? Math.max(6, Math.round(amt/monthMax*110)) : 6;
        const [, mm] = m.split('-');
        const label = amt>=10000 ? Math.round(amt/1000)+'k' : (amt>=1000 ? (amt/1000).toFixed(1)+'k' : amt);
        return `
        <div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:36px;">
          <div style="font-size:10px;color:var(--ink-soft);margin-bottom:2px;white-space:nowrap;">${label}</div>
          <div style="width:22px;height:${h}px;background:var(--rose);border-radius:6px 6px 0 0;"></div>
          <div style="font-size:10px;color:var(--ink-faint);margin-top:4px;">${parseInt(mm,10)}月</div>
        </div>`;
      }).join('')}
    </div>` : `<div class="empty" style="padding:20px 0;"><div class="msg">尚無月份資料</div></div>`;

  return `
  <div class="exp-group-header">
    <div class="exp-group-title">🏷️ 各分類佔比</div>
    <div class="exp-group-meta">共 NT$ ${grandTotal.toLocaleString()}</div>
  </div>
  <div style="background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:20px;">
    ${catBarsHtml}
  </div>
  <div class="exp-group-header">
    <div class="exp-group-title">📈 月度花費趨勢</div>
  </div>
  <div style="background:var(--surface);border-radius:16px;padding:16px 8px;box-shadow:var(--shadow-sm);">
    ${monthBarsHtml}
  </div>
  `;
}

function bindExpenseActions(){
  document.querySelectorAll('.exp-view-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      expViewMode = btn.dataset.view;
      render();
    });
  });
  document.querySelectorAll('.chip-filter-btn[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      expCategoryFilter = btn.dataset.cat;
      render();
    });
  });
  document.querySelectorAll('.chip-filter-btn[data-artist]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      expArtistFilter = btn.dataset.artist;
      render();
    });
  });
  document.querySelectorAll('.chip-filter-btn[data-year]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      expYearFilter = btn.dataset.year;
      render();
    });
  });
  document.querySelectorAll('.chip-filter-btn[data-month]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      expMonthFilter = btn.dataset.month;
      render();
    });
  });
  document.querySelectorAll('.icon-btn.dup').forEach(btn=>{
    btn.addEventListener('click', ()=> duplicateExpense(btn.dataset.id));
  });
  const searchInput = document.getElementById('expSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      expSearchQuery = e.target.value;
      const cursorPos = e.target.selectionStart;
      render();
      const newInput = document.getElementById('expSearchInput');
      if(newInput){
        newInput.focus();
        newInput.setSelectionRange(cursorPos, cursorPos);
      }
    });
  }
}

function duplicateExpense(id){
  const item = state.expense.find(e=>String(e.id)===String(id));
  if(!item) return;
  const prefill = JSON.parse(JSON.stringify(item));
  delete prefill.id;
  openExpenseForm(null, prefill);
}

function expenseStatusColor(status){
  const map = {
    '未到貨': {bg:'#FADBD8', fg:'#C0392B'},
    '已到貨': {bg:'#D8F3DC', fg:'#2F6B3F'},
    '已取消': {bg:'#E6E6E6', fg:'#555555'},
    '退換中': {bg:'#FFE3C2', fg:'#9C5A17'}
  };
  return map[status] || {bg:'#E6EEFA', fg:'#5F4E7A'};
}

function renderExpenseCard(item){
  const unit = parseFloat(item.unitPrice)||0;
  const qty = parseFloat(item.quantity)||1;
  const total = expenseAmount(item);
  const cover = (item.imageUrls||[])[0];
  const catIcon = EXPENSE_CATEGORY_ICON[item.category] || '💸';
  const catColor = item.category ? chipColor(item.category) : null;
  const statusColor = item.deliveryStatus ? expenseStatusColor(item.deliveryStatus) : null;
  const tags = (item.tags||[]);
  const footnoteParts = [];
  if(item.artist) footnoteParts.push('👤 '+item.artist);
  if(item.paymentMethod) footnoteParts.push('付款: '+item.paymentMethod);
  if(item.platform) footnoteParts.push('購自'+item.platform);

  return `
  <div class="card exp-card">
    <div class="exp-row">
      <div class="exp-thumb">
        ${cover ? `<img src="${esc(cover)}" onerror="this.parentElement.innerHTML='${catIcon}'">` : catIcon}
      </div>
      <div class="exp-info">
        <div class="exp-badges">
          ${item.category ? `<span class="tag" style="background:${catColor.bg};color:${catColor.fg};">${catIcon} ${esc(item.category)}</span>` : ''}
          ${item.deliveryStatus ? `<span class="tag" style="background:${statusColor.bg};color:${statusColor.fg};">${esc(item.deliveryStatus)}</span>` : ''}
        </div>
        <div class="card-title exp-name">${esc(item.name||'（未命名）')}</div>
        ${tags.length ? `<div>${tags.map(t=>`<span class="tag gold">#${esc(t)}</span>`).join('')}</div>` : ''}
        ${footnoteParts.length ? `<div class="card-meta" style="margin-top:4px;">${esc(footnoteParts.join(' · '))}</div>` : ''}
        ${item.note ? `<div class="card-meta" style="margin-top:4px;">${esc(item.note)}</div>` : ''}
      </div>
      <div class="exp-price">
        <div class="exp-date">${item.date? fmtDate(item.date) : '—'}</div>
        <div class="exp-unit">$${unit.toLocaleString()}×${qty}</div>
        <div class="exp-total">$${total.toLocaleString()}</div>
      </div>
    </div>
    <div class="card-actions" style="justify-content:flex-end;margin-top:8px;">
      <button class="icon-btn dup" data-tab="expense" data-id="${item.id}" title="複製這筆">📋</button>
      <button class="icon-btn edit" data-tab="expense" data-id="${item.id}">✎</button>
      <button class="icon-btn del" data-tab="expense" data-id="${item.id}">🗑</button>
    </div>
  </div>`;
}

let expTags = [];
let expImgUrls = [];

function openExpenseForm(id, prefill){
  const existing = id ? state.expense.find(e=>String(e.id)===String(id)) : null;
  const src = existing || prefill || null;
  expTags = src && Array.isArray(src.tags) ? [...src.tags] : [];
  expImgUrls = src && Array.isArray(src.imageUrls) ? [...src.imageUrls] : [];

  const platforms = [...new Set(state.expense.map(e=>e.platform).filter(Boolean))];

  const categoryOptions = [...FIXED_EXPENSE_CATEGORIES, ...state.customExpenseCategories];
  const curCategory = src ? (src.category||'') : '';
  const isCustomCategory = curCategory && !categoryOptions.includes(curCategory);
  const categoryFieldHtml = `
    <select id="expCategorySelect">
      <option value="">請選擇</option>
      ${categoryOptions.map(c=>`<option value="${esc(c)}" ${curCategory===c?'selected':''}>${esc(c)}</option>`).join('')}

    </select>
    <input type="text" id="expNewCategory" placeholder="輸入新的分類名稱" style="margin-top:8px; display:${isCustomCategory?'block':'none'};" value="${isCustomCategory?esc(curCategory):''}">`;

  const artistOptions = [...new Set([
    ...state.artists.map(a=>a.name),
    ...state.expense.map(e=>e.artist).filter(Boolean)
  ])];
  const curArtist = src ? (src.artist||'') : '';
  let artistFieldHtml = '';
  if(artistOptions.length===0){
    artistFieldHtml = `

      <input type="text" id="expNewArtistName" placeholder="輸入新藝人名稱" style="margin-top:8px; display:${curArtist && !artistOptions.includes(curArtist)?'block':'none'};" value="${curArtist && !artistOptions.includes(curArtist)?esc(curArtist):''}">`;

    <div class="field"><label>相關藝人</label>${artistFieldHtml}</div>
    <div style="display:flex; gap:10px;">
      <div class="field" style="flex:1;"><label>單價</label><input type="number" id="expUnitPrice" value="${src?esc(src.unitPrice||''):''}" placeholder="0"></div>
      <div class="field" style="flex:1;"><label>數量</label><input type="number" id="expQuantity" value="${src?esc(src.quantity||1):1}" min="1" placeholder="1"></div>
      <div class="field" style="flex:1;"><label>運費/二補</label><input type="number" id="expShipping" value="${src?esc(src.shipping||''):''}" placeholder="0"></div>
    </div>
    <div class="field">
      <label>原始幣值（選填，可換算台幣單價）</label>
      <div style="display:flex; gap:8px;">
        <select id="expCurrency" style="flex:0 0 92px;">
          ${['CNY','JPY','KRW','USD','HKD','TWD'].map(c=>`<option value="${c}" ${src&&src.origCurrency===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <input type="number" id="expOrigAmount" value="${src?esc(src.origAmount||''):''}" placeholder="原始金額" style="flex:1;">
        <button type="button" class="btn ghost" id="expConvertBtn" style="flex:0 0 auto;padding:10px 14px;">⇄ 換算</button>

      <div id="expRateHint" style="font-size:11px;color:var(--ink-soft);margin-top:4px;"></div>
    </div>
    <div class="field"><label>分類</label>${categoryFieldHtml}</div>
    <div class="field"><label>消費年月日 *</label><input type="date" id="expDate" value="${existing?esc(existing.date||''):todayStr()}"></div>
    <div class="field"><label>購物平台</label>
      <input type="text" id="expPlatform" list="expPlatformList" placeholder="例：蝦皮、代購..." value="${src?esc(src.platform||''):''}">

    </div>
    <div class="field"><label>到貨狀態</label>
      <select id="expDeliveryStatus">
        <option value="">請選擇</option>
        ${EXPENSE_STATUS.map(s=>`<option value="${esc(s)}" ${src&&src.deliveryStatus===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>

      <select id="expPaymentMethod">

      </select>

    <div class="field"><label>標籤</label>

function renderExpTagChips(){
  const box = document.getElementById('expTagBox');
  if(!box) return;
  box.innerHTML = expTags.map(t=>
    `<span class="tag-chip">${esc(t)} <span class="tag-chip-x" data-remove="${esc(t)}">×</span></span>`
  ).join('') + `<input type="text" id="expTagText" placeholder="輸入完標籤後，記得加#號加入">`;
  box.querySelectorAll('.tag-chip-x').forEach(x=>{
    x.addEventListener('click', ()=>{
      expTags = expTags.filter(t=>t!==x.dataset.remove);
      renderExpTagChips();
      bindExpTagInput();
    });
  });
  bindExpTagInput();
}
function bindExpTagInput(){
  const input = document.getElementById('expTagText');
  if(!input) return;
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      let val = input.value.trim().replace(/^#/, '');
      if(val && !expTags.includes(val)){
        expTags.push(val);
        renderExpTagChips();
        const newInput = document.getElementById('expTagText');
        if(newInput) newInput.focus();
      } else {
        input.value = '';
      }
    }
  });
}

function renderExpImgList(){
  const list = document.getElementById('expImgList');
  if(!list) return;
  if(expImgUrls.length===0){
    list.innerHTML = `<div style="font-size:12px;color:var(--ink-faint);">尚未加入圖片連結</div>`;

function addExpImgUrl(){

async function saveExpenseForm(existing){
  const name = document.getElementById('expName').value.trim();
  const date = document.getElementById('expDate').value;
  if(!name || !date){ showToast('請填寫必填欄位 *'); return; }

  const recordType = 'expense';

  const categorySelect = document.getElementById('expCategorySelect');
  let category = categorySelect.value;
  if(category==='__other__'){
    const newCat = document.getElementById('expNewCategory').value.trim();
    category = newCat;
    if(newCat && !FIXED_EXPENSE_CATEGORIES.includes(newCat) && !state.customExpenseCategories.includes(newCat)){
      state.customExpenseCategories.push(newCat);
      await saveKey('oshi-expense-categories', state.customExpenseCategories);
    }
  }

  const artistSelect = document.getElementById('expArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__'){
    const newName = document.getElementById('expNewArtistName').value.trim();
    artist = newName;
  }
  if(artist && !state.artists.find(a=>a.name===artist)){
    state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:artist });
    await saveKey('oshi-artists', state.artists);
  }

  const data = {
    recordType,
    name,
    artist,
    unitPrice: document.getElementById('expUnitPrice').value.trim(),
    quantity: document.getElementById('expQuantity').value.trim() || '1',
    shipping: document.getElementById('expShipping').value.trim(),
    origCurrency: document.getElementById('expCurrency').value,
    origAmount: document.getElementById('expOrigAmount').value.trim(),
    category,
    date,
    platform: document.getElementById('expPlatform').value.trim(),
    deliveryStatus: document.getElementById('expDeliveryStatus').value,
    paymentMethod: document.getElementById('expPaymentMethod').value,
    tags: [...expTags],
    note: document.getElementById('expNote').value.trim(),
    imageUrls: [...expImgUrls]
  };

  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.expense.push(data);
  }
  await saveKey('oshi-expense', state.expense);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

/* ================= Schedule (calendar view) ================= */
let calMonth = null;
let scheduleArtistFilter = '__all__';
let scheduleViewMode = 'calendar';

function ensureCalMonth(){
  if(!calMonth) calMonth = todayStr().slice(0,7);
}

function eventColorClass(key){
  if(!key) return 'ec0';
  let h = 0;
  for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) % 997;
  return 'ec' + (h % 5);
}

function renderScheduleTab(){
  ensureCalMonth();
  const meta = TAB_META.schedule;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;

  const artistNames = [...new Set(state.schedule.map(s=>s.artist).filter(Boolean))];
  const filteredSchedule = state.schedule.filter(s=> scheduleArtistFilter==='__all__' || s.artist===scheduleArtistFilter);

  html += `<div class="cal-filter-row" style="margin-bottom:10px;">
    <button class="sched-view-btn cal-filter-btn ${scheduleViewMode==='calendar'?'active':''}" data-view="calendar">📅 月曆檢視</button>
    <button class="sched-view-btn cal-filter-btn ${scheduleViewMode==='list'?'active':''}" data-view="list">📋 清單檢視</button>
  </div>`;

  html += `<div class="cal-filter-row">
    <button class="cal-filter-btn ${scheduleArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部行程</button>
    ${artistNames.map(n=>`<button class="cal-filter-btn ${scheduleArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
  </div>`;

  if(scheduleViewMode==='list'){
    html += renderScheduleListBody(filteredSchedule);
    return html;
  }

  const [y,m] = calMonth.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = `${y}年${m}月`;

  const eventsByDate = {};
  filteredSchedule.forEach(s=>{
    if(!s.date) return;
    if(s.isMultiDay && s.endDate && s.endDate > s.date){
      let cur = new Date(s.date+'T00:00:00');
      const end = new Date(s.endDate+'T00:00:00');
      let guard = 0;
      while(cur <= end && guard < 366){
        const ds = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
        (eventsByDate[ds] = eventsByDate[ds] || []).push(s);
        cur.setDate(cur.getDate()+1);
        guard++;
      }
    } else {
      (eventsByDate[s.date] = eventsByDate[s.date] || []).push(s);
    }
  });

  html += `<div class="cal-head">
    <button class="cal-nav-btn" data-nav="-1">‹</button>
    <div class="cal-title maru">${monthLabel}</div>
    <button class="cal-nav-btn" data-nav="1">›</button>
  </div>`;

  const dows = ['日','一','二','三','四','五','六'];
  html += `<div class="cal-grid">`;
  dows.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startWeekday;i++) html += `<div class="cal-day empty"></div>`;
  const today = todayStr();
  const MAX_PILLS = 3;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===today;
    const dayEvents = eventsByDate[dateStr] || [];
    const shown = dayEvents.slice(0, MAX_PILLS);
    const extra = dayEvents.length - shown.length;
    html += `<div class="cal-day ${isToday?'today':''}" data-date="${dateStr}">
      <span class="daynum">${d}</span>
      ${shown.map(ev=>`<span class="event-pill ${eventColorClass(ev.artist||ev.title)}" data-id="${ev.id}" title="${esc(ev.title)}">${esc(ev.title)}</span>`).join('')}
      ${extra>0 ? `<span class="event-more">+${extra} 更多</span>` : ''}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderScheduleListBody(filteredSchedule){
  const today = todayStr();
  const effectiveEnd = s=> (s.isMultiDay && s.endDate) ? s.endDate : s.date;
  const dated = filteredSchedule.filter(s=>s.date);
  const upcoming = dated.filter(s=> effectiveEnd(s) >= today).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const past = dated.filter(s=> effectiveEnd(s) < today).sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  if(upcoming.length===0 && past.length===0){
    return `<div class="empty"><div class="big">📅</div><div class="msg">還沒有安排任何行程<br>點右下角的「＋」新增一筆吧</div></div>`;
  }

  const renderRow = (s)=>{
    const dateLabel = (s.isMultiDay && s.endDate && s.endDate!==s.date)
      ? `${fmtDate(s.date)} ～ ${fmtDate(s.endDate)}`
      : fmtDate(s.date);
    const catBadge = s.category ? `<span class="tag ${tagColorClass(s.category, [...FIXED_SCHEDULE_CATEGORIES, ...state.customScheduleCategories])}">${esc(s.category)}</span>` : '';
    return `
    <div class="card">
      <div class="card-row">
        <div>
          <div class="card-title">${esc(s.title)}</div>
          <div class="card-meta">${[s.artist, s.location].filter(Boolean).join(' · ')}</div>
          <div style="margin-top:6px;">${catBadge} <span class="tag">🗓️ ${dateLabel}</span></div>
          ${s.note ? `<div class="card-meta" style="margin-top:6px;">${esc(s.note)}</div>` : ''}
        </div>
        <div class="card-actions">
          <button class="icon-btn edit" data-tab="schedule" data-id="${s.id}">✎</button>
          <button class="icon-btn del" data-tab="schedule" data-id="${s.id}">🗑</button>
        </div>
      </div>
    </div>`;
  };

  let html = '';
  if(upcoming.length>0){
    html += `<div class="exp-group-header"><div class="exp-group-title">📌 即將到來 <span class="exp-group-count">(${upcoming.length} 筆)</span></div></div>
    <div class="list-grid">${upcoming.map(renderRow).join('')}</div>`;
  }
  if(past.length>0){
    html += `<div class="exp-group-header" style="margin-top:18px;"><div class="exp-group-title">✅ 已結束 <span class="exp-group-count">(${past.length} 筆)</span></div></div>
    <div class="list-grid">${past.map(renderRow).join('')}</div>`;
  }
  return html;
}

function bindCalendarActions(){
  document.querySelectorAll('.sched-view-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      scheduleViewMode = btn.dataset.view;
      render();
    });
  });
  document.querySelectorAll('.cal-filter-btn[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{
      scheduleArtistFilter = b.dataset.filter;

    });
  });
  document.querySelectorAll('.cal-nav-btn').forEach(b=>{

      const dir = parseInt(b.dataset.nav,10);
      let newM = m+dir, newY = y;
      if(newM<1){ newM=12; newY--; }

    });
  });
}

/* ================= Photocards ================= */
let pcDrill = null;
let pcArtistFilter = '__all__';
let pcOwnedFilter = '__all__';

function pcGroupKey(pc){
  return (pc.series && pc.series.trim()) || (pc.artist && pc.artist.trim()) || '未分類';
}
function pcGroups(){
  const groups = {};
  state.photocards
    .filter(pc=> pcArtistFilter==='__all__' || pc.artist===pcArtistFilter)
    .forEach(pc=>{
      const key = pcGroupKey(pc);
      (groups[key] = groups[key] || []).push(pc);
    });
  // 圖鑑內以建立時間排序，越靠近今天排越前面
  Object.keys(groups).forEach(key=>{
    groups[key].sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  });
  return groups;
}
function pcSeriesCreatedAt(key){
  return (state.pcSeriesMeta && state.pcSeriesMeta[key] && state.pcSeriesMeta[key].createdAt) || '';
}
function pcOrderedKeys(groups){
  const preferredOrder = [...state.artists.map(a=>a.name)];
  const allKeys = Object.keys(groups);
  const seriesKeys = allKeys.filter(k=>!preferredOrder.includes(k) && k!=='未分類');
  // 圖鑑本身有自己獨立的建立日期（跟裡面小卡的建立日期分開），有設定日期的排前面、越新越前面
  seriesKeys.sort((a,b)=>{
    const da = pcSeriesCreatedAt(a), db = pcSeriesCreatedAt(b);
    if(da && db) return db.localeCompare(da);
    if(da && !db) return -1;
    if(!da && db) return 1;
    return a.localeCompare(b);
  });
  const ordered = [
    ...preferredOrder.filter(k=>groups[k]),
    ...seriesKeys,
  ];
  if(groups['未分類']) ordered.push('未分類');
  return ordered;
}

function renderPhotocardCard(pc){
  const catClass = tagColorClass(pc.category, [...FIXED_PC_CATEGORIES, ...state.customPcCategories]);
  const owned = !!pc.owned;
  return `
