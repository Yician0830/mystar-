<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>推し手帳｜我的追星手帳</title>

<!-- PWA：加到主畫面後可像 App 一樣開啟 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C15B79">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="推し手帳">
<script>
/* 提早套用深色/淺色模式，避免畫面載入時閃爍 */
(function(){
  try{
    var raw = window.localStorage.getItem('oshiapp:oshi-theme');
    var theme = raw ? JSON.parse(raw) : null;
    var mode = (theme && theme.mode) ? theme.mode : 'light';
    if(mode==='system'){
      mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    if(mode==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- 引入 Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-messaging-compat.js"></script>
<style>
  :root{
    --bg:#FBF4EC;
    --bg-deep:#F6E9DA;
    --surface:#FFFDF9;
    --surface-soft:#F8EFE2;
    --ink:#4A3D36;
    --ink-soft:#9C8977;
    --ink-faint:#DCCDB8;
    --sakura:#F3C9D6;
    --sakura-pale:#FCEDF1;
    --rose:#DD8AA0;
    --rose-deep:#C15B79;
    --matcha:#7FA05F;
    --matcha-pale:#E8F0DE;
    --wisteria:#9584C2;
    --wisteria-pale:#F0ECF8;
    --gold:#C6A13A;
    --shadow: 0 6px 20px rgba(90,60,45,0.12);
    --shadow-sm: 0 2px 8px rgba(90,60,45,0.10);
    --radius: 20px;
    --blob-1: rgba(243,201,214,0.28);
    --blob-2: rgba(149,132,194,0.16);
  }
  /* ===== 深色模式（底色／文字色，主題色由 JS 依使用者選擇的顏色套用） ===== */
  [data-theme="dark"]{
    --bg:#1C1712;
    --bg-deep:#14100D;
    --surface:#2A2320;
    --surface-soft:#332A25;
    --ink:#F3E9DE;
    --ink-soft:#B3A08C;
    --ink-faint:#6B5C4D;
    --shadow: 0 6px 20px rgba(0,0,0,0.45);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; width:100%; min-height:100%;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:
      radial-gradient(circle at 15% 8%, var(--blob-1), transparent 40%),
      radial-gradient(circle at 90% 15%, var(--blob-2), transparent 45%),
      var(--bg);
    transition: background-color 0.2s ease;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:none;
    min-height:100vh;
    background:transparent;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* Content fills the full device width — no max-width cap, no centering */
  .top-row, main#mainContent{
    width:100%;
    box-sizing:border-box;
  }
  .maru{font-family:'Zen Maru Gothic', sans-serif;}

  /* ===== Header ===== */
  header.top{
    padding:22px 20px 16px;
    position:relative;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    width:14px;height:14px;
    background:var(--sakura);
    border-radius: 0 60% 0 60%;
    opacity:0.5;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform: translateY(-20px) rotate(0deg); opacity:0;}
    10%{opacity:0.55;}
    100%{ transform: translateY(160px) rotate(200deg); opacity:0;}
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1;}
  .top-row-actions{ display:flex; align-items:center; gap:8px; }
  .header-search-btn{
    width:38px; height:38px; border-radius:50%;
    background:var(--surface); border:1px solid var(--sakura-pale);
    box-shadow:var(--shadow-sm); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:40px;height:40px;border-radius:50%;
    background:var(--rose-deep);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic';font-weight:700;font-size:18px;
    box-shadow: var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-text .title{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:19px; letter-spacing:0.5px;}
  .brand-text .sub{ font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .profile-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--sakura-pale);
    border-radius:999px;
    padding:6px 12px 6px 6px;
    cursor:pointer;
    box-shadow: var(--shadow-sm);
    font-size:12px;
    color:var(--ink-soft);
  }
  .profile-chip .dot{
    width:22px;height:22px;border-radius:50%;
    background:var(--wisteria-pale);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    overflow:hidden;
  }
  .profile-chip .dot img{ width:100%;height:100%;object-fit:cover; }

  /* ===== Tab content area ===== */
  main{
    flex:1;
    padding: 6px 18px 100px;
  }
  .section-title{
    font-family:'Zen Maru Gothic';
    font-weight:700;
    font-size:20px;
    margin: 10px 2px 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title .stamp{
    width:30px;height:30px;border-radius:50%;
    background:var(--rose);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic';font-weight:700;font-size:14px;
  }

  /* ===== responsive list grid (schedule/expense/fanlog/artists cards) ===== */
  .list-grid{ display:block; }
  @media (min-width:700px){
    .list-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:14px; align-items:stretch; }
    .list-grid .card{ margin-bottom:0; height:100%; display:flex; flex-direction:column; }
  }
  /* ===== cards ===== */
  .card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:16px 16px;
    margin-bottom:12px;
    box-shadow: var(--shadow-sm);
    position:relative;
    border:1px solid rgba(0,0,0,0.02);
  }
  .card-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{ font-weight:700; font-size:15px; margin:0 0 3px;}
  .card-meta{ font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
  .tag{
    display:inline-block;
    font-size:11px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--sakura-pale);
    color:var(--rose-deep);
    margin-right:6px;
    margin-top:4px;
    white-space:nowrap;
  }
  .tag.matcha{ background:var(--matcha-pale); color:#4C6034;}
  .tag.wisteria{ background:var(--wisteria-pale); color:#5A4A82;}
  .tag.gold{ background:#F6E9CE; color:#8C6B22;}
  .tag.rose{ background:#FBE3EA; color:#B2465F;}
  .tag.sky{ background:#DCEBEF; color:#2F5A73;}
  .tag.peach{ background:#FBE7D3; color:#9C5A17;}
  .linked-expense-tag{ cursor:pointer; }
  .linked-expense-tag:hover{ filter:brightness(0.95); }
  .linked-fanlog-tag{ cursor:pointer; }
  .linked-fanlog-tag:hover{ filter:brightness(0.95); }
  .tag.lavender{ background:#E6E4F5; color:#4F4A8C;}
  .tag.mint{ background:#DCEFEA; color:#2F6B62;}
  .tag.coral{ background:#F7E1EC; color:#8C4468;}
  .tag.amber{ background:#F0E0CB; color:#8C6239;}
  .tag.slate{ background:#EAE6E0; color:#5C5850;}
  .card-actions{ display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    width:30px;height:30px;border-radius:50%;
    border:none; background:var(--bg-deep); color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:14px;
    transition:0.15s;
  }
  .icon-btn:hover{ background:var(--sakura-pale); color:var(--rose-deep);}
  .icon-btn.del:hover{ background:#F7D9D9; color:#B54545;}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-faint);
  }
  .empty .big{ font-size:34px; margin-bottom:8px;}
  .empty .msg{ font-size:13.5px; }
  .empty .stamp-big{
    width:72px; height:72px;
    margin:0 auto 16px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Zen Maru Gothic'; font-weight:700; font-size:26px;
    color:var(--rose-deep);
    border:2px solid currentColor;
    outline:1.5px solid currentColor;
    outline-offset:5px;
    opacity:0.45;
    transform:rotate(-6deg);
    mix-blend-mode:multiply;
  }
  [data-theme="dark"] .empty .stamp-big{ mix-blend-mode:normal; opacity:0.65; }

  /* Home dashboard */
  .home-dashboard{ display:block; }
  .home-main, .home-side{ min-width:0; }
  @media (min-width:1100px){
    .home-dashboard{ display:grid; grid-template-columns:1.5fr 1fr; gap:24px; align-items:start; }
  }
  .greet-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:18px; box-shadow:var(--shadow-sm);
  }
  .greet-card-icon{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg, var(--sakura-pale), var(--wisteria-pale));
    display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  }
  .greet-card-text{ min-width:0; }
  .greet-card .greet{ margin:0; }
  .greet-card .greet-date{ margin:2px 0 0; }
  .home-thumb-card{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border-radius:14px; padding:9px 12px;
    margin-bottom:8px; box-shadow:var(--shadow-sm);
  }
  .home-thumb-pic{
    width:40px;height:40px;border-radius:10px;flex-shrink:0;
    background:var(--sakura-pale); overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .home-thumb-pic img{ width:100%;height:100%;object-fit:cover; }
  .home-thumb-info{ flex:1; min-width:0; }
  .home-thumb-title{
    font-size:13px; color:var(--ink); font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .home-thumb-meta{
    font-size:11px; color:var(--ink-soft); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .home-thumb-amt{ font-size:12.5px; font-weight:700; color:var(--rose-deep); flex-shrink:0; }
  .greet{
    font-family:'Zen Maru Gothic';
    font-size:17px;
    font-weight:700;
    margin: 4px 2px 2px;
  }
  .greet-date{ font-size:12px; color:var(--ink-soft); margin: 0 2px 16px;}
  .stat-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--surface); border-radius:16px; padding:12px 8px;
    text-align:center; box-shadow:var(--shadow-sm);
  }
  .stat-card .num{ font-family:'Zen Maru Gothic'; font-size:19px; font-weight:700; color:var(--rose-deep);}
  .stat-card .lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .oshi-banner{
    background: linear-gradient(135deg, var(--sakura-pale), var(--wisteria-pale));
    border-radius:var(--radius);
    padding:16px;
    display:flex; flex-direction:column; gap:12px;
    margin-bottom:18px;
    box-shadow: var(--shadow-sm);
  }
  .oshi-banner .oshi-top{ display:flex; gap:14px; align-items:center; }
  .oshi-banner img, .oshi-banner .ph{
    width:58px;height:58px;border-radius:50%;
    object-fit:cover; border:3px solid #fff; box-shadow:var(--shadow-sm);
    flex-shrink:0; background:var(--surface);
    display:flex;align-items:center;justify-content:center; font-size:22px;
  }
  .oshi-banner .name{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px;}
  .oshi-banner .grp{ font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .oshi-stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .oshi-stat{
    background:rgba(255,255,255,0.6);
    border-radius:14px;
    padding:8px 4px;
    text-align:center;
    min-width:0;
  }
  .oshi-stat .v{
    font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px;
    color:var(--rose-deep);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .oshi-stat .l{ font-size:10px; color:var(--ink-soft); margin-top:2px;}
  @media (min-width:700px){
    .oshi-stat{ padding:12px 8px; }
    .oshi-stat .v{ font-size:15px; }
    .oshi-stat .l{ font-size:11px; }
  }
  .bday-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  }
  .bday-card{
    background:var(--surface); border-radius:16px; padding:14px 8px;
    text-align:center; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:4px; min-width:0;
  }
  .bday-card .name{
    font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px;
    color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bday-card .date{ font-size:11.5px; color:var(--ink-soft); }
  .bday-card .days{ font-size:12px; font-weight:700; color:var(--rose-deep); }
  .bday-card.today{ background:linear-gradient(135deg, var(--sakura-pale), var(--wisteria-pale)); }
  @media (min-width:700px){
    .bday-card{ padding:16px 10px; }
    .bday-card .name{ font-size:14px; }
    .bday-card .date{ font-size:12px; }
    .bday-card .days{ font-size:13px; }
  }
  .dday-card.onsale .days{ color:var(--matcha); }
  .dday-card.onsale.today{ background:linear-gradient(135deg, var(--matcha-pale), var(--sakura-pale)); }
  .home-block{ margin-bottom:22px;}
  .home-block .block-head{
    display:flex; justify-content:space-between; align-items:center;
    margin:0 2px 10px;
  }
  .home-block .block-head h3{
    font-family:'Zen Maru Gothic'; font-size:14.5px; margin:0; font-weight:700;
    color:var(--ink);
  }
  .home-block .block-head a{
    font-size:11.5px; color:var(--rose-deep); cursor:pointer; text-decoration:none;
  }
  .mini-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border-radius:14px; padding:10px 14px;
    margin-bottom:8px; box-shadow:var(--shadow-sm); font-size:13px;
  }
  .mini-row .l{ color:var(--ink); }
  .mini-row .r{ color:var(--ink-soft); font-size:11.5px;}

  /* ===== Schedule calendar ===== */
  .cal-filter-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin:0 2px 16px;
    scrollbar-width:thin; scrollbar-color:var(--sakura-pale) transparent;
  }
  .cal-filter-row::-webkit-scrollbar{ height:5px; }
  .cal-filter-row::-webkit-scrollbar-track{ background:transparent; }
  .cal-filter-row::-webkit-scrollbar-thumb{ background:var(--sakura-pale); border-radius:999px; }
  .cal-filter-row::-webkit-scrollbar-thumb:hover{ background:var(--rose); }
  /* 年度回顧：固定 4 欄換行，不橫向捲動 */
  .year-review-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:0 2px 16px;
  }
  .year-review-grid .year-filter-btn{ width:100%; box-sizing:border-box; text-align:center; padding:7px 4px; }
  .year-review-more-btn{
    width:100%; box-sizing:border-box; padding:7px 6px; border-radius:999px;
    border:1px dashed var(--sakura-pale); background:transparent; color:var(--ink-soft);
    font-size:12.5px; font-family:'Noto Sans TC'; cursor:pointer; font-weight:500;
  }
  .year-review-more-btn:hover{ background:var(--sakura-pale); color:var(--rose-deep); }
  .month-trend-scroll{ scrollbar-width:thin; scrollbar-color:var(--sakura-pale) transparent; }
  .month-trend-scroll::-webkit-scrollbar{ height:5px; }
  .month-trend-scroll::-webkit-scrollbar-track{ background:transparent; }
  .month-trend-scroll::-webkit-scrollbar-thumb{ background:var(--sakura-pale); border-radius:999px; }
  .month-trend-scroll::-webkit-scrollbar-thumb:hover{ background:var(--rose); }
  .cal-filter-btn{
    flex-shrink:0; padding:7px 15px; border-radius:999px;
    border:1px solid var(--sakura-pale); background:var(--surface); color:var(--ink-soft);
    font-size:12.5px; font-family:'Noto Sans TC'; cursor:pointer; font-weight:500;
  }
  .cal-filter-btn.active{ background:var(--rose-deep); color:#fff; border-color:var(--rose-deep); font-weight:700;}
  .cal-filter-btn.qualify{ background:var(--matcha-pale); border-color:var(--matcha-pale); color:#3F6B45; font-weight:700;}
  .cal-filter-btn.qualify.active{ background:var(--rose-deep); border-color:var(--rose-deep); color:#fff;}
  .artist-multiselect{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
  .artist-toggle-btn{
    padding:7px 14px; border-radius:999px;
    border:1px solid var(--sakura-pale); background:var(--surface); color:var(--ink-soft);
    font-size:12.5px; font-family:'Noto Sans TC'; cursor:pointer; font-weight:500;
  }
  .artist-toggle-btn.active{ background:var(--rose-deep); color:#fff; border-color:var(--rose-deep); font-weight:700;}
  .chip-filter-btn{
    flex-shrink:0; padding:7px 14px; border-radius:999px; border:2px solid transparent;
    font-size:12.5px; font-family:'Noto Sans TC'; cursor:pointer; font-weight:600;
    transition:0.15s;
  }
  .chip-filter-btn.active{ border-color:currentColor; }
  .chip-filter-btn:hover{ transform:translateY(-1px); }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin:0 2px 14px;}
  .cal-title{ font-weight:700; font-size:16px;}
  .cal-nav-btn{
    width:32px;height:32px;border-radius:50%; border:none; background:var(--bg-deep);
    color:var(--ink-soft); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-nav-btn:hover{ background:var(--sakura-pale); color:var(--rose-deep);}
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px; width:100%; }
  .cal-dow{ text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); padding-bottom:6px;}
  .cal-day{
    position:relative; min-height:78px; border-radius:12px; background:var(--surface);
    display:flex; flex-direction:column; align-items:stretch;
    cursor:pointer; box-shadow:var(--shadow-sm); padding:6px 5px; gap:2px;
    overflow-x:visible; overflow-y:hidden;
  }
  .cal-day .daynum{ font-size:12px; font-weight:700; color:var(--ink); align-self:flex-start; }
  .cal-day.empty{ background:transparent; box-shadow:none; cursor:default;}
  .cal-day.today{ border:2px solid var(--rose-deep); background:var(--sakura-pale);}
  .cal-day.today .daynum{ color:var(--rose-deep); }
  .event-pill{
    display:block; width:100%; box-sizing:border-box;
    font-size:10px; line-height:1.5; padding:1px 6px; border-radius:6px;
    color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer;
  }
  .event-more{ font-size:9.5px; color:var(--ink-soft); padding:1px 6px; }
  /* 跨天行程橫條：用負邊距把左右兩側的格線縫隙填滿，接上鄰居格子看起來像同一條連續色塊 */
  .event-pill.event-bar{ font-weight:700; }
  .event-pill.event-bar.bridge-left{ margin-left:-6px; padding-left:8px; border-top-left-radius:0; border-bottom-left-radius:0; }
  .event-pill.event-bar.bridge-right{ margin-right:-6px; border-top-right-radius:0; border-bottom-right-radius:0; }
  @media (min-width:700px){
    .cal-day{ min-height:120px; padding:8px 7px; }
    .cal-day .daynum{ font-size:13.5px; }
    .event-pill{ font-size:11.5px; padding:3px 8px; border-radius:8px; }
  }
  .cal-daylist-title{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:14.5px; margin:4px 2px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .chip-clear{
    font-size:11px; border:none; background:var(--bg-deep); color:var(--ink-soft);
    border-radius:999px; padding:4px 12px; cursor:pointer; font-weight:500;
  }
  .chip-clear:hover{ background:var(--sakura-pale); color:var(--rose-deep);}

  /* ===== 年度／月份回顧 (schedule & fanlog) ===== */
  .review-block{ margin-bottom:22px;}
  .review-head{ font-weight:700; font-size:14.5px; margin:0 2px 10px;}
  .year-list{ display:flex; flex-direction:column; gap:10px;}
  .year-card{
    background:var(--surface); border-radius:16px; padding:13px 16px;
    cursor:pointer; box-shadow:var(--shadow-sm); border:2px solid transparent; transition:0.15s;
  }
  .year-card:hover{ transform:translateY(-1px);}
  .year-card.qualify{ background:var(--matcha-pale);}
  .year-card.active{ border-color:var(--rose-deep);}
  .year-num{ font-weight:700; font-size:17px;}
  .year-count{ font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .year-msg{ font-size:12px; margin-top:5px; font-weight:700; color:#B54545;}
  .year-card.qualify .year-msg{ color:#4E6B49;}

  .month-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .month-card{
    background:var(--surface); border-radius:14px; padding:10px 6px; text-align:center;
    cursor:pointer; box-shadow:var(--shadow-sm); border:2px solid transparent; transition:0.15s;
  }
  .month-card:hover{ transform:translateY(-1px);}
  .month-card.active{ border-color:var(--rose-deep);}
  .month-num{ font-weight:700; font-size:12.5px;}
  .month-count{ font-size:10px; color:var(--ink-soft); margin-top:3px;}
  .month-msg{ font-size:10px; margin-top:4px; font-weight:700; color:#B54545;}
  .month-card.happy .month-msg{ color:var(--rose-deep);}

  .sched-layout{ display:block; }
  @media (min-width:900px){
    .sched-layout{ display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:26px; align-items:start; }
    .sched-cal-col{ position:sticky; top:12px; min-width:0; }
    .sched-list-col{ min-width:0; }
  }

  /* Photocard count pill */
  .pc-count{ font-size:12px; color:var(--ink-soft);}
  .pc-owned{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink); margin:5px 0 6px; cursor:pointer;
  }
  .pc-owned input{ width:13px;height:13px; accent-color:var(--rose-deep); cursor:pointer; flex-shrink:0;}

  /* Photocard 大圖鑑 (series cover) grid — click into a series to see its individual cards */
  .pc-series-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    align-items:stretch; /* every card in a row stretches to the row's height */
  }
  @media (min-width:460px){ .pc-series-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:620px){ .pc-series-grid{ grid-template-columns:repeat(4,1fr); } }
  @media (min-width:780px){ .pc-series-grid{ grid-template-columns:repeat(5,1fr); } }
  @media (min-width:940px){ .pc-series-grid{ grid-template-columns:repeat(6,1fr); } }
  @media (min-width:1100px){ .pc-series-grid{ grid-template-columns:repeat(7,1fr); } }
  @media (min-width:1260px){ .pc-series-grid{ grid-template-columns:repeat(8,1fr); } }
  @media (min-width:1400px){ .pc-series-grid{ grid-template-columns:repeat(9,1fr); } }
  .pc-series-card-wrap{
    position:relative;
    height:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .pc-series-card{
    background:var(--surface); border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow-sm); cursor:pointer; border:none; padding:0; text-align:left;
    transition:transform 0.15s ease;
    display:flex; flex-direction:column;
    height:100%;
    width:100%;
    min-width:0;
  }
  .pc-series-card:hover{ transform:translateY(-3px); }
  .pc-series-cover{
    width:100%; aspect-ratio:4/5; object-fit:contain; object-position:center center;
    background:var(--sakura-pale); display:block; flex-shrink:0;
  }
  .pc-series-cover.ph{ display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--ink-faint);}
  .pc-series-edit-cover, .mc-series-edit-cover{
    position:absolute; bottom:9px; right:9px; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.92); color:var(--rose-deep); font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm);
    z-index:2;
  }
  .pc-series-body{
    padding:9px 34px 11px 11px; position:relative;
    flex:1; display:flex; flex-direction:column; justify-content:center;
    min-height:44px;
  }
  .pc-series-name{
    font-weight:700; font-size:12.5px; white-space:normal; overflow-wrap:break-word; line-height:1.35;
  }
  .pc-series-count{ font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .pc-series-progress-track{ width:100%; height:5px; background:var(--bg-deep); border-radius:4px; margin-top:5px; overflow:hidden;}
  .pc-series-progress-fill{ height:100%; background:var(--rose); border-radius:4px;}

  .pc-back{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer;
    color:var(--rose-deep); font-weight:700; font-size:13.5px; margin:0 2px 14px; user-select:none;
  }

  /* Individual photocard grid — auto-adjusts by device width, capped at 8 columns */
  .pc-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
    align-items:stretch;
  }
  @media (min-width:380px){ .pc-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:480px){ .pc-grid{ grid-template-columns:repeat(4,1fr); gap:9px; } }
  @media (min-width:620px){ .pc-grid{ grid-template-columns:repeat(5,1fr); } }
  @media (min-width:760px){ .pc-grid{ grid-template-columns:repeat(6,1fr); gap:10px; } }
  @media (min-width:900px){ .pc-grid{ grid-template-columns:repeat(7,1fr); } }
  @media (min-width:1040px){ .pc-grid{ grid-template-columns:repeat(8,1fr); } }
  @media (min-width:1180px){ .pc-grid{ grid-template-columns:repeat(9,1fr); } }
  .pc-card{
    background:var(--surface); border-radius:14px; overflow:hidden;
    box-shadow:var(--shadow-sm); position:relative; display:flex; flex-direction:column;
    height:100%;
  }
  .pc-img{
    width:100%; aspect-ratio: 4/5; object-fit:contain; object-position:center center; background:var(--sakura-pale);
    display:block;
  }
  .pc-img.ph{ display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--ink-faint);}
  .pc-body{ padding:8px 8px 8px; flex:1; display:flex; flex-direction:column;}
  .pc-name{ font-weight:700; font-size:11.5px; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pc-sub{ font-size:10px; color:var(--ink-soft); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* edit / delete buttons anchored to the bottom-right corner of each card */
  .pc-actions{ display:flex; justify-content:flex-end; gap:4px; margin-top:auto; padding-top:6px;}
  .pc-actions .icon-btn{ width:22px;height:22px; font-size:10px;}

  /* 應援牆 (support wall) gallery */
  .support-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:480px){ .support-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:680px){ .support-grid{ grid-template-columns:repeat(4,1fr); gap:14px; } }
  @media (min-width:920px){ .support-grid{ grid-template-columns:repeat(5,1fr); } }
  @media (min-width:1160px){ .support-grid{ grid-template-columns:repeat(6,1fr); } }
  .support-card{ padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .support-cover{ width:100%; aspect-ratio:4/3; object-fit:contain; background:var(--sakura-pale); display:block; }
  .support-cover.ph{ display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--ink-faint); }
  .support-body{ padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; }
  .support-body .card-actions{ margin-top:auto; padding-top:8px; }

  /* Floating add button */
  .fab{
    position:fixed;
    bottom:96px;
    right:20px;
    width:54px;height:54px;border-radius:50%;
    background:var(--rose-deep);
    color:#fff; border:none;
    font-size:24px;
    box-shadow:0 8px 18px rgba(42,143,199,0.35);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }

  /* Floating back-to-top button, sits just above the add button */
  .back-to-top{
    position:fixed;
    bottom:164px;
    right:20px;
    width:54px;height:54px;border-radius:50%;
    background:var(--surface);
    color:var(--rose-deep);
    border:1px solid var(--sakura-pale);
    font-size:20px;
    font-weight:700;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transform:translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .back-to-top.show{ opacity:1; pointer-events:auto; transform:translateY(0); }

  /* Bottom nav (becomes a left sidebar at >=900px, see breakpoint above) */
  .nav-more-only{ display:none; }
  .nav-btn.nav-more-btn{ display:none; }
  nav.bottom{
    position:fixed; bottom:0; left:0;
    width:100%; max-width:100%;
    background:var(--surface);
    border-top:1px solid var(--sakura-pale);
    display:flex; justify-content:center; gap:2px;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index:15;
    box-shadow: 0 -6px 20px rgba(42,143,199,0.08);
  }
  nav.bottom .nav-btn{ max-width:110px; }
  .nav-btn{
    background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint);
    font-family:'Noto Sans TC';
    padding:4px 2px;
    flex:1;
  }
  .nav-btn .stamp{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Zen Maru Gothic'; font-weight:700; font-size:12px;
    background:var(--bg-deep); color:var(--ink-soft);
    transition:0.15s;
  }
  .nav-btn.active .stamp{ background:var(--rose-deep); color:#fff;}
  .nav-btn.active{ color:var(--rose-deep); font-weight:700;}
  .nav-btn .lbl{ font-size:9.5px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(74,63,59,0.35);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--bg);
    width:100%; max-width:480px;
    border-radius:24px 24px 0 0;
    padding:22px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideup 0.22s ease-out;
  }
  @media (min-width:700px){
    .modal{ max-width:640px; }
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{transform:translateY(0);opacity:1;} }
  .modal h3{ font-family:'Zen Maru Gothic'; margin:0 0 16px; font-size:17px;}
  .field{ margin-bottom:13px;}
  .field label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:12px;
    border:1px solid var(--sakura-pale); background:var(--surface);
    font-family:'Noto Sans TC'; font-size:14px; color:var(--ink);
    outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--rose);
  }
  .field textarea{ resize:vertical; min-height:60px;}
  .modal-actions{ display:flex; gap:10px; margin-top:18px;}

  /* Expense (記帳本) card layout */
  .exp-grid{ display:grid; grid-template-columns:1fr; gap:14px; align-items:stretch; }
  @media (min-width:680px){ .exp-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1020px){ .exp-grid{ grid-template-columns:repeat(3,1fr); } }
  .exp-card{ padding:14px 14px 10px; margin-bottom:0; display:flex; flex-direction:column; height:100%; border-left-width:4px; border-left-style:solid; }
  .exp-row{ display:flex; gap:12px; align-items:flex-start; }
  .exp-thumb{
    width:52px; height:52px; border-radius:12px; flex-shrink:0;
    background:var(--sakura-pale); overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .exp-thumb img{ width:100%; height:100%; object-fit:cover; }
  .exp-info{ flex:1; min-width:0; }
  .exp-badges{ display:flex; flex-wrap:wrap; gap:0; margin-bottom:2px; }
  .exp-name{ margin-top:2px; }
  .exp-price{ flex-shrink:0; text-align:right; }
  .exp-date{ font-size:11px; color:var(--rose-deep); font-weight:700; margin-bottom:3px; white-space:nowrap; }
  .exp-unit{ font-size:11px; color:var(--ink-soft); }
  .exp-total{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:15.5px; margin-top:2px; }

  /* 分類與歷年標題外觀 */
  .exp-group-header{
    background:var(--surface);
    border-radius:16px;
    padding:12px 16px;
    margin:18px 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--sakura-pale);
  }
  .exp-group-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .exp-group-meta{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--rose-deep);
  }
  .exp-group-count{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:400;
  }
  /* 消費總計漸層卡 */
  .exp-total-hero{
    background:linear-gradient(135deg, var(--sakura-pale), var(--wisteria-pale));
    border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;
    box-shadow:var(--shadow-sm); display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .exp-total-hero-label{ font-size:13px; color:var(--ink-soft); font-weight:700; }
  .exp-total-hero-amount{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:26px; color:var(--rose-deep); margin-top:3px; }
  @media (min-width:700px){ .exp-total-hero-amount{ font-size:30px; } }
  /* 分類佔比橫條圖 */
  .exp-cat-bar-wrap{
    background:var(--surface); border-radius:16px; padding:14px 16px 12px; margin-bottom:16px;
    box-shadow:var(--shadow-sm); border:1px solid var(--sakura-pale);
  }
  .exp-cat-bar-title{ font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
  .exp-cat-bar-track{
    width:100%; height:14px; border-radius:999px; overflow:hidden;
    display:flex; background:var(--bg-deep);
  }
  .exp-cat-bar-seg{ height:100%; box-sizing:border-box; border-right:2px solid var(--surface); }
  .exp-cat-bar-seg:last-child{ border-right:none; }
  .exp-cat-bar-legend{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; }
  .exp-cat-bar-legend-item{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); }
  .exp-cat-bar-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  /* Segmented toggle (支出 / 售出) */
  .seg-toggle{
    display:flex; background:var(--bg-deep); border-radius:14px; padding:4px; margin-bottom:14px; gap:4px;
  }
  .seg-btn{
    flex:1; border:none; background:transparent; padding:9px; border-radius:10px;
    font-family:'Noto Sans TC'; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .seg-btn.active{ background:var(--rose-deep); color:#fff; }

  /* Tag chip input (標籤) */
  .tag-input-box{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    padding:8px 10px; border-radius:12px; border:1px solid var(--sakura-pale); background:var(--surface);
  }
  .tag-chip{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--sakura-pale); color:var(--rose-deep);
    font-size:12px; padding:4px 4px 4px 10px; border-radius:999px;
  }
  .tag-chip-x{ cursor:pointer; padding:0 5px; font-size:13px; }
  .tag-input-box input{
    flex:1; min-width:120px; border:none; outline:none; background:transparent;
    font-family:'Noto Sans TC'; font-size:13.5px; color:var(--ink); padding:4px 0;
  }
  /* Checklist（行程待辦清單） */
  .checklist-box{
    border:1px solid var(--sakura-pale); border-radius:12px; padding:8px 10px; background:var(--surface);
  }
  .checklist-item{ display:flex; align-items:center; gap:8px; padding:5px 2px; }
  .checklist-item .checklist-check{ width:16px; height:16px; accent-color:var(--rose-deep); flex-shrink:0; }
  .checklist-item .checklist-text{ flex:1; font-size:13.5px; color:var(--ink); }
  .checklist-item .checklist-text.done{ text-decoration:line-through; color:var(--ink-faint); }
  .checklist-item .checklist-x{ cursor:pointer; color:var(--ink-faint); padding:0 4px; font-size:14px; flex-shrink:0; }
  .checklist-box input#schChecklistInput{
    width:100%; border:none; outline:none; background:transparent;
    font-family:'Noto Sans TC'; font-size:13.5px; color:var(--ink); padding:6px 2px;
  }
  .checklist-progress-track{ width:100%; height:5px; background:var(--bg-deep); border-radius:4px; margin-top:5px; overflow:hidden; }
  .checklist-progress-fill{ height:100%; background:var(--rose); border-radius:4px; }
  /* 站內全域搜尋 */
  .global-search-result{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface); border:1px solid rgba(0,0,0,0.03); border-radius:14px;
    padding:11px 14px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow-sm);
    font-family:'Noto Sans TC';
  }
  .global-search-result .gsr-icon{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--bg-deep); display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .global-search-result .gsr-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .global-search-result .gsr-title{ font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .global-search-result .gsr-meta{ font-size:11.5px; color:var(--ink-soft); }
  .btn{
    flex:1; padding:12px; border-radius:14px; border:none;
    font-family:'Noto Sans TC'; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn.primary{ background:var(--rose-deep); color:#fff;}
  .btn.ghost{ background:var(--bg-deep); color:var(--ink-soft);}
  .btn.danger{ background:#F1D6D6; color:#B54545;}
  .btn.google{
    background:#fff; color:#3c4043; border:1px solid #dadce0;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn.google:disabled{ opacity:0.6; cursor:default; }
  .account-box{
    display:flex; align-items:center; gap:12px;
    background:var(--bg-deep); border-radius:16px; padding:12px 14px;
    margin-bottom:14px;
  }
  .account-box img.avatar{ width:44px;height:44px;border-radius:50%; flex-shrink:0; object-fit:cover;}
  .account-box .avatar-ph{
    width:44px;height:44px;border-radius:50%; flex-shrink:0;
    background:var(--wisteria-pale); display:flex;align-items:center;justify-content:center; font-size:20px;
  }
  .account-box .name{ font-weight:700; font-size:14px; }
  .account-box .mail{ font-size:12px; color:var(--ink-soft); }
  .account-box .synced{ font-size:11px; color:var(--rose-deep); margin-top:2px; }
  .login-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.6; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:#2E4C5E; color:#fff; padding:9px 18px; border-radius:999px;
    font-size:12.5px; z-index:60; opacity:0; transition:0.25s;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0);}

  .loading-screen{

  .storage-warn{
    display:none;
    position:relative;
    background:#FBEBC7; color:#8A6A28;
    font-size:11.5px; line-height:1.6;
    padding:10px 34px 10px 18px; text-align:center;

  .storage-warn.info{ background:var(--matcha-pale); color:#4E6B49; }

    cursor:pointer; font-size:13px; opacity:0.6; padding:4px;
  }
  .storage-warn-close:hover{ opacity:1; }

  /* ===== 外觀主題設定（深色模式切換／主題色選擇） ===== */
  .theme-swatch-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }

    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px; text-shadow:0 1px 3px rgba(0,0,0,0.45); font-weight:700;

  /* ===== 年度追星總結 (home recap card + modal) ===== */
  .recap-card{
    background: linear-gradient(135deg, var(--rose-deep), var(--rose));
    border-radius:var(--radius);
    padding:18px 18px 16px;
    color:#fff;
    margin-bottom:22px;
    box-shadow:var(--shadow);

  .recap-card::after{
    content:''; position:absolute; right:-30px; top:-30px; width:130px; height:130px;

  .recap-head{ margin-bottom:14px; position:relative; z-index:1; }

  .recap-stat{ background:rgba(255,255,255,0.16); border-radius:14px; padding:10px 4px; text-align:center; }
  .recap-stat .v{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:17px; }

  .recap-info{ background:rgba(255,255,255,0.14); border-radius:14px; padding:9px 12px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .recap-info .l{ font-size:10px; opacity:0.88; }
  .recap-info .v{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recap-btn{
    width:100%; border:none; background:rgba(255,255,255,0.94); color:var(--rose-deep);
    font-weight:700; padding:10px; border-radius:12px; cursor:pointer;
    font-family:'Noto Sans TC'; font-size:13px; position:relative; z-index:1;

  .ys-cat-row{ margin-bottom:10px; }

  /* ===== Final desktop overrides (kept at end of stylesheet so they win the cascade) ===== */
  @media (min-width:700px){

  /* At >=900px the app switches from a bottom tab bar to a left sidebar,

    nav.bottom .nav-btn.nav-more-only{ display:flex; }

<script>
/* ================= Firebase & Cloud Storage Setup ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBjclP4efWWcOTO88W_3tlcC4Za_hEIzW0",
  authDomain: "mystarlifeapp.firebaseapp.com",
  projectId: "mystarlifeapp",
  storageBucket: "mystarlifeapp.firebasestorage.app",
  messagingSenderId: "941753508434",
  appId: "1:941753508434:web:5bdf24eac9ee4514d8758b",
  measurementId: "G-FDX9867N4N"
};

let db = null;
let auth = null;
let storage = null;
let currentUser = null;
let useCloud = false;
let cloudUnsubscribe = null;      // Firestore 即時監聽的取消訂閱函式
let cloudSyncDebounceTimer = null; // 避免一次收到多筆變更時重複刷新畫面
let storageToStateKeyMap = null;   // storageKey -> stateKey 的對照表（延遲建立，避免用到還沒宣告的 BACKUP_FIELD_MAP）

try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    useCloud = true;
    // 保持登入狀態：同一台裝置/瀏覽器重新整理後不需要再次登入
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.log('設定登入持久化失敗', e));
    // 若因跳出視窗被瀏覽器擋下而改用整頁導向登入，回來後在這裡接住結果
    auth.getRedirectResult().catch(e=>{
      console.log('Google 登入導向結果讀取失敗', e);
    });
  }
} catch(e) {
  console.log("Firebase 初始化未完成，將使用本機模式", e);
}

// Storage 是額外的圖片雲端功能，獨立初始化：就算 Storage 還沒在後台啟用而失敗，
// 也完全不影響上面的登入狀態與 Firestore 資料同步，圖片功能只是自動退回本機模式
try {
  if (useCloud) {
    storage = firebase.storage();
  }
} catch(e) {
  console.log("Firebase Storage 尚未啟用，圖片上傳將改用本機模式", e);
  storage = null;
}

/* ================= 推播通知（Firebase Cloud Messaging） =================
   VAPID 金鑰：到 Firebase 主控台 →「專案設定」→「Cloud Messaging」→
   「Web Push 憑證」產生金鑰對後，把公鑰貼在下面取代 YOUR_VAPID_KEY。
   沒填的話，推播開關會自動顯示為「尚未設定」，不影響其他功能。 */
const FCM_VAPID_KEY = 'YOUR_VAPID_KEY';
let messaging = null;
try {
  if (useCloud && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported()) {
    messaging = firebase.messaging();
    // App 開著的時候收到推播，改用站內 Toast 提示，不用跳系統通知（避免同一則訊息重複打擾）
    messaging.onMessage((payload)=>{
      const title = (payload.notification && payload.notification.title) || '☀️ 今日提醒';
      const body = (payload.notification && payload.notification.body) || '';
      showToast(`🔔 ${title}${body ? '：' + body : ''}`);
    });
  }
} catch(e) {
  console.log("此瀏覽器不支援推播通知", e);
  messaging = null;
}

async function enablePushNotifications(){
  if(!messaging){ showToast('這個瀏覽器或裝置不支援推播通知'); return false; }
  if(!currentUser){ showToast('請先登入雲端帳號才能開啟推播通知'); return false; }
  if(FCM_VAPID_KEY === 'YOUR_VAPID_KEY'){ showToast('尚未設定推播金鑰，請聯絡開發者完成設定'); return false; }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ showToast('沒有通知權限，無法開啟推播提醒'); return false; }
    const swReg = await navigator.serviceWorker.ready;
    messaging.useServiceWorker(swReg);
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY });
    if(!token){ showToast('取得推播權杖失敗，請稍後再試'); return false; }
    await db.collection('users').doc(currentUser.uid).collection('fcmTokens').doc(token).set({
      token,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      userAgent: navigator.userAgent
    });
    state.profile.pushEnabled = true;
    state.profile.pushToken = token;
    await saveKey('oshi-profile', state.profile);
    showToast('已開啟手機推播通知 🔔');
    return true;
  }catch(e){
    console.error('開啟推播通知失敗', e);
    showToast('開啟推播通知失敗，請稍後再試');
    return false;
  }
}

async function disablePushNotifications(){
  try{
    if(messaging && currentUser && state.profile.pushToken){
      await db.collection('users').doc(currentUser.uid).collection('fcmTokens').doc(state.profile.pushToken).delete().catch(()=>{});
      await messaging.deleteToken().catch(()=>{});
    }
  }catch(e){ console.error('關閉推播通知失敗', e); }
  state.profile.pushEnabled = false;
  state.profile.pushToken = '';
  await saveKey('oshi-profile', state.profile);
  showToast('已關閉手機推播通知');
}

async function signInWithGoogle(){
  if(!useCloud || !auth){
    showToast('雲端服務尚未設定完成，暫時無法登入');
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    await auth.signInWithPopup(provider);
    closeModal();
    showToast('登入成功，正在同步雲端資料 ☁️');
  }catch(e){
    console.error('Google 登入失敗', e);
    if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
      try{
        await auth.signInWithRedirect(provider);
      }catch(err){
        showToast('登入失敗，請稍後再試');
      }
    } else if(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'){
      // 使用者自行關閉登入視窗，不需要顯示錯誤
    } else {
      showToast('登入失敗：' + (e.message || '請稍後再試'));
    }
  }
}

async function signOutOfGoogle(){
  if(!auth) return;
  try{
    await auth.signOut();
    closeModal();
    showToast('已登出，資料改為儲存在本機');
  }catch(e){
    console.error('登出失敗', e);
    showToast('登出失敗，請稍後再試');
  }
}

const LOCAL_PREFIX = 'oshiapp:';

async function loadKey(key, fallback){
  if(useCloud && currentUser){
    try{
      const docRef = db.collection('users').doc(currentUser.uid).collection('data').doc(key);
      const doc = await docRef.get();
      if(doc.exists && doc.data().value !== undefined){
        return doc.data().value;
      }
      return fallback;
    }catch(e){
      console.error("雲端讀取失敗", e);
      return fallback;
    }
  } else {
    try{
      const raw = window.localStorage.getItem(LOCAL_PREFIX+key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
}

async function saveKey(key, value){
  if(useCloud && currentUser){
    try{
      const docRef = db.collection('users').doc(currentUser.uid).collection('data').doc(key);
      await docRef.set({ value: value });
    }catch(e){
      showToast('雲端儲存失敗，請檢查網路連線');
      console.error(e);
    }
    return;
  } else {
    try{
      window.localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(value));
    }catch(e){
      showToast('瀏覽器儲存空間可能已滿');
      console.error(e);
    }
    return;
  }
}

/* ================= 即時雲端同步（跨裝置） ================= */
function getStorageToStateKeyMap(){
  // BACKUP_FIELD_MAP 在檔案後段才宣告，但這個函式要等到使用者登入後才會被呼叫，
  // 屆時整份 script 已經執行過一次、BACKUP_FIELD_MAP 早已就緒，所以這裡延遲建立沒問題。
  if(!storageToStateKeyMap){
    storageToStateKeyMap = {};
    BACKUP_FIELD_MAP.forEach(([stateKey, storageKey])=>{ storageToStateKeyMap[storageKey] = stateKey; });
  }
  return storageToStateKeyMap;
}

function attachCloudListener(){
  if(!useCloud || !db || !currentUser) return;
  detachCloudListener();
  const map = getStorageToStateKeyMap();
  const colRef = db.collection('users').doc(currentUser.uid).collection('data');
  let isFirstSnapshot = true;
  cloudUnsubscribe = colRef.onSnapshot((snapshot)=>{
    const isInitialLoad = isFirstSnapshot;
    isFirstSnapshot = false;
    let changed = false;
    snapshot.docChanges().forEach(change=>{
      // 自己這台裝置剛寫入、還在等待伺服器確認的變更，資料早已套用在畫面上，跳過即可避免閃爍
      if(change.doc.metadata.hasPendingWrites) return;
      if(change.type === 'removed') return;
      const storageKey = change.doc.id;
      const stateKey = map[storageKey];
      if(!stateKey) return;
      const data = change.doc.data();
      if(!data || data.value === undefined) return;
      state[stateKey] = data.value;
      changed = true;
      if(stateKey === 'theme'){
        state.theme = Object.assign({}, DEFAULT_THEME, state.theme || {});
        applyTheme(state.theme);
      }
    });
    if(changed && !isInitialLoad){
      // 短暫延遲合併多筆同時到達的變更，避免畫面被重複刷新
      clearTimeout(cloudSyncDebounceTimer);
      cloudSyncDebounceTimer = setTimeout(()=>{
        renderProfile();
        render();
        updatePendingUploadsBanner();
        showToast('已從其他裝置同步最新資料 ☁️');
      }, 300);
    }
  }, (err)=>{
    console.error('雲端即時同步監聽失敗', err);
  });
}

function detachCloudListener(){
  if(cloudUnsubscribe){
    cloudUnsubscribe();
    cloudUnsubscribe = null;
  }
}

/* ================= 外觀主題（深色模式 / 主題色） ================= */
const THEME_PRESETS = [
  {key:'sakura', name:'櫻花粉（預設）', swatch:'#C15B79', vars:{'--rose-deep':'#C15B79','--rose':'#DD8AA0','--sakura':'#F3C9D6','--sakura-pale':'#FCEDF1'}},
  {key:'ai', name:'藍染色', swatch:'#2F5A73', vars:{'--rose-deep':'#2F5A73','--rose':'#4C7C93','--sakura':'#A8CBD6','--sakura-pale':'#E4F0F2'}},
  {key:'matcha', name:'抹茶綠', swatch:'#5F7A45', vars:{'--rose-deep':'#5F7A45','--rose':'#84A25E','--sakura':'#C3D9A6','--sakura-pale':'#EDF4E1'}},
  {key:'fuji', name:'藤紫色', swatch:'#6E5A96', vars:{'--rose-deep':'#6E5A96','--rose':'#9584C2','--sakura':'#CFC4E6','--sakura-pale':'#F0ECF8'}},
  {key:'hiiro', name:'緋紅色', swatch:'#A83226', vars:{'--rose-deep':'#A83226','--rose':'#C9584A','--sakura':'#E8AB9E','--sakura-pale':'#FAE3DC'}},
  {key:'nezumi', name:'鼠色', swatch:'#5C5850', vars:{'--rose-deep':'#5C5850','--rose':'#847F74','--sakura':'#C4BFB2','--sakura-pale':'#EFEDE7'}}
];
const DEFAULT_THEME = { mode:'light', accent:'sakura', customColor:'#DD8AA0' };

function hexToRgb(hex){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
}
function mixHex(hex, target, pct){
  const c = hexToRgb(hex), t = hexToRgb(target);
  return rgbToHex(c.r+(t.r-c.r)*pct, c.g+(t.g-c.g)*pct, c.b+(t.b-c.b)*pct);
}
function buildCustomThemeVars(base){
  return {
    '--rose-deep': mixHex(base, '#000000', 0.14),
    '--rose': base,
    '--sakura': mixHex(base, '#ffffff', 0.45),
    '--sakura-pale': mixHex(base, '#ffffff', 0.80)
  };
}
function resolveThemeMode(mode){
  if(mode==='system'){
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  return mode==='dark' ? 'dark' : 'light';
}
function applyTheme(theme){
  if(!theme) theme = DEFAULT_THEME;
  const root = document.documentElement;
  root.setAttribute('data-theme', resolveThemeMode(theme.mode));
  const preset = THEME_PRESETS.find(p=>p.key===theme.accent);
  const vars = theme.accent==='custom'
    ? buildCustomThemeVars(theme.customColor||DEFAULT_THEME.customColor)
    : (preset ? preset.vars : THEME_PRESETS[0].vars);
  Object.entries(vars).forEach(([k,v])=> root.style.setProperty(k, v));
  const roseRgb = hexToRgb(vars['--rose']);
  const deepRgb = hexToRgb(vars['--rose-deep']);
  root.style.setProperty('--blob-1', `rgba(${roseRgb.r},${roseRgb.g},${roseRgb.b},0.22)`);
  root.style.setProperty('--blob-2', `rgba(${deepRgb.r},${deepRgb.g},${deepRgb.b},0.16)`);
}

function expenseAmount(item){
  const unit = parseFloat(item.unitPrice)||0;
  const qty = parseFloat(item.quantity)||1;
  const shipping = parseFloat(item.shipping)||0;
  return unit*qty + shipping;
}
/* 一筆記帳現在可以同時連到好幾個項目（應援、追星紀錄、小卡系列、周邊系列、代言/雜誌/影視都可以混搭），
   新資料存在 e.links = [{type,id}, ...]；舊資料只有單一連結欄位，這裡統一轉成同樣的陣列格式方便共用比對邏輯 */
function expenseLinksArray(e){
  if(Array.isArray(e.links) && e.links.length) return e.links;
  const legacy = [];
  if(e.supportLinkedId) legacy.push({type:'support', id:e.supportLinkedId});
  if(e.fanlogLinkedId) legacy.push({type:'fanlog', id:e.fanlogLinkedId});
  if(e.pcSeriesLinkedId) legacy.push({type:'pcSeries', id:e.pcSeriesLinkedId});
  if(e.mcSeriesLinkedId) legacy.push({type:'mcSeries', id:e.mcSeriesLinkedId});
  if(e.mediaType && e.mediaLinkedId) legacy.push({type:e.mediaType, id:e.mediaLinkedId});
  return legacy;
}
/* 找出所有連結到某筆應援的記帳紀錄：一筆應援可以連到多筆記帳（新版 links 陣列），
   也相容舊版由應援表單自動建立、只記在 support.expenseLinkedId 的單筆連結 */
function linkedExpensesForSupport(s){
  return state.expense.filter(e=>
    expenseLinksArray(e).some(l=>l.type==='support' && String(l.id)===String(s.id)) ||
    (s.expenseLinkedId && String(e.id)===String(s.expenseLinkedId))
  );
}
function supportSpentAmount(s){
  const linked = linkedExpensesForSupport(s);
  if(linked.length>0) return linked.reduce((sum,e)=> sum + expenseAmount(e), 0);
  return s.isPaid ? (parseFloat(s.paidAmount)||0) : 0;
}

/* 依「連結類型＋連結對象 id」找出對應的已連動記帳紀錄，給「🔗 已連動 N 筆記帳」標籤點擊查看用 */

/* 媒體表單共用：有填金額且勾選「同時加入記帳本」時，自動建立/更新一筆對應的記帳紀錄
   （沿用追星紀錄/應援已有的 expenseLinkedId 單筆自動連結寫法） */
async function syncMediaExpense(type, item, name, artist, date, amount, addToExpense, category){
  const amt = parseFloat(amount) || 0;
  if(!(amt>0 && addToExpense)) return;

  let linkedExpense = item.expenseLinkedId ? state.expense.find(e=>String(e.id)===String(item.expenseLinkedId)) : null;
  if(linkedExpense){
    linkedExpense.name = name;
    linkedExpense.artist = artist || '';
    linkedExpense.unitPrice = amt;
    linkedExpense.date = date || todayStr();
    linkedExpense.mediaType = type;
    linkedExpense.mediaLinkedId = item.id;

const TAG_CLASSES = ['', 'matcha', 'wisteria', 'gold', 'rose', 'sky', 'peach', 'lavender', 'mint', 'coral', 'amber', 'slate'];
function tagColorClass(text, categoryList){
  if(!text) return '';
  if(categoryList && categoryList.length){
    const idx = categoryList.indexOf(text);
    if(idx>=0) return TAG_CLASSES[idx % TAG_CLASSES.length];
  }
  // 找不到所屬清單時（例如舊資料），退回用文字雜湊決定顏色，至少同一個名稱顏色穩定
  let h = 0;
  for(let i=0;i<text.length;i++) h = (h*31 + text.charCodeAt(i)) % 997;
  return TAG_CLASSES[h % TAG_CLASSES.length];
}

function readLocalRaw(key, fallback){
  try{
    const raw = window.localStorage.getItem(LOCAL_PREFIX+key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function hasRealData(vals){
  return vals.some(v=>{
    if(Array.isArray(v)) return v.length>0;
    if(v && typeof v==='object') return !!v.nickname;
    return false;
  });
}

/* ================= 待重新上傳的照片 ================= */
/* 只有「記帳」「應援」支援直接從裝置上傳照片，雲端上傳逾時/失敗時會自動退回存成本機 dataURL，
   這裡直接掃描這兩個分頁裡還是 data: 開頭（代表還沒同步到雲端）的圖片網址，不用另外維護一份清單 */
function findPendingUploadImages(){
  const list = [];
  ['expense','support'].forEach(tab=>{
    (state[tab]||[]).forEach(item=>{
      (item.imageUrls||[]).forEach(url=>{
        if(typeof url==='string' && url.startsWith('data:')){
          list.push({ tab, itemId:item.id, url, label:item.name || item.title || item.activity || '（未命名）' });
        }
      });
    });
  });
  return list;
}
async function dataUrlToBlob(dataUrl){
  const res = await fetch(dataUrl);
  return await res.blob();
}
async function retryPendingUpload(p){
  try{
    const blob = await dataUrlToBlob(p.url);
    const url = await uploadBlobToStorage(blob);
    const item = state[p.tab].find(x=>String(x.id)===String(p.itemId));
    if(item && Array.isArray(item.imageUrls)){
      const idx = item.imageUrls.indexOf(p.url);
      if(idx>=0) item.imageUrls[idx] = url;
    }
    await saveKey('oshi-'+p.tab, state[p.tab]);
    return true;
  }catch(e){
    console.error('重新上傳失敗', e);
    return false;
  }
}
function openPendingUploadsModal(){
  const modal = document.getElementById('modal');
  const renderList = ()=>{
    const cur = findPendingUploadImages();
    if(cur.length===0){
      modal.innerHTML = `
        <h3 class="maru">📤 待重新上傳的照片</h3>
        <div style="font-size:13px;color:var(--ink-soft);padding:8px 0 16px;">目前沒有待重新上傳的照片，都已經同步到雲端了 🎉</div>
        <div class="modal-actions"><button class="btn primary" id="cancelBtn">關閉</button></div>
      `;
      document.getElementById('cancelBtn').addEventListener('click', closeModal);
      updatePendingUploadsBanner();
      return;
    }
    modal.innerHTML = `
      <h3 class="maru">📤 待重新上傳的照片</h3>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">這些照片先前雲端同步失敗，暫時只存在這台裝置上。網路穩定時按「重新上傳」補同步，換裝置前建議先處理完，避免這些照片遺失。</div>
      <div style="display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto;">
        ${cur.map((p,i)=>`
          <div class="card" style="margin-bottom:0;padding:10px 12px;display:flex;align-items:center;gap:10px;">
            <img src="${p.url}" style="width:52px;height:52px;object-fit:cover;border-radius:10px;flex-shrink:0;">
            <div style="flex:1;min-width:0;">
              <div class="card-title" style="font-size:13px;">${esc(p.label)}</div>
              <div class="card-meta">${p.tab==='expense'?'記帳':'應援'}</div>
            </div>
            <button type="button" class="btn ghost pending-retry-btn" data-pending-idx="${i}" style="flex-shrink:0;padding:6px 12px;font-size:12px;">重新上傳</button>
          </div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="cancelBtn">關閉</button>
        <button class="btn primary" id="retryAllBtn">全部重新上傳</button>
      </div>
    `;
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('retryAllBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('retryAllBtn');
      btn.disabled = true;
      btn.textContent = '上傳中...';
      let failCount = 0;
      for(const p of cur){ const ok = await retryPendingUpload(p); if(!ok) failCount++; }
      showToast(failCount>0 ? `還有 ${failCount} 張上傳失敗，請確認網路後再試一次` : '已全部重新上傳完成');
      render();
      renderList();
    });
    modal.querySelectorAll('.pending-retry-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const p = cur[Number(btn.dataset.pendingIdx)];
        btn.disabled = true;
        btn.textContent = '上傳中...';
        const ok = await retryPendingUpload(p);
        if(!ok) showToast('重新上傳失敗，請確認網路連線後再試一次');
        render();
        renderList();
      });
    });
  };
  renderList();
  showModal();
}
function updatePendingUploadsBanner(){
  const el = document.getElementById('uploadPendingBanner');

  if(uploadPendingDismissed || !(useCloud && currentUser)){ el.style.display='none'; return; }

  document.getElementById('uploadPendingText').textContent = `📤 有 ${count} 張照片尚未同步到雲端，點此查看並重新上傳`;

}

/* ================= 備份提醒 ================= */
function daysSinceBackup(){
  if(!lastBackupAt) return null;
  const then = new Date(lastBackupAt).getTime();
  if(isNaN(then)) return null;
  return Math.floor((Date.now()-then)/86400000);
}
function hasAnyRealData(){
  return ['schedule','expense','photocards','fanlog','support','merch','endorsement','magazine','movie']
    .some(k=> Array.isArray(state[k]) && state[k].length>0);
}
function updateBackupReminderBanner(){
  const el = document.getElementById('backupReminderBanner');
  if(!el) return;
  if(backupReminderDismissed || !hasAnyRealData()){ el.style.display='none'; return; }
  const days = daysSinceBackup();
  if(days===null){
    document.getElementById('backupReminderText').textContent = `💾 你還沒有匯出過備份，建議定期備份避免資料遺失，點此立即匯出`;
  } else if(days >= BACKUP_REMINDER_DAYS){
    document.getElementById('backupReminderText').textContent = `💾 距離上次備份已經 ${days} 天了，點此立即匯出備份`;
  } else {
    el.style.display='none';
    return;
  }
  el.style.display='block';
}

}

/* 將使用者從裝置選取的照片壓縮成較小的檔案；已登入雲端帳號時會上傳到 Firebase Storage 取得可分享的雲端網址，
   未登入（本機模式）時則轉成內嵌的 dataURL 直接存在本機資料裡。
   為了節省 Storage 用量與免費額度，預設把長邊壓到 1080px、品質 0.72，
   壓完如果檔案還是偏大（>500KB），會自動再降一次品質重壓一次，最多重試到品質 0.5 為止。 */
function compressImageOnce(img, maxDim, quality){
  return new Promise((resolve, reject)=>{
    let { width, height } = img;
    if(width > maxDim || height > maxDim){
      if(width >= height){ height = Math.round(height * maxDim / width); width = maxDim; }
      else { width = Math.round(width * maxDim / height); height = maxDim; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    canvas.toBlob(blob=>{
      if(blob) resolve(blob); else reject(new Error('壓縮失敗'));
    }, 'image/jpeg', quality);
  });
}
function compressImageFile(file, maxDim=1080, quality=0.72){
  const TARGET_MAX_BYTES = 500 * 1024; // 目標上限：約 500KB，超過會再自動降品質重壓
  const MIN_QUALITY = 0.5;
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('不是圖片檔')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('讀取檔案失敗'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('圖片解析失敗'));
      img.onload = async ()=>{
        try{
          let blob = await compressImageOnce(img, maxDim, quality);
          let q = quality;
          while(blob.size > TARGET_MAX_BYTES && q > MIN_QUALITY){
            q = Math.max(MIN_QUALITY, q - 0.12);
            blob = await compressImageOnce(img, maxDim, q);
          }
          resolve(blob);
        }catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function blobToDataUrl(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = ()=> reject(new Error('讀取失敗'));
    reader.readAsDataURL(blob);
  });
}
/* 上傳逾時保護用：等待指定毫秒數後 reject，搭配 Promise.race 使用，
   避免雲端請求卡住（例如 Storage 規則設定有誤、網路不穩）時畫面永遠停在轉圈狀態 */
function timeoutAfter(ms, message){
  return new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error(message||'逾時')), ms);
  });
}
const UPLOAD_TIMEOUT_MS = 15000; // 上傳超過 15 秒視為卡住，自動取消並改存本機
async function uploadBlobToStorage(blob){
  const path = `users/${currentUser.uid}/images/${Date.now()}_${Math.floor(Math.random()*100000)}.jpg`;
  const ref = storage.ref().child(path);
  const uploadTask = ref.put(blob, { contentType: 'image/jpeg' });
  try{
    const snapshot = await Promise.race([
      uploadTask,
      timeoutAfter(UPLOAD_TIMEOUT_MS, '上傳逾時')
    ]);
    return await snapshot.ref.getDownloadURL();
  }catch(e){
    try{ uploadTask.cancel(); }catch(_){}
    throw e;
  }
}
/* ================= 雲端圖片清理（刪除資料或移除圖片時，一併清掉 Storage 裡的檔案） ================= */
/* 只有真正上傳到 Firebase Storage 的圖片（網址以 firebasestorage.googleapis.com 開頭）才需要、也才能夠清理；
   使用者自己貼上的外部連結、或尚未同步成功而暫存的本機 dataURL，都不屬於我們的 Storage，不能也不應該去刪 */
function isFirebaseStorageUrl(url){
  return typeof url==='string' && url.startsWith('https://firebasestorage.googleapis.com/');
}
async function deleteStorageImageByUrl(url){
  if(!useCloud || !storage) return;
  if(!isFirebaseStorageUrl(url)) return;
  try{
    await storage.refFromURL(url).delete();
  }catch(e){
    // 檔案本來就不存在（例如已經被清過）或權限問題都不應該擋住刪除/編輯流程，安靜記錄就好
    console.error('清理雲端圖片失敗', e);
  }
}
/* 比對編輯前後的圖片網址陣列，把「編輯後被拿掉」的舊圖片從 Storage 刪除 */
async function deleteRemovedStorageImages(oldUrls, newUrls){
  const removed = (oldUrls||[]).filter(u=> !(newUrls||[]).includes(u));
  if(removed.length===0) return;
  await Promise.all(removed.map(deleteStorageImageByUrl));
}
/* 刪除整筆資料時，把它底下所有圖片一起從 Storage 清掉 */
async function deleteAllStorageImages(item){
  if(!item) return;
  const urls = Array.isArray(item.imageUrls) ? item.imageUrls : (item.imageUrl ? [item.imageUrl] : []);
  if(urls.length===0) return;
  await Promise.all(urls.map(deleteStorageImageByUrl));
}

/* 單張照片：壓縮後視登入狀態決定上傳雲端或轉成本機 dataURL。
   回傳 { url, cloud } —— cloud 為 true 代表成功同步到雲端，false 代表因逾時/失敗退回本機儲存（呼叫端可據此提醒使用者）。
   雲端上傳若逾時或失敗，會自動改存本機 dataURL，避免畫面卡住轉圈不動 */
async function processImageFileToUrl(file){
  const blob = await compressImageFile(file);
  if(useCloud && storage && currentUser){
    try{
      const url = await uploadBlobToStorage(blob);
      return { url, cloud:true };
    }catch(e){
      console.error('雲端圖片上傳失敗，改存本機', e);
      const url = await blobToDataUrl(blob);
      return { url, cloud:false };
    }
  }
  const url = await blobToDataUrl(blob);
  return { url, cloud:true }; // 本機模式（未登入雲端）本來就只存本機，不算「退回」，不用特別提示
}
/* 處理多張照片檔案（依序處理並加入陣列），成功後呼叫 onDone 重新渲染縮圖清單 */
async function addImageFilesToList(fileList, targetArrayGetter, targetArraySetter, maxCount, onDone){
  const files = Array.from(fileList || []);
  if(files.length===0) return;
  let arr = targetArrayGetter();
  const remaining = maxCount - arr.length;
  if(remaining<=0){ showToast(`最多只能加入 ${maxCount} 張圖片`); return; }
  const toProcess = files.slice(0, remaining);
  if(files.length > toProcess.length){ showToast(`最多只能加入 ${maxCount} 張，已略過多的照片`); }
  showToast(useCloud && currentUser ? '上傳中，請稍候…' : '處理中，請稍候…');
  let failCount = 0;
  let fallbackCount = 0; // 雲端上傳失敗、已改存本機的張數
  for(const file of toProcess){
    try{
      const { url, cloud } = await processImageFileToUrl(file);
      arr.push(url);
      if(!cloud) fallbackCount++;
    }catch(e){
      failCount++;
    }
  }
  targetArraySetter(arr);
  onDone();
  if(failCount>0 && fallbackCount>0){
    showToast(`${failCount} 張處理失敗已略過，${fallbackCount} 張雲端同步失敗已改存本機`);
  } else if(failCount>0){
    showToast(`${failCount} 張照片處理失敗，已略過`);
  } else if(fallbackCount>0){
    showToast(`${fallbackCount} 張雲端同步失敗，已改存本機（換裝置可能會遺失，建議稍後重試上傳）`);
  }
}

/* 追星紀錄的「相關藝人」支援同時選多位，內部以「、」串接成字串儲存以維持相容，這裡拆回陣列 */
function splitArtistNames(str){
  if(!str) return [];
  return String(str).split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
}
function toLocalDateStr(t){
  const y = t.getFullYear();
  const m = String(t.getMonth()+1).padStart(2,'0');
  const d = String(t.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function todayStr(){
  return toLocalDateStr(new Date());
}
function fanDurationText(dateStr){
  if(!dateStr) return '';
  const start = new Date(dateStr+'T00:00:00');
  const now = new Date();
  if(isNaN(start.getTime()) || start>now) return '';
  let years = now.getFullYear() - start.getFullYear();
  let months = now.getMonth() - start.getMonth();
  let days = now.getDate() - start.getDate();
  if(days<0) months -= 1;
  if(months<0){ years -= 1; months += 12; }
  if(years<=0 && months<=0){
    const diffDays = Math.max(0, Math.floor((now-start)/(1000*60*60*24)));
    return diffDays<=0 ? '今天入坑' : diffDays+'天';
  }
  let parts = [];
  if(years>0) parts.push(years+'年');
  if(months>0) parts.push(months+'個月');
  return parts.join('');
}

function computeYearSummary(year){
  const yearFanlogs = state.fanlog.filter(f=> f.date && f.date.startsWith(year));
  const concertCount = yearFanlogs.filter(f=> f.category==='演唱會').length;
  const totalEventCount = yearFanlogs.length;

  const yearExpenses = state.expense.filter(e=> e.date && e.date.startsWith(year));
  const totalExpense = yearExpenses.reduce((sum,e)=> sum + (e.unitPrice!==undefined ? expenseAmount(e) : (parseFloat(e.amount)||0)), 0);

  const catMap = {};
  yearExpenses.forEach(e=>{
    const cat = e.category || '未分類';
    const amt = e.unitPrice!==undefined ? expenseAmount(e) : (parseFloat(e.amount)||0);
    catMap[cat] = (catMap[cat]||0) + amt;
  });
  const categoryBreakdown = Object.entries(catMap).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
  const topCategory = categoryBreakdown[0] || null;

  const photocardCount = state.photocards.filter(p=> p.owned && p.createdAt && p.createdAt.startsWith(year)).length;

  const artistMap = {};
  yearFanlogs.forEach(f=>{
    splitArtistNames(f.artist).forEach(name=>{
      artistMap[name] = (artistMap[name]||0) + 1;
    });
  });
  const topArtist = Object.entries(artistMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count)[0] || null;

  const flipCount = yearFanlogs.filter(f=>f.isFlipped).length;

  return { year, concertCount, totalEventCount, totalExpense, categoryBreakdown, topCategory, photocardCount, topArtist, flipCount };
}

/* ================= Home ================= */
function nextOccurrenceInfo(dateStr){
  // 只看月/日，算出下一次的日期（今年還沒到就用今年，過了就用明年）
  if(!dateStr || dateStr.length<10) return null;
  const mm = dateStr.slice(5,7), dd = dateStr.slice(8,10);
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let year = today.getFullYear();
  let next = new Date(`${year}-${mm}-${dd}T00:00:00`);
  if(isNaN(next.getTime())) return null;
  if(next < todayMid){
    next = new Date(`${year+1}-${mm}-${dd}T00:00:00`);
  }
  const diffDays = Math.round((next - todayMid) / (1000*60*60*24));
  return { mmdd: `${parseInt(mm,10)}/${parseInt(dd,10)}`, diffDays };
}
/* 計算距離某個固定日期（非每年循環，例如演唱會日期／開賣日期）還有幾天，過去的日期回傳負數 */
function daysUntilDate(dateStr){
  if(!dateStr || dateStr.length<10) return null;
  const target = new Date(dateStr+'T00:00:00');
  if(isNaN(target.getTime())) return null;
  const today = new Date();
  const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.round((target - todayMid) / (1000*60*60*24));
}

const REMINDER_SHOWN_KEY = LOCAL_PREFIX + 'reminder-shown-date';

/* 蒐集「今天」與「明天」跟行程有關的重要事項：行程本身、開賣日、藝人生日 */
function computeTodayReminderItems(){
  const today = todayStr();
  const tomorrow = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return toLocalDateStr(d); })();
  const items = [];

  state.schedule.forEach(s=>{
    if(!s.date) return;
    const start = s.date;
    const end = (s.isMultiDay && s.endDate) ? s.endDate : s.date;
    const isTodayEvent = today>=start && today<=end;
    const isTomorrowEvent = !isTodayEvent && tomorrow>=start && tomorrow<=end;
    if(isTodayEvent){
      items.push({ icon:'🎤', when:'today', text:`今天是「${s.title}」的日子`, tab:'schedule' });
    } else if(isTomorrowEvent){
      items.push({ icon:'🎤', when:'tomorrow', text:`明天是「${s.title}」的日子`, tab:'schedule' });
    }
    if(s.onSaleDate===today){
      items.push({ icon:'🎫', when:'today', text:`「${s.title}」今天開賣！`, tab:'schedule' });
    } else if(s.onSaleDate===tomorrow){
      items.push({ icon:'🎫', when:'tomorrow', text:`「${s.title}」明天開賣，記得設鬧鐘`, tab:'schedule' });
    }
  });

  state.artists.forEach(a=>{
    if(!a.birthday) return;
    const info = nextOccurrenceInfo(a.birthday);
    if(info && info.diffDays===0){
      items.push({ icon:'🎂', when:'today', text:`今天是 ${a.name} 的生日！`, tab:'artists' });
    }
  });

  // 今天的事優先排在前面
  items.sort((a,b)=> (a.when==='today'?0:1) - (b.when==='today'?0:1));
  return items;
}

function maybeShowDailyReminder(){

  if(lastShown===today) return;

  const items = computeTodayReminderItems();

const FANLOG_CATEGORY_ICON = {
  '演唱會':'🎤','見面會':'🤝','簽唱會':'✍️','商演':'🎪','站台':'📸',
  '頒獎':'🏆','夜店':'🌃','跨年':'🎆','時裝周':'👗','校唱':'🎶','其他':'📖'
};
function greetingTimeInfo(){
  const h = new Date().getHours();
  if(h>=5 && h<11) return {text:'早安', icon:'🌅'};
  if(h>=11 && h<14) return {text:'午安', icon:'☀️'};
  if(h>=14 && h<18) return {text:'下午好', icon:'🌤️'};
  if(h>=18 && h<22) return {text:'晚安', icon:'🌆'};
  return {text:'夜深了', icon:'🌙'};
}
function homeExpenseAmount(e){
  return e.unitPrice!==undefined ? expenseAmount(e) : (parseFloat(e.amount)||0);
}
/* 依藝人加總花費，由高到低排序 */
function artistSpendBreakdown(items){
  const map = {};
  items.forEach(e=>{
    const name = (e.artist && e.artist.trim()) ? e.artist.trim() : '未指定藝人';
    map[name] = (map[name]||0) + homeExpenseAmount(e);
  });
  return Object.entries(map).map(([name,amount])=>({name,amount})).sort((a,b)=> b.amount-a.amount);
}
/* 首頁「本月追星總覽」：本月參戰次數、本月/本年花費，以及本月/本年花費最高的藝人排行 */
function computeMonthOshiOverview(){
  const today = todayStr();
  const thisMonth = today.slice(0,7);
  const thisYear = today.slice(0,4);
  const monthExpenses = state.expense.filter(e=> e.date && e.date.startsWith(thisMonth));
  const yearExpenses = state.expense.filter(e=> e.date && e.date.startsWith(thisYear));
  const monthEventCount = state.fanlog.filter(f=> f.date && f.date.startsWith(thisMonth)).length;
  const monthTotal = monthExpenses.reduce((sum,e)=> sum + homeExpenseAmount(e), 0);
  const yearTotal = yearExpenses.reduce((sum,e)=> sum + homeExpenseAmount(e), 0);
  const monthArtistTotals = artistSpendBreakdown(monthExpenses);
  const yearArtistTotals = artistSpendBreakdown(yearExpenses);
  return {
    month: thisMonth, year: thisYear,
    monthEventCount, monthTotal, yearTotal,
    monthArtistTotals, yearArtistTotals
  };
}
function renderHomeOverviewBlock(){
  const o = computeMonthOshiOverview();
  const scopeIsMonth = homeSpendScope==='month';
  const total = scopeIsMonth ? o.monthTotal : o.yearTotal;
  const artistTotals = (scopeIsMonth ? o.monthArtistTotals : o.yearArtistTotals).slice(0,3);
  const scopeLabel = scopeIsMonth ? `${o.month.replace('-','年')}月` : `${o.year}年`;

  const barsHtml = artistTotals.length===0
    ? `<div class="mini-row"><span class="l" style="color:var(--ink-faint)">${scopeLabel}還沒有花費紀錄</span></div>`

        return `<div class="ys-cat-row">

          <div class="ys-cat-track"><div class="ys-cat-fill" style="width:${pct}%; background:${color.fg};"></div></div>
        </div>`;

  return `

    <div class="stat-grid" style="margin-bottom:12px;">

      <div class="stat-card"><div class="num" style="font-size:15px;">NT$ ${Math.round(total).toLocaleString()}</div><div class="lbl">${scopeIsMonth?'本月':'本年'}花費</div></div>
      <div class="stat-card"><div class="num" style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${artistTotals[0]?esc(artistTotals[0].name):''}">${artistTotals[0]? esc(artistTotals[0].name) : '—'}</div><div class="lbl">花費最高藝人</div></div>
    </div>
    <div class="seg-toggle" id="homeSpendScopeToggle" style="margin-bottom:12px;">
      <button type="button" class="seg-btn ${scopeIsMonth?'active':''}" data-scope="month">本月花費排行</button>
      <button type="button" class="seg-btn ${!scopeIsMonth?'active':''}" data-scope="year">本年花費排行</button>

  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;

function renderCard(tab, item){
  const schema = SCHEMAS[tab];
  const titleKey = schema.find(f=>f.required && f.type==='text') ? schema.find(f=>f.required && f.type==='text').key : schema[0].key;
  let title = item[titleKey] || '（未命名）';
  let metaLine = '';
  let tags = '';

  if(tab==='schedule'){
    const dateLabel = (item.isMultiDay && item.endDate && item.endDate!==item.date)
      ? `${fmtDate(item.date)} ～ ${fmtDate(item.endDate)}`
      : fmtDate(item.date);
    metaLine = [dateLabel, item.location].filter(Boolean).join(' · ');
    if(item.artist) tags += `<span class="tag">${esc(item.artist)}</span>`;
    if(item.category) tags += `<span class="tag matcha">${esc(item.category)}</span>`;
    if(item.onSaleDate){
      const osDays = daysUntilDate(item.onSaleDate);
      const osLabel = osDays===null ? '' : (osDays>0 ? `（還有${osDays}天）` : (osDays===0 ? '（今天！）' : ''));
      tags += `<span class="tag gold">🎫 開賣 ${fmtDate(item.onSaleDate)}${osLabel}</span>`;
    }
  } else if(tab==='expense'){
    metaLine = fmtDate(item.date);
    tags += `<span class="tag gold">NT$ ${(parseFloat(item.amount)||0).toLocaleString()}</span>`;
    if(item.category) tags += `<span class="tag">${esc(item.category)}</span>`;
  } else if(tab==='fanlog'){
    metaLine = fmtDate(item.date);
    if(item.artist) tags += `<span class="tag">${esc(item.artist)}</span>`;
    if(item.category) tags += `<span class="tag ${tagColorClass(item.category, [...FIXED_FANLOG_CATEGORIES, ...state.customFanlogCategories])}">${esc(item.category)}</span>`;
    const flLinked = linkedExpensesForFanlog(item);
    const flSpent = fanlogSpentAmount(item);
    if(flSpent>0) tags += `<div style="width:100%;"></div><span class="tag gold">💰 NT$ ${flSpent.toLocaleString()}</span>`;
    tags += linkedExpenseTagHtml('fanlog', item.id, item.activity, flLinked.length);
    if(item.movieLinkedId){
      const linkedMovie = state.movie.find(m=>String(m.id)===String(item.movieLinkedId));
      if(linkedMovie) tags += `<span class="tag matcha">🎬 ${esc(linkedMovie.title)}</span>`;
    }
    if(item.isFlipped){
      const types = Array.isArray(item.flipTypes) ? item.flipTypes : [];
      const platforms = Array.isArray(item.flipPlatforms) ? item.flipPlatforms : (item.flipPlatform ? [item.flipPlatform] : []);
      const flipDetail = [types.join('/'), platforms.join('/')].filter(Boolean).join('・');
      tags += `<span class="tag rose">💌 被翻牌${flipDetail ? '・'+esc(flipDetail) : ''}</span>`;
      if(Array.isArray(item.imageUrls) && item.imageUrls.length>0){
        tags += `<span class="tag">📷 ${item.imageUrls.length}</span>`;
      }
    }
  }

  return `
  <div class="card">
    <div class="card-row">
      <div>
        <div class="card-title">${esc(title)}</div>
        <div class="card-meta">${esc(metaLine)}</div>
        <div>${tags}</div>
        ${item.note ? `<div class="card-meta" style="margin-top:6px;">${esc(item.note)}</div>` : ''}
        ${tab==='fanlog' && item.albumUrl ? `<div style="margin-top:6px;"><a href="${esc(item.albumUrl)}" target="_blank" rel="noopener" class="tag matcha" style="text-decoration:none;">📷 查看拍攝紀錄</a></div>` : ''}
      </div>
      <div class="card-actions">
        ${tab==='fanlog' ? `<button class="icon-btn dup" data-tab="fanlog" data-id="${item.id}" title="複製這筆">📋</button>` : ''}
        <button class="icon-btn edit" data-tab="${tab}" data-id="${item.id}">✎</button>
        <button class="icon-btn del" data-tab="${tab}" data-id="${item.id}">🗑</button>
      </div>
    </div>
  </div>`;
}
