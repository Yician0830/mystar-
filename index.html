      <div>
        <div class="exp-total-hero-label">💰 ${curYear} 年消費總計</div>
        <div class="exp-total-hero-amount">NT$ ${yearTotal.toLocaleString()}</div>
      </div>
    </div>
    `;

    // 選擇特定月份時，顯示該月明細
    if(expMonthFilter!=='__all__'){
      const monthItems = yearItems.filter(e=> e.date && e.date.startsWith(expMonthFilter));
      const monthTotal = monthItems.reduce((sum,e)=> sum + expenseAmount(e), 0);
      const [my, mm] = expMonthFilter.split('-');

      html += `
      <div class="exp-group-header">
        <div class="exp-group-title">🗓️ ${my}/${parseInt(mm,10)}月明細 <span class="exp-group-count">(${monthItems.length} 筆)</span></div>
        <div class="exp-group-meta">NT$ ${monthTotal.toLocaleString()}</div>
      </div>
      <div class="exp-grid">
      `;
      if(monthItems.length===0){
        html += `<div class="empty"><div class="stamp-big maru">${meta.stamp}</div><div class="msg">這個月還沒有花費紀錄</div></div>`;
      } else {
        monthItems.forEach(item=>{ html += renderExpenseCard(item); });
      }
      html += `</div>`;
    }
  }

  if(expViewMode==='all'){
    if(expMonthFilter==='__all__'){
      const yearItemsForGrid = yearFilteredItems;
      html += `<div class="exp-grid">`;
      yearItemsForGrid.forEach(item=>{ html += renderExpenseCard(item); });
      html += `</div>`;
    }
  } else if(expViewMode==='category'){
    // 依分類分組：只用今年的資料分組與加總
    const catGroups = {};
    yearFilteredItems.forEach(item=>{
      const cat = item.category || '未分類';
      if(!catGroups[cat]) catGroups[cat] = [];
      catGroups[cat].push(item);
    });

    const allExpCategories = [...FIXED_EXPENSE_CATEGORIES, ...state.customExpenseCategories];
    const categoryKeys = Object.keys(catGroups).sort((a,b)=>{
      const idxA = allExpCategories.indexOf(a);
      const idxB = allExpCategories.indexOf(b);
      if(idxA !== -1 && idxB !== -1) return idxA - idxB;
      if(idxA !== -1) return -1;
      if(idxB !== -1) return 1;
      return a.localeCompare(b);
    });

    if(expCategoryFilter!=='__all__' && !categoryKeys.includes(expCategoryFilter)) expCategoryFilter = '__all__';

    html += `<div class="cal-filter-row" style="margin-bottom:14px;">
      <button class="chip-filter-btn cal-filter-btn ${expCategoryFilter==='__all__'?'active':''}" data-cat="__all__">全部類別</button>
      ${categoryKeys.map(cat=>{
        const c = chipColor(cat);
        const icon = EXPENSE_CATEGORY_ICON[cat] || '🏷️';
        const active = expCategoryFilter===cat;
        return `<button class="chip-filter-btn ${active?'active':''}" style="background:${c.bg};color:${c.fg};" data-cat="${esc(cat)}">${icon} ${esc(cat)}</button>`;
      }).join('')}
    </div>`;

    html += expSearchBoxHtml;

    // 分類佔比橫條圖：只在「全部類別」時顯示整體分佈，選了特定分類後就不重複顯示
    if(expCategoryFilter==='__all__'){
      const catTotalsAll = categoryKeys.map(cat=>({
        cat,
        amt: catGroups[cat].reduce((s,e)=> s+expenseAmount(e), 0)
      })).filter(c=>c.amt>0).sort((a,b)=> b.amt-a.amt);
      const grandCatTotal = catTotalsAll.reduce((s,c)=> s+c.amt, 0);
      if(grandCatTotal>0){
        html += `<div class="exp-cat-bar-wrap">
          <div class="exp-cat-bar-title">📊 ${curYear} 年分類佔比</div>
          <div class="exp-cat-bar-track">
            ${catTotalsAll.map((c,i)=>{
              const color = chartColorAt(i);
              const pct = (c.amt/grandCatTotal*100);
              return `<div class="exp-cat-bar-seg" style="width:${pct}%;background:${color};" title="${esc(c.cat)} ${Math.round(pct)}%"></div>`;
            }).join('')}
          </div>
          <div class="exp-cat-bar-legend">
            ${catTotalsAll.map((c,i)=>{
              const color = chartColorAt(i);
              const pct = Math.round(c.amt/grandCatTotal*100);
              return `<span class="exp-cat-bar-legend-item"><span class="exp-cat-bar-dot" style="background:${color};"></span>${esc(c.cat)} ${pct}%</span>`;
            }).join('')}
          </div>
        </div>`;
      }
    }

    const catItems = expCategoryFilter==='__all__' ? yearFilteredItems : (catGroups[expCategoryFilter] || []);
    const catTotal = catItems.reduce((sum, e) => sum + expenseAmount(e), 0);
    const catLabel = (expCategoryFilter==='__all__' ? '全部類別' : expCategoryFilter) + `・${curYear}年`;

    html += `
    <div class="exp-group-header">
      <div class="exp-group-title">${catLabel} <span class="exp-group-count">(${catItems.length} 筆)</span></div>
      <div class="exp-group-meta">NT$ ${catTotal.toLocaleString()}</div>
    </div>
    <div class="exp-grid">
    `;
    if(catItems.length===0){
      html += `<div class="empty"><div class="stamp-big maru">${meta.stamp}</div><div class="msg">這個年度還沒有這個分類的花費紀錄</div></div>`;
    } else {
      catItems.forEach(item=>{ html += renderExpenseCard(item); });
    }
    html += `</div>`;
  } else if(expViewMode==='year'){
    // 依年份分組
    const yearGroups = {};
    items.forEach(item=>{
      const y = (item.date && item.date.length >= 4) ? item.date.slice(0,4) : '未知年份';
      if(!yearGroups[y]) yearGroups[y] = [];
      yearGroups[y].push(item);
    });

    // 年份由新到舊排序
    const yearKeys = Object.keys(yearGroups).sort((a,b)=> b.localeCompare(a));

    if(expYearFilter!=='__all__' && !yearKeys.includes(expYearFilter)) expYearFilter = yearKeys[0] || '__all__';

    html += `<div class="cal-filter-row" style="margin-bottom:14px;">
      <button class="chip-filter-btn cal-filter-btn ${expYearFilter==='__all__'?'active':''}" data-year="__all__">全部年份</button>
      ${yearKeys.map(y=>`<button class="chip-filter-btn cal-filter-btn ${expYearFilter===y?'active':''}" data-year="${esc(y)}">${esc(y)} 年</button>`).join('')}
    </div>`;

    html += expSearchBoxHtml;

    const yearItems = expYearFilter==='__all__' ? items : yearGroups[expYearFilter];
    const yearTotal = yearItems.reduce((sum, e) => sum + expenseAmount(e), 0);
    const yearLabel = expYearFilter==='__all__' ? '全部年份' : `${expYearFilter} 年`;

    html += `
    <div class="exp-group-header">
      <div class="exp-group-title">🗓️ ${esc(yearLabel)}花費明細 <span class="exp-group-count">(${yearItems.length} 筆)</span></div>
      <div class="exp-group-meta">NT$ ${yearTotal.toLocaleString()}</div>
    </div>
    <div class="exp-grid">
    `;
    yearItems.forEach(item=>{ html += renderExpenseCard(item); });
    html += `</div>`;
  } else if(expViewMode==='stats'){
    html += expSearchBoxHtml;
    html += renderExpenseStats(yearFilteredItems, curYear);
  }

  return html;
}

function renderExpenseStats(items, statsYear){
  if(items.length===0) return `<div class="empty"><div class="stamp-big maru">計</div><div class="msg">${statsYear?statsYear+' 年還':''}沒有資料可供統計</div></div>`;

  // 各分類佔比
  const catTotals = {};
  items.forEach(e=>{
    const cat = e.category || '未分類';
    catTotals[cat] = (catTotals[cat]||0) + expenseAmount(e);
  });
  const catEntries = Object.entries(catTotals).sort((a,b)=> b[1]-a[1]);
  const catMax = catEntries.length ? catEntries[0][1] : 1;
  const grandTotal = items.reduce((s,e)=> s+expenseAmount(e), 0);

  const catBarsHtml = catEntries.map(([cat, amt])=>{
    const pct = catMax>0 ? Math.max(4, Math.round(amt/catMax*100)) : 0;
    const sharePct = grandTotal>0 ? (amt/grandTotal*100).toFixed(1) : '0.0';
    const color = chipColor(cat);
    const icon = EXPENSE_CATEGORY_ICON[cat] || '🏷️';
    return `
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span>${icon} ${esc(cat)}</span>
        <span style="color:var(--ink-soft);">NT$ ${amt.toLocaleString()}（${sharePct}%）</span>
      </div>
      <div style="background:var(--bg-deep);border-radius:8px;height:14px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${color.bg};border-left:4px solid ${color.fg};border-radius:8px;"></div>
      </div>
    </div>`;
  }).join('');

  // 月度花費趨勢（依實際資料涵蓋的月份，最多近 12 個月，最新在右）
  const monthTotals = {};
  items.forEach(e=>{
    if(!e.date) return;
    const m = e.date.slice(0,7);
    monthTotals[m] = (monthTotals[m]||0) + expenseAmount(e);
  });
  const monthKeys = Object.keys(monthTotals).sort().slice(-12);
  const monthMax = monthKeys.length ? Math.max(...monthKeys.map(m=>monthTotals[m])) : 1;

  const monthBarsHtml = monthKeys.length ? `
    <div class="month-trend-scroll" style="display:flex;align-items:flex-end;gap:8px;height:150px;padding:0 4px;overflow-x:auto;">
      ${monthKeys.map(m=>{
        const amt = monthTotals[m];
        const h = monthMax>0 ? Math.max(6, Math.round(amt/monthMax*110)) : 6;
        const [, mm] = m.split('-');
        const label = amt>=10000 ? Math.round(amt/1000)+'k' : (amt>=1000 ? (amt/1000).toFixed(1)+'k' : amt);
        return `
        <div style="display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:36px;">
          <div style="font-size:10px;color:var(--ink-soft);margin-bottom:2px;white-space:nowrap;">${label}</div>
          <div style="width:22px;height:${h}px;background:var(--rose);border-radius:6px 6px 0 0;"></div>
          <div style="font-size:10px;color:var(--ink-faint);margin-top:4px;">${parseInt(mm,10)}月</div>
        </div>`;
      }).join('')}
    </div>` : `<div class="empty" style="padding:20px 0;"><div class="msg">尚無月份資料</div></div>`;

  return `
  <div class="exp-group-header">
    <div class="exp-group-title">🏷️ 各分類佔比${statsYear?`・${statsYear}年`:''}</div>
    <div class="exp-group-meta">共 NT$ ${grandTotal.toLocaleString()}</div>
  </div>
  <div style="background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:20px;">
    ${catBarsHtml}
  </div>
  <div class="exp-group-header">
    <div class="exp-group-title">📈 月度花費趨勢${statsYear?`・${statsYear}年`:''}</div>
  </div>
  <div style="background:var(--surface);border-radius:16px;padding:16px 8px;box-shadow:var(--shadow-sm);">
    ${monthBarsHtml}
  </div>
  `;
}

  });

  });

function duplicateExpense(id){
  const item = state.expense.find(e=>String(e.id)===String(id));
  if(!item) return;
  const prefill = JSON.parse(JSON.stringify(item));
  delete prefill.id;
  openExpenseForm(null, prefill);
}

function expenseStatusColor(status){
  const map = {
    '未到貨': {bg:'#FADBD8', fg:'#C0392B'},
    '已到貨': {bg:'#D8F3DC', fg:'#2F6B3F'},
    '已取消': {bg:'#E6E6E6', fg:'#555555'},
    '退換中': {bg:'#FFE3C2', fg:'#9C5A17'}
  };
  return map[status] || {bg:'#E6EEFA', fg:'#5F4E7A'};
}

function describeExpenseLink(l){
  if(l.type==='support'){ const s=state.support.find(x=>x.id===l.id); return s? '🔗 應援: '+s.title : null; }
  if(l.type==='fanlog'){ const f=state.fanlog.find(x=>x.id===l.id); return f? '🔗 紀錄: '+f.activity : null; }
  if(l.type==='pcSeries') return '🔗 小卡: '+l.id;
  if(l.type==='mcSeries') return '🔗 周邊: '+l.id;
  if(l.type==='endorsement'){ const e=state.endorsement.find(x=>x.id===l.id); return e? '🔗 代言: '+e.title : null; }
  if(l.type==='magazine'){ const m=state.magazine.find(x=>x.id===l.id); return m? '🔗 雜誌: '+m.title : null; }
  if(l.type==='movie'){ const mv=state.movie.find(x=>x.id===l.id); return mv? '🔗 影視: '+mv.title : null; }
  return null;
}

function renderExpenseCard(item){
  const unit = parseFloat(item.unitPrice)||0;
  const qty = parseFloat(item.quantity)||1;
  const total = expenseAmount(item);
  const cover = (item.imageUrls||[])[0];
  const catIcon = EXPENSE_CATEGORY_ICON[item.category] || '💸';
  const catColor = chipColor(item.category);
  const statusColor = item.deliveryStatus ? expenseStatusColor(item.deliveryStatus) : null;
  const tags = (item.tags||[]);
  const footnoteParts = [];
  if(item.artist) footnoteParts.push('👤 '+item.artist);
  expenseLinksArray(item).forEach(l=>{
    const label = describeExpenseLink(l);
    if(label) footnoteParts.push(label);
  });
  if(item.paymentMethod) footnoteParts.push('付款: '+item.paymentMethod);
  if(item.platform) footnoteParts.push('購自'+item.platform);

  return `
  <div class="card exp-card" style="border-left-color:${catColor.fg};">
    <div class="exp-row">
      <div class="exp-thumb" style="background:linear-gradient(135deg, ${catColor.bg}, var(--wisteria-pale));">
        ${cover ? `<img src="${esc(cover)}" onerror="this.parentElement.innerHTML='${catIcon}'">` : catIcon}
      </div>
      <div class="exp-info">
        <div class="exp-badges">
          ${item.category ? `<span class="tag" style="background:${catColor.bg};color:${catColor.fg};">${catIcon} ${esc(item.category)}</span>` : ''}
          ${item.deliveryStatus ? `<span class="tag" style="background:${statusColor.bg};color:${statusColor.fg};">${esc(item.deliveryStatus)}</span>` : ''}
        </div>
        <div class="card-title exp-name">${esc(item.name||'（未命名）')}</div>
        ${tags.length ? `<div>${tags.map(t=>`<span class="tag gold">#${esc(t)}</span>`).join('')}</div>` : ''}
        ${footnoteParts.length ? `<div class="card-meta" style="margin-top:4px;">${esc(footnoteParts.join(' · '))}</div>` : ''}
        ${item.note ? `<div class="card-meta" style="margin-top:4px;">${esc(item.note)}</div>` : ''}
      </div>
      <div class="exp-price">
        <div class="exp-date">${item.date? fmtDate(item.date) : '—'}</div>
        <div class="exp-unit">$${unit.toLocaleString()}×${qty}</div>
        <div class="exp-total">$${total.toLocaleString()}</div>
      </div>
    </div>
    <div class="card-actions" style="justify-content:flex-end;margin-top:auto;padding-top:8px;">
      <button class="icon-btn dup" data-tab="expense" data-id="${item.id}" title="複製這筆">📋</button>
      <button class="icon-btn edit" data-tab="expense" data-id="${item.id}">✎</button>
      <button class="icon-btn del" data-tab="expense" data-id="${item.id}">🗑</button>
    </div>
  </div>`;
}

let expTags = [];
let schChecklist = [];
const SCH_CHECKLIST_TEMPLATE = ['購買門票','安排交通','預訂住宿','準備應援物','確認集合時間/地點','列印票券或證件'];
function renderSchChecklist(){
  const box = document.getElementById('schChecklistBox');
  if(!box) return;
  box.innerHTML = schChecklist.map((it,i)=>`
    <div class="checklist-item" data-idx="${i}">
      <input type="checkbox" class="checklist-check" data-idx="${i}" ${it.done?'checked':''}>
      <span class="checklist-text ${it.done?'done':''}">${esc(it.text)}</span>
      <span class="checklist-x" data-idx="${i}">×</span>
    </div>`).join('') +
    `<input type="text" id="schChecklistInput" placeholder="輸入待辦事項後按 Enter 新增">`;
  box.querySelectorAll('.checklist-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      schChecklist[+cb.dataset.idx].done = cb.checked;
      renderSchChecklist();
    });
  });
  box.querySelectorAll('.checklist-x').forEach(x=>{
    x.addEventListener('click', ()=>{
      schChecklist.splice(+x.dataset.idx, 1);
      renderSchChecklist();
    });
  });
  bindSchChecklistInput();
}
function bindSchChecklistInput(){
  const input = document.getElementById('schChecklistInput');
  if(!input) return;
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const val = input.value.trim();
      if(val){
        schChecklist.push({text:val, done:false});
        renderSchChecklist();
        const newInput = document.getElementById('schChecklistInput');
        if(newInput) newInput.focus();
      }
    }
  });
}
function buildExpLinkOptions(){
  const opts = [];
  [...state.support].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(s=>
    opts.push({ type:'support', id:s.id, label:`🎤 ${fmtDate(s.date)} · ${s.title}` }));
  [...state.fanlog].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(f=>
    opts.push({ type:'fanlog', id:f.id, label:`📝 ${fmtDate(f.date)} · ${f.activity}` }));
  [...new Set(state.photocards.map(p=>pcGroupKey(p)))].sort().forEach(key=>
    opts.push({ type:'pcSeries', id:key, label:`🎴 小卡・${key}` }));
  [...new Set(state.merch.map(mc=>mcGroupKey(mc)))].sort().forEach(key=>
    opts.push({ type:'mcSeries', id:key, label:`🛍️ 周邊・${key}` }));
  [...state.endorsement].sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).forEach(e=>
    opts.push({ type:'endorsement', id:e.id, label:`🤝 代言・${e.title}` }));
  [...state.magazine].sort((a,b)=>(b.issueDate||'').localeCompare(a.issueDate||'')).forEach(m=>
    opts.push({ type:'magazine', id:m.id, label:`📔 雜誌・${m.title}` }));
  [...state.movie].sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).forEach(x=>
    opts.push({ type:'movie', id:x.id, label:`🎬 影視・${x.title}` }));
  return opts;
}
function expLinkCurrentItems(src, opts){
  if(!src) return [];
  return expenseLinksArray(src)
    .map(l=> opts.find(o=>o.type===l.type && String(o.id)===String(l.id)))
    .filter(Boolean);
}
let expImgUrls = [];
let currentExpLinkOpts = [];
let expLinks = [];

function renderExpLinkChips(){
  const box = document.getElementById('expLinkBox');
  if(!box) return;
  box.innerHTML = expLinks.map(l=>
    `<span class="tag-chip">${esc(l.label)} <span class="tag-chip-x" data-remove="${esc(l.type)}::${esc(String(l.id))}">×</span></span>`
  ).join('') + `<input type="text" id="expLinkText" list="expLinkDatalist" autocomplete="off" placeholder="輸入關鍵字搜尋，選到項目後自動加入">`;
  box.querySelectorAll('.tag-chip-x').forEach(x=>{
    x.addEventListener('click', ()=>{
      const key = x.dataset.remove;
      expLinks = expLinks.filter(l=> `${l.type}::${String(l.id)}` !== key);
      renderExpLinkChips();
    });
  });
  bindExpLinkInput();
}
function bindExpLinkInput(){
  const input = document.getElementById('expLinkText');
  if(!input) return;
  input.addEventListener('input', ()=>{
    const val = input.value.trim();
    const matched = currentExpLinkOpts.find(o=>o.label===val);
    if(matched && !expLinks.some(l=>l.type===matched.type && String(l.id)===String(matched.id))){
      expLinks.push(matched);
      renderExpLinkChips();
      const newInput = document.getElementById('expLinkText');
      if(newInput) newInput.focus();
    }
  });
}

function openExpenseForm(id, prefill){
  const existing = id ? state.expense.find(e=>String(e.id)===String(id)) : null;
  const src = existing || prefill || null;
  expTags = src && Array.isArray(src.tags) ? [...src.tags] : [];
  expImgUrls = src && Array.isArray(src.imageUrls) ? [...src.imageUrls] : [];

  const platforms = [...new Set(state.expense.map(e=>e.platform).filter(Boolean))];

  const categoryOptions = [...FIXED_EXPENSE_CATEGORIES, ...state.customExpenseCategories];
  const curCategory = src ? (src.category||'') : '';
  const isCustomCategory = curCategory && !categoryOptions.includes(curCategory);
  const categoryFieldHtml = `
    <select id="expCategorySelect">
      <option value="">請選擇</option>
      ${categoryOptions.map(c=>`<option value="${esc(c)}" ${curCategory===c?'selected':''}>${esc(c)}</option>`).join('')}
      <option value="__other__" ${isCustomCategory?'selected':''}>＋ 自訂分類</option>
    </select>
    <input type="text" id="expNewCategory" placeholder="輸入新的分類名稱" style="margin-top:8px; display:${isCustomCategory?'block':'none'};" value="${isCustomCategory?esc(curCategory):''}">`;

  const artistOptions = [...new Set([
    ...state.artists.map(a=>a.name),
    ...state.expense.map(e=>e.artist).filter(Boolean)
  ])];

function renderExpTagChips(){
  const box = document.getElementById('expTagBox');
  if(!box) return;
  box.innerHTML = expTags.map(t=>
    `<span class="tag-chip">${esc(t)} <span class="tag-chip-x" data-remove="${esc(t)}">×</span></span>`
  ).join('') + `<input type="text" id="expTagText" placeholder="輸入完標籤後，記得加#號加入">`;
  box.querySelectorAll('.tag-chip-x').forEach(x=>{
    x.addEventListener('click', ()=>{
      expTags = expTags.filter(t=>t!==x.dataset.remove);
      renderExpTagChips();
      bindExpTagInput();
    });
  });
  bindExpTagInput();
}
function bindExpTagInput(){
  const input = document.getElementById('expTagText');
  if(!input) return;
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      let val = input.value.trim().replace(/^#/, '');
      if(val && !expTags.includes(val)){
        expTags.push(val);
        renderExpTagChips();
        const newInput = document.getElementById('expTagText');
        if(newInput) newInput.focus();
      } else {
        input.value = '';
      }
    }
  });
}

function renderExpImgList(){
  const list = document.getElementById('expImgList');
  if(!list) return;
  if(expImgUrls.length===0){
    list.innerHTML = `<div style="font-size:12px;color:var(--ink-faint);">尚未加入圖片連結</div>`;
    return;
  }
  list.innerHTML = `<div style="display:flex; gap:8px; flex-wrap:wrap;">` + expImgUrls.map((url,idx)=>`
    <div style="position:relative; width:64px; height:64px;">
      <img src="${esc(url)}" onerror="this.src='';this.style.background='var(--sakura-pale)'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;box-shadow:var(--shadow-sm);">
      <button type="button" data-idx="${idx}" class="exp-img-remove" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#B54545;color:#fff;font-size:12px;cursor:pointer;">×</button>
    </div>`).join('') + `</div>`;
  list.querySelectorAll('.exp-img-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      expImgUrls.splice(parseInt(btn.dataset.idx),1);

}
function addExpImgUrl(){
  const input = document.getElementById('expImgNewUrl');
  const url = input.value.trim();
  if(!url) return;
  if(expImgUrls.length>=6){ showToast('最多只能加入 6 張圖片'); return; }
  expImgUrls.push(url);
  input.value = '';

async function saveExpenseForm(existing){
  const name = document.getElementById('expName').value.trim();
  const date = document.getElementById('expDate').value;
  if(!name || !date){ showToast('請填寫必填欄位 *'); return; }

  const recordType = 'expense';

  const categorySelect = document.getElementById('expCategorySelect');
  let category = categorySelect.value;
  if(category==='__other__'){
    const newCat = document.getElementById('expNewCategory').value.trim();
    category = newCat;
    if(newCat && !FIXED_EXPENSE_CATEGORIES.includes(newCat) && !state.customExpenseCategories.includes(newCat)){
      state.customExpenseCategories.push(newCat);
      await saveKey('oshi-expense-categories', state.customExpenseCategories);
    }
  }

  const artistSelect = document.getElementById('expArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__'){
    const newName = document.getElementById('expNewArtistName').value.trim();
    artist = newName;
  }
  if(artist && !state.artists.find(a=>a.name===artist)){
    state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:artist });
    await saveKey('oshi-artists', state.artists);
  }

  const data = {
    recordType,
    name,
    artist,
    unitPrice: document.getElementById('expUnitPrice').value.trim(),
    quantity: document.getElementById('expQuantity').value.trim() || '1',
    shipping: document.getElementById('expShipping').value.trim(),
    origCurrency: document.getElementById('expCurrency').value,
    origAmount: document.getElementById('expOrigAmount').value.trim(),
    category,
    date,
    links: expLinks.map(l=>({ type:l.type, id:l.id })),
    supportLinkedId: '',
    fanlogLinkedId: '',
    pcSeriesLinkedId: '',
    mcSeriesLinkedId: '',
    mediaType: '',
    mediaLinkedId: '',
    platform: document.getElementById('expPlatform').value.trim(),
    deliveryStatus: document.getElementById('expDeliveryStatus').value,
    paymentMethod: document.getElementById('expPaymentMethod').value,
    tags: [...expTags],
    note: document.getElementById('expNote').value.trim(),
    imageUrls: [...expImgUrls]
  };

  if(existing){
    await deleteRemovedStorageImages(existing.imageUrls, data.imageUrls);
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.expense.push(data);
  }
  await saveKey('oshi-expense', state.expense);
  closeModal();
  render();
  updatePendingUploadsBanner();
  showToast(existing? '已更新' : '已新增');
}

/* ================= Schedule (calendar view) ================= */
let calMonth = null;
let scheduleArtistFilter = '__all__';
let scheduleViewMode = 'calendar';

function ensureCalMonth(){
  if(!calMonth) calMonth = todayStr().slice(0,7);
}

/* 月曆行程配色改成「依藝人」— 同一位藝人在月曆、清單、記帳圖表都用同一個顏色（跟花費排行的 chipColor 共用同一份色票），
   沒有填藝人的行程統一用中性灰，不會硬湊一個看起來有意義、其實沒意義的顏色 */
const SCHEDULE_NEUTRAL_COLOR = '#8C98A4';
function scheduleEventColor(ev){
  const name = (ev.artist && ev.artist.trim()) ? ev.artist.trim() : '';
  if(!name) return SCHEDULE_NEUTRAL_COLOR;
  return chipColor(name).fg;
}

function renderScheduleTab(){
  ensureCalMonth();
  const meta = TAB_META.schedule;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;

  const artistNames = [...new Set(state.schedule.map(s=>s.artist).filter(Boolean))];
  const filteredSchedule = state.schedule.filter(s=> scheduleArtistFilter==='__all__' || s.artist===scheduleArtistFilter);

  html += `<div class="cal-filter-row" style="margin-bottom:10px;">
    <button class="sched-view-btn cal-filter-btn ${scheduleViewMode==='calendar'?'active':''}" data-view="calendar">📅 月曆檢視</button>
    <button class="sched-view-btn cal-filter-btn ${scheduleViewMode==='list'?'active':''}" data-view="list">📋 清單檢視</button>
  </div>`;

  html += `<div class="cal-filter-row">
    <button class="cal-filter-btn ${scheduleArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部行程</button>
    ${artistNames.map(n=>`<button class="cal-filter-btn ${scheduleArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
  </div>`;

  if(scheduleViewMode==='list'){
    html += renderScheduleListBody(filteredSchedule);
    return html;
  }

  const [y,m] = calMonth.split('-').map(Number);
  const firstDay = new Date(y, m-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthLabel = `${y}年${m}月`;
  const today = todayStr();

  /* 跨天行程排在最前面（依開始日期、id 穩定排序），確保同一場跨天行程在每一天的堆疊順序一致，
     這樣橫條才能在視覺上對齊、連成一條線；單日行程排在後面 */
  const isMultiDaySchedule = s=> s.date && s.isMultiDay && s.endDate && s.endDate > s.date;
  const multiDayEvents = filteredSchedule.filter(isMultiDaySchedule)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || String(a.id).localeCompare(String(b.id)));
  const singleDayEvents = filteredSchedule.filter(s=> s.date && !isMultiDaySchedule(s));

  const eventsByDate = {};
  multiDayEvents.forEach(s=>{
    let cur = new Date(s.date+'T00:00:00');
    const end = new Date(s.endDate+'T00:00:00');
    let guard = 0;
    while(cur <= end && guard < 366){
      const ds = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      (eventsByDate[ds] = eventsByDate[ds] || []).push(s);
      cur.setDate(cur.getDate()+1);
      guard++;
    }
  });
  singleDayEvents.forEach(s=>{
    (eventsByDate[s.date] = eventsByDate[s.date] || []).push(s);
  });

  html += `<div class="cal-head">
    <button class="cal-nav-btn" data-nav="-1">‹</button>
    <div class="cal-title maru">${monthLabel}</div>
    <button class="cal-nav-btn" data-nav="1">›</button>
  </div>`;
  if(calMonth !== today.slice(0,7)){
    html += `<div style="text-align:center; margin:-8px 0 14px;"><button class="chip-clear" id="calGoTodayBtn">📍 回到今天</button></div>`;
  }

  const dows = ['日','一','二','三','四','五','六'];
  html += `<div class="cal-grid">`;
  dows.forEach(d=> html += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startWeekday;i++) html += `<div class="cal-day empty"></div>`;
  const MAX_PILLS = 3;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===today;
    const weekday = (startWeekday + d - 1) % 7;
    const dayEvents = eventsByDate[dateStr] || [];
    const shown = dayEvents.slice(0, MAX_PILLS);
    const extra = dayEvents.length - shown.length;
    const pillsHtml = shown.map(ev=>{
      const color = scheduleEventColor(ev);
      if(!isMultiDaySchedule(ev)){
        return `<span class="event-pill" style="background:${color};" data-id="${ev.id}" title="${esc(ev.title)}">${esc(ev.title)}</span>`;
      }
      // 跨天行程：算出這一天是「這場活動」或「這一週」的開頭／結尾，決定橫條哪一側要接上鄰居、哪一側要收圓角
      const isEventStart = dateStr===ev.date;
      const isEventEnd = dateStr===ev.endDate;
      const capLeft = isEventStart || weekday===0;
      const capRight = isEventEnd || weekday===6;
      let cls = 'event-pill event-bar';
      if(!capLeft) cls += ' bridge-left';
      if(!capRight) cls += ' bridge-right';
      // 每一天都完整顯示活動名稱，不只是開頭那天——避免中間幾天只剩一條細線看不出是什麼行程
      return `<span class="${cls}" style="background:${color};" data-id="${ev.id}" title="${esc(ev.title)}">${esc(ev.title)}</span>`;
    }).join('');
    html += `<div class="cal-day ${isToday?'today':''}" data-date="${dateStr}">
      <span class="daynum">${d}</span>
      ${pillsHtml}
      ${extra>0 ? `<span class="event-more">+${extra} 更多</span>` : ''}
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderScheduleListBody(filteredSchedule){
  const today = todayStr();
  const effectiveEnd = s=> (s.isMultiDay && s.endDate) ? s.endDate : s.date;
  const dated = filteredSchedule.filter(s=>s.date);
  const upcoming = dated.filter(s=> effectiveEnd(s) >= today).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const past = dated.filter(s=> effectiveEnd(s) < today).sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  if(upcoming.length===0 && past.length===0){
    return `<div class="empty"><div class="stamp-big maru">程</div><div class="msg">還沒有安排任何行程<br>點右下角的「＋」新增一筆吧</div></div>`;
  }

  const renderRow = (s)=>{
    const dateLabel = (s.isMultiDay && s.endDate && s.endDate!==s.date)
      ? `${fmtDate(s.date)} ～ ${fmtDate(s.endDate)}`
      : fmtDate(s.date);
    const catBadge = s.category ? `<span class="tag ${tagColorClass(s.category, [...FIXED_SCHEDULE_CATEGORIES, ...state.customScheduleCategories])}">${esc(s.category)}</span>` : '';
    const checklist = Array.isArray(s.checklist) ? s.checklist : [];
    const doneCount = checklist.filter(it=>it.done).length;
    const checklistPct = checklist.length>0 ? Math.round(doneCount/checklist.length*100) : 0;
    const checklistHtml = checklist.length>0 ? `
      <div class="card-meta" style="margin-top:6px;">✅ 待辦 ${doneCount}/${checklist.length} 完成</div>
      <div class="pc-series-progress-track" style="margin-top:4px;"><div class="pc-series-progress-fill" style="width:${checklistPct}%;"></div></div>` : '';
    return `
    <div class="card">
      <div class="card-row">
        <div>
          <div class="card-title">${esc(s.title)}</div>
          <div class="card-meta">${[s.artist, s.location].filter(Boolean).join(' · ')}</div>
          <div style="margin-top:6px;">${catBadge} <span class="tag">🗓️ ${dateLabel}</span></div>
          ${s.note ? `<div class="card-meta" style="margin-top:6px;">${esc(s.note)}</div>` : ''}
          ${checklistHtml}
        </div>
        <div class="card-actions">
          <button class="icon-btn edit" data-tab="schedule" data-id="${s.id}">✎</button>
          <button class="icon-btn del" data-tab="schedule" data-id="${s.id}">🗑</button>
        </div>
      </div>
    </div>`;
  };

  let html = '';
  if(upcoming.length>0){
    html += `<div class="exp-group-header"><div class="exp-group-title">📌 即將到來 <span class="exp-group-count">(${upcoming.length} 筆)</span></div></div>
    <div class="list-grid">${upcoming.map(renderRow).join('')}</div>`;
  }
  if(past.length>0){
    html += `<div class="exp-group-header" style="margin-top:18px;"><div class="exp-group-title">✅ 已結束 <span class="exp-group-count">(${past.length} 筆)</span></div></div>
    <div class="list-grid">${past.map(renderRow).join('')}</div>`;
  }
  return html;
}

let pcDrill = null;
let pcArtistFilter = '__all__';
let pcOwnedFilter = '__all__';
let pcCategoryFilter = '__all__';

function normalizeSeriesKey(k){
  return (k||'').trim().toLowerCase().replace(/\s+/g,'');
}

function pcGroupKey(pc){
  return (pc.series && pc.series.trim()) || (pc.artist && pc.artist.trim()) || '未分類';
}
function pcGroups(){
  const groups = {};
  state.photocards
    .filter(pc=> pcArtistFilter==='__all__' || pc.artist===pcArtistFilter)
    .filter(pc=> pcCategoryFilter==='__all__' || pc.category===pcCategoryFilter)
    .forEach(pc=>{
      const key = pcGroupKey(pc);
      (groups[key] = groups[key] || []).push(pc);
    });
  // 已擁有排前面，同樣擁有狀態下再依建立時間排序，越靠近今天排越前面
  Object.keys(groups).forEach(key=>{
    groups[key].sort((a,b)=>{
      const ownedDiff = (b.owned?1:0) - (a.owned?1:0);
      if(ownedDiff!==0) return ownedDiff;
      return (b.createdAt||'').localeCompare(a.createdAt||'');
    });
  });
  return groups;
}
function pcSeriesCreatedAt(key){
  return (state.pcSeriesMeta && state.pcSeriesMeta[key] && state.pcSeriesMeta[key].createdAt) || '';
}
function pcOrderedKeys(groups){
  const preferredOrder = [...state.artists.map(a=>a.name)];
  const allKeys = Object.keys(groups);
  const seriesKeys = allKeys.filter(k=>!preferredOrder.includes(k) && k!=='未分類');
  // 圖鑑本身有自己獨立的建立日期（跟裡面小卡的建立日期分開），有設定日期的排前面、越新越前面
  seriesKeys.sort((a,b)=>{
    const da = pcSeriesCreatedAt(a), db = pcSeriesCreatedAt(b);
    if(da && db) return db.localeCompare(da);
    if(da && !db) return -1;
    if(!da && db) return 1;
    return a.localeCompare(b);
  });
  const ordered = [
    ...preferredOrder.filter(k=>groups[k]),
    ...seriesKeys,
  ];
  if(groups['未分類']) ordered.push('未分類');
  return ordered;
}

  const seriesFullTotals = {};

    .filter(pc=> pcArtistFilter==='__all__' || pc.artist===pcArtistFilter)
    .forEach(pc=>{

      seriesFullTotals[key] = (seriesFullTotals[key]||0) + 1;

          <div class="pc-series-name">${esc(key)}</div>

const GLOBAL_SEARCH_CONFIG = [
  { tab:'schedule', icon:'📅', label:'行程', fields:['title','artist','location','category'], titleField:'title', openFn:(id)=>{ state.tab='schedule'; render(); openScheduleForm(id); } },
  { tab:'expense', icon:'💰', label:'記帳', fields:['name','note','platform','artist','category'], titleField:'name', openFn:(id)=>{ state.tab='expense'; render(); openExpenseForm(id); } },
  { tab:'photocards', icon:'🎴', label:'小卡', fields:['name','series','artist','category'], titleField:'name', openFn:(id)=>{ state.tab='photocards'; render(); openPhotocardForm(id); } },
  { tab:'merch', icon:'🛍️', label:'周邊', fields:['name','series','artist','category'], titleField:'name', openFn:(id)=>{ state.tab='merch'; render(); openMerchForm(id); } },
  { tab:'support', icon:'📣', label:'應援', fields:['title','artist','activity','location','content'], titleField:'title', openFn:(id)=>{ state.tab='support'; render(); openSupportForm(id); } },
  { tab:'fanlog', icon:'📖', label:'紀錄', fields:['activity','artist','category'], titleField:'activity', openFn:(id)=>{ state.tab='fanlog'; render(); openFanlogForm(id); } },
  { tab:'artists', icon:'✨', label:'藝人', fields:['name','group','bio'], titleField:'name', openFn:(id)=>{ openArtistDetail(id); } },
  { tab:'endorsement', icon:'🤝', label:'代言', fields:['title','artist','category'], titleField:'title', openFn:(id)=>{ state.tab='media'; mediaSubTab='endorsement'; render(); openEndorsementForm(id); } },
  { tab:'magazine', icon:'📔', label:'雜誌', fields:['title','artist'], titleField:'title', openFn:(id)=>{ state.tab='media'; mediaSubTab='magazine'; render(); openMagazineForm(id); } },
  { tab:'movie', icon:'🎬', label:'影視', fields:['title','artist'], titleField:'title', openFn:(id)=>{ state.tab='media'; mediaSubTab='movie'; render(); openMovieForm(id); } }
];
function globalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  GLOBAL_SEARCH_CONFIG.forEach(cfg=>{
    const items = state[cfg.tab] || [];
    items.forEach(item=>{
      const hay = cfg.fields.map(f=>item[f]).filter(Boolean).join(' ').toLowerCase();
      if(hay.includes(q)) results.push({ cfg, item });
    });
  });
  return results;
}
function openGlobalSearch(){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru" style="margin-bottom:14px;">🔍 搜尋全站</h3>
    <div class="field">
      <input type="text" id="globalSearchInput" placeholder="搜尋行程、記帳、小卡、周邊、應援、紀錄、藝人、媒體..." style="width:100%;box-sizing:border-box;">
    </div>
    <div id="globalSearchResults" style="margin-top:14px;max-height:60vh;overflow-y:auto;"></div>
  `;
  const input = document.getElementById('globalSearchInput');
  const resultsBox = document.getElementById('globalSearchResults');
  const renderResults = (q)=>{
    if(!q.trim()){
      resultsBox.innerHTML = `<div style="text-align:center;color:var(--ink-faint);padding:24px 0;font-size:13px;">輸入關鍵字開始搜尋</div>`;
      return;
    }
    const results = globalSearch(q).slice(0,40);
    if(results.length===0){
      resultsBox.innerHTML = `<div style="text-align:center;color:var(--ink-faint);padding:24px 0;font-size:13px;">找不到符合「${esc(q)}」的結果</div>`;
      return;
    }
    resultsBox.innerHTML = results.map(({cfg,item})=>{
      const title = item[cfg.titleField] || '未命名';
      const subParts = [item.artist, item.date?fmtDate(item.date):'', item.category].filter(Boolean);
      return `
      <button class="global-search-result" data-tab="${cfg.tab}" data-id="${item.id}">
        <span class="gsr-icon">${cfg.icon}</span>
        <span class="gsr-body">
          <span class="gsr-title">${esc(title)}</span>
          <span class="gsr-meta">${cfg.label}${subParts.length?' · '+esc(subParts.join(' · ')):''}</span>
        </span>
      </button>`;
    }).join('');
    resultsBox.querySelectorAll('.global-search-result').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cfg = GLOBAL_SEARCH_CONFIG.find(c=>c.tab===btn.dataset.tab);
        if(cfg) cfg.openFn(btn.dataset.id);
      });
    });
  };
  renderResults('');
  input.addEventListener('input', ()=> renderResults(input.value));
  showModal();
  setTimeout(()=> input.focus(), 60);
}

function openArtistDetail(id){
  const a = state.artists.find(x=>String(x.id)===String(id));
  if(!a) return;

  const artistExpenses = state.expense.filter(e=>e.artist===a.name);
  const totalSpent = artistExpenses.reduce((sum,e)=> sum + expenseAmount(e), 0);
  const today = todayStr();
  const currentYear = today.slice(0,4);
  const lastYear = String(parseInt(currentYear,10)-1);
  const monthDay = today.slice(5,10); // MM-DD，用來跟去年同一天做同期比較
  const thisYearSpent = artistExpenses.filter(e=> (e.date||'').slice(0,4)===currentYear).reduce((sum,e)=> sum + expenseAmount(e), 0);
  const lastYearSamePeriodSpent = artistExpenses.filter(e=>{
    const d = e.date||'';
    return d.slice(0,4)===lastYear && d.slice(5,10)<=monthDay;
  }).reduce((sum,e)=> sum + expenseAmount(e), 0);
  let yoyBadgeHtml = '';
  if(lastYearSamePeriodSpent>0){
    const yoyPct = Math.round((thisYearSpent-lastYearSamePeriodSpent)/lastYearSamePeriodSpent*100);
    const up = yoyPct>=0;
    yoyBadgeHtml = ` <span style="font-size:9.5px;color:${up?'var(--rose-deep)':'var(--matcha)'};">${up?'↑':'↓'}${Math.abs(yoyPct)}%</span>`;
  } else if(thisYearSpent>0){
    yoyBadgeHtml = ` <span style="font-size:9.5px;color:var(--ink-faint);">去年同期無資料</span>`;
  }
  const pcOwnedCount = state.photocards.filter(p=>p.artist===a.name && p.owned).length;
  const pcTotalCount = state.photocards.filter(p=>p.artist===a.name).length;
  const fanlogCount = state.fanlog.filter(f=>splitArtistNames(f.artist).includes(a.name)).length;
  const supportCount = state.support.filter(s=>s.artist===a.name).length;
  const artistFlips = state.fanlog.filter(f=>splitArtistNames(f.artist).includes(a.name) && f.isFlipped);
  const flipCount = artistFlips.length;
  const flipTypeCounts = FLIP_TYPE_OPTIONS.map(t=> ({ type:t, count: artistFlips.filter(f=>Array.isArray(f.flipTypes) && f.flipTypes.includes(t)).length })).filter(x=>x.count>0);

  // 花費 vs 收藏 比例：換得到實體收藏（專輯/小卡/周邊等）的花費，跟體驗／消耗型花費（門票/交通/餐飲等）的佔比
  const collectibleSpent = artistExpenses.filter(e=> COLLECTIBLE_EXPENSE_CATEGORIES.includes(e.category)).reduce((sum,e)=> sum + expenseAmount(e), 0);
  const experienceSpent = totalSpent - collectibleSpent;
  const collectiblePct = totalSpent>0 ? Math.round(collectibleSpent/totalSpent*100) : 0;
  const experiencePct = totalSpent>0 ? 100 - collectiblePct : 0;
  const avgPerPc = pcOwnedCount>0 ? Math.round(collectibleSpent/pcOwnedCount) : null;
  const ratioChartHtml = totalSpent>0 ? `
    <div style="background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow-sm);">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">💰 花費 vs 🎴 收藏 比例</div>
      <div style="display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--bg-deep);">
        ${collectiblePct>0 ? `<div style="width:${collectiblePct}%;background:var(--rose);"></div>` : ''}
        ${experiencePct>0 ? `<div style="width:${experiencePct}%;background:var(--wisteria);"></div>` : ''}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:8px;">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--rose);margin-right:4px;"></span>換得收藏（專輯/小卡/周邊等）NT$ ${collectibleSpent.toLocaleString()}（${collectiblePct}%）</span>
      </div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--wisteria);margin-right:4px;"></span>體驗／其他支出（門票/交通/餐飲等）NT$ ${experienceSpent.toLocaleString()}（${experiencePct}%）
      </div>
      ${avgPerPc!==null ? `<div style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;border-top:1px dashed var(--ink-faint);padding-top:8px;">平均每張擁有的小卡花費約 NT$ ${avgPerPc.toLocaleString()}</div>` : ''}
    </div>` : '';

  const birthdayInfo = a.birthday ? nextOccurrenceInfo(a.birthday) : null;
  const birthdayCountdownHtml = (birthdayInfo && birthdayInfo.diffDays>=0 && birthdayInfo.diffDays<=30)
    ? `<span class="tag rose">🎂 ${birthdayInfo.diffDays===0?'今天生日！':`還有 ${birthdayInfo.diffDays} 天生日`}</span>`
    : '';

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;">
      ${a.photoUrl
        ? `<img src="${esc(a.photoUrl)}" onerror="this.style.display='none'" style="width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
        : `<div style="width:64px;height:64px;border-radius:50%;background:var(--sakura-pale);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">✨</div>`}
      <div>
        <h3 class="maru" style="margin:0;">${esc(a.name)} ${artistOshiLevel(a)==='本命' ? '<span style="color:var(--rose-deep)">♡</span>':''}</h3>
        <div class="card-meta">${esc(a.group||'')}</div>
      </div>
    </div>
    <div style="margin-bottom:10px;">
      ${oshiLevelTag(artistOshiLevel(a))}
      ${a.birthday ? `<span class="tag">🎂 ${fmtDate(a.birthday)}</span>`:''}
      ${birthdayCountdownHtml}
      ${a.debutDate ? `<span class="tag matcha">出道 ${fmtDate(a.debutDate)}</span>`:''}
      ${a.fanSince ? `<span class="tag rose">入坑 ${fanDurationText(a.fanSince)}（${fmtDate(a.fanSince)}）</span>`:''}
    </div>
    ${a.bio ? `<div class="card-meta" style="white-space:pre-wrap;line-height:1.7;">${esc(a.bio)}</div>` : `<div class="card-meta" style="color:var(--ink-faint);">尚未填寫簡介</div>`}
    <div class="stat-grid" style="grid-template-columns:2fr 1fr 1fr;margin-top:14px;">
      <div class="stat-card" style="display:flex;align-items:center;padding-left:4px;padding-right:4px;">
        <div id="artistYearSpentBtn" style="flex:1;min-width:0;cursor:pointer;">
          <div class="num" style="font-size:15.5px;">NT$ ${thisYearSpent.toLocaleString()}</div>
          <div class="lbl">今年花費${yoyBadgeHtml}</div>
        </div>
        <div style="width:1px;align-self:stretch;background:var(--ink-faint);opacity:0.35;margin:2px 8px;"></div>
        <div id="artistTotalSpentBtn" style="flex:1;min-width:0;cursor:pointer;">
          <div class="num" style="font-size:15.5px;">NT$ ${totalSpent.toLocaleString()}</div>
          <div class="lbl">累積花費</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="num">${pcOwnedCount}/${pcTotalCount}</div>
        <div class="lbl">小卡收藏</div>
        ${pcTotalCount>0 ? `<div style="height:4px;border-radius:2px;background:var(--bg-deep);margin-top:6px;overflow:hidden;"><div style="height:100%;width:${Math.round(pcOwnedCount/pcTotalCount*100)}%;background:var(--rose);"></div></div>` : ''}
      </div>
      <div class="stat-card"><div class="num">${fanlogCount}</div><div class="lbl">追星紀錄</div></div>
    </div>
    ${ratioChartHtml}
    ${supportCount>0 ? `<div class="card-meta" id="artistSupportLink" style="margin-top:8px;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;">📣 應援紀錄：${supportCount} 筆 →</div>` : ''}
    ${flipCount>0 ? `<div class="card-meta" style="margin-top:4px;">💌 被翻牌次數：${flipCount} 次${flipTypeCounts.length ? '（'+flipTypeCounts.map(x=>`${esc(x.type)} ${x.count}`).join('・')+'）' : ''}</div>` : ''}
    <div class="modal-actions" style="margin-top:18px;">
      <button class="btn ghost" id="cancelBtn">關閉</button>
      <button class="btn primary" id="artistDetailEditBtn">編輯</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('artistDetailEditBtn').addEventListener('click', ()=>{
    closeModal();
    openForm('artists', a.id);
  });
  const yearSpentBtn = document.getElementById('artistYearSpentBtn');
  if(yearSpentBtn){
    yearSpentBtn.addEventListener('click', ()=>{
      closeModal();
      state.tab = 'expense';
      expViewMode = 'all';
      expMonthFilter = '__all__';
      expSearchQuery = a.name;
      render();
    });
  }
  const totalSpentBtn = document.getElementById('artistTotalSpentBtn');
  if(totalSpentBtn){
    totalSpentBtn.addEventListener('click', ()=>{
      closeModal();
      state.tab = 'expense';
      expViewMode = 'year';
      expYearFilter = '__all__';
      expSearchQuery = a.name;
      render();
    });
  }
  const supportLink = document.getElementById('artistSupportLink');
  if(supportLink){
    supportLink.addEventListener('click', ()=>{
      closeModal();
      state.tab = 'support';
      supportArtistFilter = a.name;
      supportYearFilter = '__all__';
      render();
    });
  }
  showModal();
}

/* ================= Support wall (應援牆) ================= */
let supportArtistFilter = '__all__';
let supportYearFilter = '__all__';
let supImgUrls = [];
let endorsementArtistFilter = '__all__';
let magazineArtistFilter = '__all__';
let movieArtistFilter = '__all__';
let mediaSubTab = 'endorsement';
let mediaSearchQuery = '';

function renderSupportTab(){
  const meta = TAB_META.support;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;
  if(state.support.length===0){
    html += `<div class="empty"><div class="stamp-big maru">${meta.stamp}</div><div class="msg">${meta.empty}<br>點右下角的「＋」放上你的應援吧</div></div>`;
    return html;
  }

  const artistNames = [...new Set(state.support.map(s=>s.artist).filter(Boolean))];
  if(artistNames.length>0){
    html += `<div class="cal-filter-row">
      <button class="cal-filter-btn ${supportArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部藝人</button>
      ${artistNames.map(n=>`<button class="cal-filter-btn ${supportArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
    </div>`;
  }
  if(supportArtistFilter!=='__all__' && !artistNames.includes(supportArtistFilter)) supportArtistFilter = '__all__';

  const years = [...new Set(state.support.map(s=> s.date ? s.date.slice(0,4) : null).filter(Boolean))].sort((a,b)=> b.localeCompare(a));
  if(supportYearFilter!=='__all__' && !years.includes(supportYearFilter)) supportYearFilter = '__all__';
  if(years.length>0){
    html += `<div class="cal-filter-row" style="margin-top:8px;">
      <button class="cal-filter-btn year-filter-btn ${supportYearFilter==='__all__'?'active':''}" data-year="__all__">全部年份</button>
      ${years.map(y=>`<button class="cal-filter-btn year-filter-btn ${supportYearFilter===y?'active':''}" data-year="${y}">${y}</button>`).join('')}
    </div>`;
  }

  const today = todayStr();
  const effectiveEnd = s=> (s.isMultiDay && s.endDate) ? s.endDate : s.date;
  const bySupportArtist = s=> supportArtistFilter==='__all__' || s.artist===supportArtistFilter;
  const bySupportYear = s=> supportYearFilter==='__all__' || (s.date && s.date.startsWith(supportYearFilter));
  const upcoming = state.support.filter(s=> bySupportArtist(s) && bySupportYear(s) && effectiveEnd(s) >= today).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const past = state.support.filter(s=> bySupportArtist(s) && bySupportYear(s) && effectiveEnd(s) < today).sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const scopedSupport = state.support.filter(s=> bySupportArtist(s) && bySupportYear(s));
  const totalSpent = scopedSupport.reduce((sum,s)=> sum + supportSpentAmount(s), 0);
  const linkedEventCount = scopedSupport.filter(s=> linkedExpensesForSupport(s).length>0).length;
  const totalLinkedEntries = scopedSupport.reduce((sum,s)=> sum + linkedExpensesForSupport(s).length, 0);
  html += `
  <div class="mini-row" style="margin:12px 0 16px; background:var(--surface); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow-sm);">
    <span class="l" style="font-weight:700;">💰 應援花費總計</span>
    <span class="r" style="font-weight:700; color:var(--rose-deep);">NT$ ${totalSpent.toLocaleString()}</span>
  </div>
  ${totalLinkedEntries>0 ? `<div style="font-size:11px;color:var(--ink-soft);margin:-10px 2px 16px;">共 ${linkedEventCount} 場應援已連動記帳本，合計 ${totalLinkedEntries} 筆花費紀錄</div>` : ''}
  `;

  const renderSupportCard = (s, isEnded)=>{
    const dateLabel = (s.isMultiDay && s.endDate && s.endDate!==s.date)
      ? `${fmtDate(s.date)} ～ ${fmtDate(s.endDate)}`
      : fmtDate(s.date);
    const imgs = (s.imageUrls && s.imageUrls.length) ? s.imageUrls : (s.imageUrl ? [s.imageUrl] : []);
    const cover = imgs[0];
    const linked = linkedExpensesForSupport(s);
    const spentAmt = supportSpentAmount(s);
    return `
    <div class="card support-card">
      <div style="position:relative;">
        ${cover
          ? `<img class="support-cover" src="${esc(cover)}" onerror="this.outerHTML='<div class=&quot;support-cover ph&quot;>📣</div>'">`
          : `<div class="support-cover ph">📣</div>`}
        ${imgs.length>1 ? `<span class="tag" style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.55);color:#fff;">📷 ${imgs.length}</span>` : ''}
      </div>
      <div class="support-body">
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-meta">${[s.artist, s.activity, s.location].filter(Boolean).join(' · ')}</div>
        <div>
          ${dateLabel ? `<span class="tag">${dateLabel}</span>` : ''}
          ${isEnded ? `<span class="tag wisteria">已結束活動</span>` : ''}
          ${(s.isPaid || spentAmt>0) ? `<div style="width:100%;"></div><span class="tag gold">💰 付費應援${spentAmt?('　NT$'+spentAmt.toLocaleString()):''}</span>` : ''}
          ${linked.length>0 ? linkedExpenseTagHtml('support', s.id, s.title, linked.length) : ''}
        </div>
        ${s.condition ? `<div class="card-meta" style="margin-top:6px;">🎟️ 領取條件：${esc(s.condition)}</div>` : ''}
        ${s.content ? `<div class="card-meta" style="margin-top:4px;">${esc(s.content)}</div>` : ''}

function duplicateSupport(id){
  const item = state.support.find(s=>String(s.id)===String(id));
  if(!item) return;
  const prefill = JSON.parse(JSON.stringify(item));
  delete prefill.id;
  delete prefill.expenseLinkedId; // 複製出來的新一筆不該指向原本那筆已連動的記帳紀錄
  openSupportForm(null, prefill);

function addSupImgUrl(){
  const input = document.getElementById('supImgNewUrl');
  const url = input.value.trim();
  if(!url) return;
  if(supImgUrls.length>=6){ showToast('最多只能加入 6 張圖片'); return; }
  supImgUrls.push(url);
  input.value = '';

async function saveSupportForm(existing){
  const title = document.getElementById('supTitle').value.trim();
  if(!title){ showToast('請填寫應援名稱'); return; }

  const artistSelect = document.getElementById('supArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__' || (artistSelect && artistSelect.options.length && artistSelect.value==='__new__')){
    const newName = document.getElementById('supNewArtistName').value.trim();
    artist = newName;
  }
  if(artist && !state.artists.find(a=>a.name===artist)){
    state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:artist });
    await saveKey('oshi-artists', state.artists);
  }

  const isMultiDay = document.getElementById('supMultiDayBtn').classList.contains('active');
  let date, endDate = '';
  if(isMultiDay){
    date = document.getElementById('supStartDate').value.trim();
    endDate = document.getElementById('supEndDate').value.trim();
    if(endDate && date && endDate < date){ showToast('結束日期不能早於開始日期'); return; }
  } else {
    date = document.getElementById('supDate').value.trim();
  }

  const isPaid = document.getElementById('supIsPaid').checked;
  const paidAmount = document.getElementById('supPaidAmount') ? document.getElementById('supPaidAmount').value.trim() : '';
  const addToExpense = isPaid && document.getElementById('supAddToExpense') && document.getElementById('supAddToExpense').checked;

  const data = {
    title,
    artist,
    activity: document.getElementById('supActivity').value.trim(),
    date,
    isMultiDay: !!isMultiDay,
    endDate: isMultiDay ? endDate : '',
    location: document.getElementById('supLocation').value.trim(),
    condition: document.getElementById('supCondition').value.trim(),
    articleUrl: document.getElementById('supArticleUrl').value.trim(),
    isPaid,
    paidAmount,
    imageUrls: [...supImgUrls],
    content: document.getElementById('supContent').value.trim()
  };

  let targetSupport;
  if(existing){
    await deleteRemovedStorageImages(existing.imageUrls, data.imageUrls);
    Object.assign(existing, data);
    targetSupport = existing;
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.support.push(data);
    targetSupport = data;
  }

  // 應援 ↔ 記帳本 串連：勾選「同時加入記帳本」時，自動建立/更新對應的花費紀錄
  if(addToExpense){
    const amt = parseFloat(paidAmount) || 0;
    let linkedExpense = targetSupport.expenseLinkedId ? state.expense.find(e=>String(e.id)===String(targetSupport.expenseLinkedId)) : null;
    if(linkedExpense){
      linkedExpense.name = title;
      linkedExpense.artist = artist;
      linkedExpense.unitPrice = amt;
      linkedExpense.date = date;
      linkedExpense.supportLinkedId = targetSupport.id;
    } else {
      const newExpense = {
        id: 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000)+'e',
        recordType: 'expense',
        name: title,
        artist,
        unitPrice: amt,
        quantity: '1',
        shipping: '',
        origCurrency: 'TWD',
        origAmount: '',
        category: '應援物/飯製商品',
        date,
        supportLinkedId: targetSupport.id,
        platform: '',
        deliveryStatus: '',
        paymentMethod: '',
        tags: [],
        note: '由應援牆自動建立',
        imageUrls: []
      };
      state.expense.push(newExpense);
      targetSupport.expenseLinkedId = newExpense.id;
    }
    await saveKey('oshi-expense', state.expense);
  }

  await saveKey('oshi-support', state.support);
  closeModal();
  render();
  updatePendingUploadsBanner();
  showToast(existing? '已更新' : '已新增');
}

function renderMediaTab(){
  const meta = TAB_META.media;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;
  html += `<div class="cal-filter-row">
    <button class="cal-filter-btn media-subtab-btn ${mediaSubTab==='endorsement'?'active':''}" data-sub="endorsement">🤝 代言</button>
    <button class="cal-filter-btn media-subtab-btn ${mediaSubTab==='magazine'?'active':''}" data-sub="magazine">📔 雜誌</button>
    <button class="cal-filter-btn media-subtab-btn ${mediaSubTab==='movie'?'active':''}" data-sub="movie">🎬 影視</button>
  </div>
  <div class="field" style="margin:12px 0;">
    <input type="text" id="mediaSearchInput" placeholder="🔍 搜尋名稱、藝人、類型..." value="${esc(mediaSearchQuery)}" style="width:100%;box-sizing:border-box;">
  </div>`;
  if(mediaSubTab==='magazine') html += renderMagazineBody();
  else if(mediaSubTab==='movie') html += renderMovieBody();

function mediaMatchesSearch(item, extraFields){
  const q = mediaSearchQuery.trim().toLowerCase();
  if(!q) return true;
  const hay = [item.title, item.artist, item.category, ...(extraFields||[])].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function bindMediaTabActions(){

function renderEndorsementBody(){
  const meta = TAB_META.endorsement;
  let html = '';
  if(state.endorsement.length===0){
    html += `<div class="empty"><div class="stamp-big maru">${meta.stamp}</div><div class="msg">${meta.empty}<br>點右下角的「＋」新增一筆吧</div></div>`;
    return html;
  }

  const artistNames = [...new Set(state.endorsement.map(e=>e.artist).filter(Boolean))];
  if(artistNames.length>0){
    html += `<div class="cal-filter-row">
      <button class="cal-filter-btn ${endorsementArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部藝人</button>
      ${artistNames.map(n=>`<button class="cal-filter-btn ${endorsementArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
    </div>`;
  }
  if(endorsementArtistFilter!=='__all__' && !artistNames.includes(endorsementArtistFilter)) endorsementArtistFilter = '__all__';

  const filtered = state.endorsement
    .filter(e=> endorsementArtistFilter==='__all__' || e.artist===endorsementArtistFilter)
    .filter(e=> mediaMatchesSearch(e))
    .sort((a,b)=> (b.startDate||'').localeCompare(a.startDate||''));

  if(filtered.length===0){
    html += `<div class="empty"><div class="stamp-big maru">${mediaSearchQuery.trim()?'查':meta.stamp}</div><div class="msg">${mediaSearchQuery.trim()?'找不到符合條件的代言紀錄':'這位藝人還沒有代言合作紀錄'}</div></div>`;
    return html;
  }

  html += `<div class="support-grid">${filtered.map(e=>renderEndorsementCard(e)).join('')}</div>`;
  return html;
}

function openForm(tab, id, prefill){
  editingId = id;
  const schema = SCHEMAS[tab];
  const existing = id ? state[tab].find(i=>String(i.id)===String(id)) : null;
  const meta = TAB_META[tab];

  let fieldsHtml = '';
  schema.forEach(f=>{
    const val = existing ? (existing[f.key]||'') : (prefill && prefill[f.key]!==undefined ? prefill[f.key] : '');
    fieldsHtml += `<div class="field"><label>${f.label}${f.required?' *':''}</label>`;
    if(f.type==='textarea'){
      fieldsHtml += `<textarea data-field="${f.key}" placeholder="${f.ph||''}">${esc(val)}</textarea>`;
    } else if(f.type==='select'){
      fieldsHtml += `<select data-field="${f.key}">`;
      fieldsHtml += `<option value="">請選擇</option>`;
      f.options.forEach(op=>{
        fieldsHtml += `<option value="${esc(op)}" ${val===op?'selected':''}>${esc(op)}</option>`;
      });
      fieldsHtml += `</select>`;
    } else {
      fieldsHtml += `<input type="${f.type}" data-field="${f.key}" value="${esc(val)}" placeholder="${f.ph||''}">`;
    }
    fieldsHtml += `</div>`;
  });

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">${existing? '編輯' : '新增'} · ${meta.label}</h3>
    <div id="formFields">${fieldsHtml}</div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', ()=> saveForm(tab, schema, existing));
  showModal();
}

async function saveForm(tab, schema, existing){
  const data = {};
  let missingRequired = false;
  schema.forEach(f=>{
    const el = document.querySelector(`[data-field="${f.key}"]`);
    const val = el ? el.value.trim() : '';
    if(f.required && !val) missingRequired = true;
    data[f.key] = val;
  });
  if(missingRequired){
    showToast('請填寫必填欄位 *');
    return;
  }
  // 改名前先記住藝人原本的名字，等等要拿去同步更新所有引用這個名字的資料
  const oldArtistName = (tab==='artists' && existing) ? existing.name : null;
  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state[tab].push(data);
  }
  // 本命只能有一位：設定新的本命時，自動取消其他藝人身上的本命標記
  if(tab==='artists' && data.oshiLevel==='本命'){
    const savedId = existing ? existing.id : data.id;
    state.artists.forEach(a=>{
      if(String(a.id)!==String(savedId) && artistOshiLevel(a)==='本命'){
        a.oshiLevel = '';
        a.isOshi = '否';
      }
    });
  }
  await saveKey('oshi-'+tab, state[tab]);
  // 藝人改名了：把行程／記帳／小卡／周邊／應援／紀錄／代言／雜誌／影視裡引用到舊名字的地方，全部一起換成新名字
  let renamed = false;
  if(oldArtistName && data.name && oldArtistName!==data.name){
    await renameArtistEverywhere(oldArtistName, data.name);
    renamed = true;
  }
  closeModal();
  render();
  showToast(renamed ? `已更新，並同步改名「${oldArtistName}」→「${data.name}」` : (existing? '已更新' : '已新增'));
}

/* 藝人改名時，把所有其他分頁裡引用到這個藝人名字的資料一併更新，
   不用使用者自己一筆一筆手動改。回傳前會一次把有變動的分頁存回去。 */
async function renameArtistEverywhere(oldName, newName){
  const savers = [];

  // 這些分頁的 artist 欄位是單一字串，直接整筆比對取代
  ['schedule','support','endorsement','magazine','movie','expense','photocards','merch'].forEach(t=>{
    let changed = false;
    (state[t]||[]).forEach(item=>{
      if(item.artist===oldName){ item.artist = newName; changed = true; }
    });
    if(changed) savers.push(saveKey('oshi-'+t, state[t]));
  });

  // 追星紀錄的 artist 可能同時填好幾位藝人（用頓號/逗號分隔），只替換其中命中的那一個名字
  let fanlogChanged = false;
  (state.fanlog||[]).forEach(f=>{
    if(!f.artist) return;
    const names = splitArtistNames(f.artist);
    if(names.includes(oldName)){
      f.artist = names.map(n=> n===oldName ? newName : n).join('、');
      fanlogChanged = true;
    }
  });
  if(fanlogChanged) savers.push(saveKey('oshi-fanlog', state.fanlog));

  // 小卡／周邊系列圖鑑：沒填「系列」的小卡/周邊，圖鑑會直接用藝人名稱當作分組 key，
  // 這種情況要把封面圖跟建立時間也搬到新的 key，不然圖鑑資料會跟著「消失」（其實是變成孤兒資料）
  let pcMetaChanged = false, merchMetaChanged = false;
  if(state.pcSeriesCovers && state.pcSeriesCovers[oldName]!==undefined){
    state.pcSeriesCovers[newName] = state.pcSeriesCovers[oldName];
    delete state.pcSeriesCovers[oldName];
    pcMetaChanged = true;
  }
  if(state.pcSeriesMeta && state.pcSeriesMeta[oldName]!==undefined){
    state.pcSeriesMeta[newName] = state.pcSeriesMeta[oldName];
    delete state.pcSeriesMeta[oldName];
    pcMetaChanged = true;
  }
  if(pcMetaChanged){
    savers.push(saveKey('oshi-pc-covers', state.pcSeriesCovers));
    savers.push(saveKey('oshi-pc-series-meta', state.pcSeriesMeta));
  }
  if(state.merchSeriesCovers && state.merchSeriesCovers[oldName]!==undefined){
    state.merchSeriesCovers[newName] = state.merchSeriesCovers[oldName];
    delete state.merchSeriesCovers[oldName];
    merchMetaChanged = true;
  }
  if(state.merchSeriesMeta && state.merchSeriesMeta[oldName]!==undefined){
    state.merchSeriesMeta[newName] = state.merchSeriesMeta[oldName];
    delete state.merchSeriesMeta[oldName];
    merchMetaChanged = true;
  }
  if(merchMetaChanged){
    savers.push(saveKey('oshi-merch-covers', state.merchSeriesCovers));
    savers.push(saveKey('oshi-merch-series-meta', state.merchSeriesMeta));
  }

  await Promise.all(savers);
}

async function savePhotocardForm(existing){
  const name = document.getElementById('pcName').value.trim();
  if(!name){ showToast('請填寫小卡名稱'); return; }

  const artistSelect = document.getElementById('pcArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__' || (state.artists.length===0 && artistSelect && artistSelect.value==='__new__')){
    const newName = document.getElementById('pcNewArtistName').value.trim();
    artist = newName;
    if(newName && !state.artists.find(a=>a.name===newName)){
      state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:newName });
      await saveKey('oshi-artists', state.artists);
    }
  }

  const categorySelect = document.getElementById('pcCategorySelect');
  let category = categorySelect.value;
  if(category==='__other__'){
    const newCat = document.getElementById('pcNewCategory').value.trim();
    category = newCat;
    if(newCat && !FIXED_PC_CATEGORIES.includes(newCat) && !state.customPcCategories.includes(newCat)){
      state.customPcCategories.push(newCat);
      await saveKey('oshi-pc-categories', state.customPcCategories);
    }
  }

  const data = {
    name,
    artist,
    series: document.getElementById('pcSeries').value.trim(),
    category,
    channel: document.getElementById('pcChannel').value.trim(),
    imageUrl: document.getElementById('pcImageUrl').value.trim(),
    createdAt: document.getElementById('pcCreatedAt').value || todayStr(),
    owned: document.getElementById('pcOwned').checked
  };

  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.photocards.push(data);
  }
  await saveKey('oshi-photocards', state.photocards);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

function duplicatePhotocard(id){
  const item = state.photocards.find(p=>String(p.id)===String(id));
  if(!item) return;
  const prefill = JSON.parse(JSON.stringify(item));
  delete prefill.id;

async function saveMerchForm(existing){
  const name = document.getElementById('mcName').value.trim();
  if(!name){ showToast('請填寫名稱'); return; }

  const artistSelect = document.getElementById('mcArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__' || (state.artists.length===0 && artistSelect && artistSelect.value==='__new__')){
    const newName = document.getElementById('mcNewArtistName').value.trim();
    artist = newName;
    if(newName && !state.artists.find(a=>a.name===newName)){
      state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:newName });
      await saveKey('oshi-artists', state.artists);
    }
  }

  const categorySelect = document.getElementById('mcCategorySelect');
  let category = categorySelect.value;
  if(category==='__other__'){
    const newCat = document.getElementById('mcNewCategory').value.trim();
    category = newCat;
    if(newCat && !FIXED_MERCH_CATEGORIES.includes(newCat) && !state.customMerchCategories.includes(newCat)){
      state.customMerchCategories.push(newCat);
      await saveKey('oshi-merch-categories', state.customMerchCategories);
    }
  }

  const data = {
    name,
    artist,
    series: document.getElementById('mcSeries').value.trim(),
    category,
    channel: document.getElementById('mcChannel').value.trim(),
    price: document.getElementById('mcPrice').value ? parseFloat(document.getElementById('mcPrice').value) : '',
    imageUrl: document.getElementById('mcImageUrl').value.trim(),
    createdAt: document.getElementById('mcCreatedAt').value || todayStr(),
    owned: document.getElementById('mcOwned').checked
  };

  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.merch.push(data);
  }
  await saveKey('oshi-merch', state.merch);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

function renderFlArtistChips(){
  const box = document.getElementById('flArtistChips');
  if(!box) return;
  box.innerHTML = flArtists.map(n=>
    `<span class="tag-chip">${esc(n)} <span class="tag-chip-x" data-remove="${esc(n)}">×</span></span>`
  ).join('');
  box.querySelectorAll('.tag-chip-x').forEach(x=>{
    x.addEventListener('click', ()=>{
      const name = x.dataset.remove;
      flArtists = flArtists.filter(n=>n!==name);
      const toggleBtn = document.querySelector(`#flArtistToggleGroup .artist-toggle-btn[data-name="${CSS.escape(name)}"]`);
      if(toggleBtn) toggleBtn.classList.remove('active');
      renderFlArtistChips();
    });
  });
}
function bindFlArtistTextInput(){
  const input = document.getElementById('flArtistText');
  if(!input) return;
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      const val = input.value.trim();
      if(val && !flArtists.includes(val)){
        flArtists.push(val);
        const toggleBtn = document.querySelector(`#flArtistToggleGroup .artist-toggle-btn[data-name="${CSS.escape(val)}"]`);
        if(toggleBtn) toggleBtn.classList.add('active');
        renderFlArtistChips();
      }
      input.value = '';
    }
  });
}

function renderFlImgList(){
  const list = document.getElementById('flImgList');

    </div>`).join('') + `</div>`;
  list.querySelectorAll('.fl-img-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{

  };

        origAmount: '',
        category: '其他追星支出',
        date,

        platform: '',
        deliveryStatus: '',
        paymentMethod: '',
        tags: [],
        note: '由追星紀錄自動建立',
        imageUrls: []
      };
      state.expense.push(newExpense);
      targetFanlog.expenseLinkedId = newExpense.id;
    }

  await saveKey('oshi-fanlog', state.fanlog);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

function duplicateFanlog(id){
  const item = state.fanlog.find(f=>String(f.id)===String(id));
  if(!item) return;
  const prefill = JSON.parse(JSON.stringify(item));
  delete prefill.id;
  delete prefill.expenseLinkedId; // 複製出來的新一筆不該指向原本那筆已連動的記帳紀錄
  openFanlogForm(null, prefill);
}

async function saveScheduleForm(existing){
  const title = document.getElementById('schTitle').value.trim();
  const isMultiDay = document.getElementById('schMultiDayBtn').classList.contains('active');

  let date, endDate = '';
  if(isMultiDay){
    date = document.getElementById('schStartDate').value.trim();
    endDate = document.getElementById('schEndDate').value.trim();
    if(!title || !date || !endDate){ showToast('請填寫必填欄位 *'); return; }
    if(endDate < date){ showToast('結束日期不能早於開始日期'); return; }
  } else {
    date = document.getElementById('schDate').value.trim();
    if(!title || !date){ showToast('請填寫必填欄位 *'); return; }
  }

  const categorySelect = document.getElementById('schCategorySelect');
  let category = categorySelect.value;
  if(category==='__other__'){
    const newCat = document.getElementById('schNewCategory').value.trim();
    category = newCat;
    if(newCat && !FIXED_SCHEDULE_CATEGORIES.includes(newCat) && !state.customScheduleCategories.includes(newCat)){
      state.customScheduleCategories.push(newCat);
      await saveKey('oshi-schedule-categories', state.customScheduleCategories);
    }
  }

  const artistSelect = document.getElementById('schArtistSelect');

  const data = {
    title,
    artist: artistSelect ? artistSelect.value : '',
    date,
    isMultiDay: !!isMultiDay,
    endDate: isMultiDay ? endDate : '',
    location: document.getElementById('schLocation').value.trim(),
    category,
    onSaleDate: document.getElementById('schOnSaleDate').value.trim(),
    checklist: schChecklist
  };

  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.schedule.push(data);
  }
  await saveKey('oshi-schedule', state.schedule);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

/* ================= Fanlog tab (年度／月份回顧) ================= */
let fanlogYearFilter = null;
let fanlogMonthFilter = null;
let fanlogArtistFilter = '__all__';
let fanlogYearsExpanded = false;

const FANLOG_YEAR_QUALIFY_COUNT = 8;
const FANLOG_MONTH_HAPPY_COUNT = 3;
const FANLOG_YEAR_ROW_MAX = 7;

function renderFanlogTab(){
  const meta = TAB_META.fanlog;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;

  const today = todayStr();
  const thisYear = today.slice(0,4);
  const dated = state.fanlog.filter(f=>f.date);

  if(dated.length===0 && !fanlogYearFilter){
    html += `<div class="empty"><div class="stamp-big maru">${meta.stamp}</div><div class="msg">${meta.empty}<br>點右下角的「＋」新增一筆吧</div></div>`;
    return html;
  }

  const years = [...new Set([thisYear, ...dated.map(f=>f.date.slice(0,4))])].sort((a,b)=> b.localeCompare(a));
  if(!fanlogYearFilter || !years.includes(fanlogYearFilter)){
    fanlogYearFilter = years.includes(thisYear) ? thisYear : years[0];
  }
  if(fanlogMonthFilter && !fanlogMonthFilter.startsWith(fanlogYearFilter)) fanlogMonthFilter = null;

  /* ---- 年度回顧：最多顯示 7 個年份，超過的用「更多」按鈕展開，固定 4 欄換行不橫向捲動 ---- */
  const showAllYears = fanlogYearsExpanded || years.length <= FANLOG_YEAR_ROW_MAX;
  const visibleYears = showAllYears ? years : years.slice(0, FANLOG_YEAR_ROW_MAX);
  let yearListHtml = visibleYears.map(y=>{
    const count = dated.filter(f=>f.date.slice(0,4)===y).length;
    const flipCount = dated.filter(f=>f.date.slice(0,4)===y && f.isFlipped).length;
    const isThisYear = y===thisYear;
    const qualify = !isThisYear && count>=FANLOG_YEAR_QUALIFY_COUNT;
    const active = y===fanlogYearFilter ? 'active' : '';
    return `<button class="cal-filter-btn year-filter-btn ${qualify?'qualify':''} ${active}" data-year="${y}">${y} · ${count}場${flipCount>0?` · 💌${flipCount}`:''}</button>`;
  }).join('');
  if(!showAllYears){
    yearListHtml += `<button class="year-review-more-btn" id="fanlogYearsMoreBtn">更多 +${years.length - FANLOG_YEAR_ROW_MAX}</button>`;
  }

  /* ---- 月份回顧（依所選年度） ---- */
  let monthListHtml = '';
  for(let m=1;m<=12;m++){
    const mm = String(m).padStart(2,'0');
    const ym = `${fanlogYearFilter}-${mm}`;
    const count = dated.filter(f=>f.date.startsWith(ym)).length;
    const flipCount = dated.filter(f=>f.date.startsWith(ym) && f.isFlipped).length;
    const happy = count>=FANLOG_MONTH_HAPPY_COUNT;
    const active = ym===fanlogMonthFilter ? 'active' : '';
    monthListHtml += `<div class="month-card ${happy?'happy':''} ${active}" data-ym="${ym}">
      <div class="month-num maru">${fanlogYearFilter}/${m}月</div>
      <div class="month-count">本月參加：${count}場</div>
      ${flipCount>0 ? `<div class="month-count">💌 被翻牌：${flipCount}次</div>` : ''}
    </div>`;
  }

  const reviewHtml = `
    <div class="review-block">
      <div class="review-head maru">📆 年度回顧</div>
      <div class="year-review-grid">${yearListHtml}</div>
    </div>
    <div class="review-block">
      <div class="review-head maru">🗓️ 月份回顧</div>
      <div class="month-grid">${monthListHtml}</div>
    </div>`;

  /* ---- 詳細內容（右側列表） ---- */
  let filtered = dated.filter(f=>f.date.startsWith(fanlogMonthFilter || fanlogYearFilter));

  const artistCountMap = {};
  filtered.forEach(f=> splitArtistNames(f.artist).forEach(n=>{ artistCountMap[n] = (artistCountMap[n]||0) + 1; }));
  const artistNames = Object.keys(artistCountMap).sort((a,b)=> artistCountMap[b]-artistCountMap[a] || a.localeCompare(b,'zh-Hant'));
  if(fanlogArtistFilter!=='__all__' && !artistNames.includes(fanlogArtistFilter)) fanlogArtistFilter = '__all__';

  if(fanlogArtistFilter!=='__all__') filtered = filtered.filter(f=>splitArtistNames(f.artist).includes(fanlogArtistFilter));

  /* 依日期排序：日期新到舊排列 */
  filtered.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const filterLabel = fanlogMonthFilter ? `${fanlogMonthFilter.replace('-','/')}` : `${fanlogYearFilter}`;
  let listHtml = `<div class="cal-daylist-title">
    ${filterLabel} 的活動
    ${fanlogMonthFilter ? `<button class="chip-clear" id="clearFanlogMonthFilter">清除月份篩選 ✕</button>` : ''}
  </div>`;

  if(artistNames.length>0){
    listHtml += `<div class="cal-filter-row">
      <button class="cal-filter-btn ${fanlogArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部藝人</button>
      ${artistNames.map(n=>`<button class="cal-filter-btn ${fanlogArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
    </div>`;
  }

  const fanlogPeriodTotal = filtered.reduce((sum,f)=> sum + fanlogSpentAmount(f), 0);
  if(fanlogPeriodTotal>0){
    listHtml += `<div class="mini-row" style="margin:10px 0 14px; background:var(--surface); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow-sm);">
      <span class="l" style="font-weight:700;">💰 這段期間花費</span>
      <span class="r" style="font-weight:700; color:var(--rose-deep);">NT$ ${fanlogPeriodTotal.toLocaleString()}</span>
    </div>`;
  }

  if(filtered.length===0){
    listHtml += `<div class="empty"><div class="stamp-big maru">${meta.stamp}</div><div class="msg">這段時間還沒有紀錄<br>點右下角的「＋」新增一筆吧</div></div>`;
  } else {
    listHtml += `<div class="list-grid">`;
    filtered.forEach(item=>{ listHtml += renderCard('fanlog', item); });
    listHtml += `</div>`;
  }

  html += `<div class="sched-layout">
    <div class="sched-cal-col">${reviewHtml}</div>
    <div class="sched-list-col">${listHtml}</div>
  </div>`;
  return html;
}
