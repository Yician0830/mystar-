      <button class="btn primary" id="saveProfBtn">儲存</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  let pendingDailyReminder = state.profile.dailyReminder!==false;
  document.getElementById('reminderToggle').querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingDailyReminder = btn.dataset.val==='on';
      document.getElementById('reminderToggle').querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });
  document.getElementById('goArtistsBtn').addEventListener('click', ()=>{
    closeModal();
    state.tab = 'artists';
    render();
  });
  document.getElementById('themeModeToggle').querySelectorAll('.seg-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      state.theme.mode = btn.dataset.mode;
      document.getElementById('themeModeToggle').querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('active', b===btn));
      applyTheme(state.theme);
      await saveKey('oshi-theme', state.theme);
    });
  });
  document.querySelectorAll('#themeSwatchGrid .theme-swatch').forEach(sw=>{
    sw.addEventListener('click', async ()=>{
      state.theme.accent = sw.dataset.accent;
      document.querySelectorAll('#themeSwatchGrid .theme-swatch').forEach(s=>s.classList.toggle('active', s===sw));
      document.getElementById('themeCustomColor').style.display = state.theme.accent==='custom' ? 'block' : 'none';
      applyTheme(state.theme);
      await saveKey('oshi-theme', state.theme);
    });
  });
  document.getElementById('themeCustomColor').addEventListener('input', async (e)=>{
    state.theme.customColor = e.target.value;
    state.theme.accent = 'custom';
    document.querySelectorAll('#themeSwatchGrid .theme-swatch').forEach(s=>s.classList.toggle('active', s.dataset.accent==='custom'));
    applyTheme(state.theme);
    await saveKey('oshi-theme', state.theme);
  });
  document.getElementById('exportBackupBtn').addEventListener('click', exportBackupData);
  document.getElementById('importBackupBtn').addEventListener('click', ()=>{
    document.getElementById('backupFileInput').click();
  });
  document.getElementById('backupFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    handleImportFile(file);
    e.target.value = '';
  });
  document.getElementById('saveProfBtn').addEventListener('click', async ()=>{
    state.profile.nickname = document.getElementById('profNickname').value.trim();
    state.profile.dailyReminder = pendingDailyReminder;
    await saveKey('oshi-profile', state.profile);
    closeModal();
    renderProfile();
    render();
    showToast('已更新個人資料');
  });
  const loginBtn = document.getElementById('googleLoginBtn');
  if(loginBtn){
    loginBtn.addEventListener('click', async ()=>{
      loginBtn.disabled = true;
      loginBtn.querySelector('span').textContent = '登入中...';
      await signInWithGoogle();
      if(document.body.contains(loginBtn)){
        loginBtn.disabled = false;
        loginBtn.querySelector('span').textContent = '使用 Google 帳號登入';
      }
    });
  }
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn){
    logoutBtn.addEventListener('click', signOutOfGoogle);
  }
  const pushToggleBtn = document.getElementById('pushToggleBtn');
  if(pushToggleBtn){
    pushToggleBtn.addEventListener('click', async ()=>{
      pushToggleBtn.disabled = true;
      const isPushOn = !!(state.profile.pushEnabled && state.profile.pushToken);
      if(isPushOn){ await disablePushNotifications(); } else { await enablePushNotifications(); }
      if(document.getElementById('overlay').classList.contains('show')) openProfileForm();
    });
  }
  showModal();
}

/* ================= 資料備份匯出／匯入 ================= */
const BACKUP_FIELD_MAP = [
  ['schedule','oshi-schedule'],
  ['expense','oshi-expense'],
  ['photocards','oshi-photocards'],
  ['support','oshi-support'],
  ['fanlog','oshi-fanlog'],
  ['artists','oshi-artists'],
  ['endorsement','oshi-endorsement'],
  ['magazine','oshi-magazine'],
  ['movie','oshi-movie'],
  ['profile','oshi-profile'],
  ['theme','oshi-theme'],
  ['customPcCategories','oshi-pc-categories'],
  ['customEndorsementCategories','oshi-endorsement-categories'],
  ['pcSeriesCovers','oshi-pc-covers'],
  ['pcSeriesMeta','oshi-pc-series-meta'],
  ['customFanlogCategories','oshi-fanlog-categories'],
  ['customScheduleCategories','oshi-schedule-categories'],
  ['customExpenseCategories','oshi-expense-categories'],
  ['merch','oshi-merch'],
  ['customMerchCategories','oshi-merch-categories'],
  ['merchSeriesCovers','oshi-merch-covers'],
  ['merchSeriesMeta','oshi-merch-series-meta']
];

function exportBackupData(){
  const backup = { version: 1, exportedAt: new Date().toISOString() };
  BACKUP_FIELD_MAP.forEach(([stateKey])=>{ backup[stateKey] = state[stateKey]; });

  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `推し手帳備份-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  lastBackupAt = backup.exportedAt;
  saveKey('oshi-last-backup', lastBackupAt);
  backupReminderDismissed = false;
  updateBackupReminderBanner();
  showToast('已匯出備份檔');
}

async function handleImportFile(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object'){ showToast('備份檔格式不正確'); return; }
    confirmImportBackup(data);
  }catch(err){
    showToast('讀取備份檔失敗，請確認檔案格式');
  }
}

function confirmImportBackup(data){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">確定要匯入這份備份嗎？</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">匯入後將覆蓋目前所有資料（行程、記帳、小卡、周邊、應援、紀錄、藝人等），此動作無法復原。建議先匯出目前資料備份再繼續。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn danger" id="importConfirmBtn">確定匯入並覆蓋</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('importConfirmBtn').addEventListener('click', async ()=>{
    await applyImportedBackup(data);
    closeModal();
    renderProfile();
    render();
    showToast('已匯入備份資料');
  });
  showModal();
}

async function applyImportedBackup(data){
  for(const [stateKey, storageKey] of BACKUP_FIELD_MAP){
    if(data[stateKey] !== undefined){
      state[stateKey] = data[stateKey];
      await saveKey(storageKey, state[stateKey]);
    }
  }
  updatePendingUploadsBanner();
  updateBackupReminderBanner();
}

function confirmDelete(tab, id){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">確定要刪除嗎？</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">刪除後資料將無法復原。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn danger" id="delConfirmBtn">確定刪除</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('delConfirmBtn').addEventListener('click', async ()=>{
    const item = state[tab].find(i=>String(i.id)===String(id));
    await deleteAllStorageImages(item);
    state[tab] = state[tab].filter(i=>String(i.id)!==String(id));
    await saveKey('oshi-'+tab, state[tab]);
    closeModal();
    render();
    updatePendingUploadsBanner();
    showToast('已刪除紀錄');
  });
  showModal();
}

function showModal(){ document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 2200);
}

/* 啟動應用程式 */
window.addEventListener('DOMContentLoaded', init);

/* 註冊 Service Worker，讓加到主畫面後能像 App 一樣開啟、離線也能打開已看過的頁面 */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
