function renderPhotocards(){
  const meta = TAB_META.photocards;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;
  if(state.photocards.length===0){
    html += `<div class="empty"><div class="big">${meta.emptyIcon}</div><div class="msg">${meta.empty}<br>點右下角的「＋」新增一張吧</div></div>`;
    return html;
  }

  const artistNames = [...new Set(state.photocards.map(p=>p.artist).filter(Boolean))];
  html += `<div class="cal-filter-row">
    <button class="cal-filter-btn ${pcArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部藝人</button>
    ${artistNames.map(n=>`<button class="cal-filter-btn ${pcArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
  </div>`;
  html += `<div class="cal-filter-row" style="margin-top:8px;">
    <button class="pc-owned-filter-btn cal-filter-btn ${pcOwnedFilter==='__all__'?'active':''}" data-owned="__all__">全部</button>
    <button class="pc-owned-filter-btn cal-filter-btn ${pcOwnedFilter==='owned'?'active':''}" data-owned="owned">✅ 已擁有</button>
    <button class="pc-owned-filter-btn cal-filter-btn ${pcOwnedFilter==='wish'?'active':''}" data-owned="wish">🌟 願望清單</button>
  </div>`;

  const groups = pcGroups();
  const filteredItems = Object.values(groups).flat();
  const totalCount = filteredItems.length;
  const totalOwned = filteredItems.filter(p=>p.owned).length;
  const totalPct = totalCount>0 ? Math.round(totalOwned/totalCount*100) : 0;
  html += `
  <div class="mini-row" style="margin:12px 0 16px; background:var(--surface); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow-sm);">
    <span class="l" style="font-weight:700;">🎴 收藏進度</span>
    <span class="r" style="font-weight:700; color:var(--rose-deep);">${totalOwned} / ${totalCount} 張（${totalPct}%）</span>
  </div>
  `;

  // 願望清單篩選：只影響下方顯示的圖鑑/清單，收藏進度總覽維持顯示全部
  let displayGroups = groups;
  if(pcOwnedFilter!=='__all__'){
    displayGroups = {};
    Object.keys(groups).forEach(key=>{
      const filtered = groups[key].filter(pc=> pcOwnedFilter==='owned' ? pc.owned : !pc.owned);
      if(filtered.length>0) displayGroups[key] = filtered;
    });
  }

  if(pcDrill && !displayGroups[pcDrill]) pcDrill = null;

  if(pcDrill){
    const items = displayGroups[pcDrill];
    const drillOwned = items.filter(i=>i.owned).length;
    html += `<div class="pc-back" data-back="1">← 返回圖鑑</div>`;
    html += `<div class="card-title" style="margin:0 2px 12px;font-size:16px;">${esc(pcDrill)} <span class="pc-count">(${drillOwned}/${items.length} 已收藏)</span></div>`;
    html += `<div class="pc-grid">`;
    items.forEach(pc=>{ html += renderPhotocardCard(pc); });
    html += `</div>`;
    return html;
  }

  if(Object.keys(displayGroups).length===0){
    html += `<div class="empty"><div class="big">🌟</div><div class="msg">目前沒有符合條件的小卡</div></div>`;
    return html;
  }

  const ordered = pcOrderedKeys(displayGroups);
  html += `<div class="pc-series-grid">`;
  ordered.forEach(key=>{
    const items = displayGroups[key];
    const ownedCount = items.filter(i=>i.owned).length;
    const pct = items.length>0 ? Math.round(ownedCount/items.length*100) : 0;
    const manualCover = state.pcSeriesCovers && state.pcSeriesCovers[key];
    const autoCover = items.find(i=>i.imageUrl);
    const coverUrl = manualCover || (autoCover ? autoCover.imageUrl : '');
    html += `
    <div class="pc-series-card-wrap">
      <button class="pc-series-card" data-series="${esc(key)}">
        ${coverUrl ? `<img class="pc-series-cover" src="${esc(coverUrl)}" onerror="this.outerHTML='<div class=&quot;pc-series-cover ph&quot;>🎴</div>'">`
                : `<div class="pc-series-cover ph">🎴</div>`}
        <div class="pc-series-body">
          <div class="pc-series-name">${esc(key)}</div>
          <div class="pc-series-count">已收藏 ${ownedCount}/${items.length} 張</div>
          <div class="pc-series-progress-track"><div class="pc-series-progress-fill" style="width:${pct}%;"></div></div>
        </div>
      </button>
      <button class="pc-series-edit-cover" data-series="${esc(key)}" title="編輯封面圖片網址">✎</button>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ================= Artists ================= */
function renderArtists(){
  const meta = TAB_META.artists;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;
  if(state.artists.length===0){
    html += `<div class="empty"><div class="big">${meta.emptyIcon}</div><div class="msg">${meta.empty}<br>點右下角的「＋」新增藝人吧</div></div>`;
    return html;
  }
  html += `<div class="list-grid">`;
  const OSHI_ORDER = {'本命':0, '二推':1, '三推':2, '均愛(箱推)':3, '':4};
  const sortedArtists = [...state.artists].sort((a,b)=> (OSHI_ORDER[artistOshiLevel(a)] ?? 4) - (OSHI_ORDER[artistOshiLevel(b)] ?? 4));
  sortedArtists.forEach(a=>{
    html += `
    <div class="card artist-card" data-id="${a.id}" style="cursor:pointer;">
      <div class="card-row">
        <div style="display:flex;gap:12px;">
          ${a.photoUrl
            ? `<img src="${esc(a.photoUrl)}" onerror="this.style.display='none'" style="width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
            : `<div style="width:52px;height:52px;border-radius:50%;background:var(--sakura-pale);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">✨</div>`}
          <div>
            <div class="card-title">${esc(a.name)} ${artistOshiLevel(a)==='本命' ? '<span style="color:var(--rose-deep)">♡</span>':''}</div>
            <div class="card-meta">${esc(a.group||'')}</div>
            <div>
              ${oshiLevelTag(artistOshiLevel(a))}
              ${a.birthday ? `<span class="tag">🎂 ${fmtDate(a.birthday)}</span>`:''}
              ${a.debutDate ? `<span class="tag matcha">出道 ${fmtDate(a.debutDate)}</span>`:''}
              ${a.fanSince ? `<span class="tag rose">入坑 ${fanDurationText(a.fanSince)}</span>`:''}
            </div>
          </div>
        </div>
        <div class="card-actions">
          <button class="icon-btn edit" data-tab="artists" data-id="${a.id}">✎</button>
          <button class="icon-btn del" data-tab="artists" data-id="${a.id}">🗑</button>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function bindArtistCardActions(){
  document.querySelectorAll('.artist-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.icon-btn')) return;
      openArtistDetail(card.dataset.id);
    });
  });
}

function openArtistDetail(id){
  const a = state.artists.find(x=>String(x.id)===String(id));
  if(!a) return;

  const totalSpent = state.expense.filter(e=>e.artist===a.name).reduce((sum,e)=> sum + expenseAmount(e), 0);
  const pcOwnedCount = state.photocards.filter(p=>p.artist===a.name && p.owned).length;
  const pcTotalCount = state.photocards.filter(p=>p.artist===a.name).length;
  const fanlogCount = state.fanlog.filter(f=>f.artist===a.name).length;
  const supportCount = state.support.filter(s=>s.artist===a.name).length;

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;">
      ${a.photoUrl
        ? `<img src="${esc(a.photoUrl)}" onerror="this.style.display='none'" style="width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;">`
        : `<div style="width:64px;height:64px;border-radius:50%;background:var(--sakura-pale);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">✨</div>`}
      <div>
        <h3 class="maru" style="margin:0;">${esc(a.name)} ${artistOshiLevel(a)==='本命' ? '<span style="color:var(--rose-deep)">♡</span>':''}</h3>
        <div class="card-meta">${esc(a.group||'')}</div>
      </div>
    </div>
    <div style="margin-bottom:10px;">
      ${oshiLevelTag(artistOshiLevel(a))}
      ${a.birthday ? `<span class="tag">🎂 ${fmtDate(a.birthday)}</span>`:''}
      ${a.debutDate ? `<span class="tag matcha">出道 ${fmtDate(a.debutDate)}</span>`:''}
      ${a.fanSince ? `<span class="tag rose">入坑 ${fanDurationText(a.fanSince)}（${fmtDate(a.fanSince)}）</span>`:''}
    </div>
    ${a.bio ? `<div class="card-meta" style="white-space:pre-wrap;line-height:1.7;">${esc(a.bio)}</div>` : `<div class="card-meta" style="color:var(--ink-faint);">尚未填寫簡介</div>`}
    <div class="stat-grid" style="margin-top:14px;">
      <div class="stat-card"><div class="num">NT$ ${totalSpent.toLocaleString()}</div><div class="lbl">累積花費</div></div>
      <div class="stat-card"><div class="num">${pcOwnedCount}/${pcTotalCount}</div><div class="lbl">小卡收藏</div></div>
      <div class="stat-card"><div class="num">${fanlogCount}</div><div class="lbl">追星紀錄</div></div>
    </div>
    ${supportCount>0 ? `<div class="card-meta" style="margin-top:8px;">📣 應援紀錄：${supportCount} 筆</div>` : ''}
    <div class="modal-actions" style="margin-top:18px;">
      <button class="btn ghost" id="cancelBtn">關閉</button>
      <button class="btn primary" id="artistDetailEditBtn">編輯</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('artistDetailEditBtn').addEventListener('click', ()=>{
    closeModal();
    openForm('artists', a.id);
  });
  showModal();
}

/* ================= Support wall (應援牆) ================= */
let supportArtistFilter = '__all__';
let supportYearFilter = '__all__';
let supImgUrls = [];
let endorsementArtistFilter = '__all__';
let magazineArtistFilter = '__all__';
let movieArtistFilter = '__all__';
let mediaSubTab = 'endorsement';
let mediaSearchQuery = '';

function renderSupportTab(){
  const meta = TAB_META.support;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;
  if(state.support.length===0){
    html += `<div class="empty"><div class="big">${meta.emptyIcon}</div><div class="msg">${meta.empty}<br>點右下角的「＋」放上你的應援吧</div></div>`;
    return html;
  }

  const artistNames = [...new Set(state.support.map(s=>s.artist).filter(Boolean))];
  if(artistNames.length>0){
    html += `<div class="cal-filter-row">
      <button class="cal-filter-btn ${supportArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部藝人</button>
      ${artistNames.map(n=>`<button class="cal-filter-btn ${supportArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
    </div>`;
  }
  if(supportArtistFilter!=='__all__' && !artistNames.includes(supportArtistFilter)) supportArtistFilter = '__all__';

  const years = [...new Set(state.support.map(s=> s.date ? s.date.slice(0,4) : null).filter(Boolean))].sort((a,b)=> b.localeCompare(a));
  if(supportYearFilter!=='__all__' && !years.includes(supportYearFilter)) supportYearFilter = '__all__';
  if(years.length>0){
    html += `<div class="cal-filter-row" style="margin-top:8px;">
      <button class="cal-filter-btn year-filter-btn ${supportYearFilter==='__all__'?'active':''}" data-year="__all__">全部年份</button>
      ${years.map(y=>`<button class="cal-filter-btn year-filter-btn ${supportYearFilter===y?'active':''}" data-year="${y}">${y}</button>`).join('')}
    </div>`;
  }

  const today = todayStr();
  const effectiveEnd = s=> (s.isMultiDay && s.endDate) ? s.endDate : s.date;
  const bySupportArtist = s=> supportArtistFilter==='__all__' || s.artist===supportArtistFilter;
  const bySupportYear = s=> supportYearFilter==='__all__' || (s.date && s.date.startsWith(supportYearFilter));
  const upcoming = state.support.filter(s=> bySupportArtist(s) && bySupportYear(s) && effectiveEnd(s) >= today).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const past = state.support.filter(s=> bySupportArtist(s) && bySupportYear(s) && effectiveEnd(s) < today).sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const paidInScope = state.support.filter(s=> bySupportArtist(s) && bySupportYear(s) && s.isPaid);
  const totalSpent = paidInScope.reduce((sum,s)=> sum + (parseFloat(s.paidAmount)||0), 0);
  const linkedCount = paidInScope.filter(s=>s.expenseLinkedId).length;
  html += `
  <div class="mini-row" style="margin:12px 0 16px; background:var(--surface); border-radius:14px; padding:12px 16px; box-shadow:var(--shadow-sm);">
    <span class="l" style="font-weight:700;">💰 應援花費總計</span>
    <span class="r" style="font-weight:700; color:var(--rose-deep);">NT$ ${totalSpent.toLocaleString()}</span>
  </div>
  ${paidInScope.length>0 ? `<div style="font-size:11px;color:var(--ink-soft);margin:-10px 2px 16px;">共 ${paidInScope.length} 筆付費應援，其中 ${linkedCount} 筆已連動記帳本</div>` : ''}
  `;

  const renderSupportCard = (s, isEnded)=>{
    const dateLabel = (s.isMultiDay && s.endDate && s.endDate!==s.date)
      ? `${fmtDate(s.date)} ～ ${fmtDate(s.endDate)}`
      : fmtDate(s.date);
    const imgs = (s.imageUrls && s.imageUrls.length) ? s.imageUrls : (s.imageUrl ? [s.imageUrl] : []);
    const cover = imgs[0];
    return `
    <div class="card support-card">
      <div style="position:relative;">
        ${cover
          ? `<img class="support-cover" src="${esc(cover)}" onerror="this.outerHTML='<div class=&quot;support-cover ph&quot;>📣</div>'">`
          : `<div class="support-cover ph">📣</div>`}
        ${imgs.length>1 ? `<span class="tag" style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.55);color:#fff;">📷 ${imgs.length}</span>` : ''}
      </div>
      <div class="support-body">
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-meta">${[s.artist, s.activity, s.location].filter(Boolean).join(' · ')}</div>
        <div>
          ${dateLabel ? `<span class="tag">${dateLabel}</span>` : ''}
          ${isEnded ? `<span class="tag wisteria">已結束活動</span>` : ''}
          ${s.isPaid ? `<span class="tag gold">💰 付費應援${s.paidAmount?('　NT$'+Number(s.paidAmount).toLocaleString()):''}</span>` : ''}
          ${s.expenseLinkedId ? `<span class="tag matcha">🔗 已連動記帳本</span>` : ''}
        </div>
        ${s.condition ? `<div class="card-meta" style="margin-top:6px;">🎟️ 領取條件：${esc(s.condition)}</div>` : ''}
        ${s.content ? `<div class="card-meta" style="margin-top:4px;">${esc(s.content)}</div>` : ''}
        ${s.articleUrl ? `<div style="margin-top:6px;"><a href="${esc(s.articleUrl)}" target="_blank" rel="noopener" class="tag" style="text-decoration:none;">🔗 查看文章</a></div>` : ''}
        <div class="card-actions" style="justify-content:flex-end;margin-top:8px;">
          <button class="icon-btn edit" data-tab="support" data-id="${s.id}">✎</button>
          <button class="icon-btn del" data-tab="support" data-id="${s.id}">🗑</button>
        </div>
      </div>
    </div>`;
  };

  if(upcoming.length>0){
    html += `<div class="home-block">
      <div class="block-head"><h3>🎪 即將開始</h3></div>
      <div class="support-grid">${upcoming.map(s=>renderSupportCard(s,false)).join('')}</div>
    </div>`;
  }
  if(past.length>0){
    html += `<div class="home-block">
      <div class="block-head"><h3>✅ 已結束應援</h3></div>
      <div class="support-grid">${past.map(s=>renderSupportCard(s,true)).join('')}</div>
    </div>`;
  }
  return html;
}

function bindSupportFilterActions(){
  document.querySelectorAll('.cal-filter-btn[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{
      supportArtistFilter = b.dataset.filter;
      render();
    });
  });
  document.querySelectorAll('.cal-filter-btn[data-year]').forEach(b=>{
    b.addEventListener('click', ()=>{
      supportYearFilter = b.dataset.year;
      render();
    });
  });
}

function openSupportForm(id){
  const existing = id ? state.support.find(s=>String(s.id)===String(id)) : null;
  supImgUrls = existing ? [...(existing.imageUrls && existing.imageUrls.length ? existing.imageUrls : (existing.imageUrl ? [existing.imageUrl] : []))] : [];
  const artistOptions = [...new Set([
    ...state.artists.map(a=>a.name),
    ...state.support.map(s=>s.artist).filter(Boolean)
  ])];
  const curArtist = existing ? (existing.artist||'') : '';

  let artistFieldHtml = '';
  if(artistOptions.length===0){
    artistFieldHtml = `
      <select id="supArtistSelect"><option value="">尚未新增藝人</option><option value="__new__">＋ 直接輸入藝人名稱</option></select>
      <input type="text" id="supNewArtistName" placeholder="輸入藝人名稱" style="margin-top:8px;" value="${esc(curArtist)}">`;
  } else {
    artistFieldHtml = `
      <select id="supArtistSelect">
        <option value="">請選擇</option>
        ${artistOptions.map(n=>`<option value="${esc(n)}" ${curArtist===n?'selected':''}>${esc(n)}</option>`).join('')}
        <option value="__new__" ${curArtist && !artistOptions.includes(curArtist)?'selected':''}>＋ 新增藝人</option>
      </select>
      <input type="text" id="supNewArtistName" placeholder="輸入新藝人名稱" style="margin-top:8px; display:${curArtist && !artistOptions.includes(curArtist)?'block':'none'};" value="${curArtist && !artistOptions.includes(curArtist)?esc(curArtist):''}">`;
  }

  const isMultiDay = existing ? !!existing.isMultiDay : false;
  const curDate = existing ? (existing.date||'') : todayStr();
  const curEndDate = existing ? (existing.endDate||'') : '';
  const isPaid = existing ? !!existing.isPaid : false;

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">${existing? '編輯' : '新增'} · 應援</h3>
    <div class="field"><label>應援名稱 *</label><input type="text" id="supTitle" value="${existing?esc(existing.title):''}" placeholder="例：生日應援燈箱 / 週年廣告"></div>
    <div class="field"><label>相關藝人</label>${artistFieldHtml}</div>
    <div class="field"><label>發放活動</label><input type="text" id="supActivity" value="${existing?esc(existing.activity||''):''}" placeholder="例：815小巨蛋演唱會"></div>
    <div class="field">
      <label>應援日期</label>
      <div class="seg-toggle">
        <button type="button" class="seg-btn ${!isMultiDay?'active':''}" id="supSingleDayBtn">單日活動</button>
        <button type="button" class="seg-btn ${isMultiDay?'active':''}" id="supMultiDayBtn">多天活動</button>
      </div>
    </div>
    <div class="field" id="supSingleDateField" style="display:${isMultiDay?'none':'block'};">
      <label>日期</label><input type="date" id="supDate" value="${esc(curDate)}">
    </div>
    <div id="supMultiDateFields" style="display:${isMultiDay?'block':'none'};">
      <div class="field"><label>開始日期</label><input type="date" id="supStartDate" value="${esc(curDate)}"></div>
      <div class="field"><label>結束日期</label><input type="date" id="supEndDate" value="${esc(curEndDate)}"></div>
    </div>
    <div class="field"><label>地點</label><input type="text" id="supLocation" value="${existing?esc(existing.location||''):''}" placeholder="例：台北車站、地鐵廣告..."></div>
    <div class="field"><label>領取條件</label><input type="text" id="supCondition" value="${existing?esc(existing.condition||''):''}" placeholder="例：憑當日票根、消費滿額..."></div>
    <div class="field"><label>文章連結</label><input type="url" id="supArticleUrl" value="${existing?esc(existing.articleUrl||''):''}" placeholder="貼上相關文章／貼文連結"></div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="supIsPaid" style="width:16px;height:16px;accent-color:var(--rose-deep);" ${isPaid?'checked':''}>
        付費應援
      </label>
    </div>
    <div id="supPaidFields" style="display:${isPaid?'block':'none'};">
      <div class="field"><label>花費金額</label><input type="number" id="supPaidAmount" value="${existing?esc(existing.paidAmount||''):''}" placeholder="0"></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="supAddToExpense" style="width:16px;height:16px;accent-color:var(--rose-deep);" checked>
          同時加入記帳本
        </label>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;">會在記帳本自動建立/更新一筆對應花費（分類：應援物/飯製商品）</div>
      </div>
    </div>
    <div class="field"><label>展示圖片（最多 6 張，可從手機/電腦上傳照片，或貼上圖片連結）</label>
      <div id="supImgList"></div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <button type="button" class="btn ghost" id="supImgUploadBtn" style="flex:0 0 auto;padding:10px 14px;">📷 上傳照片</button>
        <input type="file" id="supImgFileInput" accept="image/*" multiple style="display:none;">
      </div>
      <div style="display:flex; gap:8px; margin-top:6px;">
        <input type="url" id="supImgNewUrl" placeholder="或貼上圖片連結" style="flex:1;">
        <button type="button" class="btn ghost" id="supImgAddBtn" style="flex:0 0 auto;padding:10px 14px;">＋新增</button>
      </div>
    </div>
    <div class="field"><label>發放內容</label><textarea id="supContent" placeholder="發放的物品、數量、大家的反應...">${existing?esc(existing.content||''):''}</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  `;

  const artistSelect = document.getElementById('supArtistSelect');
  const newArtistInput = document.getElementById('supNewArtistName');
  artistSelect.addEventListener('change', ()=>{
    newArtistInput.style.display = artistSelect.value==='__new__' ? 'block' : 'none';
  });

  const paidCheckbox = document.getElementById('supIsPaid');
  const paidFields = document.getElementById('supPaidFields');
  paidCheckbox.addEventListener('change', ()=>{
    paidFields.style.display = paidCheckbox.checked ? 'block' : 'none';
  });

  const singleBtn = document.getElementById('supSingleDayBtn');
  const multiBtn = document.getElementById('supMultiDayBtn');
  const singleField = document.getElementById('supSingleDateField');
  const multiFields = document.getElementById('supMultiDateFields');
  singleBtn.addEventListener('click', ()=>{
    singleBtn.classList.add('active'); multiBtn.classList.remove('active');
    singleField.style.display = 'block'; multiFields.style.display = 'none';
  });
  multiBtn.addEventListener('click', ()=>{
    multiBtn.classList.add('active'); singleBtn.classList.remove('active');
    multiFields.style.display = 'block'; singleField.style.display = 'none';
  });

  renderSupImgList();
  document.getElementById('supImgAddBtn').addEventListener('click', addSupImgUrl);
  document.getElementById('supImgUploadBtn').addEventListener('click', ()=> document.getElementById('supImgFileInput').click());
  document.getElementById('supImgFileInput').addEventListener('change', async (e)=>{
    await addImageFilesToList(e.target.files, ()=>supImgUrls, (arr)=>{ supImgUrls = arr; }, 6, renderSupImgList);
    e.target.value = '';
  });

  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', ()=> saveSupportForm(existing));
  showModal();
}

function renderSupImgList(){
  const list = document.getElementById('supImgList');
  if(!list) return;
  if(supImgUrls.length===0){
    list.innerHTML = `<div style="font-size:12px;color:var(--ink-faint);">尚未加入圖片</div>`;
    return;
  }
  list.innerHTML = `<div style="display:flex; gap:8px; flex-wrap:wrap;">` + supImgUrls.map((url,idx)=>`
    <div style="position:relative; width:64px; height:64px;">
      <img src="${esc(url)}" onerror="this.src='';this.style.background='var(--sakura-pale)'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;box-shadow:var(--shadow-sm);">
      <button type="button" data-idx="${idx}" class="sup-img-remove" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#B54545;color:#fff;font-size:12px;cursor:pointer;">×</button>
    </div>`).join('') + `</div>`;
  list.querySelectorAll('.sup-img-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      supImgUrls.splice(parseInt(btn.dataset.idx),1);
      renderSupImgList();
    });
  });
}
function addSupImgUrl(){
  const input = document.getElementById('supImgNewUrl');
  const url = input.value.trim();
  if(!url) return;
  if(supImgUrls.length>=6){ showToast('最多只能加入 6 張圖片'); return; }
  supImgUrls.push(url);
  input.value = '';
  renderSupImgList();
}

async function saveSupportForm(existing){
  const title = document.getElementById('supTitle').value.trim();
  if(!title){ showToast('請填寫應援名稱'); return; }

  const artistSelect = document.getElementById('supArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__' || (artistSelect && artistSelect.options.length && artistSelect.value==='__new__')){
    const newName = document.getElementById('supNewArtistName').value.trim();
    artist = newName;
  }
  if(artist && !state.artists.find(a=>a.name===artist)){
    state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:artist });
    await saveKey('oshi-artists', state.artists);
  }

  const isMultiDay = document.getElementById('supMultiDayBtn').classList.contains('active');
  let date, endDate = '';
  if(isMultiDay){
    date = document.getElementById('supStartDate').value.trim();
    endDate = document.getElementById('supEndDate').value.trim();
    if(endDate && date && endDate < date){ showToast('結束日期不能早於開始日期'); return; }
  } else {
    date = document.getElementById('supDate').value.trim();
  }

  const isPaid = document.getElementById('supIsPaid').checked;
  const paidAmount = document.getElementById('supPaidAmount') ? document.getElementById('supPaidAmount').value.trim() : '';
  const addToExpense = isPaid && document.getElementById('supAddToExpense') && document.getElementById('supAddToExpense').checked;

  const data = {
    title,
    artist,
    activity: document.getElementById('supActivity').value.trim(),
    date,
    isMultiDay: !!isMultiDay,
    endDate: isMultiDay ? endDate : '',
    location: document.getElementById('supLocation').value.trim(),
    condition: document.getElementById('supCondition').value.trim(),
    articleUrl: document.getElementById('supArticleUrl').value.trim(),
    isPaid,
    paidAmount,
    imageUrls: [...supImgUrls],
    content: document.getElementById('supContent').value.trim()
  };

  let targetSupport;
  if(existing){
    Object.assign(existing, data);
    targetSupport = existing;
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.support.push(data);
    targetSupport = data;
  }

  // 應援 ↔ 記帳本 串連：勾選「同時加入記帳本」時，自動建立/更新對應的花費紀錄
  if(addToExpense){
    const amt = parseFloat(paidAmount) || 0;
    let linkedExpense = targetSupport.expenseLinkedId ? state.expense.find(e=>String(e.id)===String(targetSupport.expenseLinkedId)) : null;
    if(linkedExpense){
      linkedExpense.name = title;
      linkedExpense.artist = artist;
      linkedExpense.unitPrice = amt;
      linkedExpense.date = date;
    } else {
      const newExpense = {
        id: 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000)+'e',
        recordType: 'expense',
        name: title,
        artist,
        unitPrice: amt,
        quantity: '1',
        shipping: '',
        origCurrency: 'TWD',
        origAmount: '',
        category: '應援物/飯製商品',
        date,
        platform: '',
        deliveryStatus: '',
        paymentMethod: '',
        tags: [],
        note: '由應援牆自動建立',
        imageUrls: []
      };
      state.expense.push(newExpense);
      targetSupport.expenseLinkedId = newExpense.id;
    }
    await saveKey('oshi-expense', state.expense);
  }

  await saveKey('oshi-support', state.support);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

function renderMediaTab(){

  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;
  html += `<div class="cal-filter-row">
    <button class="cal-filter-btn media-subtab-btn ${mediaSubTab==='endorsement'?'active':''}" data-sub="endorsement">🤝 代言</button>

  </div>
  <div class="field" style="margin:12px 0;">
    <input type="text" id="mediaSearchInput" placeholder="🔍 搜尋名稱、藝人、類型..." value="${esc(mediaSearchQuery)}" style="width:100%;box-sizing:border-box;">
  </div>`;
  if(mediaSubTab==='magazine') html += renderMagazineBody();
  else if(mediaSubTab==='movie') html += renderMovieBody();
  else html += renderEndorsementBody();
  return html;
}

function mediaMatchesSearch(item, extraFields){
  const q = mediaSearchQuery.trim().toLowerCase();
  if(!q) return true;
  const hay = [item.title, item.artist, item.category, ...(extraFields||[])].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

async function saveEndorsementForm(existing){
  const title = document.getElementById('endTitle').value.trim();
  if(!title){ showToast('請填寫代言/合作名稱'); return; }

  const artistSelect = document.getElementById('endArtistSelect');
  let artist = artistSelect ? artistSelect.value : '';
  if(artist==='__new__'){
    artist = document.getElementById('endNewArtistName').value.trim();
  }
  if(artist && !state.artists.find(a=>a.name===artist)){
    state.artists.push({ id:'id_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:artist });
    await saveKey('oshi-artists', state.artists);
  }

  const categorySelect = document.getElementById('endCategorySelect');
  let category = categorySelect.value;
  if(category==='__other__'){
    const newCat = document.getElementById('endNewCategory').value.trim();
    category = newCat;
    if(newCat && !FIXED_ENDORSEMENT_CATEGORIES.includes(newCat) && !state.customEndorsementCategories.includes(newCat)){
      state.customEndorsementCategories.push(newCat);
      await saveKey('oshi-endorsement-categories', state.customEndorsementCategories);
    }
  }

  const startDate = document.getElementById('endStartDate').value.trim();

  const data = {
    title,
    artist,
    category,
    startDate,
    imageUrl: document.getElementById('endImageUrl').value.trim()
  };

  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state.endorsement.push(data);
  }
  await saveKey('oshi-endorsement', state.endorsement);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

async function saveMovieForm(existing){

    endDate,

    imageUrl: document.getElementById('movImageUrl').value.trim(),

  };

    state.movie.push(data);
  }
  await saveKey('oshi-movie', state.movie);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

function openForm(tab, id, prefill){
  editingId = id;
  const schema = SCHEMAS[tab];
  const existing = id ? state[tab].find(i=>String(i.id)===String(id)) : null;
  const meta = TAB_META[tab];

  let fieldsHtml = '';
  schema.forEach(f=>{
    const val = existing ? (existing[f.key]||'') : (prefill && prefill[f.key]!==undefined ? prefill[f.key] : '');
    fieldsHtml += `<div class="field"><label>${f.label}${f.required?' *':''}</label>`;
    if(f.type==='textarea'){
      fieldsHtml += `<textarea data-field="${f.key}" placeholder="${f.ph||''}">${esc(val)}</textarea>`;
    } else if(f.type==='select'){
      fieldsHtml += `<select data-field="${f.key}">`;
      fieldsHtml += `<option value="">請選擇</option>`;
      f.options.forEach(op=>{
        fieldsHtml += `<option value="${esc(op)}" ${val===op?'selected':''}>${esc(op)}</option>`;
      });
      fieldsHtml += `</select>`;
    } else {
      fieldsHtml += `<input type="${f.type}" data-field="${f.key}" value="${esc(val)}" placeholder="${f.ph||''}">`;
    }
    fieldsHtml += `</div>`;
  });

  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">${existing? '編輯' : '新增'} · ${meta.label}</h3>
    <div id="formFields">${fieldsHtml}</div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', ()=> saveForm(tab, schema, existing));
  showModal();
}

async function saveForm(tab, schema, existing){
  const data = {};
  let missingRequired = false;
  schema.forEach(f=>{
    const el = document.querySelector(`[data-field="${f.key}"]`);
    const val = el ? el.value.trim() : '';
    if(f.required && !val) missingRequired = true;
    data[f.key] = val;
  });
  if(missingRequired){
    showToast('請填寫必填欄位 *');
    return;
  }
  if(existing){
    Object.assign(existing, data);
  } else {
    data.id = 'id_'+Date.now()+'_'+Math.floor(Math.random()*1000);
    state[tab].push(data);
  }
  // 本命只能有一位：設定新的本命時，自動取消其他藝人身上的本命標記
  if(tab==='artists' && data.oshiLevel==='本命'){
    const savedId = existing ? existing.id : data.id;
    state.artists.forEach(a=>{
      if(String(a.id)!==String(savedId) && artistOshiLevel(a)==='本命'){
        a.oshiLevel = '';
        a.isOshi = '否';
      }
    });
  }
  await saveKey('oshi-'+tab, state[tab]);
  closeModal();
  render();
  showToast(existing? '已更新' : '已新增');
}

async function saveScheduleForm(existing){

      await saveKey('oshi-schedule-categories', state.customScheduleCategories);

    artist: artistSelect ? artistSelect.value : '',

    endDate: isMultiDay ? endDate : '',

/* ================= Fanlog tab (年度／月份回顧) ================= */
let fanlogYearFilter = null;
let fanlogMonthFilter = null;
let fanlogArtistFilter = '__all__';

const FANLOG_YEAR_QUALIFY_COUNT = 8;
const FANLOG_MONTH_HAPPY_COUNT = 3;

function renderFanlogTab(){
  const meta = TAB_META.fanlog;
  let html = `<div class="section-title"><div class="stamp maru">${meta.stamp}</div>${meta.label}</div>`;

  const today = todayStr();
  const thisYear = today.slice(0,4);
  const dated = state.fanlog.filter(f=>f.date);

  if(dated.length===0 && !fanlogYearFilter){
    html += `<div class="empty"><div class="big">${meta.emptyIcon}</div><div class="msg">${meta.empty}<br>點右下角的「＋」新增一筆吧</div></div>`;
    return html;
  }

  const years = [...new Set([thisYear, ...dated.map(f=>f.date.slice(0,4))])].sort((a,b)=> b.localeCompare(a));
  if(!fanlogYearFilter || !years.includes(fanlogYearFilter)){
    fanlogYearFilter = years.includes(thisYear) ? thisYear : years[0];
  }
  if(fanlogMonthFilter && !fanlogMonthFilter.startsWith(fanlogYearFilter)) fanlogMonthFilter = null;

  /* ---- 年度回顧 ---- */
  let yearListHtml = years.map(y=>{
    const count = dated.filter(f=>f.date.slice(0,4)===y).length;
    const isThisYear = y===thisYear;
    const qualify = !isThisYear && count>=FANLOG_YEAR_QUALIFY_COUNT;
    const active = y===fanlogYearFilter ? 'active' : '';
    return `<button class="cal-filter-btn year-filter-btn ${qualify?'qualify':''} ${active}" data-year="${y}">${y} · ${count}場</button>`;
  }).join('');

  /* ---- 月份回顧（依所選年度） ---- */
  let monthListHtml = '';
  for(let m=1;m<=12;m++){
    const mm = String(m).padStart(2,'0');
    const ym = `${fanlogYearFilter}-${mm}`;
    const count = dated.filter(f=>f.date.startsWith(ym)).length;
    const happy = count>=FANLOG_MONTH_HAPPY_COUNT;
    const active = ym===fanlogMonthFilter ? 'active' : '';
    monthListHtml += `<div class="month-card ${happy?'happy':''} ${active}" data-ym="${ym}">
      <div class="month-num maru">${fanlogYearFilter}/${m}月</div>
      <div class="month-count">本月參加：${count}場</div>
    </div>`;
  }

  const reviewHtml = `
    <div class="review-block">
      <div class="review-head maru">📆 年度回顧</div>
      <div class="cal-filter-row" style="margin:0 2px;">${yearListHtml}</div>
    </div>
    <div class="review-block">
      <div class="review-head maru">🗓️ 月份回顧</div>
      <div class="month-grid">${monthListHtml}</div>
    </div>`;

  /* ---- 詳細內容（右側列表） ---- */
  let filtered = dated.filter(f=>f.date.startsWith(fanlogMonthFilter || fanlogYearFilter));

  const artistNames = [...new Set(filtered.map(f=>f.artist).filter(Boolean))];
  if(fanlogArtistFilter!=='__all__' && !artistNames.includes(fanlogArtistFilter)) fanlogArtistFilter = '__all__';

  if(fanlogArtistFilter!=='__all__') filtered = filtered.filter(f=>f.artist===fanlogArtistFilter);

  /* 依日期排序：日期新到舊排列 */
  filtered.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const filterLabel = fanlogMonthFilter ? `${fanlogMonthFilter.replace('-','/')}` : `${fanlogYearFilter}`;
  let listHtml = `<div class="cal-daylist-title">
    ${filterLabel} 的活動
    ${fanlogMonthFilter ? `<button class="chip-clear" id="clearFanlogMonthFilter">清除月份篩選 ✕</button>` : ''}
  </div>`;

  if(artistNames.length>0){
    listHtml += `<div class="cal-filter-row">
      <button class="cal-filter-btn ${fanlogArtistFilter==='__all__'?'active':''}" data-filter="__all__">全部藝人</button>
      ${artistNames.map(n=>`<button class="cal-filter-btn ${fanlogArtistFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}
    </div>`;
  }

  if(filtered.length===0){
    listHtml += `<div class="empty"><div class="big">${meta.emptyIcon}</div><div class="msg">這段時間還沒有紀錄<br>點右下角的「＋」新增一筆吧</div></div>`;
  } else {
    listHtml += `<div class="list-grid">`;
    filtered.forEach(item=>{ listHtml += renderCard('fanlog', item); });
    listHtml += `</div>`;
  }

  html += `<div class="sched-layout">
    <div class="sched-cal-col">${reviewHtml}</div>
    <div class="sched-list-col">${listHtml}</div>
  </div>`;
  return html;
}

/* ================= 資料備份匯出／匯入 ================= */
const BACKUP_FIELD_MAP = [
  ['schedule','oshi-schedule'],
  ['expense','oshi-expense'],
  ['photocards','oshi-photocards'],
  ['support','oshi-support'],
  ['fanlog','oshi-fanlog'],
  ['artists','oshi-artists'],
  ['endorsement','oshi-endorsement'],
  ['magazine','oshi-magazine'],
  ['movie','oshi-movie'],
  ['profile','oshi-profile'],
  ['theme','oshi-theme'],
  ['customPcCategories','oshi-pc-categories'],
  ['customEndorsementCategories','oshi-endorsement-categories'],
  ['pcSeriesCovers','oshi-pc-covers'],
  ['pcSeriesMeta','oshi-pc-series-meta'],
  ['customFanlogCategories','oshi-fanlog-categories'],
  ['customScheduleCategories','oshi-schedule-categories'],
  ['customExpenseCategories','oshi-expense-categories']
];

function exportBackupData(){
  const backup = { version: 1, exportedAt: new Date().toISOString() };
  BACKUP_FIELD_MAP.forEach(([stateKey])=>{ backup[stateKey] = state[stateKey]; });

  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `推し手帳備份-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔');
}

async function handleImportFile(file){
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object'){ showToast('備份檔格式不正確'); return; }
    confirmImportBackup(data);
  }catch(err){
    showToast('讀取備份檔失敗，請確認檔案格式');
  }
}

function confirmImportBackup(data){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">確定要匯入這份備份嗎？</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">匯入後將覆蓋目前所有資料（行程、記帳、小卡、應援、紀錄、藝人等），此動作無法復原。建議先匯出目前資料備份再繼續。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn danger" id="importConfirmBtn">確定匯入並覆蓋</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('importConfirmBtn').addEventListener('click', async ()=>{
    await applyImportedBackup(data);
    closeModal();
    renderProfile();
    render();
    showToast('已匯入備份資料');
  });
  showModal();
}

async function applyImportedBackup(data){
  for(const [stateKey, storageKey] of BACKUP_FIELD_MAP){
    if(data[stateKey] !== undefined){
      state[stateKey] = data[stateKey];
      await saveKey(storageKey, state[stateKey]);
    }
  }
}

function confirmDelete(tab, id){
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3 class="maru">確定要刪除嗎？</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">刪除後資料將無法復原。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn danger" id="delConfirmBtn">確定刪除</button>
    </div>
  `;
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('delConfirmBtn').addEventListener('click', async ()=>{
    state[tab] = state[tab].filter(i=>String(i.id)!==String(id));
    await saveKey('oshi-'+tab, state[tab]);
    closeModal();
    render();
    showToast('已刪除紀錄');
  });
  showModal();
}

function showModal(){ document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 2200);
}

/* 啟動應用程式 */
window.addEventListener('DOMContentLoaded', init);
</script>
