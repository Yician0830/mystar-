<!DOCTYPE html>
<html lang="zh-Hant" data-field="line">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>旅遊紀錄 — ARCHIVE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅遊紀錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script>
  // 深淺色主題：跟著系統設定，系統切換時即時更新
  (function(){
    try{
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var apply = function(){ document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); };
      apply();
      if(mq.addEventListener) mq.addEventListener('change', apply); else if(mq.addListener) mq.addListener(apply);
    }catch(e){}
  })();
</script>
<style>
  :root{
    --paper:#f4f2ec; --ink:#15130f; --ink-dim:#453f30; --ink-faint:#6b6552;
    --line:rgba(21,19,15,0.14); --line-strong:rgba(21,19,15,0.4);
    --accent:#9a5808; --danger:#cc2036; --fill:rgba(21,19,15,0.045);
    --display:'Archivo Black','Noto Sans TC',sans-serif;
    --maru:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  html[data-theme="dark"]{
    --paper:#17150f; --ink:#f2efe6; --ink-dim:#cfc7b4; --ink-faint:#8f8772;
    --line:rgba(242,239,230,0.14); --line-strong:rgba(242,239,230,0.4);
    --accent:#eaa540; --danger:#ff6b7d; --fill:rgba(242,239,230,0.07);
  }
  :root{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--maru); min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:820px; margin:0 auto; padding:28px 28px 64px;}
  .back{display:inline-block; font-size:13px; font-weight:500; letter-spacing:0.08em; color:var(--ink-dim); text-decoration:none; padding:3px 10px; border:1px solid var(--ink);}
  .back:hover,.back:focus-visible{background:var(--ink); color:var(--paper);}
  header{padding:clamp(28px,7vh,64px) 0 clamp(20px,4vh,36px);}
  header svg{width:30px; height:30px; color:var(--accent); margin-bottom:12px;}
  h1{font-weight:900; font-size:clamp(30px,6vw,48px); letter-spacing:0.03em; line-height:1.2;}
  header p{margin-top:10px; color:var(--ink-dim); font-size:15px; line-height:1.7;}

  form{border-top:1px solid var(--line-strong); padding:22px 0 28px; display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  label{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .full{grid-column:1 / -1;}
  input,textarea,select{font:inherit; font-size:16px; font-weight:500; color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--line-strong); padding:9px 2px; border-radius:0;}
  input:focus,textarea:focus,select:focus{outline:none; border-bottom-color:var(--accent); box-shadow:0 1px 0 0 var(--accent);}
  textarea{resize:vertical; min-height:72px; padding:9px 11px; background:var(--fill); border-bottom-color:var(--line); field-sizing:content;}
  input[type="checkbox"]{border:0; box-shadow:none;}
  input[type="checkbox"]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button{font:inherit; font-size:15px; font-weight:700; letter-spacing:0.06em; color:var(--paper); background:var(--ink); border:0; padding:11px 22px; cursor:pointer; justify-self:start;}
  button:hover,button:focus-visible{background:var(--accent);}

  .list{border-top:1px solid var(--line-strong);}
  .trip{padding:22px 0; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:flex-start;}
  .trip .main{flex:1; min-width:0;}
  .trip .name{font-weight:900; font-size:clamp(20px,3.2vw,26px); letter-spacing:0.03em; line-height:1.3;}
  .trip .where{margin-top:4px; font-size:15px; font-weight:500; color:var(--accent);}
  .trip .meta{margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .trip .meta b{color:var(--ink-dim); font-weight:700;}
  .trip .note{margin-top:10px; font-size:14px; line-height:1.7; color:var(--ink-dim); white-space:pre-wrap;}
  .del{background:transparent; color:var(--ink-faint); padding:4px 8px; font-size:13px; font-weight:500; letter-spacing:0;}
  .del:hover,.del:focus-visible{background:transparent; color:var(--danger);}
  .empty{padding:40px 0; text-align:center; color:var(--ink-faint); font-size:15px;}
  @media (max-width:520px){
    .wrap{padding:20px 20px 56px;}
    form{grid-template-columns:1fr;}
  }

  [hidden]{display:none !important;}
  .login{border-top:1px solid var(--line-strong); padding:32px 0 8px;}
  .login p{color:var(--ink-dim); font-size:15px; line-height:1.7; margin-bottom:18px; max-width:460px;}
  .err{margin-top:14px; font-size:14px; color:var(--danger);}
  .who{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line-strong); font-size:13px; font-weight:500; color:var(--ink-dim);}
  .who button{background:transparent; color:var(--ink-faint); padding:2px 6px; font-size:13px; font-weight:500; letter-spacing:0;}
  .who button:hover,.who button:focus-visible{background:transparent; color:var(--accent);}
  .who + #app form{border-top:0; padding-top:12px;}
  /* 詳細頁時頁首標題被隱藏，「← ARCHIVE」會直接貼著登入列的上線，補一點間距 */
  #head[hidden] ~ .who{margin-top:16px;}
.tabs{display:flex; gap:8px; padding:0 0 16px; flex-wrap:wrap;}
  .tabs button{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); padding:5px 14px; font-size:13px; font-weight:700; letter-spacing:0.04em;}
  .tabs button:hover,.tabs button:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .tabs button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tag{display:inline-block; font-size:12px; font-weight:700; letter-spacing:0.06em; padding:1px 8px; margin-bottom:8px; border:1px solid var(--line-strong); color:var(--ink-dim);}
  .tag.fan{background:var(--accent); border-color:var(--accent); color:var(--paper);}
.actions{display:flex; gap:10px; flex-wrap:wrap;}
  .acts{display:flex; gap:2px; flex:0 0 auto;}
  .ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong);}
  .ghost:hover,.ghost:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .del[data-act="edit"]:hover,.del[data-act="edit"]:focus-visible{color:var(--accent);}
  .editnote{font-size:14px; font-weight:700; color:var(--accent);}
  .grp{padding:16px 0 4px; font-size:13px; font-weight:700; letter-spacing:0.08em; color:var(--ink-dim);}
  .count{color:var(--accent); font-weight:700;}
a.name{display:block; color:inherit; text-decoration:none;}
  a.name:hover,a.name:focus-visible{color:var(--accent);}
  .dhead{padding:clamp(20px,5vh,40px) 0 20px;}
  .dhead h2{font-weight:900; font-size:clamp(26px,5vw,40px); letter-spacing:0.03em; line-height:1.25; margin-top:4px;}
  .dhead .dm{margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .sec{padding:26px 0 12px;}
  .sh{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .sh h3{font-size:17px; font-weight:900; letter-spacing:0.04em;}
  .sh .btns{display:flex; gap:8px; flex-wrap:wrap;}
  .mini{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); padding:4px 12px; font-size:13px; font-weight:700; letter-spacing:0.03em;}
  .mini:hover,.mini:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  .grid input,.grid select,.grid textarea,.day input,.day textarea,.exp input,.exp select{width:100%; min-width:0;}
  .day{background:var(--fill); padding:14px; margin-bottom:12px;}
  .dh{display:grid; grid-template-columns:auto 150px 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
  .dh b{font-size:14px; letter-spacing:0.04em; color:var(--accent);}
  .day textarea{min-height:76px; line-height:1.7; background:var(--paper);}
  .exp{display:grid; grid-template-columns:96px 1fr 120px auto; gap:8px; margin-bottom:8px; align-items:center;}
  .total{font-size:18px; font-weight:700; margin-top:14px;}
  .total b{font-size:24px; color:var(--accent);}
  .chips{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .chips b{color:var(--ink-dim);}
  @container (max-width:400px){
    .dh{grid-template-columns:1fr auto; }
    .dh b{grid-column:1 / -1;}
    .dh input[type="date"]{grid-column:1 / -1;}
    .dh input:not([type="date"]){grid-column:1 / 2;}
    .exp{grid-template-columns:1fr 1fr auto;}
    .exp input[data-k="name"]{grid-column:1 / -1; order:-1;}
  }
.sh h3 small{font-size:13px; font-weight:700; color:var(--accent); margin-left:8px; letter-spacing:0.04em;}
  .ck{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .ck input[type="checkbox"]{flex:0 0 auto; width:20px; height:20px; padding:0; accent-color:var(--accent); cursor:pointer;}
  .ck input[data-k="text"]{flex:1; min-width:0;}
  .ck.done input[data-k="text"]{text-decoration:line-through; color:var(--ink-faint);}
.bk{background:var(--fill); padding:14px; margin-bottom:12px; display:grid; gap:8px;}
  .bk input,.bk select,.bk textarea{width:100%; min-width:0;}
  .bk textarea{min-height:56px; line-height:1.6; background:var(--paper);}
  .bh{display:grid; grid-template-columns:96px 1fr auto; gap:8px; align-items:center;}
  .bg{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .bcode{display:flex; gap:6px; align-items:center;}
  .bcode .mini{flex:0 0 auto;}
  @container (max-width:400px){
    .bh{grid-template-columns:1fr auto;}
    .bh select{grid-column:1 / -1;}
    .bg{grid-template-columns:1fr;}
  }

  .totop{position:fixed; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:10; width:44px; height:44px; padding:0; font-size:20px; line-height:1; letter-spacing:0; box-shadow:0 2px 8px rgba(0,0,0,0.25);}

  .del[data-do^="del"]{font-size:22px; line-height:1; padding:4px 10px;}
  .ck input[data-k="text"]{border-bottom-color:var(--line);}
  .ck input[data-k="text"]:focus{border-bottom-color:var(--accent);}
  .dh b .wk{font-weight:500; color:var(--ink-faint);}
  .bh select{font-weight:700; color:var(--accent);}
  .bh input[data-k="name"]{font-weight:900; font-size:17px;}
  .bcode input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:0.06em; font-variant-numeric:tabular-nums;}
  .exp select{font-weight:700; color:var(--ink-dim);}
  .exp input[data-k="amount"]{text-align:right; font-variant-numeric:tabular-nums;}
  .total b,.chips b{font-variant-numeric:tabular-nums;}
  /* 想改成淡底色輸入框：把 <html> 的 data-field="line" 改成 "fill" */
  html[data-field="fill"] input:not([type="checkbox"]),html[data-field="fill"] select,html[data-field="fill"] textarea{background:var(--fill); border-bottom-color:transparent; padding:9px 11px;}
  html[data-field="fill"] input:not([type="checkbox"]):focus,html[data-field="fill"] select:focus,html[data-field="fill"] textarea:focus{box-shadow:inset 0 0 0 2px var(--accent);}
  html[data-field="fill"] .day input:not([type="checkbox"]),html[data-field="fill"] .day select,html[data-field="fill"] .day textarea,
  html[data-field="fill"] .bk input:not([type="checkbox"]),html[data-field="fill"] .bk select,html[data-field="fill"] .bk textarea{background:var(--paper);}
  html[data-field="fill"] .ck input[data-k="text"]{border-bottom-color:transparent;}
  .bar .save.alt{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong);}
  .bar .save.alt:hover,.bar .save.alt:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .vtext{white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px; line-height:1.7; font-weight:500;}
  .vempty{color:var(--ink-faint); font-size:14px; padding:4px 0 12px; line-height:1.7;}
  .muted{color:var(--ink-faint); font-weight:500;}
  .kv{display:grid; gap:12px;}
  .kv > div{display:grid; grid-template-columns:88px minmax(0,1fr); gap:8px; align-items:baseline;}
  .kv dt{font-size:12px; font-weight:700; color:var(--ink-faint); letter-spacing:0.06em;}
  .kv dd{font-weight:500; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;}
  .vlink{color:var(--accent); text-decoration:underline; text-underline-offset:3px;}
  .btag{font-size:12px; font-weight:900; color:var(--accent); letter-spacing:0.06em; white-space:nowrap;}
  .bk.v{gap:6px;}
  .bvh{display:flex; align-items:baseline; gap:10px;}
  .bname{font-size:17px; font-weight:900; line-height:1.4;}
  .btime{font-variant-numeric:tabular-nums; color:var(--ink-dim); font-weight:500;}
  .bcv{display:flex; align-items:center; gap:8px;}
  .bcv code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; font-weight:700; letter-spacing:0.06em; overflow-wrap:anywhere;}
  .dvh{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; margin-bottom:6px;}
  .dvh b{font-size:14px; letter-spacing:0.04em; color:var(--accent);}
  .dvh .wk{font-weight:500; color:var(--ink-faint);}
  .dvh .ddate{font-size:13px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .dvh .dtitle{font-weight:900;}
  .day.v .vempty{padding:0;}
  .ck.v{flex-direction:row; align-items:center; font-size:16px; font-weight:500; color:var(--ink); cursor:pointer; padding:3px 0;}
  .ck.v span{flex:1; min-width:0; line-height:1.6;}
  .ck.v.done span{text-decoration:line-through; color:var(--ink-faint);}
  .approx{margin-top:4px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .approx b{color:var(--ink-dim); font-variant-numeric:tabular-nums;}
  .ssub{margin:22px 0 10px; font-size:13px; font-weight:900; letter-spacing:0.08em; color:var(--ink-dim);}
  .cgrid,.xgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px;}
  .xgrid{margin-top:0;}
  .ccard,.xcard{background:var(--fill); border:1px solid var(--line); padding:12px 14px; min-width:0; display:grid; gap:4px; align-content:start;}
  .ccard .cn,.xcard .xc{font-size:13px; font-weight:700; color:var(--ink-dim);}
  .ccard .ca{font-size:20px; font-weight:900; font-variant-numeric:tabular-nums;}
  .cbar{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .cbar i{flex:1; height:5px; background:var(--line); position:relative; overflow:hidden;}
  .cbar i::after{content:''; position:absolute; inset:0 auto 0 0; width:var(--w,0%); background:var(--accent);}
  .left{font-size:12px; font-weight:700;}
  .left.ok{color:#2e8b57;} .left.over{color:var(--danger);}
  .xcard .xn{font-size:15px; font-weight:700; line-height:1.4; overflow-wrap:anywhere;}
  .xcard .xa{font-size:16px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--accent);}
  .bud{margin-top:14px; font-size:13px; color:var(--ink-dim);}
  .bud summary{cursor:pointer; font-weight:700; padding:4px 0;}
  .bud .fgrid{margin:10px 0 0;}
  @container (max-width:300px){ .cgrid,.xgrid{grid-template-columns:minmax(0,1fr);} }
  .lks{display:flex; flex-wrap:wrap; gap:6px;}
  .lk{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); padding:2px 8px; font-size:12px; font-weight:700; letter-spacing:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; justify-self:auto;}
  .flash{outline:2px solid var(--accent); outline-offset:2px;}
  .ie3{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px;}
  .expv{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:baseline; padding:7px 0;}
  .expv b{font-variant-numeric:tabular-nums;}
  .sname{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center;}
  .sname input{font-weight:900; font-size:17px;}
  .sdates{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .nn{font-size:13px; font-weight:700; color:var(--accent);}
  .nn:empty{display:none;}
  .board{display:flex; flex-direction:column; gap:26px; padding:2px 0 16px;}
  .dtabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .dtab[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .dcol{display:grid; gap:10px; align-content:start; min-width:0; width:100%;}
  .dchd{display:grid; gap:6px; padding:2px 2px 4px;}
  .dtop{display:flex; align-items:baseline; gap:8px;}
  .dtop b{font-size:14px; letter-spacing:0.04em; color:var(--accent);}
  .dtop .wk{font-size:13px; font-weight:500; color:var(--ink-faint);}
  .dtop .cnt{margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .dsub{padding:0 2px 2px; font-size:13px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .dsub b{margin-left:10px; font-size:14px; color:var(--ink);}
  .icard{background:var(--fill); padding:12px; display:grid; gap:8px;}
  .itop{display:flex; gap:10px; align-items:baseline;}
  .itime{flex:0 0 auto; font-size:13px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
  .ititle{font-size:16px; font-weight:900; line-height:1.4; overflow-wrap:anywhere;}
  .pills{display:flex; flex-wrap:wrap; gap:6px;}
  .pill{--c:#8a8570; font-size:12px; font-weight:700; padding:2px 8px; border-radius:2px; background:var(--fill); color:var(--ink-dim);}
  @supports (background:color-mix(in srgb,red 10%,transparent)){
    .pill{background:color-mix(in srgb,var(--c) 16%,transparent); color:color-mix(in srgb,var(--c) 70%,var(--ink));}
  }
  .pill[data-v="景點"]{--c:#3b7ea1;} .pill[data-v="美食"]{--c:#c7742a;} .pill[data-v="交通"]{--c:#6f7d8c;}
  .pill[data-v="購物"]{--c:#a5478f;} .pill[data-v="住宿"]{--c:#8a6d3b;} .pill[data-v="活動"]{--c:#d1436b;}
  .pill[data-v="已預訂"]{--c:#2e8b57;} .pill[data-v="未預訂"]{--c:#cc2036;} .pill[data-v="臨時"]{--c:#7a5bb5;}
  .icard .place{font-size:13px; overflow-wrap:anywhere;}
  .icard input,.icard select{width:100%; min-width:0;}
  .icard input[data-k="title"]{font-weight:900;}
  .icard textarea{width:100%; min-height:56px; line-height:1.6; background:var(--paper);}
  .ie1{display:grid; grid-template-columns:104px minmax(0,1fr) auto; gap:8px; align-items:center;}
  .ie2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;}
  .dadd{width:100%; justify-content:center;}
  .dcol > .dchd input{width:100%;}
  html[data-field="fill"] .icard input:not([type="checkbox"]),html[data-field="fill"] .icard select,html[data-field="fill"] .icard textarea{background:var(--paper);}
  .newrow{padding:0 0 14px;}
  .fgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 12px; margin-bottom:12px;}
  .fgrid input,.fgrid select{width:100%; min-width:0;}
  .fgrid .bcode input{flex:1;}
  .sh select{padding:5px 8px; font-weight:700;}
  .rate{margin-top:12px; font-size:13px; color:var(--ink-dim);}
  .rate label{flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap; font-weight:500;}
  .rate input{width:110px;}
  .hint{margin-top:8px; font-size:12px; color:var(--ink-faint); line-height:1.6;}
  @container (max-width:300px){ .fgrid{grid-template-columns:minmax(0,1fr);} }
  @media (pointer:coarse){
    .del,.mini,.tabs button,.who button,.back{min-height:40px; display:inline-flex; align-items:center; justify-content:center;}
    .del{padding:8px 12px;}
    .mini{padding:8px 14px;}
    .tabs button{padding:8px 16px;}
    .who button{padding:8px 10px;}
    .back{padding:8px 12px;}
    .acts{gap:6px;}
    .ck input[type="checkbox"]{width:24px; height:24px;}
    .sh select{min-height:40px;}
    .bar .save{min-height:40px;}
  }

  /* ── 詳細頁：滿版、三欄（預訂資料＋住宿＋行前清單 ／ 每日行程 ／ 花費），窄螢幕自動改成兩欄或一欄 ── */
  body.wide .wrap{max-width:1600px; padding-left:clamp(20px,3vw,48px); padding-right:clamp(20px,3vw,48px);}
  .bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 0; background:var(--paper); border-bottom:1px solid var(--line);}
  .savest{margin-left:auto; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .savest.dirty{color:var(--accent); font-weight:700;}
  .bar .save{padding:7px 24px; font-size:14px;}
  .cols{display:grid; grid-template-columns:minmax(0,1fr); gap:0 clamp(20px,2.5vw,40px); align-items:start;}
  .col{min-width:0; container-type:inline-size;}
  @media (min-width:800px){
    .cols{grid-template-columns:repeat(2,minmax(0,1fr));}
    .col.c3{grid-column:1 / -1;}
  }
  @media (min-width:1200px){
    .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);}
    .col.c3{grid-column:auto;}
  }
  /* 搜尋與篩選列 */
  .fbar{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; padding:0 0 16px;}
  .fbar .fs{flex:1 1 200px; min-width:0;}
  .fbar input,.fbar select{width:100%; font-size:15px;}
  .fbar select{flex:0 1 auto; min-width:110px; background:var(--paper); cursor:pointer;}
  .fbar .fsel{flex:0 1 130px; min-width:110px;}
  .fbar .fclr{flex:0 0 auto; background:transparent; color:var(--ink-faint); border:1px solid var(--line-strong); padding:5px 12px; font-size:13px; font-weight:700; letter-spacing:0.04em;}
  .fbar .fclr:hover,.fbar .fclr:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .fbar:not([hidden]) ~ .list{border-top:0;}
  .fcount{font-size:13px; font-weight:500; color:var(--ink-faint); padding:0 0 4px;}
  /* 卡片上的關鍵資訊摘要 */
  .trip .ksum{margin-top:10px; padding:8px 12px; background:var(--fill); display:grid; gap:4px; font-size:13px; line-height:1.6; color:var(--ink-dim);}
  .trip .ksum div{display:flex; gap:10px; min-width:0;}
  .trip .ksum em{font-style:normal; font-weight:700; color:var(--ink-faint); flex:0 0 auto; min-width:2.6em;}
  .trip .ksum span{min-width:0; overflow-wrap:anywhere;}
  .trip .ksum code{font-size:12px; background:var(--line); padding:0 5px;}
  /* 寬螢幕：列表頁加寬，旅程卡片排成多欄 */
  @media (min-width:760px){
    body:not(.wide) .wrap{max-width:1400px;}
    .list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
    .list .grp{grid-column:1 / -1; padding:20px 0 0;}
    .list .trip{position:relative; flex-direction:column; gap:0; padding:18px 20px 20px; border:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong);}
    .list .trip .acts{position:absolute; top:12px; right:12px;}
  }
  @media (min-width:1100px){
    .list{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  /* 多幣別花費 */
  .exp{grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr) auto;}
  .exp input[data-k="name"]{grid-column:1 / -1; order:-1;}
  .exp select.ecur{padding-left:0; padding-right:0;}
  .dcl{font-size:12px; font-weight:500; color:var(--ink-faint); align-self:center;}
  .rate{display:grid; gap:6px;}
  .rate .rhint{font-size:12px; color:var(--ink-faint);}
  .approx.warn{color:var(--danger);}
  .xcard .xa small{font-size:12px; font-weight:700; color:var(--ink-faint);}
  .xcard .xs{font-size:12px; color:var(--ink-faint);}
  /* 旅程詳細頁：最上方的「← ARCHIVE」不需要，只留「← 旅遊紀錄」 */
  body.wide .wrap > a.back{display:none;}
  /* 行程離開時間／停留時長 */
  .iet{display:grid; grid-template-columns:104px minmax(0,1fr); gap:8px; align-items:center;}
  .idurt{font-size:13px; font-weight:500; color:var(--ink-faint);}
  .idurt.has{font-weight:700; color:var(--accent);}
  .pill[data-v="停留"]{--c:#8a6d3b;}
  .pill[data-v="現場候位"]{--c:#b8741a;}
  .icard .itrans{font-size:13px; font-weight:500; color:var(--ink-dim); overflow-wrap:anywhere;}
</style>

<body>
<div class="wrap">
  <a class="back" href="https://yician0830.github.io/">← ARCHIVE</a>

  <header id="head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M8 11v5M16 11v5"/></svg>
    <h1>旅遊紀錄</h1>
    <p>航班、住宿與行程。平常出遊，和為了見他而出發的每一趟，都收在這裡。</p>
  </header>

  <section id="login" class="login" hidden>
    <p>登入後，旅程會存在你的雲端帳號，跟推し手帳使用同一個 Google 帳號，手機和電腦都看得到。</p>
    <button type="button" id="signin">使用 Google 登入</button>
    <div class="err" id="err" role="alert"></div>
  </section>
  <div class="who" id="who" hidden>
    <span>☁️ <span id="uname"></span> 已登入，旅程同步中</span>
    <button type="button" id="signout" title="登出後推し手帳也會一併登出">登出</button>
  </div>

  <div id="app" hidden>
  <div class="newrow" id="newRow"><button type="button" id="newBtn">＋ 新增旅程</button></div>
  <form id="f" hidden>
    <label class="full">這趟旅程<input name="title" required placeholder="例如：東京三日遊、東京巡演三日"></label>
    <label>類型<select name="kind" id="kind"><option value="general">一般旅遊</option><option value="fan">追星</option></select></label>
    <label id="eventWrap" hidden>活動／對象<input name="event" placeholder="例如：演唱會名稱、見面會"></label>
    <label>地點<input name="place" placeholder="例如：東京・有明"></label>
    <label>出發日<input name="start" type="date" required></label>
    <label>回程日<input name="end" type="date"></label>
    <label class="full">備註（航班、住宿、行程、心得）<textarea name="note"></textarea></label>
    <div class="full editnote" id="editNote" hidden></div>
    <div class="full actions"><button type="submit" id="submitBtn">新增旅程</button><button type="button" class="ghost" id="cancelBtn">取消</button></div>
  </form>

  <div class="tabs" id="tabs">
      <button type="button" data-k="all" aria-pressed="true">全部</button>
      <button type="button" data-k="general" aria-pressed="false">一般旅遊</button>
      <button type="button" data-k="fan" aria-pressed="false">追星</button>
    </div>
    <div class="fbar" id="fbar" hidden>
      <label class="fs"><input type="search" id="q" placeholder="搜尋：旅程、地點、活動、航班、飯店、備註…" autocomplete="off" aria-label="搜尋旅程"></label>
      <label class="fsel"><select id="yearF" aria-label="依年份篩選"></select></label>
      <label class="fsel"><select id="placeF" aria-label="依地點篩選"></select></label>
      <button type="button" class="fclr" id="fclr" hidden>清除篩選</button>
    </div>
    <div class="fcount" id="fcount" hidden></div>
    <div class="list" id="list"></div>
  </div>
  <div id="detail" hidden></div>
</div>

<datalist id="tmodes"><option value="步行"><option value="JR"><option value="地鐵"><option value="電車"><option value="巴士"><option value="計程車"><option value="包車"><option value="租車"><option value="高鐵"><option value="飛機"><option value="渡輪"></datalist>
<button type="button" id="totop" class="totop" aria-label="回到最上方" title="回到最上方" hidden>↑</button>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
  // 與推し手帳共用同一個 Firebase 專案，登入狀態在同一個網域底下自動共用
  var firebaseConfig = {
  apiKey: "AIzaSyBjclP4efWWcOTO88W_3tlcC4Za_hEIzW0",
  authDomain: "mystarlifeapp.firebaseapp.com",
  projectId: "mystarlifeapp",
  storageBucket: "mystarlifeapp.firebasestorage.app",
  messagingSenderId: "941753508434",
  appId: "1:941753508434:web:5bdf24eac9ee4514d8758b",
  measurementId: "G-FDX9867N4N"
};
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth(), db = firebase.firestore();
  // 離線快取：沒網路時仍可讀取（與編輯）上次同步的旅程，恢復連線後自動同步。要在其他 Firestore 呼叫之前執行
  db.enablePersistence({ synchronizeTabs: true }).catch(function(e){
    console.warn('離線快取未啟用：', e.code);   // failed-precondition／unimplemented（例如無痕模式）時照常線上使用
  });
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});

  // 旅程存在 users/{uid}/data/travel-trips，跟手帳同一個位置與格式（{ value: [...] }）
  var KEY = 'travel-trips', OLD_LOCAL_KEY = 'travel-diary-v1';
  var trips = [], docRef = null, unsub = null;
  var $ = function(id){ return document.getElementById(id); };

  function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function d(s){ return s ? s.replace(/-/g,'.') : ''; }
  function showErr(m){ $('err').textContent = m || ''; }

  function persist(){
    if(!docRef) return Promise.resolve(true);
    return docRef.set({ value: trips }).then(function(){ return true; }, function(e){
      console.error(e); alert('儲存失敗，請檢查網路連線後再試一次'); return false;
    });
  }
  function readOldLocal(){
    try{ var a = JSON.parse(localStorage.getItem(OLD_LOCAL_KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }

  var filter = 'all', DAY = 86400000;
  function toDate(x){ if(!x) return null; var p = x.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  // 依日期自動判斷：接下來（還沒出發／旅途中）或已成行
  function phase(t){
    var n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var s0 = toDate(t.start), e0 = toDate(t.end) || s0;
    if(!s0) return {k:'past'};
    if(today < s0) return {k:'up', n:Math.round((s0 - today) / DAY)};
    if(today <= e0) return {k:'now', n:Math.round((today - s0) / DAY) + 1};
    return {k:'past'};
  }
  // 追星：列表上提醒售票／抽選日（已購票或落選就不再倒數）
  function saleChip(t, fan, ph){
    var fi = t.fanInfo;
    if(!fan || !fi || !fi.saleDate || ph.k === 'past') return '';
    var sd = toDate(fi.saleDate), n = new Date(), td = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    if(!sd) return '';
    var dn = Math.round((sd - td) / DAY), st = fi.saleStatus || '', open = st !== '已購票' && st !== '落選';
    return '<span>售票／抽選 <b>' + esc(d(fi.saleDate)) + '</b>' + (st ? '・' + esc(st) : '') +
      (open && dn >= 0 ? '・' + (dn === 0 ? '就是今天' : '還有 ' + dn + ' 天') : '') + '</span>';
  }

  // 從預訂的時間文字（例如「2/20 10:20-15:00」「02/20 08:30 → 13:10」）取出最早的出發時間，用來排序航班
  function bkStamp(t, x){
    var tx = String(x.time || ''), dm = tx.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/), tm = tx.match(/(\d{1,2})\s*:\s*(\d{2})/);
    if(!dm) return Infinity;
    var s0 = toDate(t.start), y = s0 ? s0.getFullYear() : new Date().getFullYear();
    var dt = new Date(y, +dm[1] - 1, +dm[2], tm ? +tm[1] : 0, tm ? +tm[2] : 0);
    if(s0 && dt < new Date(s0.getTime() - 60 * DAY)) dt = new Date(y + 1, +dm[1] - 1, +dm[2], tm ? +tm[1] : 0, tm ? +tm[2] : 0);   // 跨年（12 月出發、1 月回程）
    return isNaN(dt) ? Infinity : dt.getTime();
  }
  // ---- 卡片摘要：航班、首日住宿、票務 ----
  function ksumHtml(t, fan, ph, hasSaleChip){
    if(ph.k === 'past') return '';
    var rows = [];
    var bks = t.bookings || [], sts = t.stays || [];
    var fl = bks.filter(function(x){ return x.type === '航班' && (x.name || x.time); })
      .map(function(x, i){ return { x:x, k:bkStamp(t, x), i:i }; })
      .sort(function(a, b){ return a.k === b.k ? a.i - b.i : (a.k < b.k ? -1 : 1); })
      .map(function(o){ return o.x; });
    if(fl.length){
      var f = fl[0];
      rows.push(['航班', esc(f.name || '') + (f.time ? (f.name ? '　' : '') + esc(f.time) : '') + (fl.length > 1 ? '　<small>等 ' + fl.length + ' 段</small>' : '')]);
    }
    var st = sts.filter(function(x){ return x.name; }).sort(function(a,b){ return String(a.checkin || '9999').localeCompare(String(b.checkin || '9999')); })[0];
    if(st) rows.push(['住宿', esc(st.name) + (st.checkin ? '　' + esc(d(st.checkin)) + ' 入住' : '')]);
    if(fan){
      var fi = t.fanInfo || {}, tk = bks.filter(function(x){ return x.type === '門票' && (x.name || x.code); })[0], parts = [];
      if(fi.saleStatus && !hasSaleChip) parts.push(esc(fi.saleStatus));
      if(tk){ parts.push(esc(tk.name || '門票')); if(tk.code) parts.push('<code>' + esc(tk.code) + '</code>'); }
      if(fi.showDate) parts.push('場次 ' + esc(d(fi.showDate)));
      if(parts.length) rows.push(['票務', parts.join('　')]);
    }
    if(!rows.length) return '';
    return '<div class="ksum">' + rows.map(function(r){ return '<div><em>' + r[0] + '</em><span>' + r[1] + '</span></div>'; }).join('') + '</div>';
  }
  // ---- 搜尋與篩選 ----
  var q = '', yearF = 'all', placeF = 'all', composing = false;
  // 地點可以填多個城市（用 / 、 , → 等分隔），每個城市都能篩選；「東京・有明」這種「城市・區域」只取城市
  function citiesOf(t){
    var seen = {}, out = [];
    String(t.place || '').split(/[\/／、,，;；→＞>+＋&]+/).forEach(function(seg){
      var c = seg.split(/[・·]/)[0].trim();
      if(c && !seen[c]){ seen[c] = 1; out.push(c); }
    });
    return out;
  }
  function yearOf(t){ return t.start ? String(t.start).slice(0, 4) : ''; }
  function hay(t){
    var a = [t.title, t.place, t.event, t.note];
    (t.bookings || []).forEach(function(x){ a.push(x.name, x.code, x.note); });
    (t.stays || []).forEach(function(x){ a.push(x.name, x.address, x.note); });
    return a.filter(Boolean).join(' ').toLowerCase();
  }
  function fillSel(el, all, vals, cur){
    el.innerHTML = '<option value="all">' + all + '</option>' + vals.map(function(v){ return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
  }
  function syncFilters(){
    var ys = {}, cs = {};
    trips.forEach(function(t){ var y = yearOf(t); if(y) ys[y] = 1; citiesOf(t).forEach(function(c){ cs[c] = 1; }); });
    var yl = Object.keys(ys).sort().reverse(), cl = Object.keys(cs).sort();
    if(yearF !== 'all' && !ys[yearF]) yearF = 'all';
    if(placeF !== 'all' && !cs[placeF]) placeF = 'all';
    fillSel($('yearF'), '所有年份', yl, yearF);
    fillSel($('placeF'), '所有地點', cl, placeF);
    $('fbar').hidden = !trips.length;
  }
  function tripHtml(t, ph){
    var fan = t.kind === 'fan';
    var dates = d(t.start) + (t.end ? ' – ' + d(t.end) : '');
    var count = ph.k === 'up' ? '<span class="count">' + (ph.n === 0 ? '今天出發' : '還有 ' + ph.n + ' 天') + '</span>'
              : ph.k === 'now' ? '<span class="count">旅途中・第 ' + ph.n + ' 天</span>' : '';
    var where = [t.place, fan ? t.event : ''].filter(Boolean).map(esc).join('・');
    var chip = saleChip(t, fan, ph);
    return '<div class="trip"><div class="main">' +
      '<span class="tag' + (fan ? ' fan' : '') + '">' + (fan ? '追星' : '旅遊') + '</span>' +
      '<a class="name" href="#/t/' + t.id + '">' + esc(t.title) + '</a>' +
      (where ? '<div class="where">' + where + '</div>' : '') +
      '<div class="meta">' + count + '<span>' + dates + '</span>' + chip + ((t.checklist && t.checklist.length && ph.k !== 'past') ? '<span>行前清單 <b>' + prog(t) + '</b></span>' : '') + '</div>' +
      ksumHtml(t, fan, ph, !!chip) +
      (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '') +
      '</div><div class="acts">' +
      '<button class="del" data-act="edit" data-id="' + t.id + '" type="button">編輯</button>' +
      '<button class="del" data-act="del" data-id="' + t.id + '" type="button">刪除</button></div></div>';
  }
  function render(){
    var el = $('list');
    syncFilters();
    var kw = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var active = !!(kw.length || yearF !== 'all' || placeF !== 'all');
    $('fclr').hidden = !active;
    var shown = trips.filter(function(t){
      if(!(filter === 'all' || (t.kind || 'general') === filter)) return false;
      if(yearF !== 'all' && yearOf(t) !== yearF) return false;
      if(placeF !== 'all' && citiesOf(t).indexOf(placeF) < 0) return false;
      if(kw.length){ var h = hay(t); if(!kw.every(function(w){ return h.indexOf(w) > -1; })) return false; }
      return true;
    });
    $('fcount').hidden = !active;
    if(active) $('fcount').textContent = '符合的旅程：' + shown.length + ' 趟';
    if(!shown.length){
      el.innerHTML = '<div class="empty">' + (!trips.length ? '還沒有旅程，按上方「＋ 新增旅程」開始第一趟。' : active ? '找不到符合的旅程，換個關鍵字或清除篩選看看。' : '這個分類還沒有旅程。') + '</div>';
      return;
    }
    var next = [], past = [];
    shown.forEach(function(t){ var ph = phase(t); (ph.k === 'past' ? past : next).push({t:t, ph:ph}); });
    next.sort(function(a,b){ return String(a.t.start).localeCompare(String(b.t.start)); });   // 最近要出發的在最上面
    past.sort(function(a,b){ return String(b.t.start).localeCompare(String(a.t.start)); });   // 最近去過的在最上面
    var h = '';
    if(next.length) h += '<div class="grp">接下來</div>' + next.map(function(x){ return tripHtml(x.t, x.ph); }).join('');
    if(past.length) h += '<div class="grp">已成行</div>' + past.map(function(x){ return tripHtml(x.t, x.ph); }).join('');
    el.innerHTML = h;
  }
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    filter = b.dataset.k;
    [].forEach.call($('tabs').children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    render();
  });

  $('q').addEventListener('compositionstart', function(){ composing = true; });
  $('q').addEventListener('compositionend', function(){ composing = false; q = this.value; render(); });

      (editMode ? '<button type="button" class="save" data-do="done">完成</button>' : '<button type="button" class="save alt" data-do="edit">編輯</button>') + '</div>' +
      '<div class="dhead"><span class="tag' + (fan ? ' fan' : '') + '">' + (fan ? '追星' : '旅遊') + '</span>' +
      '<h2 id="dtitle">' + esc(t.title) + '</h2>' +
      '<div class="dm" id="dmeta">' + dmHtml(t) + '</div></div>';

    h += editMode ? editBody(t, fan) : viewBody(t, fan);
    var y = window.scrollY;          // 重繪會讓頁面瞬間變短，先記下位置再還原，避免跳回最上方
    var oldBoard = el.querySelector('.board'), bx = oldBoard ? oldBoard.scrollLeft : 0;   // 看板左右位置也要保留
    el.innerHTML = h;
    var newBoard = el.querySelector('.board'); if(newBoard) newBoard.scrollLeft = bx;
    [].forEach.call(el.querySelectorAll('textarea'), autosize);
    window.scrollTo(0, y);
  }

  $('detail').addEventListener('change', function(e){
    var el = e.target, t = cur(), ds = el.dataset;
    if(!t) return;
    normDays(t);
    if(ds.i){
      var pd = (t.days || []).filter(function(x){ return String(x.id) === ds.p; })[0];
      var it2 = pd && (pd.items || []).filter(function(x){ return String(x.id) === ds.i; })[0];
      if(it2){
        it2[ds.k] = el.value;
        if(ds.k === 'time' || ds.k === 'end'){
          var dEl = el.closest('.icard').querySelector('.idurt'), dtx = durText(it2);
          if(dEl){ dEl.textContent = dtx ? '停留 ' + dtx : '← 離開時間（選填，會自動算停留時長）'; dEl.classList.toggle('has', !!dtx); }
        }
      }
    } else if(ds.d){
      var day = (t.days || []).filter(function(x){ return String(x.id) === ds.d; })[0];
      if(day){
        day[ds.k] = el.value;
        if(ds.k === 'date'){ var wkEl = el.closest('.dcol').querySelector('.wk'); if(wkEl) wkEl.textContent = wk(el.value); }
      }
    } else if(ds.b){
      var bk = (t.bookings || []).filter(function(x){ return String(x.id) === ds.b; })[0];
      if(bk) bk[ds.k] = el.value;
    } else if(ds.c){
      var it = (t.checklist || []).filter(function(x){ return String(x.id) === ds.c; })[0];
      if(it){
        if(el.type === 'checkbox'){
          it.done = el.checked;
          el.closest('.ck').classList.toggle('done', el.checked);
          if($('prog')) $('prog').textContent = prog(t);
        } else { it.text = el.value; }
      }
    } else if(ds.e){
      var ex = (t.expenses || []).filter(function(x){ return String(x.id) === ds.e; })[0];
      if(ex){
        ex[ds.k] = el.value;
        if(ds.k === 'amount' || ds.k === 'cat' || ds.k === 'cur') $('sum').innerHTML = sumHtml(t);
        if(ds.k === 'cur' && $('rateRow')) $('rateRow').innerHTML = rateRowsHtml(t);
      }
    } else if(ds.s){
      var st = (t.stays || []).filter(function(x){ return String(x.id) === ds.s; })[0];
      if(st){
        st[ds.k] = el.value;
        if(ds.k === 'checkin' || ds.k === 'checkout'){
          var card = el.closest('.bk'), outEl = card.querySelector('input[data-k="checkout"]'), nnEl = card.querySelector('.nn');
          if(ds.k === 'checkin' && outEl) outEl.min = el.value || '';
          if(nnEl) nnEl.textContent = stayHint(st);
        }
      }
    } else if(ds.f){
      t.fanInfo = t.fanInfo || {}; t.fanInfo[ds.k] = el.value;
    } else if(ds.bud){
      t.budgets = t.budgets || {}; t.budgets[ds.bud] = el.value;
      if($('sum')) $('sum').innerHTML = sumHtml(t);
    } else if(ds.r){
      t.rates = t.rates || {}; t.rates[ds.r] = el.value;
      if($('sum')) $('sum').innerHTML = sumHtml(t);
    } else if(ds.t){
      t[ds.k] = el.value;
      if($('sum')) $('sum').innerHTML = sumHtml(t);
    }
    doPersist();
  });
  // 打字中就先提示「尚未儲存」，離開欄位後自動儲存
  $('detail').addEventListener('input', function(e){
    if(e.target.tagName === 'TEXTAREA') autosize(e.target);
    if(e.target.matches('input,textarea,select')) setSave('輸入中，離開欄位後會自動儲存', true);
  });

  $('detail').addEventListener('click', function(e){
    var b = e.target.closest('button[data-do]'); if(!b) return;
    var t = cur(); if(!t) return;
    t.days = t.days || []; t.expenses = t.expenses || []; t.checklist = t.checklist || []; t.bookings = t.bookings || []; t.stays = t.stays || [];
    normDays(t);
    var act = b.dataset.do, newItemId = null;
    if(act === 'goto'){
      if(b.dataset.day){ if(dayFilter !== 'all') dayFilter = b.dataset.day; renderDetail(); }
      var tg = document.getElementById(b.dataset.to);
      if(tg){ tg.scrollIntoView({behavior:'smooth', block:'center'}); tg.classList.add('flash'); setTimeout(function(){ tg.classList.remove('flash'); }, 1600); }
      return;
    }
    if(act === 'dayf'){ dayFilter = b.dataset.day; renderDetail(); return; }
    if(act === 'addday' || act === 'gen') dayFilter = 'all';   // 新增／產生後要看得到新的那天
    if(act === 'save'){
      // 先讓正在輸入的欄位送出變更（手機上按按鈕不一定會讓欄位失焦）
      var ae = document.activeElement;
      if(ae && ae !== b && $('detail').contains(ae) && ae.blur) ae.blur();
      doPersist(); return;
    }
    if(act === 'edit'){ editMode = true; renderDetail(); return; }
    if(act === 'done'){
      // 先讓正在輸入的欄位送出變更，再切回檢視
      var ae2 = document.activeElement;
      if(ae2 && $('detail').contains(ae2) && ae2.blur) ae2.blur();
      t.days.forEach(function(day){ day.items = sortedItems(day); });   // 完成時依時間排好
      editMode = false; renderDetail(); doPersist(); return;
    }
    if(act === 'copy'){
      var codeIn = b.parentNode.querySelector('input');
      var code = codeIn ? codeIn.value : (b.dataset.code || '');
      if(!code) return;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){
          b.textContent = '已複製'; setTimeout(function(){ b.textContent = '複製'; }, 1200);
        }).catch(function(){ alert('複製失敗，請手動選取文字複製'); });
      } else { alert('這個瀏覽器不支援一鍵複製，請手動選取文字複製'); }
      return;
    }
    if(act === 'openlink'){
      var u = b.parentNode.querySelector('input').value.trim();
      if(!u) return;
      try{
        var url = new URL(u, location.href);
        if(url.protocol === 'http:' || url.protocol === 'https:') window.open(url.href, '_blank', 'noopener');
        else alert('連結只支援 http／https 開頭的網址');
      }catch(err){ alert('連結格式不正確'); }
      return;
    }
    if(act === 'addday'){
      var last = t.days.length ? t.days[t.days.length-1].date : '', nd = '';
      if(last){ var x0 = toDate(last); x0.setDate(x0.getDate()+1); nd = ymd(x0); } else if(t.start){ nd = t.start; }
      t.days.push({ id:uid(), date:nd, title:'', items:[] });
    } else if(act === 'gen'){
      var s0 = toDate(t.start), e0 = toDate(t.end) || s0;
      if(!s0){ alert('請先回旅程列表，按「編輯」填好出發日'); return; }
      if(e0 < s0){ alert('回程日早於出發日，請先回旅程列表按「編輯」修正'); return; }
      var have = {}, n = 0;
      t.days.forEach(function(x){ have[x.date] = 1; });
      for(var c0 = new Date(s0); c0 <= e0 && n < 60; c0.setDate(c0.getDate()+1), n++){
        var key = ymd(c0);
        if(!have[key]) t.days.push({ id:uid(), date:key, title:'', items:[] });
      }
      t.days.sort(function(a,b){ return (a.date || '9999').localeCompare(b.date || '9999'); });
    } else if(act === 'delday'){
      var dx = t.days.filter(function(x){ return String(x.id) === b.dataset.id; })[0];
      if(dx && ((dx.items || []).length || String(dx.title || '').trim()) && !confirm('確定要刪除這一天的行程嗎？（這天所有行程卡片也會一併刪除）')) return;
      t.days = t.days.filter(function(x){ return String(x.id) !== b.dataset.id; });
    } else if(act === 'addit'){
      var dd = t.days.filter(function(x){ return String(x.id) === b.dataset.day; })[0];
      if(!dd) return;
      var ni = newItem(); dd.items.push(ni); newItemId = ni.id;
    } else if(act === 'delit'){
      var dd2 = t.days.filter(function(x){ return String(x.id) === b.dataset.day; })[0];
      if(!dd2) return;
      var it3 = dd2.items.filter(function(x){ return String(x.id) === b.dataset.id; })[0];
      if(it3 && (String(it3.title || '').trim() || String(it3.note || '').trim() || String(it3.place || '').trim()) && !confirm('確定要刪除這個行程嗎？')) return;
      dd2.items = dd2.items.filter(function(x){ return String(x.id) !== b.dataset.id; });
    } else if(act === 'addbk'){
      t.bookings.push({ id:uid(), type:'航班', name:'', time:'', code:'', note:'' });
    } else if(act === 'delbk'){
      if(!confirm('確定要刪除這筆預訂資料嗎？')) return;
      t.bookings = t.bookings.filter(function(x){ return String(x.id) !== b.dataset.id; });
    } else if(act === 'addstay'){
      var prev = t.stays.length ? t.stays[t.stays.length - 1] : null;
      t.stays.push({ id:uid(), name:'', checkin: prev ? (prev.checkout || '') : (t.start || ''), checkout: prev ? '' : (t.end || ''), address:'', code:'', note:'' });
    } else if(act === 'delstay'){
      var sx = t.stays.filter(function(x){ return String(x.id) === b.dataset.id; })[0];
      if(sx && (String(sx.name || '').trim() || String(sx.address || '').trim() || String(sx.code || '').trim()) && !confirm('確定要刪除這筆住宿資料嗎？')) return;
      t.stays = t.stays.filter(function(x){ return String(x.id) !== b.dataset.id; });
    } else if(act === 'addck'){
      t.checklist.push({ id:uid(), text:'', done:false });
    } else if(act === 'delck'){
      var ck0 = t.checklist.filter(function(x){ return String(x.id) === b.dataset.id; })[0];
      if(ck0 && String(ck0.text || '').trim() && !confirm('確定要刪除這個清單項目嗎？')) return;
      t.checklist = t.checklist.filter(function(x){ return String(x.id) !== b.dataset.id; });
    } else if(act === 'tpl'){
      var have2 = {};
      t.checklist.forEach(function(x){ have2[x.text] = 1; });
      TEMPLATES[t.kind === 'fan' ? 'fan' : 'general'].forEach(function(tx){
        if(!have2[tx]) t.checklist.push({ id:uid(), text:tx, done:false });
      });
    } else if(act === 'addexp'){
      t.expenses.push({ id:uid(), cat:'其他', name:'', amount:'', cur:(t.currency || 'TWD') });
    } else if(act === 'delexp'){
      var ex0 = t.expenses.filter(function(x){ return String(x.id) === b.dataset.id; })[0];
      if(ex0 && (String(ex0.name || '').trim() || String(ex0.amount == null ? '' : ex0.amount).trim()) && !confirm('確定要刪除這筆花費嗎？')) return;
      t.expenses = t.expenses.filter(function(x){ return String(x.id) !== b.dataset.id; });
    }
    renderDetail(); doPersist();
    if(act === 'addbk'){
      var lastBk = t.bookings[t.bookings.length - 1];
      var inb = $('detail').querySelector('input[data-b="' + lastBk.id + '"][data-k="name"]');
      if(inb) inb.focus();
    }
    if(newItemId){
      var inItem = $('detail').querySelector('input[data-i="' + newItemId + '"][data-k="title"]');
      if(inItem) inItem.focus();
    }
    if(act === 'addstay'){
      var lastSt = t.stays[t.stays.length - 1];
      var ins = $('detail').querySelector('input[data-s="' + lastSt.id + '"][data-k="name"]');
      if(ins) ins.focus();
    }
    if(act === 'addck'){
      var lastCk = t.checklist[t.checklist.length - 1];
      var inp = $('detail').querySelector('input[data-c="' + lastCk.id + '"][data-k="text"]');
      if(inp) inp.focus();
    }
  });
  // 在清單項目按 Enter 直接新增下一項（輸入法選字時的 Enter 不算）
  $('detail').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
    if(!e.target.matches('.ck input[data-k="text"]')) return;
    e.preventDefault();
    e.target.dispatchEvent(new Event('change', {bubbles:true}));
    var add = $('detail').querySelector('button[data-do="addck"]');
    if(add) add.click();
  });

  // ---- 簡易路由：#/t/旅程id 顯示詳細頁，其餘顯示列表 ----
  function route(){
    var m = location.hash.match(/^#\/t\/(.+)$/);
    currentId = m ? decodeURIComponent(m[1]) : null;
    var inDetail = !!currentId && loaded;
    document.body.classList.toggle('wide', inDetail);
    var entering = inDetail && shownId !== currentId;   // 剛進入這趟旅程（不是同步資料造成的重繪）
    if(entering){ saveMsg = '變更會自動儲存'; saveDirty = false; editMode = isBlank(cur()); dayFilter = 'all'; }   // 全新的空白旅程直接進編輯，其餘先看內容
    shownId = inDetail ? currentId : null;
    $('head').hidden = inDetail;
    $('detail').hidden = !inDetail;
    if(!auth.currentUser){ return; }
    $('app').hidden = inDetail;
    if(inDetail){ renderDetail(); if(entering) window.scrollTo(0, 0); }
    else if(loaded){ render(); }
  }
  window.addEventListener('hashchange', route);

  // ---- 回到最上方按鈕：往下捲一段後才出現 ----
  (function(){
    var btn = $('totop');
    function toggle(){ btn.hidden = window.scrollY < 400; }
    window.addEventListener('scroll', toggle, { passive:true });
    btn.addEventListener('click', function(){
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top:0, behavior: calm ? 'auto' : 'smooth' });
    });
    toggle();
  })();

  // ---- 離線支援：註冊 service worker（需要 https，sw.js 要和本檔放在同一個資料夾） ----
  // 切到別的 App、鎖螢幕或關掉分頁時，先讓正在輸入的欄位送出變更（手機上不一定會觸發「離開欄位」）
  function flushEdits(){
    var ae = document.activeElement;
    if(ae && ae !== document.body && $('detail').contains(ae) && ae.blur) ae.blur();
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushEdits(); });
  window.addEventListener('pagehide', flushEdits);
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('service worker 註冊失敗：', e); });
    });
  }
</script>
</body>
</html>
