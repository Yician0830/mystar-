<!DOCTYPE html>
<html lang="zh-Hant" data-field="line">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>旅遊紀錄 — ARCHIVE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅遊紀錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script>
  // 深淺色主題：跟著系統設定，系統切換時即時更新
  (function(){
    try{
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var apply = function(){ document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); };
      apply();
      if(mq.addEventListener) mq.addEventListener('change', apply); else if(mq.addListener) mq.addListener(apply);
    }catch(e){}
  })();
</script>
<style>
  :root{
    --paper:#f4f2ec; --ink:#15130f; --ink-dim:#453f30; --ink-faint:#6b6552;
    --line:rgba(21,19,15,0.14); --line-strong:rgba(21,19,15,0.4);
    --accent:#9a5808; --danger:#cc2036; --fill:rgba(21,19,15,0.045);
    --display:'Archivo Black','Noto Sans TC',sans-serif;
    --maru:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  html[data-theme="dark"]{
    --paper:#17150f; --ink:#f2efe6; --ink-dim:#cfc7b4; --ink-faint:#8f8772;
    --line:rgba(242,239,230,0.14); --line-strong:rgba(242,239,230,0.4);
    --accent:#eaa540; --danger:#ff6b7d; --fill:rgba(242,239,230,0.07);
  }
  :root{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--maru); min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:820px; margin:0 auto; padding:28px 28px 64px;}
  .back{display:inline-block; font-size:13px; font-weight:500; letter-spacing:0.08em; color:var(--ink-dim); text-decoration:none; padding:3px 10px; border:1px solid var(--ink);}
  .back:hover,.back:focus-visible{background:var(--ink); color:var(--paper);}
  header{padding:clamp(28px,7vh,64px) 0 clamp(20px,4vh,36px);}
  header svg{width:30px; height:30px; color:var(--accent); margin-bottom:12px;}
  h1{font-weight:900; font-size:clamp(30px,6vw,48px); letter-spacing:0.03em; line-height:1.2;}
  header p{margin-top:10px; color:var(--ink-dim); font-size:15px; line-height:1.7;}

  form{border-top:1px solid var(--line-strong); padding:22px 0 28px; display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  label{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .full{grid-column:1 / -1;}
  input,textarea,select{font:inherit; font-size:16px; font-weight:500; color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--line-strong); padding:9px 2px; border-radius:0;}
  input:focus,textarea:focus,select:focus{outline:none; border-bottom-color:var(--accent); box-shadow:0 1px 0 0 var(--accent);}
  textarea{resize:vertical; min-height:72px; padding:9px 11px; background:var(--fill); border-bottom-color:var(--line); field-sizing:content;}
  input[type="checkbox"]{border:0; box-shadow:none;}
  input[type="checkbox"]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button{font:inherit; font-size:15px; font-weight:700; letter-spacing:0.06em; color:var(--paper); background:var(--ink); border:0; padding:11px 22px; cursor:pointer; justify-self:start;}
  button:hover,button:focus-visible{background:var(--accent);}

  .list{border-top:1px solid var(--line-strong);}
  .trip{padding:22px 0; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:flex-start;}
  .trip .main{flex:1; min-width:0;}
  .trip .name{font-weight:900; font-size:clamp(20px,3.2vw,26px); letter-spacing:0.03em; line-height:1.3;}
  .trip .where{margin-top:4px; font-size:15px; font-weight:500; color:var(--accent);}
  .trip .meta{margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .trip .meta .mbrk{flex-basis:100%; height:0; margin:-4px 0 0;}
  .trip .meta b{color:var(--ink-dim); font-weight:700;}
  .trip .ttl{margin-top:10px; display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 8px; color:var(--accent);}
  .trip .ttl .ttll{font-size:13px; font-weight:900; letter-spacing:0.08em;}
  .trip .ttl .ttln{font-size:24px; font-weight:900; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:0;}
  .trip .ttl .ttlu{font-size:14px; font-weight:700;}
  .trip .ttl .ttlw{font-size:12px; font-weight:500; color:var(--ink-faint);}
  .trip .note{margin-top:10px; font-size:14px; line-height:1.7; color:var(--ink-dim); white-space:pre-wrap;}
  .del{background:transparent; color:var(--ink-faint); padding:4px 8px; font-size:13px; font-weight:500; letter-spacing:0;}
  .del:hover,.del:focus-visible{background:transparent; color:var(--danger);}
  .empty{padding:40px 0; text-align:center; color:var(--ink-faint); font-size:15px;}
  @media (max-width:520px){
    .wrap{padding:20px 20px 56px;}
    form{grid-template-columns:1fr;}
  }
  /* 手機：編輯／刪除改成浮在卡片右上角，內容區才能撐滿整個螢幕寬度 */
  @media (max-width:759px){
    .list .trip{position:relative; display:block;}
    .list .trip .main{width:100%;}
    .list .trip .acts{position:absolute; top:14px; right:0; display:flex;}
    .list .trip .ksum{width:100%; margin-right:0; font-size:13px;}
    .list .trip .ksum div{gap:8px;}
    .list .trip .where,.list .trip .name,.list .trip .note{max-width:100%; overflow-wrap:anywhere; word-break:normal;}
    .list .trip .where{line-height:1.5;}
  }

  .payrow{flex-direction:row; align-items:center; gap:10px; margin:6px 0;}
  .payrow select{flex:1; min-width:0;}
  .fneed{font-weight:900; font-size:1.18em; color:var(--accent);}
  .fneed .fnsub{font-size:0.75em; font-weight:500; color:var(--ink-faint);}
  [hidden]{display:none !important;}
  .login{border-top:1px solid var(--line-strong); padding:32px 0 8px;}
  .login p{color:var(--ink-dim); font-size:15px; line-height:1.7; margin-bottom:18px; max-width:460px;}
  .err{margin-top:14px; font-size:14px; color:var(--danger);}
  .who{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line-strong); font-size:13px; font-weight:500; color:var(--ink-dim);}
  .who button{background:transparent; color:var(--ink-faint); padding:2px 6px; font-size:13px; font-weight:500; letter-spacing:0;}
  .who button:hover,.who button:focus-visible{background:transparent; color:var(--accent);}
  .who + #app form{border-top:0; padding-top:12px;}
  /* 詳細頁時頁首標題被隱藏，「← ARCHIVE」會直接貼著登入列的上線，補一點間距 */
  #head[hidden] ~ .who{margin-top:16px;}
.tabs{display:flex; gap:8px; padding:0 0 16px; flex-wrap:wrap;}
  .tabs button{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); padding:5px 14px; font-size:13px; font-weight:700; letter-spacing:0.04em;}
  .tabs button:hover,.tabs button:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .tabs button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tag{display:inline-block; font-size:12px; font-weight:700; letter-spacing:0.06em; padding:1px 8px; margin-bottom:8px; border:1px solid var(--line-strong); color:var(--ink-dim);}
  .tag.fan{background:var(--accent); border-color:var(--accent); color:var(--paper);}
.actions{display:flex; gap:10px; flex-wrap:wrap;}
  .acts{display:flex; gap:2px; flex:0 0 auto;}
  .ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong);}
  .ghost:hover,.ghost:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .del[data-act="edit"]:hover,.del[data-act="edit"]:focus-visible{color:var(--accent);}
  .editnote{font-size:14px; font-weight:700; color:var(--accent);}
  .grp{padding:16px 0 4px; font-size:13px; font-weight:700; letter-spacing:0.08em; color:var(--ink-dim);}
  .count{color:var(--accent); font-weight:700;}
  .trip .meta .count{font-size:17px; font-weight:900; letter-spacing:0.02em;}
  .trip .meta .count.soon{color:var(--danger);}
  .grpbtn{display:flex; align-items:center; gap:8px; width:100%; background:transparent; border:0; text-align:left; cursor:pointer; font-family:inherit;}
  .grpbtn:hover,.grpbtn:focus-visible{color:var(--accent); background:transparent;}
  .grpbtn .gch{display:inline-block; transition:transform .2s; transform:rotate(-90deg);}
  .grpbtn[aria-expanded="true"] .gch{transform:none;}
a.name{display:block; color:inherit; text-decoration:none;}
  a.name:hover,a.name:focus-visible{color:var(--accent);}
  .dhead{padding:clamp(20px,5vh,40px) 0 20px;}
  .dhead{position:relative;}
  .secnav{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .secnav .mini{padding:4px 10px; font-size:12px;}
  @media (min-width:1100px){ .secnav{position:absolute; right:0; top:clamp(20px,5vh,40px); max-width:46%; justify-content:flex-end; margin-top:0;} }
  .dhead h2{font-weight:900; font-size:clamp(26px,5vw,40px); letter-spacing:0.03em; line-height:1.25; margin-top:4px;}
  .dhead .dm{margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .sec{padding:26px 0 12px;}
  .sh{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .sh h3{font-size:17px; font-weight:900; letter-spacing:0.04em;}
  .sh .btns{display:flex; gap:8px; flex-wrap:wrap;}
  .mini{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); padding:4px 12px; font-size:13px; font-weight:700; letter-spacing:0.03em;}
  .mini:hover,.mini:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  .grid input,.grid select,.grid textarea,.day input,.day textarea,.exp input,.exp select{width:100%; min-width:0;}
  .day{background:var(--fill); padding:14px; margin-bottom:12px;}
  .dh{display:grid; grid-template-columns:auto 150px 1fr auto; gap:8px; align-items:center; margin-bottom:8px;}
  .dh b{font-size:14px; letter-spacing:0.04em; color:var(--accent);}
  .day textarea{min-height:76px; line-height:1.7; background:var(--paper);}
  .exp{display:grid; grid-template-columns:96px 1fr 120px auto; gap:8px; margin-bottom:8px; align-items:center;}
  .total{font-size:18px; font-weight:700; margin-top:14px;}
  .total b{font-size:24px; color:var(--accent);}
  .chips{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-size:13px; font-weight:500; color:var(--ink-faint);}
  .chips b{color:var(--ink-dim);}
  @container (max-width:400px){
    .dh{grid-template-columns:1fr auto; }
    .dh b{grid-column:1 / -1;}
    .dh input[type="date"]{grid-column:1 / -1;}
    .dh input:not([type="date"]){grid-column:1 / 2;}
    .exp{grid-template-columns:1fr 1fr auto;}
    .exp input[data-k="name"]{grid-column:1 / -1; order:-1;}
  }
.sh h3 small{font-size:13px; font-weight:700; color:var(--accent); margin-left:8px; letter-spacing:0.04em;}
  .ck{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .ck input[type="checkbox"]{flex:0 0 auto; width:20px; height:20px; padding:0; accent-color:var(--accent); cursor:pointer;}
  .ck input[data-k="text"]{flex:1; min-width:0;}
  .ck.done input[data-k="text"]{text-decoration:line-through; color:var(--ink-faint);}
.bk{background:var(--fill); padding:14px; margin-bottom:12px; display:grid; gap:8px;}
  .bk input,.bk select,.bk textarea{width:100%; min-width:0;}
  .bk textarea{min-height:56px; line-height:1.6; background:var(--paper);}
  .bh{display:grid; grid-template-columns:96px 1fr auto; gap:8px; align-items:center;}
  .bg{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .bcode{display:flex; gap:6px; align-items:center;}
  .bcode .mini{flex:0 0 auto;}
  @container (max-width:400px){
    .bh{grid-template-columns:1fr auto;}
    .bh select{grid-column:1 / -1;}
    .bg{grid-template-columns:1fr;}
  }

  /* 預算進度提醒：花到 80% 變橘、超過變紅 */
  :root{--warn:#c2410c;} html[data-theme="dark"]{--warn:#ff9f5a;}
  .left.warn{color:var(--warn);}
  .ccard.lv-warn{border-left:3px solid var(--warn);}
  .ccard.lv-over{border-left:3px solid var(--danger);}
  .budalert{margin:0 0 20px; padding:8px 14px; background:var(--fill); border-left:4px solid var(--warn); font-size:13px; font-weight:700; line-height:1.7; color:var(--ink-dim);}
  .budalert.over{border-left-color:var(--danger);}
  .budalert b{color:var(--ink); font-weight:900;}
  .budalert .over{color:var(--danger);} .budalert .warn{color:var(--warn);}
  /* 金額輸入防呆 */
  .amtwarn{grid-column:1 / -1; flex-basis:100%; margin-top:4px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:12px; font-weight:700; line-height:1.6; color:var(--danger);}
  .amtwarn .mini{padding:1px 10px; font-size:12px;}
  input[aria-invalid="true"]{border-bottom-color:var(--danger);}
  /* 分攤花費 */
  .plabel{margin:10px 0 4px;}
  .xsplit{display:grid; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .xsplit select{width:100%;}
  .xsplit .sharers{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px;}
  .xsplit .sharers[hidden]{display:none;}
  .xsplit .sharers label{flex-direction:row; align-items:center; gap:6px; font-size:14px; font-weight:500; color:var(--ink);}
  .xsplit .sharers input{width:18px; height:18px; padding:0; accent-color:var(--accent); cursor:pointer;}
  .split{margin-top:14px; padding-top:10px; border-top:1px solid var(--line-strong); display:grid; gap:6px; font-size:13px;}
  .split .sph{font-weight:900; letter-spacing:0.04em; color:var(--ink-dim);}
  .split .sph small{font-weight:500; color:var(--ink-faint); margin-left:6px;}
  .split .spr{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 12px; align-items:baseline; padding:4px 0; border-bottom:1px solid var(--line);}
  .split .spr b{font-size:14px; overflow-wrap:anywhere;}
  .split .spr .spd{grid-column:1; font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
  .split .spr .spn{grid-column:2; grid-row:1 / span 2; align-self:center; font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .split .spr .spn.get{color:var(--accent);}
  .split .xfer{padding:6px 10px; background:var(--fill); border-left:3px solid var(--accent); font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;}
  .split .sgrp{border:1px solid var(--line); background:var(--fill); border-left:3px solid var(--accent); padding:8px 12px 6px;}
  .split .sgh{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; padding-bottom:4px; border-bottom:1px solid var(--line);}
  .split .sgh b{font-weight:900;}
  .split .sgt{font-size:13px; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .split .sgr{display:flex; justify-content:space-between; gap:8px; padding:5px 0 0; font-size:14px; font-variant-numeric:tabular-nums;}
  .split .sgr b{font-weight:900;}

  /* 旅行統計 */
  .stats{margin:0 0 20px; padding:14px 16px; background:var(--fill); border-left:4px solid var(--accent); display:grid; gap:12px;}
  .stats[hidden]{display:none;}
  .stats .sthd{font-size:13px; font-weight:900; letter-spacing:0.08em; color:var(--ink-dim);}
  .stats .sthd small{margin-left:8px; font-weight:500; letter-spacing:0; color:var(--ink-faint);}
  .stats .sttiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px 16px;}
  .stats .stt{display:grid; gap:2px; min-width:0;}
  .stats .stt .stl{font-size:12px; font-weight:700; color:var(--ink-faint);}
  .stats .stt .stn{font-size:24px; font-weight:900; line-height:1.15; font-variant-numeric:tabular-nums; color:var(--accent);}
  .stats .stt .stn small{font-size:13px; font-weight:700; color:var(--ink-dim); margin-left:3px;}
  .stats .stt .sts{font-size:12px; color:var(--ink-faint);}
  .stats .stcities{display:flex; flex-wrap:wrap; gap:6px;}
  .stats .stc{background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); padding:2px 10px; font-size:12px; font-weight:700; letter-spacing:0;}
  .stats .stc:hover,.stats .stc:focus-visible{background:transparent; color:var(--accent); border-color:var(--accent);}
  .stats .stc[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  /* 每天的天氣、整天路線 */
  .dsub.dx{display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; padding-top:2px;}
  .dx .wx{font-size:13px; font-weight:700; color:var(--ink-dim); font-variant-numeric:tabular-nums;}
  .dx .wx:empty{display:none;}
  .dx .wx small{margin-left:6px; font-size:11px; font-weight:500; color:var(--ink-faint);}
  .dx .rtl{font-size:12px; font-weight:700; color:var(--accent); text-decoration:none; border:1px solid var(--accent); padding:1px 8px; white-space:nowrap;}
  .dx .rtl:hover,.dx .rtl:focus-visible{background:var(--accent); color:var(--paper);}
  #wxnote:empty{display:none;}
  .mgrow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--line-strong);}
  .mgact{display:flex; align-items:center; gap:6px; flex:none;}
  .mgp{font-size:12px; color:var(--ink-dim);}
  .mgtag{font-style:normal; font-size:11px; font-weight:700; color:var(--danger); border:1px solid var(--danger); padding:0 4px;}
  .mgsum{margin-top:6px;} .mgsum:empty{display:none;}
  .mgedit{flex:0 0 100%; display:grid; gap:8px; margin:2px 0 8px; padding:10px; background:var(--paper); border:1px solid var(--line-strong); border-left:3px solid var(--accent);}
  .mgedit label{display:grid; gap:2px; min-width:0; font-size:12px; font-weight:700; color:var(--ink-dim);}
  .mgedit input,.mgedit select,.mgedit textarea{min-width:0; width:100%;}
  .mgedit .mge3{display:grid; grid-template-columns:1.4fr 0.9fr 0.8fr; gap:6px;}
  .mgedit .mgef{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .mgpri{font-style:normal; font-size:11px; font-weight:700; padding:0 4px; border:1px solid var(--accent); color:var(--accent);}
  .mgpri.must{background:var(--accent); color:var(--paper);} .mgpri.low{border-color:var(--line-strong); color:var(--ink-faint);}
  .mggh{display:flex; align-items:center; gap:8px; margin:12px 0 2px; font-size:13px; font-weight:900; color:var(--accent); letter-spacing:0.04em;}
  .mggh:first-of-type{margin-top:4px;} .mggh small{font-weight:700; color:var(--ink-faint);} .mggh .lk{font-size:12px;}
  .mgtgs select,.mgedit .mgefl select{width:auto; padding:2px 6px; font-size:13px;}
  .mgedit .mgefl{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .mgedit .mge2{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .mgedit .mgfee{margin:0;} .mgedit .mgfee:empty,.mgedit .mgexp:empty{display:none;}
  .mgtgs #mgcap{width:6.6em;}
  .mgtgd{position:relative;}
  .mgtgd>summary{list-style:none; cursor:pointer; width:auto; padding:2px 6px; font-size:13px; white-space:nowrap; color:var(--ink-dim); background:var(--paper); border:1px solid var(--line-strong);}

  .spv{padding:9px 14px 9px 14px; gap:6px;}

  .dtabs{display:grid; grid-template-columns:repeat(var(--dcols,6),minmax(0,1fr)); gap:6px; width:100%; max-width:none; margin-bottom:12px; padding:8px 0; box-shadow:0 12px 0 0 var(--paper); position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--barh,58px)); z-index:4; background:var(--paper);}

  /* 卡片上的關鍵資訊摘要 */
  .trip .due,.meta .due b{color:var(--danger); font-weight:700;}
  .nobuy{display:inline-block; color:var(--danger); font-weight:900; font-size:1.05em; line-height:1.5; padding:0 8px; margin:0 2px; border:1px solid var(--danger); border-radius:3px; letter-spacing:0.06em;}
  .dueok{color:var(--ink-faint); font-size:13px;}
  .shows{display:grid; gap:8px;}
  .shows .shd{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .shcard{padding:10px 12px; background:var(--fill); border:1px solid var(--line);}
  .shbtns{display:inline-flex; align-items:center; gap:6px;}
  .shbtns .dcl{white-space:nowrap;}
  .shcard .shn{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; font-weight:900; color:var(--ink-faint);}
  .kv dd div + div{margin-top:3px;}
  .kv > div.shwrap{grid-template-columns:minmax(0,1fr); gap:8px;}
  .kv .shlist{display:grid; gap:8px;}
  .kv .shlist div + div{margin-top:0;}
  .shv{display:grid; gap:6px; padding:10px 12px 10px 14px; background:var(--fill); border-left:3px solid var(--accent);}
  .shv.past{opacity:0.6; border-left-color:var(--line-strong);}
  .shv-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  /* 場次超過一筆：每張卡片預設收合，只留日期／狀態／倒數，點開看入場時間、座位、票價 */
  .shdet>summary{list-style:none; cursor:pointer; min-height:32px;}
  .shv.shv-c{padding:4px 12px 4px 14px;}
  .shv-seatin{flex:1 1 140px; min-width:0; font-size:14px; font-weight:700; color:var(--ink-dim); overflow-wrap:anywhere;}
  .shdet>summary.shv-top{gap:6px 12px; min-height:40px;}
  .shdet[open] .shv-body{padding-bottom:6px;}
  .shdet>summary::-webkit-details-marker{display:none;}
  .shdet>summary::after{content:''; flex:0 0 auto; width:8px; height:8px; margin-left:4px; border-right:2px solid var(--ink-dim); border-bottom:2px solid var(--ink-dim); transform:rotate(45deg) translate(-2px,-2px); transition:transform .15s;}
  .shdet[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px);}
  .shdet>summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .shdet .shv-body{display:grid; gap:6px; margin-top:6px;}
  .shv-no{flex:0 0 auto; min-width:22px; height:22px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center; background:var(--ink); color:var(--paper); font-size:12px; font-weight:900;}
  .shv-date{font-size:17px; font-weight:900; letter-spacing:0.01em;}
  .shv-date small{font-size:13px; font-weight:700; color:var(--ink-faint); margin-left:3px;}
  .shv-left{margin-left:auto; font-size:13px; font-weight:700;}
  .shv-times{display:flex; flex-wrap:wrap; gap:2px 16px; font-size:14px; color:var(--ink-dim);}
  .shv-times b{color:var(--ink); font-weight:700;}
  .shv-seat{font-size:15px; font-weight:700; color:var(--ink);}
  .shv-seat span{display:inline-block; margin-right:8px; padding:0 6px; font-size:11px; font-weight:900; letter-spacing:0.06em; color:var(--ink-faint); border:1px solid var(--line-strong);}
  .vmuted{color:var(--ink-dim); font-size:13px;}
  .shv-back{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 14px; font-size:13px; color:var(--ink-dim);}
  .shv-back b{font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums;}
  .shv-gap{font-weight:700; width:100%;}
  .shv-gap.ok{color:var(--ink-faint);}
  .shv-gap.tight{color:#c0392b;}
  .shv-price{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:2px 12px; padding-top:6px; border-top:1px dashed var(--line-strong); font-size:13px; color:var(--ink-dim);}
  .shv-price b{font-size:15px; color:var(--accent); font-variant-numeric:tabular-nums;}
  .shpay{display:grid; grid-template-columns:minmax(0,1fr) 5.5em 5em; gap:10px 14px; margin-top:10px; align-items:end;}
  @container (max-width:340px){ .shpay{grid-template-columns:minmax(0,1fr) minmax(0,1fr);} .shpay label:first-child{grid-column:1 / -1;} }
  .ksum{margin-top:10px; padding:8px 12px; background:var(--fill); display:grid; gap:4px; font-size:13px; line-height:1.6; color:var(--ink-dim);}
  .trip .ksum div{display:flex; gap:10px; min-width:0;}
  .trip .ksum em{font-style:normal; font-weight:700; color:var(--ink-faint); flex:0 0 auto; min-width:2.6em;}
  .trip .ksum span{min-width:0; overflow-wrap:anywhere;}
  .trip .ksum .kp{display:inline-block; max-width:100%;}
  .trip .ksum code{font-size:12px; background:var(--line); padding:0 5px;}
  /* 寬螢幕：列表頁加寬，旅程卡片排成多欄 */
  @media (min-width:760px){
    body:not(.wide) .wrap{max-width:1400px;}
    .list{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
    .list .grp{grid-column:1 / -1; padding:20px 0 0;}
    .list .trip{position:relative; flex-direction:column; gap:0; padding:18px 20px 20px; border:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong);}
    .list .trip .acts{position:absolute; top:12px; right:12px;}
  }
  @media (min-width:1100px){
    .list{grid-template-columns:repeat(3,minmax(0,1fr));}
  }
  /* 多幣別花費 */
  .exp{grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr) auto;}
  .exp input[data-k="name"]{grid-column:1 / -1; order:-1;}
  .exp select.ecur{padding-left:0; padding-right:0;}
  .dcl{font-size:12px; font-weight:500; color:var(--ink-faint); align-self:center;}
  .rate{display:grid; gap:6px;}
  .rate .rhint{font-size:12px; color:var(--ink-faint);}
  .approx.warn{color:var(--danger);}
  .xcard .xa small{font-size:12px; font-weight:700; color:var(--ink-faint);}
  .xcard .xs{font-size:12px; color:var(--ink-faint);}
  .xcard .xa .xpre{display:block; width:fit-content; margin:2px 0 0 auto; font-size:11px; font-weight:700; color:var(--ink-dim); border:1px solid var(--line-strong); border-radius:99px; padding:0 7px; line-height:1.6; letter-spacing:0.03em;}
  /* 旅程詳細頁：最上方的「← ARCHIVE」不需要，只留「← 旅遊紀錄」 */
  body.wide .wrap > a.back{display:none;}
  /* 行程離開時間／停留時長 */
  .iet{display:grid; grid-template-columns:148px minmax(0,1fr); gap:8px; align-items:center;}
  .idurt{font-size:13px; font-weight:500; color:var(--ink-faint);}
  .idurt.has{font-weight:700; color:var(--accent);}
  .pill[data-v="停留"]{--c:#8a6d3b;}
  .pill[data-v="現場候位"]{--c:#b8741a;}
  .icard .itrans{font-size:13px; font-weight:500; color:var(--ink-dim); overflow-wrap:anywhere;}
  .icard .itrans b{font-weight:900; color:var(--ink);}
  .ie4{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:8px;}
  @container (max-width:300px){ .ie4{grid-template-columns:minmax(0,1fr);} }
  /* 旅程詳細頁：最上方沒有「← ARCHIVE」了，登入列頂端的線也一併拿掉 */
  body.wide .who{border-top:0; margin-top:0;}
  /* 花費明細：一列固定兩張卡片（數量多時不會拉太長）；連結小標籤不截斷，卡片裡放不下就在標籤內自動換行；很窄的欄位才改成一列一張 */
  .lks{display:flex; flex-wrap:wrap; gap:6px; max-width:none; min-width:0;}
  .lk{width:auto; max-width:100%; white-space:normal; overflow:visible; text-overflow:clip; overflow-wrap:anywhere; text-align:left; line-height:1.5;}
  .xgrid{display:grid; grid-template-columns:minmax(0,1fr); gap:4px; align-items:start;}
  .xgrid .xcard{width:auto; min-width:0; max-width:none; grid-template-columns:minmax(0,1fr) auto; column-gap:12px; row-gap:3px; align-items:center; padding:8px 12px;}
  .xgrid .xcard .xn{font-size:14px; line-height:1.4;}
  .xgrid .xcard .xa{font-size:15px; text-align:right; white-space:nowrap;}
  .xgrid .xcard .xap{grid-column:2; grid-row:2; text-align:right; white-space:nowrap; font-size:11px;}
  .xgrid .xcard .lks{grid-column:1; grid-row:2; gap:4px;}
  .xgrid .xcard .lk{font-size:11px; padding:1px 6px;}
  .xgrid .xcard .xw{grid-column:1 / -1;}
  .ssub{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;}
  .ssub .xtog{margin-left:auto; display:inline-flex; gap:4px;}
  .ssub .xtog .mini{padding:2px 10px; font-size:12px; min-height:0;}
  .ssub .xtog .mini[aria-pressed="true"],.ssub .xtog .mini[aria-pressed="true"]:hover{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .xdh{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; padding:0 2px 2px; font-size:12px; font-weight:900; color:var(--ink-dim); border-bottom:1px solid var(--line-strong);}
  .xdh:first-child{margin-top:0;}
  .xdh b{color:var(--accent); font-variant-numeric:tabular-nums;}
  .approx .left{font-size:13px; text-align:left;}
  .ccard.clk{cursor:pointer; transition:border-color .15s, background .15s;}
  .ccard.clk:hover{border-color:var(--accent);}
  .ccard.clk:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .ccard.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .ssub .xhint{font-weight:500; letter-spacing:0; color:var(--ink-faint);}
  .ssub .mini{vertical-align:middle;}
  .xgrid .xempty{grid-column:1 / -1;}
  /* 編輯模式的精簡清單列＋彈跳窗 */
  .crow{display:flex; align-items:center; gap:8px; padding:8px 8px 8px 12px; margin:0 0 6px; background:var(--fill); border:1px solid var(--line); cursor:pointer;}
  .crow:hover,.crow:focus-visible{border-color:var(--accent); outline:0;}
  .crow .cmain{flex:1; min-width:0;}
  .crow .c1{font-size:14px; font-weight:700; overflow-wrap:anywhere;}
  .crow .c2{font-size:12px; color:var(--ink-faint); margin-top:2px; overflow-wrap:anywhere;}
  .crow .cright{flex:0 0 auto; font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; font-size:14px;}
  .crow .cright small{font-size:11px; color:var(--ink-faint); font-weight:700;}
  .emodal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.5);}
  .emodal.on{display:flex;}
  .emodal .mbox{container-type:inline-size; width:min(600px,100%); max-height:100%; overflow:auto; background:var(--paper); border:1px solid var(--line-strong); padding:16px 18px 18px; box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .emodal .mhead h3{margin:0 0 12px; font-size:17px;}
  .emodal .mvday{display:grid; gap:4px; margin:0 0 12px; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .emodal .mvday select{width:100%;}
  .emodal .mfoot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; position:sticky; bottom:-18px; padding:10px 0 0; background:var(--paper);}
  .tcdlg-box{width:min(420px,100%) !important;}
  .tcdlg-body{display:grid; gap:12px;}
  .tcdlg-f{display:grid; gap:4px; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .tcdlg-f input{width:100%; min-width:0; font-size:16px;}   /* 16px：iPhone 點輸入框不會自動放大 */
  .tcdlg-err{min-height:1.2em; font-size:13px; font-weight:700; color:var(--danger);}
  .tcdlg-ok{font-weight:900; color:var(--accent); border-color:var(--accent);}
  .xcard.xwarn{border-style:dashed;}
  .xcard .xs.xw{color:var(--danger); font-weight:700;}
  .dsub .dsum{margin-left:10px; font-size:13px; font-weight:700; color:var(--accent);}
  .rate .rrow{display:grid; gap:4px;}
  .rate .rmeta{font-size:12px; color:var(--ink-faint);}
  .rate .rmeta:empty{display:none;}
  .nw{white-space:nowrap;}
  .bk.v .stime{font-size:13px; letter-spacing:-0.01em;}
  .itx{display:grid; gap:6px;}
  .itx[hidden]{display:none;}
  .itx .dhead{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .itx .dish{display:grid; grid-template-columns:1fr minmax(90px,34%) auto; gap:8px; align-items:center;}
  .itx .dish input{width:100%; min-width:0;}
  .itintro{font-size:13px; color:var(--ink-dim); line-height:1.7;}
  .dishes{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .dishes .dlabel{font-size:12px; font-weight:900; color:var(--accent); letter-spacing:0.06em; margin-right:2px;}
  .dishes .dchip{font-size:13px; font-weight:700; padding:2px 10px; border:1px solid var(--accent); border-radius:99px; background:var(--paper); color:var(--ink);}
  .dishes .dtotal{margin-left:auto; font-size:12px; font-weight:700; color:var(--ink-faint);}
  .dishes .dtotal b{color:var(--accent); font-size:14px; font-weight:900;}
  .itx .dsum{color:var(--accent); font-weight:900;}
  .itx .shopr{display:grid; grid-template-columns:auto minmax(0,1.1fr) minmax(0,1fr) auto; gap:8px; align-items:center;}
  .itx .shopr input[type="text"],.itx .shopr input:not([type]){width:100%; min-width:0;}
  .itx .shopr input[type="checkbox"]{width:20px; height:20px; padding:0; accent-color:var(--accent);}
  @container (max-width:420px){ .itx .shopr{grid-template-columns:auto minmax(0,1fr) auto;} .itx .shopr input[data-k="note"]{grid-column:2 / 3; grid-row:2;} }
  /* 交通移動：一步一列，左邊紅點＋細線串起來，重點步驟用淡黃底 */
  /* 轉乘路段／訂位提醒／周遊券比較 */
  .tlegs{margin-top:2px; padding:10px 14px 8px; background:var(--paper); border:1px solid var(--line); border-radius:6px;}
  .tlegs .tlh{font-size:13px; font-weight:700; color:var(--ink-dim); margin-bottom:6px;}
  .tlegs .tlr{display:flex; gap:8px; align-items:baseline; padding:3px 0; font-size:14px; flex-wrap:wrap;}
  .tlegs .tln{flex:0 0 auto; min-width:18px; height:18px; line-height:18px; text-align:center; border-radius:50%; background:var(--line-strong,#bbb); color:var(--paper,#fff); font-size:11px; font-weight:700;}
  .tlegs .tlb{flex:1 1 200px; min-width:0;}
  .tlegs .tlf{margin-left:auto; font-size:13px; font-weight:700; color:var(--accent,#9a5a00); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .tlegs .tlw{font-size:12px; color:var(--ink-faint); padding:0 0 2px 26px;}
  .tlegs .tlw.warn{color:#b3261e; font-weight:700;}
  .tlegs .tlt{font-size:13px; font-weight:700; color:var(--ink-dim); padding-top:4px; border-top:1px dashed var(--line); margin-top:4px;}
  .itx-legs>summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .itx .legr{display:flex; flex-wrap:wrap; gap:6px; padding:8px 0; border-bottom:1px dashed var(--line); align-items:center;}
  .itx .legr input{flex:1 1 90px; min-width:0; width:auto;}
  .itx .legr input[data-k="lfrom"], .itx .legr input[data-k="lto"]{flex:1 1 120px;}
  .itx .legr input[data-k="ldep"], .itx .legr input[data-k="larr"]{flex:0 1 84px;}
  .itx .legr input[data-k="lfare"]{flex:0 1 100px;}
  .itx .legr .del{flex:0 0 auto;}
  .irem{margin:2px 0; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .irem.due{color:#b3261e;}
  .fpass{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .fpass label{display:block; font-size:13px; font-weight:700; color:var(--ink-dim);}
  .fpass input{display:block; width:100%; margin-top:4px;}
  .fpass .fpc{margin-top:6px; font-size:13px; line-height:1.5;}
  .frem{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; line-height:1.6;}
  .frem .due{color:#b3261e; font-weight:700;}
  .tsteps{margin-top:2px; padding:10px 14px 8px; background:var(--paper); border:1px solid var(--line); border-radius:6px;}
  .tsteps .tsh{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:14px; font-weight:900; letter-spacing:0.04em; color:var(--danger);}
  .tsteps .tsr{position:relative; display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 12px; padding:6px 0 6px 24px;}
  .tsteps .tsr::before{content:""; position:absolute; left:2px; top:13px; width:10px; height:10px; border-radius:50%; background:var(--danger);}
  .tsteps .tsr::after{content:""; position:absolute; left:6px; top:24px; bottom:-6px; width:2px; background:var(--line-strong);}
  .tsteps .tsr:last-child::after{display:none;}
  .tsteps .tsl{flex:0 0 auto; min-width:2.6em; font-size:15px; font-weight:900; color:var(--ink);}
  .tsteps .tst{flex:1 1 0; min-width:0; font-size:15px; font-weight:500; line-height:1.5; color:var(--ink-dim); overflow-wrap:anywhere;}
  .tsteps .tst.hl{flex:0 1 auto; padding:0 8px; font-weight:900; color:var(--ink); background:rgba(234,165,64,0.28); border-radius:4px;}
  .itx .stepr{display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) auto auto; gap:8px; align-items:center;}
  .itx .stepr .ck{margin:0; white-space:nowrap;}
  @container (max-width:420px){ .itx .stepr{grid-template-columns:minmax(0,1fr) auto auto;} .itx .stepr input[data-k="text"]{grid-column:1 / -1; grid-row:2;} .itx .stepr .ck{grid-column:2; grid-row:1;} .itx .stepr .del{grid-column:3; grid-row:1;} }
  /* 中間欄分頁、推薦必買 */
  .midtabs{margin:0 0 14px; gap:8px;}
  .midtabs .mini{padding:7px 18px; font-size:14px;}
  .mgrow{flex-wrap:wrap;}
  .mgact .mglk{width:6.4em; padding:2px 2px; font-size:13px; color:var(--ink-dim); background:var(--paper); border:1px solid var(--line-strong); border-bottom:1px solid var(--line-strong);}
  .mgdone>summary,.mgaddd>summary{list-style:none; cursor:pointer; padding:8px 2px; font-size:14px; font-weight:900; color:var(--ink-dim);}
  .mgdone>summary::-webkit-details-marker,.mgaddd>summary::-webkit-details-marker{display:none;}
  .mgdone>summary::after{content:' ▸'; color:var(--ink-faint);} .mgdone[open]>summary::after{content:' ▾';}
  .mgaddd>summary{margin-top:8px; color:var(--accent);}
  .mgdone>summary:focus-visible,.mgaddd>summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mgtag2{font-style:normal; font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent); padding:0 4px;}
  .mgtgs{display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px;}
  .mgtgs .ck{margin:0;}
  .recgrid{display:flex; flex-wrap:wrap; gap:8px;}
  .recchip{padding:4px 12px; font-size:13px; font-weight:700; letter-spacing:0; color:var(--accent); background:transparent; border:1px solid var(--accent); border-radius:99px;}
  .recchip.on,.recchip.on:hover{color:var(--ink-faint); background:transparent; border-color:var(--line-strong); cursor:default;}
  .mgl{flex:0 0 100%; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:0 0 6px 30px;}
  .mgl .mglc{display:inline-flex; align-items:center; gap:2px; max-width:100%;}
  .mgl .mglc .del{padding:0 6px; font-size:16px;}
  .mgl select{width:auto; max-width:100%; min-width:0; padding:3px 6px; font-size:13px; font-weight:700; color:var(--ink-dim); background:var(--paper);}
  .buyhint{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 10px; background:rgba(234,165,64,0.14); border-left:3px solid var(--accent);}
  .buyhint .bhl{font-size:12px; font-weight:900; letter-spacing:0.06em; color:var(--accent);}
  .buyhint .bhc{padding:1px 10px; font-size:13px; font-weight:700; letter-spacing:0; color:var(--ink); background:var(--paper); border:1px solid var(--accent); border-radius:99px;}
  .buyhint .bhc:hover,.buyhint .bhc:focus-visible{background:var(--accent); color:var(--paper);}
  .buyhint .bhc.done{text-decoration:line-through; color:var(--ink-faint); border-color:var(--line-strong);}
  .mgwhere{font-style:normal; font-size:12px; font-weight:500; color:var(--ink-faint);}

  .ckbox{width:min(420px,100%);} .ckrow{display:flex; justify-content:space-between; gap:16px; padding:8px 0; border-bottom:1px solid var(--line-strong); font-size:15px;} .ckrow span{color:var(--ink-dim); font-weight:700;} .ckrow b{text-align:right;}

<div class="wrap">

<datalist id="tmodes"><option value="步行"><option value="JR"><option value="地鐵"><option value="電車"><option value="巴士"><option value="計程車"><option value="包車"><option value="租車"><option value="高鐵"><option value="飛機"><option value="渡輪"><option value="新幹線"><option value="纜車"><option value="單車"></datalist>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
  // 與推し手帳共用同一個 Firebase 專案，登入狀態在同一個網域底下自動共用
  var firebaseConfig = {
  apiKey: "AIzaSyBjclP4efWWcOTO88W_3tlcC4Za_hEIzW0",
  authDomain: "mystarlifeapp.firebaseapp.com",
  projectId: "mystarlifeapp",
  storageBucket: "mystarlifeapp.firebasestorage.app",
  messagingSenderId: "941753508434",
  appId: "1:941753508434:web:5bdf24eac9ee4514d8758b",
  measurementId: "G-FDX9867N4N"
};
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth(), db = firebase.firestore();
  // 離線快取：沒網路時仍可讀取（與編輯）上次同步的旅程，恢復連線後自動同步。要在其他 Firestore 呼叫之前執行
  var persistOK = false;
  db.enablePersistence({ synchronizeTabs: true }).then(function(){ persistOK = true; refreshOffline(); }).catch(function(e){
    console.warn('離線快取未啟用：', e.code);   // failed-precondition／unimplemented（例如無痕模式）時照常線上使用
  });
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});

  // 旅程存在 users/{uid}/data/travel-trips，跟手帳同一個位置與格式（{ value: [...] }）
  var KEY = 'travel-trips', OLD_LOCAL_KEY = 'travel-diary-v1';
  var trips = [], docRef = null, unsub = null;
  var $ = function(id){ return document.getElementById(id); };

  function esc(t){ return String(t).replace(/[\u{1D400}-\u{1D7FF}]/gu, function(c){ return c.normalize('NFKC'); }).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function d(s){ return s ? s.replace(/-/g,'.') : ''; }
  function showErr(m){ $('err').textContent = m || ''; }

  function persist(){
    if(!docRef || viewOnly) return Promise.resolve(true);
    return docRef.set({ value: trips }).then(function(){ scheduleShareSync(); return true; }, function(e){
      console.error(e); alert('儲存失敗，請檢查網路連線後再試一次'); return false;
    });
  }
  function readOldLocal(){
    try{ var a = JSON.parse(localStorage.getItem(OLD_LOCAL_KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }

  var filter = 'all', DAY = 86400000;
  function toDate(x){ if(!x) return null; var p = x.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  // 依日期自動判斷：接下來（還沒出發／旅途中）或已成行
  function phase(t){
    var n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var s0 = toDate(t.start), e0 = toDate(t.end) || s0;
    if(!s0) return {k:'past'};
    if(today < s0) return {k:'up', n:Math.round((s0 - today) / DAY)};
    if(today <= e0) return {k:'now', n:Math.round((today - s0) / DAY) + 1};
    return {k:'past'};
  }
  // 追星：列表上提醒售票／抽選日、結果公布日、繳費／取票期限
  // 已購票、落選或未購票：不再提醒；已中籤：改為倒數繳費／取票期限；其他：提醒下一個還沒到的日期
  function dueLeft(dt){
    var n = new Date(), td = new Date(n.getFullYear(), n.getMonth(), n.getDate()), dn = Math.round((dt - td) / DAY);
    return { n:dn, txt: dn > 1 ? '還有 ' + dn + ' 天' : dn === 1 ? '明天' : dn === 0 ? '就是今天' : '已過 ' + (-dn) + ' 天' };
  }
  // 場次：fanInfo.shows = [{id, date, door, show, seat}]；舊資料的 showDate／door／show 會在編輯時自動搬進來
  function fanShows(t, mut){
    var fi = t.fanInfo || (mut ? (t.fanInfo = {}) : {});
    if(Array.isArray(fi.shows)) return fi.shows;
    var leg = (fi.showDate || fi.door || fi.show) ? [{ id:uid(), date:fi.showDate || '', door:fi.door || '', show:fi.show || '', seat:'' }] : [];
    if(mut){ fi.shows = leg; delete fi.showDate; delete fi.door; delete fi.show; return fi.shows; }
    return leg;
  }
  // 場次的入場／開演／座位，寫成行程備註的樣子
  function showNoteText(sx){
    var n = [];
    if(sx.door) n.push('入場 ' + tm12(sx.door)); if(sx.show) n.push('開演 ' + tm12(sx.show)); if(String(sx.seat || '').trim()) n.push('座位：' + String(sx.seat).trim());
    return n.join('\n');
  }
  // 場次改了入場／開演／座位，從這個場次「加入行程」的那筆行程跟著改（時間沒被手動改過、備註還是自動產生的才改）
  function syncShowItems(t, sx, oldTime){
    var changed = false, nt = sx.door || sx.show || '';
    (t.days || []).forEach(function(day){ (day.items || []).forEach(function(it){
      if(String(it.lkShow) !== String(sx.id)) return;
      if(nt && (!it.time || it.time === oldTime) && it.time !== nt){ it.time = nt; changed = true; }
      var lines = String(it.note || '').split('\n').filter(Boolean);
      if(!lines.length || lines.every(function(l){ return /^(入場 |開演 |座位：)/.test(l); })){
        var nn = showNoteText(sx); if(nn !== (it.note || '')){ it.note = nn; changed = true; }
      }
    }); });
    if(changed){ var bs = document.getElementById('sec-board'); if(bs) bs.outerHTML = boardHtml(t, editMode); }
  }
  function shHas(x){ return !!(x.date || x.door || x.show || x.seat || x.price || x.qty); }
  function showsSorted(t){
    return fanShows(t).filter(shHas).slice().sort(function(a, b){
      var A = (a.date || '9999') + ' ' + (a.door || a.show || ''), B = (b.date || '9999') + ' ' + (b.door || b.show || '');
      return A < B ? -1 : A > B ? 1 : 0;
    });
  }
  function nextShow(t){
    var best = null;
    fanShows(t).forEach(function(x){
      var dt = toDate(x.date); if(!dt) return;
      var l = dueLeft(dt);
      if(l.n >= 0 && (!best || l.n < best.l.n)) best = { x:x, l:l };
    });
    return best;
  }
  function showChip(t, fan, ph){
    if(!fan || ph.k === 'past') return '';
    var nx = nextShow(t); if(!nx) return '';
    return '<span' + (nx.l.n <= 3 ? ' class="due"' : '') + '>演出 <b>' + esc(d(nx.x.date)) + '</b>・' + nx.l.txt + '</span>';
  }
  function showAddPanel(t, x){
    var days = t.days || []; if(viewOnly || !days.length) return '';
    var pick = days.filter(function(dy){ return dy.date && dy.date === x.date; })[0] || days[0];
    var opts = days.map(function(dy, i){ return '<option value="' + dy.id + '"' + (dy === pick ? ' selected' : '') + '>Day ' + (i + 1) + (dy.date ? '　' + esc(d(dy.date)) + '（' + esc(wk(dy.date).replace(/[（）()]/g, '')) + '）' : '') + (dy.date && dy.date === x.date ? '　★演出日' : '') + '</option>'; }).join('');
    return '<div class="spadd-wrap"><button class="mini" type="button" data-do="spaddt">＋ 加入行程</button><div class="spadd" hidden><select class="spadd-day" aria-label="加入哪一天">' + opts + '</select>' +
      '<input class="spadd-time" type="time" aria-label="行程時間" value="' + esc(x.door || x.show || '') + '"><button class="mini spadd-go" type="button" data-do="showgo" data-id="' + x.id + '">加入</button></div></div>';
  }
  var tcOpen = {};   // 交通卡「詳細」哪幾張展開
  var shOpen = {};   // 場次卡片（多筆時）哪幾張展開，重畫頁面時維持原狀
  function showsView(t){
    var arr = showsSorted(t), n = arr.length; if(!n) return '';
    var cards = arr.map(function(x, i){
      var dt = toDate(x.date), l = dt ? dueLeft(dt) : null, past = !!(l && l.n < 0);
      var left = l && l.n >= 0 ? '<span class="shv-left ' + (l.n <= 3 ? 'due' : 'dueok') + '">' + l.txt + '</span>' : (past ? '<span class="shv-left dueok">已結束</span>' : '');
      var top = '<div class="shv-top">' + (n > 1 ? '<span class="shv-no">' + (i + 1) + '</span>' : '') +
        '<span class="shv-date">' + (x.date ? esc(d(x.date)) + '<small>' + esc(wk(x.date)) + '</small>' : '<span class="muted">日期未定</span>') + '</span>' + (n > 1 && x.seat ? '<span class="shv-seatin">' + esc(x.seat) + '</span>' : '') + (x.status ? '<span class="shv-st">' + saleSt(x.status) + '</span>' : '') + left + '</div>';
      var tm = (x.door ? '<span>入場 <b>' + esc(tm12(x.door)) + '</b></span>' : '') + (x.show ? '<span>開演 <b>' + esc(tm12(x.show)) + '</b></span>' : '') + (x.end ? '<span>散場 <b>' + esc(tm12(x.end)) + '</b></span>' : '');
      var back = '';
      if(x.end || x.last){
        var em = toMin(x.end), lm = toMin(x.last), gap = null;
        if(em != null && lm != null){ if(lm < em) lm += 1440; gap = lm - em; }
        var gtxt = gap == null ? '' : gap < 0 ? '' : '<span class="shv-gap ' + (gap < 30 ? 'tight' : 'ok') + '">' + (gap < 30 ? '⚠ 只剩 ' + gap + ' 分鐘，來不及就要提早走或另外搭車' : '散場後有 ' + (gap >= 60 ? Math.floor(gap / 60) + ' 小時' + (gap % 60 ? ' ' + (gap % 60) + ' 分' : '') : gap + ' 分鐘') + '可以回住處') + '</span>';
        back = (x.last || gtxt) ? '<div class="shv-back">' + (x.last ? '<span>最晚回程 <b>' + esc(tm12(x.last)) + '</b></span>' : '') + gtxt + '</div>' : '';
      }
      var pr = amt(x.price), qy = amt(x.qty), cu = esc(x.cur || 'TWD'), price = '';
      if(pr) price = '<div class="shv-price"><span>票價 ' + cu + ' ' + money(pr) + (qy ? ' × ' + money(qy) + ' 張' : '') + '</span>' + (qy > 1 ? '<b>＝ ' + cu + ' ' + money(pr * qy) + '</b>' : '') + '</div>';
      else if(qy) price = '<div class="shv-price"><span>' + money(qy) + ' 張</span></div>';
      var body = (tm ? '<div class="shv-times">' + tm + '</div>' : '') + back +
        (x.seat && n < 2 ? '<div class="shv-seat"><span>座位</span>' + esc(x.seat) + '</div>' : '') + price + showAddPanel(t, x);
      if(n > 1) return '<div class="shv shv-c' + (past ? ' past' : '') + '"><details class="shdet" data-sh="' + esc(x.id) + '"' + (shOpen[x.id] ? ' open' : '') + '>' +
        '<summary class="shv-top">' + top.replace(/^<div class="shv-top">/, '').replace(/<\/div>$/, '') + '</summary><div class="shv-body">' + body + '</div></details></div>';
      return '<div class="shv' + (past ? ' past' : '') + '">' + top + body + '</div>';
    }).join('');
    return '<div class="shwrap"><dt>' + (n > 1 ? '場次（' + n + '）' : '場次') + '</dt><dd class="shlist">' + cards + '</dd></div>';
  }
  // 票券合計：各場次「票價 × 張數」，依幣別加總，並用本趟旅程填的匯率換算成新台幣
  function ticketTotal(t){
    var by = {}, order = [], twd = 0, miss = {};
    fanShows(t).forEach(function(x){
      var p = amt(x.price); if(!p) return;
      var n = p * (amt(x.qty) || 1), c = x.cur || 'TWD', r = rateOf(t, c);
      if(!(c in by)){ by[c] = 0; order.push(c); }
      by[c] += n;
      if(r) twd += n * r; else miss[c] = 1;
    });
    if(!order.length) return '';

    if(!e.target.matches('.ck input[data-k="text"]')) return;
    e.preventDefault();
    e.target.dispatchEvent(new Event('change', {bubbles:true}));
    var add = $('detail').querySelector('button[data-do="addck"]');
    if(add) add.click();
  });


  // ---- 唯讀分享：把「這一趟」的快照複製到 shared/{隨機代碼}，任何拿到連結的人都能看（不能改）----
  // 旅程資料變動時會自動更新快照；停止分享就刪掉那份快照，連結立刻失效
  var viewOnly = false, sharedTrip = null, shownShare = null, shareCache = {}, shareTimer = null;
  function shareRoute(){ var m = location.hash.match(/^#\/s\/([0-9a-f]{20,64})$/); return m ? m[1] : null; }
  function newShareId(){ var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function shareUrl(id){ return location.origin + location.pathname + '#/s/' + id; }
  // 分享出去的內容：預設不含訂位代號／座位，也不含花費、預算與分攤
  function shareSnap(t){
    var c = JSON.parse(JSON.stringify(t)), sh = t.share || {};
    delete c.share;
    var shows = (c.fanInfo && c.fanInfo.shows) || [];
    if(!sh.codes){
      (c.bookings || []).forEach(function(x){ x.code = ''; });
      (c.stays || []).forEach(function(x){ x.code = ''; });
      shows.forEach(function(x){ x.seat = ''; });
    }
    if(!sh.exp){
      c.expenses = []; c.budgets = {}; c.people = ''; c._noExp = true;
      shows.forEach(function(x){ delete x.price; delete x.qty; delete x.cur; });
      [].concat((c.days || []).reduce(function(a, dy){ return a.concat(dy.items || []); }, []), c.bookings || [], c.stays || [], c.spots || [], c.tcards || []).forEach(function(x){ delete x.lkExps; delete x.lkExp; });
    }
    return c;
  }
  function syncShare(t){
    var u = auth.currentUser;
    if(!u || !t.share || !t.share.id) return Promise.resolve(true);
    var json = JSON.stringify(shareSnap(t));
    if(shareCache[t.share.id] === json) return Promise.resolve(true);
    return db.collection('shared').doc(t.share.id).set({ owner: u.uid, title: t.title || '', data: json, updated: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function(){ shareCache[t.share.id] = json; return true; }, function(e){ console.error(e); return false; });
  }
  function scheduleShareSync(){
    clearTimeout(shareTimer);
    shareTimer = setTimeout(function(){ trips.forEach(function(t){ if(t.share && t.share.id) syncShare(t); }); }, 1500);
  }
  var shModal = document.createElement('div'); shModal.className = 'shmodal'; shModal.hidden = true; document.body.appendChild(shModal);
  var shTripId = null, shMsg = '';
  function shTrip(){ return trips.filter(function(x){ return String(x.id) === String(shTripId); })[0]; }
  function shRender(){
    var t = shTrip(); if(!t){ shModal.hidden = true; return; }
    var sh = t.share, on = !!(sh && sh.id);
    var opts = '<div class="shopts"><label><input type="checkbox" data-sh="codes"' + (on && sh.codes ? ' checked' : '') + '><span>也分享訂位代號、座位<br><small>預設不分享，這些是別人拿去可能會冒用的資料</small></span></label>' +
      '<label><input type="checkbox" data-sh="exp"' + (on && sh.exp ? ' checked' : '') + '><span>也分享花費、預算與分攤<br><small>預設不分享</small></span></label></div>';
    shModal.innerHTML = '<div class="shbox" role="dialog" aria-modal="true" aria-label="分享旅程"><h3>分享「' + esc(t.title || '這趟旅程') + '」</h3>' +
      (on
        ? '<p>拿到連結的人可以看這一趟的內容，但不能修改，也不用登入。你之後修改旅程，對方重新整理就會看到最新的。</p>' +
          '<div class="shurl"><input id="shurl" readonly value="' + esc(shareUrl(sh.id)) + '" aria-label="分享連結"><button class="mini" type="button" data-shdo="copy">複製</button></div>' + opts +
          '<p>連結沒有加密，知道網址的人都能打開，請只傳給信任的人。</p>'
        : '<p>會產生一個只讀的連結，傳給朋友就能看這一趟的行程、住宿與打卡點。你只分享這一趟，其他旅程不會被看到。</p>' + opts) +
      (shMsg ? '<p class="shwarn">' + esc(shMsg) + '</p>' : '') +
      '<div class="shbtns">' + (on ? '<button class="mini" type="button" data-shdo="stop">停止分享</button>' : '<button class="save" type="button" data-shdo="make">產生分享連結</button>') + '<button class="mini" type="button" data-shdo="close">關閉</button></div></div>';
  }
  function openShare(t){ shTripId = t.id; shMsg = ''; shRender(); shModal.hidden = false; }
  function shClose(){ shModal.hidden = true; if(!viewOnly && currentId) renderDetail(); }
  shModal.addEventListener('click', function(e){
    if(e.target === shModal){ shClose(); return; }
    var b = e.target.closest('button[data-shdo]'); if(!b) return;
    var t = shTrip(); if(!t) return;
    var act = b.dataset.shdo;
    if(act === 'close'){ shClose(); return; }
    if(act === 'copy'){
      var inp = $('shurl'), txt = inp ? inp.value : '';
      var done = function(){ b.textContent = '已複製'; setTimeout(function(){ b.textContent = '複製'; }, 1500); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ inp.select(); });
      else { inp.select(); try{ document.execCommand('copy'); done(); }catch(x){} }
      return;
    }
    if(act === 'make'){
      t.share = { id:newShareId(), codes: !!shModal.querySelector('[data-sh="codes"]').checked, exp: !!shModal.querySelector('[data-sh="exp"]').checked };
      b.disabled = true; b.textContent = '產生中…'; shMsg = '';
      syncShare(t).then(function(ok){
        if(!ok){ delete t.share; shMsg = '分享失敗：請確認 Firebase 規則已加入 shared 的設定（見說明），或檢查網路。'; shRender(); return; }
        doPersist(); shRender();
      });
      return;
    }
    if(act === 'stop'){
      if(!confirm('停止分享後，這個連結會立刻失效，確定嗎？')) return;
      var id = t.share && t.share.id;
      db.collection('shared').doc(id).delete().then(function(){
        delete shareCache[id]; delete t.share; shMsg = ''; doPersist(); shRender();
      }, function(err){ console.error(err); shMsg = '停止分享失敗，請檢查網路後再試一次。'; shRender(); });
    }
  });
  shModal.addEventListener('change', function(e){
    var el = e.target; if(!el.dataset || !el.dataset.sh) return;
    var t = shTrip(); if(!t || !t.share) return;       // 還沒產生連結時，只是先選好
    t.share[el.dataset.sh] = el.checked;
    doPersist(); syncShare(t);
  });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !shModal.hidden) shClose(); });
  // 朋友打開的唯讀頁面
  // 分享內容來自別人寫進雲端的 JSON：id 與連結欄位（id、lk 開頭）會被直接接進 HTML 屬性，先過濾成只剩英數字、底線與連字號，避免被塞入惡意程式；同一規則套在所有 id，互相連結的關係不會斷
  function cleanId(v){ return typeof v === 'string' ? v.replace(/[^\w-]/g, '') : (typeof v === 'number' ? v : ''); }
  function cleanShared(o){
    if(Array.isArray(o)){ o.forEach(cleanShared); return o; }
    if(o && typeof o === 'object'){
      Object.keys(o).forEach(function(k){
        var v = o[k];
        if(k === 'id' || /^lk/.test(k)){
          if(Array.isArray(v)) o[k] = v.map(cleanId);
          else if(v && typeof v === 'object') cleanShared(v);
          else o[k] = cleanId(v);
        }else if(v && typeof v === 'object') cleanShared(v);
      });
    }
    return o;
  }
  function openShared(id){
    viewOnly = true; shownShare = id; sharedTrip = null; currentId = null; editMode = false;
    document.body.classList.add('viewonly', 'wide');
    $('login').hidden = true; $('who').hidden = true; $('app').hidden = true; $('head').hidden = true; $('detail').hidden = false;
    $('detail').innerHTML = '<p class="vempty" style="padding:40px 0">讀取中…</p>';
    var fail = function(msg){ if(shownShare === id) $('detail').innerHTML = '<div class="empty" style="margin-top:40px">' + msg + '</div>'; };
    db.collection('shared').doc(id).get().then(function(doc){
      if(shownShare !== id) return;
      if(!doc.exists){ fail('這個分享連結已經失效，或分享已被關閉。'); return; }
      try{ sharedTrip = cleanShared(JSON.parse(doc.data().data)); }catch(x){ fail('讀取分享內容失敗。'); return; }
      currentId = String(sharedTrip.id); dayInitFor = null; loaded = true;
      document.title = (sharedTrip.title || '旅遊紀錄') + ' — 分享';
      renderDetail();
    }, function(e){ console.error(e); fail('讀取失敗，請檢查網路，或請對方確認分享仍然有效。'); });
  }

  // ---- 簡易路由：#/t/旅程id 顯示詳細頁，其餘顯示列表 ----
  function route(){
    var sid = shareRoute();
    if(sid){ if(!viewOnly || shownShare !== sid) openShared(sid); return; }
    if(viewOnly){ location.reload(); return; }      // 離開分享頁：重新載入，回到自己的旅程
    hideUndo();
    var m = location.hash.match(/^#\/t\/(.+)$/);
    currentId = m ? decodeURIComponent(m[1]) : null;
    catFilter = 'all'; xGroup = 'all'; xOpen = false;
    if(!currentId) dayInitFor = null;
    var inDetail = !!currentId && loaded;
    document.body.classList.toggle('wide', inDetail);
    var entering = inDetail && shownId !== currentId;   // 剛進入這趟旅程（不是同步資料造成的重繪）
    if(entering){ saveMsg = '變更會自動儲存'; saveDirty = false; editMode = isBlank(cur()); dayFilter = 'all'; }   // 全新的空白旅程直接進編輯，其餘先看內容
    shownId = inDetail ? currentId : null;
    $('head').hidden = inDetail;
    $('detail').hidden = !inDetail;
    if(!auth.currentUser){ return; }
    $('app').hidden = inDetail;
    if(inDetail){ renderDetail(); if(entering) window.scrollTo(0, 0); }
    else if(loaded){ render(); }
  }
  window.addEventListener('hashchange', route);

  // ---- 回到最上方按鈕：往下捲一段後才出現 ----
  (function(){
    var btn = $('totop');
    function toggle(){ btn.hidden = window.scrollY < 400; }
    window.addEventListener('scroll', toggle, { passive:true });
    btn.addEventListener('click', function(){
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top:0, behavior: calm ? 'auto' : 'smooth' });
    });
    toggle();
  })();

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target && e.target.id === 'wishin'){ e.preventDefault(); var bt = document.querySelector('[data-do="wishadd"]'); if(bt) bt.click(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type === 'text' && e.target.closest && e.target.closest('.mgedit')){ e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target && e.target.id === 'mgname'){ e.preventDefault(); var bt = document.querySelector('[data-do="merchadd"]'); if(bt) bt.click(); }
  });
  // ---- 離線支援：註冊 service worker（需要 https，sw.js 要和本檔放在同一個資料夾） ----
  // 切到別的 App、鎖螢幕或關掉分頁時，先讓正在輸入的欄位送出變更（手機上不一定會觸發「離開欄位」）
  function flushEdits(){
    var ae = document.activeElement;
    if(ae && ae !== document.body && $('detail').contains(ae) && ae.blur) ae.blur();
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushEdits(); });
  window.addEventListener('pagehide', flushEdits);
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('service worker 註冊失敗：', e); });
    });
  }
</script>
</body>
</html>
