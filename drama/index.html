<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>追劇紀錄｜我的影視手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- 跟手帳共用同一個 Firebase 專案，登入狀態與資料都存在同一個帳號底下 -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#FBF4EC; --surface:#FFFDF9; --surface-soft:#F8EFE2;
  --ink:#4A3D36; --ink-soft:#9C8977; --ink-faint:#DCCDB8;
  --rose:#DD8AA0; --rose-deep:#C15B79; --rose-pale:#FCEDF1;
  --matcha:#7FA05F; --matcha-pale:#E8F0DE;
  --wisteria:#9584C2; --wisteria-pale:#F0ECF8;
  --gold:#C6A13A; --gold-pale:#F6E9CE;
  --sky:#5E9AAE; --sky-pale:#DCEBEF;
  --shadow:0 4px 16px rgba(90,60,45,0.10); --radius:18px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1E1A17; --surface:#2A2420; --surface-soft:#332C26;
    --ink:#EDE6DD; --ink-soft:#B8A996; --ink-faint:#4A4038;
    --rose:#E39CB0; --rose-deep:#E6A0B4; --rose-pale:#3A2830;
    --matcha:#9BC17C; --matcha-pale:#26301F;
    --wisteria:#B3A0DE; --wisteria-pale:#2B2438;
    --gold:#D9B95C; --gold-pale:#332B18;
    --sky:#7FC0D6; --sky-pale:#1F2E32;
    --shadow:0 4px 16px rgba(0,0,0,0.35);
  }
  .card,.stat,.d-card,.g-card,.f-card,.platCard,.monthCard{border-color:rgba(255,255,255,.06);}
  .toast{background:#3A322B; color:#F5EFE7;}
}
*{box-sizing:border-box;}
body{margin:0; font-family:'Noto Sans TC',sans-serif; background:var(--bg); color:var(--ink); padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));}
.page{max-width:1080px; margin:0 auto;}
.maru{font-family:'Zen Maru Gothic',sans-serif;}
h1{font-family:'Zen Maru Gothic'; font-size:20px; margin:4px 0 18px; display:flex; align-items:center; gap:8px;}
.sec{margin:34px 0 14px; padding-bottom:9px; border-bottom:1px solid rgba(74,61,54,0.09); font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center;}
.card{background:var(--surface); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,.04);}
.grid4{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr);}}
.stat{background:var(--surface); border-radius:var(--radius); padding:16px; text-align:center; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,.04);}
.stat .ic{margin-bottom:4px; color:var(--rose-deep); display:flex; align-items:center; justify-content:center;}
.stat .ic svg{width:20px; height:20px;}
.stat .n{font-family:'Zen Maru Gothic'; font-weight:900; font-size:26px; color:var(--rose-deep);}
.stat .l{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.addBtn{background:var(--rose-deep); color:#fff; border:none; border-radius:999px; padding:10px 18px; font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px; cursor:pointer;}
.fab{position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:50%; background:var(--rose-deep); color:#fff; border:none; font-size:26px; line-height:1; box-shadow:0 6px 18px rgba(90,60,45,0.28); cursor:pointer; z-index:60; display:none; align-items:center; justify-content:center; font-family:'Zen Maru Gothic';}
@media(max-width:700px){.fab{display:flex;}}
.chipRow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.chip{background:var(--surface-soft); border:1px solid var(--ink-faint); border-radius:999px; padding:5px 12px; font-size:12px; color:var(--ink-soft); cursor:pointer;}
.chip.active{background:var(--rose-deep); color:#fff; border-color:var(--rose-deep);}
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px;}
.bar-label{width:74px; flex:0 0 74px; color:var(--ink-soft); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{flex:1; background:var(--surface-soft); border-radius:6px; height:14px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--rose),var(--rose-deep)); border-radius:6px;}
.bar-num{width:20px; flex:0 0 20px; color:var(--ink-soft);}
.d-card{background:var(--surface); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:10px; border:1px solid rgba(0,0,0,.04);}
.d-row{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.d-title{font-weight:700; font-size:15px;}
.d-meta{font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.7;}
.d-tag{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--rose-pale); color:var(--rose-deep); margin:2px 4px 0 0;}
.galleryGrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media(min-width:560px){.galleryGrid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:820px){.galleryGrid{grid-template-columns:repeat(6,1fr);}}
@media(min-width:1080px){.galleryGrid{grid-template-columns:repeat(8,1fr);}}
@media(min-width:1320px){.galleryGrid{grid-template-columns:repeat(8,1fr);}}
.g-card{background:var(--surface); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; cursor:pointer; position:relative; border:1px solid rgba(0,0,0,.04);}
.g-cover{width:100%; aspect-ratio:2/3; overflow:hidden; position:relative;}
.g-cover img{width:100%; height:100%; object-fit:cover; display:block;}
.g-cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;color:rgba(74,61,54,0.35);}
.g-badge{position:absolute; top:6px; left:6px; font-size:10px; padding:2px 8px; border-radius:999px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.g-fav{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; background:rgba(255,253,249,0.9); display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.12); z-index:2; color:var(--ink-faint);}
.g-fav.on{color:var(--rose-deep);}
.g-body{padding:9px 10px 10px;}
.g-title{font-weight:700; font-size:13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.g-meta{font-size:11px; color:var(--ink-soft); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.g-actions{display:flex; gap:6px; padding:0 10px 10px; opacity:0; transform:translateY(2px); transition:opacity .15s ease, transform .15s ease;}
.g-card:hover .g-actions, .g-card:focus-within .g-actions{opacity:1; transform:translateY(0);}
@media(hover:none){ .g-actions{opacity:1; transform:none;} }
.g-actions button{flex:1; padding:5px; font-size:11px; border-radius:8px; border:none; cursor:pointer; font-family:'Zen Maru Gothic';}
.g-actions .edit{background:var(--surface-soft); color:var(--ink-soft);}
.g-actions .del{background:#F4DCD9; color:#B14B3F;}
.status-badge{font-size:11px; padding:3px 10px; border-radius:999px; font-weight:700; flex:0 0 auto;}
.st-watching{background:var(--sky-pale); color:var(--sky);}
.st-done{background:var(--matcha-pale); color:var(--matcha);}
.st-want{background:var(--wisteria-pale); color:var(--wisteria);}
.st-drop{background:var(--surface-soft); color:var(--ink-faint);}
.progress-track{background:var(--surface-soft); border-radius:6px; height:6px; margin-top:8px; overflow:hidden;}
.progress-fill{height:100%; background:var(--rose-deep); border-radius:6px;}
.g-rating{color:var(--gold); font-size:11px; letter-spacing:1px; margin-top:3px;}
.starPick{display:flex; gap:4px; font-size:24px; line-height:1; margin:2px 0 4px;}
.starPick span{cursor:pointer; color:var(--ink-faint); transition:color .1s;}
.starPick span.on{color:var(--gold);}
.donutWrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.donut{width:120px; height:120px; border-radius:50%; flex:0 0 120px; position:relative;}
.donut .hole{position:absolute; inset:18px; background:var(--surface); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.donut .hole .n{font-family:'Zen Maru Gothic'; font-weight:900; font-size:20px; color:var(--ink);}
.donut .hole .l{font-size:10px; color:var(--ink-soft);}
.legend{display:flex; flex-direction:column; gap:6px; flex:1; min-width:120px;}
.legend-row{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink);}
.legend-dot{width:10px; height:10px; border-radius:50%; flex:0 0 10px;}
.legend-name{flex:1;}
.legend-n{color:var(--ink-soft); font-size:11.5px;}
.plat-sub{font-weight:400; color:var(--ink-soft); font-size:10.5px; margin-top:4px; line-height:1.5;}
.trendCard{margin-bottom:10px;}
.trendCard .cap{font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
.featuredScroll{display:flex; gap:12px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:2px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;}
.featuredScroll::-webkit-scrollbar{height:5px;}
.featuredScroll::-webkit-scrollbar-thumb{background:var(--ink-faint); border-radius:999px;}
.f-card{flex:0 0 130px; scroll-snap-align:start; background:var(--surface); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; position:relative; border:1px solid rgba(0,0,0,.04);}
.f-cover{width:100%; aspect-ratio:2/3; overflow:hidden; position:relative;}
.f-cover img{width:100%; height:100%; object-fit:cover; display:block;}
.f-cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:26px;color:rgba(74,61,54,0.35);}
.f-fav{position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; background:rgba(255,253,249,0.9); display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.12); z-index:2; color:var(--ink-faint);}
.f-fav.on{color:var(--rose-deep);}
.f-body{padding:8px 9px 9px;}
.f-title{font-weight:700; font-size:12.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.f-meta{font-size:10.5px; color:var(--ink-soft); margin-top:3px;}
.searchRow{display:flex; gap:8px; margin-bottom:14px;}
.searchRow input{flex:1; min-width:0; padding:9px 14px; border-radius:999px; border:1px solid var(--ink-faint); background:var(--surface); font-family:inherit; font-size:13px; color:var(--ink);}
.searchRow select{flex:0 0 auto; padding:9px 10px; border-radius:999px; border:1px solid var(--ink-faint); background:var(--surface); font-family:inherit; font-size:12px; color:var(--ink-soft);}
.twoCol{display:grid; grid-template-columns:1fr; gap:20px;}
@media(min-width:480px){.twoCol{grid-template-columns:1fr 1fr; gap:16px;}}
.twoCol.top{align-items:start;}
.archYear{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:10px;}
.archYear .card .y{font-family:'Zen Maru Gothic'; font-weight:900; font-size:18px;}
.archYear .card .m{font-size:12px; color:var(--ink-soft); margin-top:6px; white-space:nowrap;}
.clickable{cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.clickable:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(90,60,45,0.14);}
.yearDetailGrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; max-height:60vh; overflow-y:auto; padding:2px;}
@media(min-width:480px){.yearDetailGrid{grid-template-columns:repeat(3,1fr);}}
.platGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media(min-width:640px){.platGrid{grid-template-columns:repeat(6,1fr);}}
.platCard{background:var(--surface); border-radius:14px; padding:14px 8px; text-align:center; box-shadow:var(--shadow); font-family:'Zen Maru Gothic'; font-weight:700; font-size:12.5px; border:1px solid rgba(0,0,0,.04);}
.monthGrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
@media(min-width:900px){.monthGrid{grid-template-columns:repeat(3,1fr);}}
.monthCard{background:var(--surface); border-radius:14px; padding:12px; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,.04);}
.monthCard .mt{font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px;}
.monthCard .mm{font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.6;}
.empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0;}
/* modal */
.overlay{position:fixed; inset:0; background:rgba(30,20,15,0.4); display:none; align-items:flex-end; justify-content:center; z-index:50;}
.overlay.show{display:flex;}
.modal{background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--ink-faint); background:var(--bg); font-family:inherit; font-size:13.5px; color:var(--ink);}
.field textarea{resize:vertical; min-height:50px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-actions{display:flex; gap:10px; margin-top:16px;}
.btn{flex:1; padding:11px; border-radius:12px; border:none; font-family:'Zen Maru Gothic'; font-weight:700; font-size:13.5px; cursor:pointer;}
.btn.save{background:var(--rose-deep); color:#fff;}
.btn.ghost{background:var(--surface-soft); color:var(--ink-soft);}
.btn.danger{background:#F4DCD9; color:#B14B3F;}
.authBtn{display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:999px; padding:6px 14px 6px 6px; box-shadow:var(--shadow); font-size:12.5px; color:var(--ink-soft); cursor:pointer; border:none; font-family:'Noto Sans TC';}
.authBtn img{width:24px;height:24px;border-radius:50%;}
.authBtn .g{width:24px;height:24px;border-radius:50%;background:var(--rose-pale);display:flex;align-items:center;justify-content:center;font-size:13px;}
.field-err{color:#B14B3F; font-size:11.5px; margin-top:4px; display:none;}
.field.err input{border-color:#B14B3F;}
.field.err .field-err{display:block;}
.genreSelect{position:relative;}
.genreSelectBtn{width:100%; text-align:left; padding:9px 32px 9px 10px; border-radius:10px; border:1px solid var(--ink-faint); background:var(--bg); font-family:inherit; font-size:13.5px; color:var(--ink); cursor:pointer; position:relative;}
.genreSelectBtn::after{content:'▾'; position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:11px;}
.genreSelectBtn.placeholder{color:var(--ink-soft);}
.genreDropdown{display:none; position:absolute; z-index:20; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--ink-faint); border-radius:12px; box-shadow:var(--shadow); padding:8px; max-height:220px; overflow-y:auto;}
.genreDropdown.open{display:block;}
.genreOpt{display:flex; align-items:center; gap:8px; padding:7px 6px; font-size:13px; border-radius:8px; cursor:pointer;}
.genreOpt:hover{background:var(--surface-soft);}
.genreOpt input{width:auto; margin:0;}
.tagChips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
.tagChips:empty{display:none; margin:0;}
.tagChip{display:inline-flex; align-items:center; gap:4px; background:var(--wisteria-pale); color:var(--wisteria); border-radius:999px; padding:4px 6px 4px 10px; font-size:12px;}
.tagChip button{background:none; border:none; color:inherit; cursor:pointer; font-size:13px; line-height:1; padding:0 2px;}
#fTagInput{width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--ink-faint); background:var(--bg); font-family:inherit; font-size:13.5px; color:var(--ink);}
.tagPresets{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.tagPresetBtn{background:var(--surface-soft); border:1px solid var(--ink-faint); border-radius:999px; padding:4px 10px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; font-family:inherit;}
.tagPresetBtn:hover{background:var(--wisteria-pale); color:var(--wisteria); border-color:var(--wisteria);}
.g-tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
.g-tag{background:var(--wisteria-pale); color:var(--wisteria); font-size:10.5px; padding:2px 8px; border-radius:999px;}
.updateBanner{display:none; align-items:center; gap:8px; flex-wrap:wrap; background:var(--rose-pale); color:var(--rose-deep); border-radius:14px; padding:10px 14px; font-size:12.5px; font-weight:700; margin-bottom:16px; font-family:'Zen Maru Gothic';}
.updateBanner .ub-enable{margin-left:auto; background:var(--rose-deep); color:#fff; border:none; border-radius:999px; padding:5px 12px; font-size:11px; font-family:'Noto Sans TC'; font-weight:500; cursor:pointer;}
.weekdayPick{display:flex; gap:6px;}
.wdBtn{width:34px; height:34px; border-radius:50%; border:1px solid var(--ink-faint); background:var(--bg); color:var(--ink-soft); font-size:13px; cursor:pointer; font-family:inherit;}
.wdBtn.on{background:var(--rose-deep); color:#fff; border-color:var(--rose-deep);}
.f-update{font-size:10.5px; color:var(--ink-soft); margin-top:4px;}
.f-update.today{color:var(--rose-deep); font-weight:700;}
.f-card.due-today{box-shadow:0 0 0 2px var(--rose-deep), var(--shadow);}
.imgPreview{width:100%; max-height:170px; border-radius:10px; overflow:hidden; margin:-2px 0 10px; background:var(--surface-soft); display:none;}
.imgPreview img{width:100%; height:170px; object-fit:cover; display:block;}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px; font-size:13px; font-family:'Zen Maru Gothic'; font-weight:700; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:80;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
/* year wrap card */
.wrapHead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
.wrapHead select{padding:7px 10px; border-radius:999px; border:1px solid var(--ink-faint); background:var(--surface); font-family:inherit; font-size:12.5px; color:var(--ink);}
.wrapCard{background:linear-gradient(160deg, var(--rose-deep), var(--wisteria)); color:#fff; border-radius:20px; padding:26px 22px; text-align:center; position:relative; overflow:hidden;}
.wrapCard::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 85% 8%, rgba(255,255,255,.18), transparent 45%); pointer-events:none;}
.wrapCard .maru{font-size:12px; letter-spacing:2px; opacity:.85; text-transform:uppercase;}
.wrapCard h2{font-family:'Zen Maru Gothic'; font-size:24px; margin:4px 0 20px;}
.wrapRow{display:flex; justify-content:space-around; margin-bottom:16px;}
.wrapStat .num{font-family:'Zen Maru Gothic'; font-weight:900; font-size:32px; line-height:1;}
.wrapStat .lab{font-size:11px; opacity:.85; margin-top:4px;}
.wrapHighlights{text-align:left; background:rgba(255,255,255,.15); border-radius:14px; padding:14px 16px; font-size:12.5px; line-height:2.1;}
.wrapHighlights .hl-row b{font-weight:700;}
.wrapFoot{margin-top:16px; font-size:10.5px; opacity:.75;}
.modal-actions.wrap-actions{margin-top:14px;}
.wrapTop5{text-align:left; background:rgba(255,255,255,.15); border-radius:14px; padding:12px 16px; font-size:12.5px; margin-top:12px;}
.wrapTop5Title{font-family:'Zen Maru Gothic'; font-weight:700; margin-bottom:6px;}
.wrapTop5Row{display:flex; align-items:center; gap:8px; padding:3px 0;}
.wrapTop5Row .rank{width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex:none;}
.wrapTop5Row .t5-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.wrapTop5Row .t5-stars{color:var(--gold); font-size:11px; flex:none;}
.bestPickList{max-height:180px; overflow-y:auto; border:1px solid var(--ink-faint); border-radius:10px; padding:6px;}
.bestPickRow{display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:12.5px; border-radius:8px; cursor:pointer;}
.bestPickRow:hover{background:var(--surface-soft);}
.bestPickRow input{width:auto; margin:0;}
.bestPickRow span:first-of-type{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bp-stars{color:var(--gold); font-size:11px; flex:none;}
</style>
</head>
<body>
<div class="page">
<h1><span>🎬</span> 追劇紀錄</h1>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
  <a href="https://yician0830.github.io/" style="text-decoration:none;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;" title="回到入口頁">🏠</a>
  <div style="display:flex;align-items:center;gap:8px;">
    <button id="notifyBtn" onclick="enableNotifications()" style="background:var(--surface);box-shadow:var(--shadow);border-radius:999px;width:36px;height:36px;border:none;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;" title="開啟追劇提醒通知">🔕</button>
    <div id="authBar"></div>
  </div>
</div>

<div id="updateBanner" class="updateBanner"></div>

<div class="grid4" id="statsBar" style="margin-bottom:20px;"></div>

<div id="featuredSec" style="display:none;">
  <div class="sec" style="margin-top:0;">📺 正在觀看</div>
  <div class="featuredScroll" id="featuredArea"></div>
</div>

<div class="twoCol top">
  <div>
    <div class="sec">📊 類型分布</div>
    <div class="card" id="genreChart"></div>
  </div>
  <div>
    <div class="sec">🎭 常看演員 Top5</div>
    <div class="card" id="actorChart"></div>
  </div>
</div>

<div class="sec">📺 平台總覽</div>
<div style="font-size:11px;color:var(--ink-soft);margin:-6px 0 10px;">時數為估算值（每集以 45 分鐘計算）</div>
<div class="platGrid" id="platGrid"></div>

<div class="twoCol">
  <div>
    <div class="sec">📅 年度檔案</div>
    <div class="card trendCard" id="yearTrend"></div>
    <div class="archYear" id="yearArchive"></div>
  </div>
  <div>
    <div class="sec"><span>🗓️ 月度檔案（<span id="curYear"></span>）</span></div>
    <div class="monthGrid" id="monthGrid"></div>
  </div>
</div>

<div class="sec">🎉 年度總結 <button class="addBtn" onclick="openYearWrap()">✨ 產生年度總結卡</button></div>

<div id="wishSec" style="display:none;">
  <div class="sec">📋 片單（想看）</div>
  <div class="galleryGrid" id="wishGrid"></div>
</div>

<div class="sec">🗂️ 全部清單 <button class="addBtn" onclick="openForm()">＋ 新增影視劇</button></div>
<div class="chipRow" id="statusFilter"></div>
<div class="chipRow" id="platformFilter"></div>
<div class="chipRow" id="ratingFilter"></div>
<div class="chipRow" id="tagFilter"></div>
<div class="searchRow">
  <input type="text" id="searchBox" placeholder="🔍 搜尋劇名或演員..." oninput="filters.search=this.value; renderList();">
  <select id="sortSelect" onchange="filters.sort=this.value; renderList();">
    <option value="date_desc">日期新→舊</option>
    <option value="date_asc">日期舊→新</option>
    <option value="progress_desc">進度高→低</option>
    <option value="progress_asc">進度低→高</option>
    <option value="rating_desc">評分高→低</option>
    <option value="title">劇名筆畫</option>
  </select>
</div>
<div class="galleryGrid" id="listArea"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<button class="fab" onclick="openForm()" aria-label="新增影視劇" title="新增影視劇">＋</button>

<script>
/* ================= 與手帳共用的 Firebase 專案 ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBjclP4efWWcOTO88W_3tlcC4Za_hEIzW0",
  authDomain: "mystarlifeapp.firebaseapp.com",
  projectId: "mystarlifeapp",
  storageBucket: "mystarlifeapp.firebasestorage.app",
  messagingSenderId: "941753508434",
  appId: "1:941753508434:web:5bdf24eac9ee4514d8758b",
  measurementId: "G-FDX9867N4N"
};
let db=null, auth=null, currentUser=null, useCloud=false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  useCloud = true;
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  auth.getRedirectResult().catch(()=>{});
}catch(e){ console.log('Firebase 初始化失敗，改用本機模式', e); }

const STORE_KEY='oshi-drama-list';
const LOCAL_PREFIX='oshiapp:';
async function loadKey(key, fallback){
  if(useCloud && currentUser){
    try{
      const doc = await db.collection('users').doc(currentUser.uid).collection('data').doc(key).get();
      return (doc.exists && doc.data().value!==undefined) ? doc.data().value : fallback;
    }catch(e){ console.error('雲端讀取失敗', e); return fallback; }
  }
  try{ const raw = localStorage.getItem(LOCAL_PREFIX+key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
}
async function saveKeyCloud(key, value){
  if(useCloud && currentUser){
    try{ await db.collection('users').doc(currentUser.uid).collection('data').doc(key).set({value}); }
    catch(e){ console.error('雲端儲存失敗', e); }
    return;
  }
  try{ localStorage.setItem(LOCAL_PREFIX+key, JSON.stringify(value)); }catch(e){}
}
async function signInWithGoogle(){
  if(!useCloud){ alert('雲端服務尚未設定完成'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  try{ await auth.signInWithPopup(provider); }
  catch(e){
    if(e.code==='auth/popup-blocked') await auth.signInWithRedirect(provider);
  }
}
async function signOutUser(){ if(auth) await auth.signOut(); }
function renderAuthBar(){
  const el = document.getElementById('authBar');
  if(currentUser){
    el.innerHTML = `<button class="authBtn" onclick="signOutUser()">${currentUser.photoURL?`<img src="${currentUser.photoURL}">`:'<span class="g">🙂</span>'}${esc(currentUser.displayName||'已登入')} · 登出</button>`;
  } else {
    el.innerHTML = `<button class="authBtn" onclick="signInWithGoogle()"><span class="g">G</span>用 Google 帳號登入同步</button>`;
  }
}

let state = [];
let filters = { status:'__all__', platform:'__all__', rating:'__all__', tag:'__all__', search:'', sort:'date_desc' };
const CHART_COLORS=['var(--rose-deep)','var(--matcha)','var(--wisteria)','var(--gold)','var(--sky)','var(--rose)','#B98B56','#6B8E9E','#A97C9E','#8FA85C'];
const COVER_GRADIENTS=[
  'linear-gradient(155deg, var(--rose-pale), var(--gold-pale))',
  'linear-gradient(155deg, var(--wisteria-pale), var(--sky-pale))',
  'linear-gradient(155deg, var(--matcha-pale), var(--gold-pale))',
  'linear-gradient(155deg, var(--sky-pale), var(--rose-pale))',
  'linear-gradient(155deg, var(--gold-pale), var(--wisteria-pale))'
];
function coverGrad(i){ return COVER_GRADIENTS[i % COVER_GRADIENTS.length]; }
const GENRES=['電影','愛情','影集','綜藝','偶像劇','恐怖','懸疑','動畫','喜劇','紀錄片','其他'];
const STATUSES=[['想看','st-want'],['追劇中','st-watching'],['已完結','st-done'],['棄劇','st-drop']];
const GENRE_OPTIONS=['愛情','懸疑','恐怖','喜劇','奇幻','動作','家庭','職場','犯罪','歷史','音樂','紀錄片','青春校園','其他'];
const TAG_PRESETS=['必刷神作','配樂超棒','下飯劇','已棄坑'];
const WEEKDAY_LABELS=['日','一','二','三','四','五','六'];
let currentFormTags = [];
let currentFormWeekdays = [];
function toggleWeekday(i, btn){
  const idx = currentFormWeekdays.indexOf(i);
  if(idx>=0){ currentFormWeekdays.splice(idx,1); btn.classList.remove('on'); }
  else { currentFormWeekdays.push(i); btn.classList.add('on'); }
}
function isWatching(x){
  return x.status==='追劇中' || (x.status==='已完結' && !!x.startDate && !x.endDate);
}
function syncWeekdayFieldVisibility(){
  const statusEl = document.getElementById('fStatus');
  const field = document.getElementById('weekdayField');
  if(!statusEl || !field) return;
  const startEl = document.getElementById('fStart');
  const endEl = document.getElementById('fEnd');
  const watching = statusEl.value==='追劇中' || (statusEl.value==='已完結' && startEl && startEl.value && endEl && !endEl.value);
  field.style.display = watching ? 'block' : 'none';
}
function enableNotifications(){
  if(!('Notification' in window)){ showToast('此瀏覽器不支援通知'); return; }
  Notification.requestPermission().then(p=>{
    showToast(p==='granted' ? '通知已開啟 ✓' : '未開啟通知權限');
    renderNotifyBtn();
    renderUpdateBanner();
  });
}
function renderNotifyBtn(){
  const btn = document.getElementById('notifyBtn');
  if(!btn) return;
  const granted = ('Notification' in window) && Notification.permission==='granted';
  btn.textContent = granted ? '🔔' : '🔕';
  btn.title = granted ? '已開啟追劇提醒通知' : '點擊開啟追劇提醒通知';
}
function maybeNotifyToday(dueTitles){
  if(!dueTitles.length) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const todayStr = new Date().toISOString().slice(0,10);
  const key = LOCAL_PREFIX+'lastNotifyDate';
  if(localStorage.getItem(key)===todayStr) return;
  try{ new Notification('追劇提醒', {body:`今天更新：${dueTitles.join('、')}`}); }catch(e){}
  localStorage.setItem(key, todayStr);
}
function renderUpdateBanner(){
  const el = document.getElementById('updateBanner');
  if(!el) return;
  const today = new Date().getDay();
  const due = state.filter(x=>isWatching(x) && Array.isArray(x.updateDays) && x.updateDays.includes(today));
  if(!due.length){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='flex';
  const needsEnable = ('Notification' in window) && Notification.permission!=='granted';
  el.innerHTML = `<span>🔔 今天更新：${due.map(x=>esc(x.title)).join('、')}</span>${needsEnable?'<button type="button" class="ub-enable" onclick="enableNotifications()">開啟通知提醒</button>':''}`;
  maybeNotifyToday(due.map(x=>x.title));
}
function allKnownTags(){
  const set = new Set(TAG_PRESETS);
  state.forEach(x=>(x.tags||[]).forEach(t=>set.add(t)));
  return [...set];
}
function renderTagChips(){
  const wrap = document.getElementById('tagChips');
  if(!wrap) return;
  wrap.innerHTML = currentFormTags.map(t=>`<span class="tagChip">${esc(t)}<button type="button" onclick="removeTag('${esc(t).replace(/'/g,"\\'")}')">×</button></span>`).join('');
}
function addTag(t){
  t = (t||'').trim();
  if(!t || currentFormTags.includes(t)) { const input=document.getElementById('fTagInput'); if(input) input.value=''; return; }
  currentFormTags.push(t);
  const input = document.getElementById('fTagInput');
  if(input) input.value='';
  renderTagChips();
}
function removeTag(t){
  currentFormTags = currentFormTags.filter(x=>x!==t);
  renderTagChips();
}
function handleTagKeydown(e){
  if(e.key==='Enter' || e.key===','){
    e.preventDefault();
    addTag(e.target.value);
  }
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function save(){ await saveKeyCloud(STORE_KEY, state); render(); }
function uid(){ return 'd'+Date.now()+Math.floor(Math.random()*1000); }

function render(){
  renderFeatured(); renderStats(); renderChart(); renderActors(); renderWishlist(); renderFilters(); renderList();
  renderYearArchive(); renderPlatforms(); renderMonthGrid(); renderUpdateBanner();
}
function renderActors(){
  const counts = {};
  state.forEach(x=>{
    (x.actor||'').split(/[、,，\/]/).map(s=>s.trim()).filter(Boolean).forEach(a=> counts[a]=(counts[a]||0)+1);
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const el = document.getElementById('actorChart');
  if(!entries.length){ el.innerHTML = '<div class="empty">還沒有演員紀錄，新增劇集時填寫演員欄位就會統計在這裡</div>'; return; }
  const max = entries[0][1];
  el.innerHTML = entries.map(([a,n])=>`
    <div class="bar-row"><span class="bar-label" title="${esc(a)}">${esc(a)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div><span class="bar-num">${n}</span></div>`).join('');
}
function stars(n){ n=Number(n)||0; return '★'.repeat(n)+'☆'.repeat(5-n); }
function progressPct(x){ return x.epTotal ? Math.min(100, Math.round((x.epWatched||0)/x.epTotal*100)) : 0; }
function renderFeatured(){
  const sec = document.getElementById('featuredSec');
  const items = state.filter(isWatching).sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  if(!items.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  const today = new Date().getDay();
  document.getElementById('featuredArea').innerHTML = items.map((x,i)=>{
    const pct = progressPct(x);
    const hasUpdateDays = Array.isArray(x.updateDays) && x.updateDays.length;
    const dueToday = hasUpdateDays && x.updateDays.includes(today);
    return `<div class="f-card ${dueToday?'due-today':''}" onclick="openForm('${x.id}')">
      <div class="f-cover" style="background:${coverGrad(i)}">
        <span class="f-fav ${Number(x.rating)===5?'on':''}" onclick="toggleFavorite('${x.id}', event)">${Number(x.rating)===5?'❤':'♡'}</span>
        ${x.image?`<img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;f-fav ${Number(x.rating)===5?'on':''}&quot; onclick=&quot;toggleFavorite(\\'${x.id}\\', event)&quot;>${Number(x.rating)===5?'❤':'♡'}</span><div class=&quot;ph&quot;>🎬</div>'">`:'<div class="ph">🎬</div>'}
      </div>
      <div class="f-body">
        <div class="f-title">${esc(x.title)}</div>
        <div class="f-meta">${esc(x.platform||'')}${x.epTotal?' ・ '+(x.epWatched||0)+'/'+x.epTotal:''}</div>
        ${x.epTotal?`<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`:''}
        ${hasUpdateDays?`<div class="f-update ${dueToday?'today':''}">${dueToday?'🔴 今天更新':'🔔 每週'+x.updateDays.map(d=>WEEKDAY_LABELS[d]).join('、')+'更新'}</div>`:''}
      </div>
    </div>`;
  }).join('');
}
const STAT_ICONS={
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2 12 7 7 2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>',
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>'
};
function renderStats(){
  const watching = state.filter(isWatching).length;
  const done = state.filter(x=>x.status==='已完結' && !isWatching(x)).length;
  const totalEp = state.reduce((s,x)=> s+(Number(x.epWatched)||0), 0);
  const thisMonth = new Date().toISOString().slice(0,7);
  const addedThisMonth = state.filter(x=>(x.startDate||'').startsWith(thisMonth)).length;
  document.getElementById('statsBar').innerHTML = [
    [STAT_ICONS.tv,'追劇中',watching],[STAT_ICONS.check,'已看完',done],[STAT_ICONS.film,'累積集數',totalEp],[STAT_ICONS.plus,'本月新增',addedThisMonth]
  ].map(([ic,l,n])=>`<div class="stat"><div class="ic">${ic}</div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}
function renderChart(){
  const counts = {};
  state.forEach(x=> (x.genres||[]).forEach(g=> counts[g]=(counts[g]||0)+1));
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const el = document.getElementById('genreChart');
  if(!entries.length){ el.innerHTML = '<div class="empty">還沒有紀錄,新增後這裡會自動統計</div>'; return; }
  const total = entries.reduce((s,[,n])=>s+n,0);
  let acc = 0;
  const stops = entries.map(([g,n],i)=>{
    const from = acc/total*360; acc += n; const to = acc/total*360;
    return `${CHART_COLORS[i%CHART_COLORS.length]} ${from}deg ${to}deg`;
  }).join(', ');
  const legend = entries.map(([g,n],i)=>{
    const pct = Math.round(n/total*100);
    return `<div class="legend-row"><span class="legend-dot" style="background:${CHART_COLORS[i%CHART_COLORS.length]}"></span><span class="legend-name">${esc(g)}</span><span class="legend-n">${n} 部・${pct}%</span></div>`;
  }).join('');
  el.innerHTML = `<div class="donutWrap">
    <div class="donut" style="background:conic-gradient(${stops});">
      <div class="hole"><div class="n">${total}</div><div class="l">部次</div></div>
    </div>
    <div class="legend">${legend}</div>
  </div>`;
}
function renderFilters(){
  const statusEl = document.getElementById('statusFilter');
  statusEl.innerHTML = ['__all__',...STATUSES.filter(s=>s[0]!=='想看').map(s=>s[0])].map(s=>
    `<button class="chip ${filters.status===s?'active':''}" data-f="status" data-v="${s}">${s==='__all__'?'全部狀態':s}</button>`).join('');
  const plats = ['__all__',...new Set(state.map(x=>x.platform).filter(Boolean))];
  document.getElementById('platformFilter').innerHTML = plats.map(p=>
    `<button class="chip ${filters.platform===p?'active':''}" data-f="platform" data-v="${p}">${p==='__all__'?'全部平台':p}</button>`).join('');
  const ratingOpts = [['__all__','全部評分'],['5','★5'],['4','★4以上']];
  document.getElementById('ratingFilter').innerHTML = ratingOpts.map(([v,l])=>
    `<button class="chip ${filters.rating===v?'active':''}" data-f="rating" data-v="${v}">${l}</button>`).join('');
  const tagOpts = ['__all__',...new Set(state.flatMap(x=>x.tags||[]))];
  document.getElementById('tagFilter').innerHTML = tagOpts.map(t=>
    `<button class="chip ${filters.tag===t?'active':''}" data-f="tag" data-v="${esc(t)}">${t==='__all__'?'全部標籤':esc(t)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=> b.onclick=()=>{ filters[b.dataset.f]=b.dataset.v; render(); });
}
function renderList(){
  let items = state.filter(x=>x.status!=='想看');
  if(filters.sort==='date_asc') items.sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  else if(filters.sort==='progress_desc') items.sort((a,b)=>progressPct(b)-progressPct(a));
  else if(filters.sort==='progress_asc') items.sort((a,b)=>progressPct(a)-progressPct(b));
  else if(filters.sort==='rating_desc') items.sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0));
  else if(filters.sort==='title') items.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh-Hant'));
  else items.sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  if(filters.status!=='__all__') items = items.filter(x=>x.status===filters.status);
  if(filters.platform!=='__all__') items = items.filter(x=>x.platform===filters.platform);
  if(filters.rating==='5') items = items.filter(x=>Number(x.rating)===5);
  if(filters.rating==='4') items = items.filter(x=>Number(x.rating)>=4);
  if(filters.tag!=='__all__') items = items.filter(x=>(x.tags||[]).includes(filters.tag));
  if(filters.search && filters.search.trim()){
    const q = filters.search.trim().toLowerCase();
    items = items.filter(x=>(x.title||'').toLowerCase().includes(q) || (x.actor||'').toLowerCase().includes(q) || (x.tags||[]).some(t=>t.toLowerCase().includes(q)));
  }
  if(items.length===0){ document.getElementById('listArea').innerHTML = '<div class="empty">找不到符合條件的紀錄</div>'; return; }
  document.getElementById('listArea').innerHTML = items.map((x,i)=>cardTemplate(x,i)).join('');
}
function cardTemplate(x,i){
  const stCls = (STATUSES.find(s=>s[0]===x.status)||['','st-want'])[1];
  const pct = progressPct(x);
  return `<div class="g-card">
      <div class="g-cover" style="background:${coverGrad(i)}" onclick="openForm('${x.id}')">
        <span class="status-badge g-badge ${stCls}">${esc(x.status)}</span>
        <span class="g-fav ${Number(x.rating)===5?'on':''}" onclick="toggleFavorite('${x.id}', event)">${Number(x.rating)===5?'❤':'♡'}</span>
        ${x.image ? `<img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=&quot;status-badge g-badge ${stCls}&quot;>${esc(x.status)}</span><span class=&quot;g-fav ${Number(x.rating)===5?'on':''}&quot; onclick=&quot;toggleFavorite(\\'${x.id}\\', event)&quot;>${Number(x.rating)===5?'❤':'♡'}</span><div class=&quot;ph&quot;>🎬</div>'">` : `<div class="ph">🎬</div>`}
      </div>
      <div class="g-body" onclick="openForm('${x.id}')">
        <div class="g-title">${esc(x.title)}</div>
        <div class="g-meta">${esc(x.platform||'')}${x.epTotal?' ・ '+(x.epWatched||0)+'/'+x.epTotal+'集':''}</div>
        ${x.rating?`<div class="g-rating">${stars(x.rating)}</div>`:''}
        ${x.epTotal?`<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`:''}
        ${x.tags&&x.tags.length?`<div class="g-tags">${x.tags.map(t=>`<span class="g-tag">${esc(t)}</span>`).join('')}</div>`:''}
      </div>
      <div class="g-actions">
        <button class="edit" onclick="event.stopPropagation();openForm('${x.id}')">編輯</button>
        <button class="del" onclick="event.stopPropagation();delItem('${x.id}')">刪除</button>
      </div>
    </div>`;
}
function renderWishlist(){
  const sec = document.getElementById('wishSec');
  const items = state.filter(x=>x.status==='想看').sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  if(!items.length){ sec.style.display='none'; return; }
  sec.style.display='block';
  document.getElementById('wishGrid').innerHTML = items.map((x,i)=>cardTemplate(x,i)).join('');
}
function renderYearArchive(){
  const years = {};
  state.forEach(x=>{ const y=(x.startDate||'').slice(0,4); if(!y) return; years[y]=years[y]||{n:0,done:0}; years[y].n++; if(x.status==='已完結' && x.endDate) years[y].done++; });
  const listDesc = Object.entries(years).sort((a,b)=>b[0].localeCompare(a[0]));
  document.getElementById('yearArchive').innerHTML = listDesc.length ? listDesc.map(([y,v])=>`
    <div class="card clickable" onclick="openYearDetail('${y}')"><div class="y">${y}</div><div class="m">觀看數量：${v.n}　已看完：${v.done}</div></div>`).join('')
    : '<div class="empty">還沒有可以彙整的年度資料</div>';
  const listAsc = [...listDesc].reverse();
  renderYearTrend(listAsc);
}
function openYearDetail(year){
  const items = state.filter(x=>(x.startDate||'').startsWith(year))
    .sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  document.getElementById('modal').innerHTML = `
    <h3 style="margin:0 0 14px;font-family:'Zen Maru Gothic';">${esc(year)} 年看過的劇（${items.length} 部）</h3>
    <div class="yearDetailGrid">${items.map((x,i)=>cardTemplate(x,i)).join('') || '<div class="empty">這年還沒有紀錄</div>'}</div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">關閉</button></div>`;
  document.getElementById('overlay').classList.add('show');
}
function renderYearTrend(listAsc){
  const el = document.getElementById('yearTrend');
  if(listAsc.length<2){ el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='block';
  const max = Math.max(...listAsc.map(([,v])=>v.n),1);
  const w=300,h=70,pad=14;
  const stepX = (w-2*pad)/(listAsc.length-1);
  const pts = listAsc.map(([y,v],i)=>{
    const x = pad+i*stepX;
    const yy = h-pad-((v.n/max)*(h-2*pad));
    return {x,y:yy,label:y,val:v.n};
  });
  const poly = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const marks = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--rose-deep)"></circle><text x="${p.x}" y="${p.y-8}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${p.val}</text><text x="${p.x}" y="${h+10}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${p.label}</text>`).join('');
  el.innerHTML = `<div class="cap">年度觀看量趨勢</div><svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:auto;display:block;">
    <polyline points="${poly}" fill="none" stroke="var(--rose)" stroke-width="2"/>${marks}</svg>`;
}
function renderPlatforms(){
  const plats = [...new Set(state.map(x=>x.platform).filter(Boolean))];
  document.getElementById('platGrid').innerHTML = plats.length ? plats.map(p=>{
    const items = state.filter(x=>x.platform===p);
    const n = items.length;
    const ep = items.reduce((s,x)=>s+(Number(x.epWatched)||0),0);
    const hrs = Math.round(ep*45/60*10)/10;
    return `<div class="platCard" style="cursor:pointer;" onclick="filterByPlatform('${esc(p).replace(/'/g,"\\'")}')">${esc(p)}<div class="plat-sub">${n} 部<br>${ep} 集 ・ 約 ${hrs} 小時</div></div>`;
  }).join('') : '<div class="empty" style="grid-column:1/-1;">還沒有平台資料</div>';
}
function filterByPlatform(p){
  filters.platform = p;
  render();
  const target = document.getElementById('platformFilter');
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}
function renderMonthGrid(){
  const y = new Date().getFullYear();
  document.getElementById('curYear').textContent = y;
  let html = '';
  for(let m=1;m<=12;m++){
    const mm = String(m).padStart(2,'0'); const key = y+'-'+mm;
    const started = state.filter(x=>(x.startDate||'').startsWith(key)).length;
    const done = state.filter(x=>(x.endDate||'').startsWith(key) && x.status==='已完結').length;
    html += `<div class="monthCard clickable" onclick="openMonthDetail('${key}')"><div class="mt">${y}/${mm}</div><div class="mm">本月觀看：${started} 部<br>本月看完：${done} 部</div></div>`;
  }
  document.getElementById('monthGrid').innerHTML = html;
}
function openMonthDetail(key){
  const items = state.filter(x=>(x.startDate||'').startsWith(key) || (x.endDate||'').startsWith(key))
    .sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||''));
  const [yy,mm] = key.split('-');
  document.getElementById('modal').innerHTML = `
    <h3 style="margin:0 0 14px;font-family:'Zen Maru Gothic';">${yy}/${mm} 看過的劇（${items.length} 部）</h3>
    <div class="yearDetailGrid">${items.map((x,i)=>cardTemplate(x,i)).join('') || '<div class="empty">這個月還沒有紀錄</div>'}</div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">關閉</button></div>`;
  document.getElementById('overlay').classList.add('show');
}

function getYearsWithData(){
  const ys = new Set(state.map(x=>(x.startDate||'').slice(0,4)).filter(Boolean));
  const arr = [...ys].sort((a,b)=>b.localeCompare(a));
  return arr.length ? arr : [String(new Date().getFullYear())];
}
function buildYearWrap(year){
  const items = state.filter(x=>(x.startDate||'').startsWith(year));
  const count = items.length;
  const ep = items.reduce((s,x)=>s+(Number(x.epWatched)||0),0);
  const hrs = Math.round(ep*45/60*10)/10;
  const genreCounts={}; items.forEach(x=>(x.genres||[]).forEach(g=>genreCounts[g]=(genreCounts[g]||0)+1));
  const topGenre = Object.entries(genreCounts).sort((a,b)=>b[1]-a[1])[0];
  const platCounts={}; items.forEach(x=>{ if(x.platform) platCounts[x.platform]=(platCounts[x.platform]||0)+1; });
  const topPlat = Object.entries(platCounts).sort((a,b)=>b[1]-a[1])[0];
  const actorCounts={}; items.forEach(x=>(x.actor||'').split(/[、,，\/]/).map(s=>s.trim()).filter(Boolean).forEach(a=>actorCounts[a]=(actorCounts[a]||0)+1));
  const topActor = Object.entries(actorCounts).sort((a,b)=>b[1]-a[1])[0];
  const topRated = [...items].filter(x=>Number(x.rating)>0).sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0))[0];
  const manualPicks = items.filter(x=>x.bestYear===year);
  const isManualPicks = manualPicks.length>0;
  const topPicks = (isManualPicks ? manualPicks : items.filter(x=>Number(x.rating)>0))
    .slice().sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0)).slice(0,5);
  return {year,count,ep,hrs,topGenre,topPlat,topActor,topRated,topPicks,isManualPicks};
}
function openYearWrap(){
  const years = getYearsWithData();
  document.getElementById('modal').innerHTML = `
    <div class="wrapHead">
      <h3 class="maru" style="margin:0;">年度總結卡</h3>
      <select id="wrapYearSel" onchange="renderWrapCard(this.value); renderBestPickList(this.value);">${years.map(y=>`<option value="${y}">${y} 年</option>`).join('')}</select>
    </div>
    <div id="wrapCardBody"></div>
    <div class="field" style="margin-top:14px;">
      <label>🌟 手動挑選本年度最佳代表作（最多5部，不選則自動依評分挑選 Top5）</label>
      <div class="bestPickList" id="bestPickList"></div>
    </div>
    <div class="modal-actions wrap-actions">
      <button class="btn ghost" onclick="closeModal()">關閉</button>
      <button class="btn save" onclick="downloadWrapCard()">下載圖片</button>
    </div>`;
  renderWrapCard(years[0]);
  renderBestPickList(years[0]);
  document.getElementById('overlay').classList.add('show');
}
function renderBestPickList(year){
  const wrap = document.getElementById('bestPickList');
  if(!wrap) return;
  const items = state.filter(x=>(x.startDate||'').startsWith(year));
  if(!items.length){ wrap.innerHTML = '<div class="empty" style="padding:6px 0;">這年還沒有紀錄</div>'; return; }
  const pickedCount = items.filter(x=>x.bestYear===year).length;
  wrap.innerHTML = items.map(x=>{
    const checked = x.bestYear===year;
    const disable = (!checked && pickedCount>=5) ? 'disabled' : '';
    return `<label class="bestPickRow"><input type="checkbox" ${checked?'checked':''} ${disable} onchange="toggleBestPick('${x.id}','${year}',this.checked)"><span>${esc(x.title)}</span>${x.rating?`<span class="bp-stars">${stars(x.rating)}</span>`:''}</label>`;
  }).join('');
}
function toggleBestPick(id, year, checked){
  const it = state.find(x=>x.id===id);
  if(!it) return;
  if(checked){
    const currentCount = state.filter(x=>x.bestYear===year).length;
    if(currentCount>=5){ showToast('最多只能選5部喔'); renderBestPickList(year); return; }
    it.bestYear = year;
  } else if(it.bestYear===year){
    it.bestYear = '';
  }
  save().then(()=>{ renderWrapCard(year); renderBestPickList(year); });
}
function renderWrapCard(year){
  const d = buildYearWrap(year);
  const highlights = [
    d.topGenre ? `<div class="hl-row">🎭 最愛類型：<b>${esc(d.topGenre[0])}</b>（${d.topGenre[1]} 部）</div>` : '',
    d.topPlat ? `<div class="hl-row">📺 最常用平台：<b>${esc(d.topPlat[0])}</b>（${d.topPlat[1]} 部）</div>` : '',
    d.topActor ? `<div class="hl-row">🌟 常看演員：<b>${esc(d.topActor[0])}</b>（${d.topActor[1]} 部）</div>` : '',
    d.topRated ? `<div class="hl-row">🏆 最高評分：<b>${esc(d.topRated.title)}</b>（${stars(d.topRated.rating)}）</div>` : ''
  ].filter(Boolean).join('');
  const topPicksHtml = d.topPicks.length ? `<div class="wrapTop5">
      <div class="wrapTop5Title">${d.isManualPicks?'⭐ 年度最佳代表作':'🏅 年度 Top '+d.topPicks.length}</div>
      ${d.topPicks.map((x,i)=>`<div class="wrapTop5Row"><span class="rank">${i+1}</span><span class="t5-title">${esc(x.title)}</span>${x.rating?`<span class="t5-stars">${stars(x.rating)}</span>`:''}</div>`).join('')}
    </div>` : '';
  document.getElementById('wrapCardBody').innerHTML = `
    <div class="wrapCard" id="wrapCardImg">
      <div class="maru">MY DRAMA WRAPPED</div>
      <h2>${esc(year)} 年度追劇回顧</h2>
      <div class="wrapRow">
        <div class="wrapStat"><div class="num">${d.count}</div><div class="lab">部作品</div></div>
        <div class="wrapStat"><div class="num">${d.ep}</div><div class="lab">集數</div></div>
        <div class="wrapStat"><div class="num">${d.hrs}</div><div class="lab">小時</div></div>
      </div>
      ${highlights ? `<div class="wrapHighlights">${highlights}</div>` : '<div class="wrapHighlights">今年還沒有足夠的紀錄可以分析，多新增幾部吧！</div>'}
      ${topPicksHtml}
      <div class="wrapFoot">追劇紀錄｜我的影視手帳</div>
    </div>`;
}
let _h2cLoading=null;
function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  if(_h2cLoading) return _h2cLoading;
  _h2cLoading = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=resolve; s.onerror=reject;
    document.head.appendChild(s);
  });
  return _h2cLoading;
}
function downloadWrapCard(){
  const el = document.getElementById('wrapCardImg');
  if(!el) return;
  showToast('圖片產生中…');
  loadHtml2Canvas().then(()=>{
    return window.html2canvas(el, {backgroundColor:null, scale:2});
  }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'drama-wrapped-'+(document.getElementById('wrapYearSel')?.value||'')+'.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(()=>{
    showToast('圖片產生失敗，請改用截圖分享');
  });
}

function openForm(id){
  const existing = id ? state.find(x=>x.id===id) : null;
  currentFormTags = existing && Array.isArray(existing.tags) ? [...existing.tags] : [];
  currentFormWeekdays = existing && Array.isArray(existing.updateDays) ? [...existing.updateDays] : [];
  document.getElementById('modal').innerHTML = `
    <h3 class="maru">${existing?'編輯':'新增'}影視劇</h3>
    <div class="field" id="fTitleField"><label>劇名</label><input id="fTitle" value="${existing?esc(existing.title):''}" placeholder="例：黑暗榮耀" oninput="clearTitleErr()"><div class="field-err">請輸入劇名喔</div></div>
    <div class="field"><label>封面圖片網址</label><input id="fImage" value="${existing?esc(existing.image||''):''}" placeholder="貼上圖片連結（例如海報 URL）" oninput="updateImgPreview()"></div>
    <div class="imgPreview" id="fImagePreview"></div>
    <div class="row2">
      <div class="field"><label>狀態</label><select id="fStatus" onchange="syncWeekdayFieldVisibility()">${STATUSES.map(s=>`<option ${existing&&existing.status===s[0]?'selected':''}>${s[0]}</option>`).join('')}</select></div>
      <div class="field"><label>平台</label><input id="fPlatform" value="${existing?esc(existing.platform||''):''}" placeholder="Netflix / Disney+ ..."></div>
    </div>
    <div class="field"><label>我的評分</label>
      <div class="starPick" id="fRatingWrap">${[1,2,3,4,5].map(n=>`<span data-v="${n}" onclick="setRating(${n})">★</span>`).join('')}</div>
      <input type="hidden" id="fRating" value="${existing?existing.rating||0:0}">
    </div>
    <div class="field">
      <label>類型（可複選）</label>
      <div class="genreSelect" id="genreSelect">
        <button type="button" class="genreSelectBtn placeholder" id="genreSelectBtn" onclick="toggleGenreDropdown(event)">請選擇類型</button>
        <div class="genreDropdown" id="genreDropdown">
          ${GENRE_OPTIONS.map(g=>`<label class="genreOpt"><input type="checkbox" value="${esc(g)}" onchange="syncGenreSelectBtn()" ${existing&&(existing.genres||[]).includes(g)?'checked':''}> ${esc(g)}</label>`).join('')}
        </div>
      </div>
    </div>
    <div class="field" id="weekdayField" style="display:none;">
      <label>每週更新日（可複選，追劇中會顯示提醒）</label>
      <div class="weekdayPick" id="weekdayPick">
        ${WEEKDAY_LABELS.map((l,i)=>`<button type="button" class="wdBtn ${existing&&(existing.updateDays||[]).includes(i)?'on':''}" onclick="toggleWeekday(${i}, this)">${l}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>自訂標籤</label>
      <div class="tagChips" id="tagChips"></div>
      <input type="text" id="fTagInput" placeholder="輸入標籤後按 Enter 新增" list="tagSuggestions" onkeydown="handleTagKeydown(event)">
      <datalist id="tagSuggestions">${allKnownTags().map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
      <div class="tagPresets">${TAG_PRESETS.map(t=>`<button type="button" class="tagPresetBtn" onclick="addTag('${esc(t).replace(/'/g,"\\'")}')">+ ${esc(t)}</button>`).join('')}</div>
    </div>
    <div class="row2">
      <div class="field"><label>已看集數</label><input id="fEpW" type="number" min="0" value="${existing?existing.epWatched||'':''}"></div>
      <div class="field"><label>總集數</label><input id="fEpT" type="number" min="0" value="${existing?existing.epTotal||'':''}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>開看日期</label><input id="fStart" type="date" value="${existing?existing.startDate||'':''}" onchange="syncWeekdayFieldVisibility()"></div>
      <div class="field"><label>看完日期</label><input id="fEnd" type="date" value="${existing?existing.endDate||'':''}" onchange="syncWeekdayFieldVisibility()"></div>
    </div>
    <div class="row2">
      <div class="field"><label>國家</label><input id="fCountry" value="${existing?esc(existing.country||''):''}"></div>
      <div class="field"><label>相關演員/藝人</label><input id="fActor" value="${existing?esc(existing.actor||''):''}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn save" onclick="saveForm('${existing?existing.id:''}')">儲存</button>
    </div>`;
  paintStars(existing?Number(existing.rating)||0:0);
  updateImgPreview();
  syncGenreSelectBtn();
  renderTagChips();
  syncWeekdayFieldVisibility();
  document.getElementById('overlay').classList.add('show');
}
function toggleGenreDropdown(e){
  if(e) e.stopPropagation();
  document.getElementById('genreDropdown').classList.toggle('open');
}
function syncGenreSelectBtn(){
  const btn = document.getElementById('genreSelectBtn');
  if(!btn) return;
  const picked = [...document.querySelectorAll('#genreDropdown input:checked')].map(el=>el.value);
  if(picked.length){ btn.textContent = picked.join('、'); btn.classList.remove('placeholder'); }
  else { btn.textContent = '請選擇類型'; btn.classList.add('placeholder'); }
}
document.addEventListener('click', e=>{
  const sel = document.getElementById('genreSelect');
  if(sel && !sel.contains(e.target)) { const dd=document.getElementById('genreDropdown'); if(dd) dd.classList.remove('open'); }
});
function updateImgPreview(){
  const url = document.getElementById('fImage').value.trim();
  const box = document.getElementById('fImagePreview');
  if(!url){ box.style.display='none'; box.innerHTML=''; return; }
  box.style.display='block';
  box.innerHTML = `<img src="${esc(url)}" onerror="this.parentElement.style.display='none'">`;
}
function clearTitleErr(){ document.getElementById('fTitleField').classList.remove('err'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}
function paintStars(n){
  document.getElementById('fRating').value = n;
  document.querySelectorAll('#fRatingWrap span').forEach(s=> s.classList.toggle('on', Number(s.dataset.v)<=n));
}
function toggleFavorite(id, ev){
  if(ev) ev.stopPropagation();
  const it = state.find(x=>x.id===id);
  if(!it) return;
  it.rating = Number(it.rating)===5 ? 0 : 5;
  save();
}
function setRating(n){
  const cur = Number(document.getElementById('fRating').value)||0;
  paintStars(cur===n ? 0 : n);
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
function saveForm(id){
  const title = document.getElementById('fTitle').value.trim();
  if(!title){
    document.getElementById('fTitleField').classList.add('err');
    document.getElementById('fTitle').focus();
    return;
  }
  const leftoverTag = document.getElementById('fTagInput').value.trim();
  if(leftoverTag && !currentFormTags.includes(leftoverTag)) currentFormTags.push(leftoverTag);
  const data = {
    id: id || uid(),
    title,
    image: document.getElementById('fImage').value.trim(),
    rating: Number(document.getElementById('fRating').value)||0,
    status: document.getElementById('fStatus').value,
    platform: document.getElementById('fPlatform').value.trim(),
    genres: [...document.querySelectorAll('#genreDropdown input:checked')].map(el=>el.value),
    tags: [...currentFormTags],
    updateDays: [...currentFormWeekdays].sort((a,b)=>a-b),
    epWatched: Number(document.getElementById('fEpW').value)||0,
    epTotal: Number(document.getElementById('fEpT').value)||0,
    startDate: document.getElementById('fStart').value,
    endDate: document.getElementById('fEnd').value,
    country: document.getElementById('fCountry').value.trim(),
    actor: document.getElementById('fActor').value.trim()
  };
  const idx = state.findIndex(x=>x.id===data.id);
  if(idx>=0 && state[idx].bestYear) data.bestYear = state[idx].bestYear;
  if(idx>=0) state[idx]=data; else state.push(data);
  closeModal(); save();
  showToast('已儲存 ✓');
}
function delItem(id){
  if(!confirm('確定要刪除這筆紀錄嗎？')) return;
  state = state.filter(x=>x.id!==id); save();
}

async function init(){
  renderAuthBar();
  renderNotifyBtn();
  state = await loadKey(STORE_KEY, []);
  render();
  if(useCloud && auth){
    auth.onAuthStateChanged(async (user)=>{
      currentUser = user;
      renderAuthBar();
      state = await loadKey(STORE_KEY, []);
      render();
    });
  }
}
init();
</script>
